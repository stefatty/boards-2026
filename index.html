 molar", "Mesio-buccal pulp-horn of the mandibular first molar", "Mesial or distal incisal pulp horn of the central incisor", "Mesial or distal incisal pulp horn of the lateral incisor"], "answer": 1, "explanation": "Correct: C. Mesio-buccal pulp-horn of the mandibular first molar", "source": "2012 Troutman Comprehensive Review", "domain": "Pulp Therapy & Endodontics", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.278", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What percentage of physically abused children present with head and neck trauma?", "options": ["Subcondylar region", "Angle", "Body", ">50%"], "answer": 0, "explanation": "Correct: A. Subcondylar region", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.280", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following characteristics of ferric sulfate are true when it is used as a pulpotomy agent in primary teeth?", "options": ["Acts as an astringent to control bleeding", "Requires about 15 seconds to act", "Has no documented teratogenic properties", "Has disinfecting properties", "All of the above are correct"], "answer": 4, "explanation": "Correct: E. All of the above are correct", "source": "2012 Troutman Comprehensive Review", "domain": "Pulp Therapy & Endodontics", "category": "Pulp Therapy & Endodontics", "source_page": "Troutman Comprehensive Review 2012 — Q.282", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Most odontogenic infections (dental abscess) in permanent molars are caused, primarily, by which of the following?", "options": ["Significant presence of aerobic streptococci with aerobic and anaerobic cocci and rods", "Primarily anaerobic Vellionella, some Peptostreptococci and Bacteroides, with few aerobic streptococci", "Gram negative anaerobic streptococci", "Aerobic gram positive Fusobacterium", "Mixed anaerobic gram negative cocci and rods"], "answer": 0, "explanation": "Correct: A. Significant presence of aerobic streptococci with aerobic and anaerobic cocci and rods", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.283", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Most odontogenic infections (dental abscess) in primary molars are caused, primarily, by which of the following?", "options": ["Aerobic and anaerobic cocci and rods, with significant presence of aerobic streptococci", "Primarily anaerobic Vellionella, some Peptostreptococci and Bacteroides, with few aerobic streptococci", "Gram negative anaerobic streptococci", "Aerobic gram positive Fusobacterium"], "answer": 1, "explanation": "Correct: B. Primarily anaerobic Vellionella, some Peptostreptococci and Bacteroides, with few aerobic streptococci", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.284", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following statements is TRUE regarding the healing of permanent teeth with root fractures?", "options": ["Optimal repositioning of dislocated fragments increases the frequency of healing, especially in mature teeth", "Fusion of the fractured tooth fragments with alveolar bone occurred sooner in teeth with mature roots than in those with immature roots", "Hard tissue healing is less frequent in traumatized teeth that are not splinted", "There is a significant difference in the frequency of healing between teeth splinted with rigid acrylic splints and those splinted with orthodontic wire", "The width of the diastasis, in teeth with root fractures, was not found to be significantly related to healing"], "answer": 0, "explanation": "Correct: A. Optimal repositioning of dislocated fragments increases the frequency of healing, especially in mature teeth", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Oral Surgery & Trauma", "source_page": "Troutman Comprehensive Review 2012 — Q.285", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following criteria was has been found to have the most positive effect upon healing of intra-alveolar permanent tooth root fractures?", "options": ["Position of the fracture", "Time of treatment following the fracture", "Immaturity of root development", "Longer duration of splinting maxillary vs. mandibular"], "answer": 0, "explanation": "Correct: A. Position of the fracture", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Surgery & Trauma", "category": "Oral Surgery & Trauma", "source_page": "Troutman Comprehensive Review 2012 — Q.286", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The most common factor leading to hypoxemia in pediatric patients sedated for dental treatment is which of the following?", "options": ["Circulatory collapse", "Bradycardia", "Drug overdose", "Hyperventilation", "Airway obstruction"], "answer": 4, "explanation": "Correct: E. Airway obstruction", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.287", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Nitrous oxide is primarily eliminated by which of the following?", "options": ["Serum to the kidneys", "Lungs", "Blood hemoglobin", "Mucosal absorption", "Blood hemoglobin to the liver"], "answer": 1, "explanation": "Correct answer: Lungs. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.288", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Pre-General Anesthesia fasting instructions for pediatric patients includes All EXCEPT which of the following:", "options": ["Clear liquids up to 2 hours before", "Breast milk up to 4 hours before", "Regular milk or orange juice up to 6 hours before", "Solid foods up to 6 hours before", "Infant formula up to 4 hours before"], "answer": 4, "explanation": "Correct: E. Infant formula up to 4 hours before", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.289", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Five minutes after administration of 50% nitrous oxide and oxygen to a 6-year-old boy, he complains of feeling dizzy and nauseated. Which of the following should be your reaction?", "options": ["Proceed with scheduled treatment, maintaining patient at current level of nitrous oxide", "Reduce the nitrous oxide level by 10% and observe his response before proceeding", "Increase the nitrous oxide level by 10% and delay treatment until patient becomes more relaxed", "Stop treatment and turn off the nitrous oxide flow immediately because patient is entering into the pre-excitatory stage of anesthesia", "Turn off the nitrous oxide flow and administer 100% oxygen with positive pressure because the child is having an allergic reaction"], "answer": 1, "explanation": "Correct: B. Reduce the nitrous oxide level by 10% and observe his response before proceeding", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.290", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Sedative drugs such as Meperidine, Hydroxyzine and diazepam area carried in the blood stream by which of the following?", "options": ["Hemoglobin", "Red blood cells", "White blood cells", "Serum"], "answer": 3, "explanation": "Correct answer: Serum. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.291", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the appropriate post-treatment recovery IV fluid", "options": ["20-30 mL/hr. 4x 2x 1x", "40-50 mL/hr. 1st. 10 kg. 2nd.10 kg. add. kg.", "60-70 mL/hr. = Flow-Rate for IV fluids in mL/hr.", "80-90 mL/hr.", "100-110 mL/hr."], "answer": 2, "explanation": "Correct: C. 60-70 mL/hr. = Flow-Rate for IV fluids in mL/hr.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.293", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The normal respiratory rate of a 2-3 year-old child is about the same as which of the following?", "options": ["The same as a 21 year- old", "The same as a 16 year-old", "Two times greater than a 21 year-old", "Half that of a 12 year-old", "Half that of a 21 year-old"], "answer": 2, "explanation": "Correct: C. Two times greater than a 21 year-old", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.294", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The most essential monitor when using oral conscious sedation for pediatric dental patients is which of the following?", "options": ["EKG", "Capnograph", "Sphygmomanometer (blood pressure)", "Pulse oximeter", "Visual observation of patient lip and fingernail color"], "answer": 3, "explanation": "Correct: D. Pulse oximeter", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.295", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Pediatric sedative drug doses should be calculated based upon which of the following?", "options": ["The age of the patient", "Young’s Rule", "Clark’s rule", "A dose based upon mg per kg or lb of body weight", "The recommended adult dose."], "answer": 3, "explanation": "Correct: D. A dose based upon mg per kg or lb of body weight", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.296", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the normal respiratory rate for a 3 year-old child?", "options": ["34 to 40 per minute", "22 to 30 per minute", "15 to 20 per minute", "12 to 15 per minute", "10 to 12 per minute"], "answer": 1, "explanation": "Correct: B. 22 to 30 per minute", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.297", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What is the maximum recommended concentration of Nitrous Oxide that should be administered to a child without the use of a pulse oximeter and other appropriate monitoring devices?", "options": ["30% nitrous oxide", "40% nitrous oxide", "50% nitrous oxide", "60% nitrous oxide", "70% nitrous oxide"], "answer": 2, "explanation": "Correct: C. 50% nitrous oxide", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.298", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In monitoring a sedated pediatric patient, the child’s heart rate is more important than their blood pressure.", "options": ["True", "False"], "answer": 0, "explanation": "Correct answer: True. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.299", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "A six-year-old boy is sedated with oral Meperidine. During the procedure he experiences respiratory depression. Which narcotic antagonist should be given to this child without risk of further respiratory depression?", "options": ["Nalorphine (Nalline)", "Levallorophan tartrate (Lorfan)", "Naloxone (Narcan)", "Epinephrine", "Flumazenil"], "answer": 2, "explanation": "Correct: C. Naloxone (Narcan)", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.300", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following medical conditions is a contraindication to the administration of nitrous oxide and oxygen sedation?", "options": ["Asthma", "Epilepsy/seizure disorder", "Sickle cell anemia", "All of the above are contraindications", "None of the above is a contraindication to the administration of Nitrous Oxide & Oxygen at an appropriate level"], "answer": 4, "explanation": "Correct: E. None of the above is a contraindication to the administration of Nitrous Oxide & Oxygen at an appropriate level", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.301", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Nitrous oxide is carried in the blood stream by which of the following?", "options": ["Hemoglobin", "White blood cells", "Red blood cells", "Serum"], "answer": 3, "explanation": "Correct answer: Serum. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.302", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Malignant hyperthermia is treated with which of the following?", "options": ["Diphenhydramine", "Dexamethasone", "Epinephrine", "Naloxone", "Dantrolene"], "answer": 4, "explanation": "Correct: E. Dantrolene", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.304", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Nausea and vomiting associated with PO Opioid analgesics are the result of which of the following?", "options": ["Dehydration of the stomach lining", "Acidic effect of the Opioid on the stomach lining", "Increased relaxation of the stomach walls", "Stimulation of the CTZ chemoreceptor trigger zone", "Generally related to the simultaneous administration of Nitrous Oxide"], "answer": 3, "explanation": "Correct: D. Stimulation of the CTZ chemoreceptor trigger zone", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.306", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "When scheduling patients for dental procedures to be done with general anesthesia in the hospital operating room environment, which of the following information is most important to assure that the hospital records are appropriate?", "options": ["CPT diagnostic codes, which are compatible with ICD9 codes", "The medical reason for requiring general anesthesia for the dental procedures you will be providing", "A diagnosis of Acute Stress Reaction and the procedure to be done as Complete Oral Rehabilitation", "Primary dental diagnosis (ICD9 codable); Secondary diagnosis, justifying the use of general anesthesia and Operating room facilities, and planned dental procedures (CPT codable)", "Appropriate insurance codes to insure coverage for anesthesia"], "answer": 3, "explanation": "Correct: D. Primary dental diagnosis (ICD9 codable); Secondary diagnosis, justifying the use of general anesthesia and Operating room facilities, and planned dental procedures (CPT codable)", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.307", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the appropriate flow-rate for a post general anesthesia IV for a 15 kg. child?", "options": ["40 cc/hr.", "50 cc/hr.", "80 cc/hr.", "100 cc/hr."], "answer": 1, "explanation": "Correct: B. 50 cc/hr.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.308", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Endotracheal tubes used for patients under 7 years do not generally have inflatable cuffs because of which of the following?", "options": ["Cuffs cause drying of the tracheal mucosa in patients younger then 7 yr.", "The upper airway, in children younger then 7 yr. is generally smallest below the vocal cords and cuffs aren’t necessary", "Cuffs on tubes could cause post-operative edema because the upper airway in children is more sensitive than in adults", "Endotracheal tubes used for children < 7 yr. are too small to make the cuffs more efficient", "Both b and c are generally considered correct for children < 7 yr. Of age"], "answer": 2, "explanation": "Correct: C. Cuffs on tubes could cause post-operative edema because the upper airway in children is more sensitive than in adults", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.309", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Patients who are classified as ASA II represent which of the following?", "options": ["Flumazenil", "Naloxone", "Benzodiazepine", "Sodium Dantrolene", "Digoxin"], "answer": 1, "explanation": "Correct: B. Naloxone", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.310", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "According to the American Academy of Pediatric Dentistry \"Guidelines for Minimal, Moderate and Deep Sedation (Ped. Dent. 2009), which of the following monitoring devices are recommended for Pediatric Moderate Sedation? (1)Pulse oximeter (2) Precordial stethoscope (3) Capnography (4) Blood pressure cuff (5) ECG", "options": ["1,2 & 4", "1,3,4 & 5", "All of the above."], "answer": 0, "explanation": "Correct answer: 1,2 & 4. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.312", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is / are true as they relate to bacteremias of dental origin and antimicrobial sensitivity following oral surgical procedures in children?", "options": ["The presence of plaque is related significantly with the occurrence of prolonged bacteremia after simple oral surgical procedures.", "The presence of gingival inflammation is related significantly with the occurrence of prolonged bacteremia after simple oral surgical procedures.", "The presence of more than 1 dental abscess is related to significantly greater bacteremia after dental surgical extraction.", "About 85 % of the bacteria found in the blood stream after dental extraction of an abscessed tooth are not sensitive to the antibiotic(s) prescribed for prophylaxis."], "answer": 1, "explanation": "Correct: B. The presence of gingival inflammation is related significantly with the occurrence of prolonged bacteremia after simple oral surgical procedures.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Oral Surgery & Trauma", "source_page": "Troutman Comprehensive Review 2012 — Q.313", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "On the day that a 4 year-old child is scheduled for surgery, the OR admissions nurse notes that the child, who is obviously upset and crying, exhibits malaise and a yellow mucous discharge from the nose. The child’s temperature is 38 degrees, WBC is 9200, hematocrit is 39%, platelet count is 330,000 and hemoglobin is 14.2. The nurse recommends that the surgery should be cancelled. What is the most likely reason that the nurse would make this recommendation?", "options": ["Hemoglobin is too low and might result in prolonged bleeding", "Platelets are low", "Hematocrit and hemoglobin suggest the need for further blood analysis", "The child has a respiratory infection", "The child is obviously upset and would be difficult to anesthetize at this time"], "answer": 3, "explanation": "Correct: D. The child has a respiratory infection", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.314", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "While your patient is under the effect of general anesthesia for dental procedures, they experience malignant hyperthermia. Which of the following are the most frequent initial signs of this condition?", "options": ["Laryngospasm, bradycardia, gradual temperature elevation", "Muscle rigidity, bradycardia, sudden increase in CO2 retention", "Masseter muscle spasm, tachycardia, gradual increase in PCO2 and temperature elevation", "Laryngospasm, gradual temperature elevation and venus desaturation", "Bronchospasm, rapid drop in O2 saturation, temperature elevation and seizure"], "answer": 2, "explanation": "Correct: C. Masseter muscle spasm, tachycardia, gradual increase in PCO2 and temperature elevation", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.315", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following anesthetic agents is / are likely to cause malignant hyperthermia in patients who are susceptible to MH?", "options": ["Trichloroethylene", "Halothane", "Succinylcholine", "Isoflurane", "All of the above agents are known to precipitate a MH crisis."], "answer": 4, "explanation": "Correct: E. All of the above agents are known to precipitate a MH crisis.", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.316", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the presence of which of the following conditions can nitrous oxide produce an undesirable side effect?", "options": ["Hepatitis C", "Down Syndrome", "Acute otitis media", "Neuromuscular disorders such as Cerebral Palsy", "Sickle Cell Trait"], "answer": 2, "explanation": "Correct: C. Acute otitis media", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.317", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is a DISADVANTAGE of nitrous oxide?", "options": ["It has an irritating effect on the upper airway", "It has an unpleasant odor that is intolerable to some children", "It can produce postoperative nightmares", "It can initiate seizures in seizure-prone children", "It is a weak sedative agent, which may be ineffective in highly anxious preschool children"], "answer": 4, "explanation": "Correct: E. It is a weak sedative agent, which may be ineffective in highly anxious preschool children", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.318", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "A child has been sedated and is undergoing restorative dental procedures with a rubber dental dam in place. After about 30 minutes, the child begins to snore. Which of the following actions should the dentist take?", "options": ["No remedial action is indicated. The patient is relaxed and sleeping normally", "Shake the patient to arouse them", "Reposition the head to the “sniffing position” to open the child’s airway", "Discontinue the dental procedure and administer 100% Oxygen by positive pressure"], "answer": 2, "explanation": "Correct: C. Reposition the head to the “sniffing position” to open the child’s airway", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.319", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "You have administered a narcotic agent to a child by the oral route to sedate them for dental treatment. The child is positioned supine in the dental chair and has appropriate monitors in then loses consciousness. Which of the following is the FIRST thing you should do to appropriately manage the situation?", "options": ["Call 911", "Position the head to obtain a patient airway", "Administer Naloxone sublingually", "Start an IV infusion of Lidocaine", "Administer 100% Oxygen by positive pressure"], "answer": 1, "explanation": "Correct: B. Position the head to obtain a patient airway", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.320", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "If a child patient who you plan to sedate has a history of asthma, which of the following information do you need to obtain to determine if the child is appropriate for in-office sedation?", "options": ["History of snoring", "Medication history", "Last asthmatic attack", "History of hospitalization", "All of the above are necessary information"], "answer": 4, "explanation": "Correct: E. All of the above are necessary information", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.321", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following statements best describes events that contribute to the development of cardiopulmonary arrest in infants and children during sedation procedures?", "options": ["Cardiopulmonary arrest is usually the first symptom of underlying cardiovascular disease", "Cardiopulmonary arrest is most often the end result of deterioration in respiratory and circulatory oxygen function", "Cardiopulmonary arrest is usually precipitated by sudden onset of ventricular arrhythmias", "Cardiopulmonary arrest is most likely the result of neurologic dysfunction caused by the sedative drug(s)"], "answer": 1, "explanation": "Correct: B. Cardiopulmonary arrest is most often the end result of deterioration in respiratory and circulatory oxygen function", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.322", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following are correct NPO instructions for “No solids or opaque liquids” prior to in-office minimal or moderate sedation for a 4 year-old child?", "options": ["< 24 hours", "< 12 hours", "< 6 hours", "< 4 hours", "< 2 hours"], "answer": 2, "explanation": "Correct: C. < 6 hours", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.323", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "If a sedated child shows evidence of airway obstruction, which of the following is the FIRST step to improve the child’s airway?", "options": ["Administer oxygen by positive pressure", "Reposition the head and apply jaw thrust", "Administer Succinylcholine", "Administer epinephrine", "Activate EMS system"], "answer": 1, "explanation": "Correct: B. Reposition the head and apply jaw thrust", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.324", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is NOT required when performing dental treatment for a pediatric patient utilizing minimal or moderate sedation in the dental office?", "options": ["Nitrous Oxide – Oxygen scavenging system", "Emergency suction device not dependent on electrical supply", "Pulse oximeter", "Capnograph (CO2) monitor", "Positive pressure emergency oxygen system"], "answer": 3, "explanation": "Correct: D. Capnograph (CO2) monitor", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.325", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is a contraindication when considering oral Minimal to Moderate sedation for a pediatric dental patient?", "options": ["Inability to obtain radiographs at the time of the initial examination", "Patient weighing greater than 35 Kilos.", "Unrepaired congenital cardiac anomaly", "Severe Mental developmental delay and self-destructive behavior", "All of the above are contraindications"], "answer": 2, "explanation": "Correct: C. Unrepaired congenital cardiac anomaly", " wer": 3, "explanation": "Correct answer: 30 to 2. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.377", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the most common form of childhood cancer in the first year of life?", "options": ["Leukemia (ALL)", "Soft tissue sarcomas", "Lymphomas", "Sympathetic nervous system tumors.", "Malignant bone tumors"], "answer": 3, "explanation": "Correct: D. Sympathetic nervous system tumors.", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Pathology & Medicine", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.378", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The percent of Fluoride found in Fluoride Varnish is which of the following?", "options": ["2.26%", "2.5%", "5%", "5.5%", "6.5%."], "answer": 0, "explanation": "Correct answer: 2.26%. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.379", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the appropriate Classification of Dentinogenesis Imperfecta that is associated with blue sclera and occurs in conjunction with Osteogenesis Imperfecta?", "options": ["Type I", "Type II", "Type III", "Type IV"], "answer": 0, "explanation": "Correct answer: Type I. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Special Healthcare Needs", "source_page": "Troutman Comprehensive Review 2012 — Q.380", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Asthma has been reported to be the most common childhood disease. Which of the following is the percent of children 18 years of age or younger that have been diagnosed with asthma?", "options": ["5%", "6.5%", "8.5%", "10%", "12.5%"], "answer": 2, "explanation": "Correct answer: 8.5%. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.381", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "An adolescent diagnosed with perimyolysis would be most likely to be related to which of the following?", "options": ["Asthma", "Bulimia", "Anorexia Nervosa", "Type I Diabetes", "Use of smokeless tobacco products"], "answer": 1, "explanation": "Correct answer: Bulimia. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.382", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the appropriate blood pressure for a 6 – 9 year-old child?", "options": ["116 / 76 3-5 95-110/60-75 = 3 – 6 yr.", "122 / 78 6-9 100-120/60-75 = 6 – 12 yr.", "126 / 82 10-12", "136 / 86 13-15 110-135/65-85 = 12+ yr.", "140 / 90 16-20"], "answer": 1, "explanation": "Correct: B. 122 / 78 6-9 100-120/60-75 = 6 – 12 yr.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.383", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "At which of the following levels is the narrowest part of the pediatric airway located?", "options": ["Hyoid bone", "Vocal cords", "Thyroid", "Cricoid cartilage", "Trachea"], "answer": 3, "explanation": "Correct: D. Cricoid cartilage", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.384", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What is the percentage of high-school students that use smokeless tobacco?", "options": ["10% of males and females", "10.5% of males and 2% of females", "13.4% of males and 2.3% of females", "15.3% of males and 1.2% of females", "20% of males and 13% of females"], "answer": 2, "explanation": "Correct: C. 13.4% of males and 2.3% of females", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.385", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What % of 2 to 5 year-olds in the US (2004 data) are determined to have at least one carious tooth?", "options": ["20%", "24%", "28%", "30%", "42%"], "answer": 2, "explanation": "Correct answer: 28%. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.386", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represent(s) potential side effect of the Groper appliance?", "options": ["Tongue thrust habit", "Speech impediment", "Decreased Anterior facial growth", "Decreased Horizontal maxillary growth.", "All of the above may be side effects of the Groper Appliance"], "answer": 3, "explanation": "Correct: D. Decreased Horizontal maxillary growth.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.387", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Fetal Alcohol Syndrome is characterized by which of the following?", "options": ["Microcephaly", "Flat & narrow prolabium", "Maxillary hypoplasia", "Mental retardation", "All of the above are characteristics of Fetal Alcohol Syndrome."], "answer": 4, "explanation": "Correct: E. All of the above are characteristics of Fetal Alcohol Syndrome.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.388", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the normal white blood cell count for a 4 year-old child?", "options": ["3,000 to 5,000", "6,000 – 15,000", "15,000 – 20,000", "20,000 – 30,000", "30,000 – 40,000"], "answer": 1, "explanation": "Correct: B. 6,000 – 15,000", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.389", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following BMI levels would be classified as Obese?", "options": [">50% of normal for age", ">65% of normal for age", ">70% of normal for age", ">80% of normal for age", ">95% of normal for age"], "answer": 4, "explanation": "Correct: E. >95% of normal for age", "source": "2012 Troutman Comprehensive Review", "domain": "Special Healthcare Needs", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.390", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following has been found to be side a side effect of intraoral piercing?", "options": ["Periodontal disease", "Speech impediment", "Tooth fractures", "Airway obstruction", "All of the above are potential side effects of intra-oral piercing."], "answer": 4, "explanation": "Correct: E. All of the above are potential side effects of intra-oral piercing.", "source": "2012 Troutman Comprehensive Review", "domain": "Periodontics", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.391", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the Immunization Schedule, What is the recommended time for the FIRST DTaP (Diphtheria, Tetanus & acellular Pertussis) immunization?", "options": ["1 mo.", "2 mo.", "4. mo.", "6 mo."], "answer": 1, "explanation": "Correct answer: 2 mo.. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.392", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the immunization schedule, what is the recommended time for the FIRST MMR (Measles, Mumps & Rubella) immunization?", "options": ["> 12 – 15 mo.", "18 mo.", "19 – 23 mo.", "2 to 3 yr.", "4 to 6 yr."], "answer": 0, "explanation": "Correct: A. > 12 – 15 mo.", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.393", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the immunization schedule, what is the recommended time for the FINAL MMR (Measles, Mumps & Rubella) immunization?", "options": ["> 12 – 15 mo.", "18 mo.", "19 – 23 mo.", "2 to 3 yr.", "4 to 6 yr."], "answer": 4, "explanation": "Correct: E. 4 to 6 yr.", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.394", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What is the age of the onset of puberty in Females?", "options": ["10 – 12", "11 – 13", "12 – 15 (Males)", "14 – 16"], "answer": 1, "explanation": "Correct answer: 11 – 13. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.395", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following drugs has the potential to interfere with the effects of Benzodiazepine in patients taking it to control seizures?", "options": ["Lidocaine", "Clindamycin", "Chlorhexadine", "Flumazenil", "Versed"], "answer": 3, "explanation": "Correct: D. Flumazenil", "source": "2012 Troutman Comprehensive Review", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.396", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Albrights Hereditary Osteodystrophy is associated with which of the following?", "options": ["Hyperthyroidism", "Hyperparathyroidism", "Hyperadrenalism", "Pseudohyperparathyroidism", "Pseudohypoparathyroidism"], "answer": 4, "explanation": "Correct: E. Pseudohypoparathyroidism", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Pathology & Medicine", "category": "Oral Pathology & Medicine", "source_page": "Troutman Comprehensive Review 2012 — Q.397", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the incidence of Necrotizing Periodontal Disease in children in the US?", "options": ["2%", "3 %", "5%", ">5%"], "answer": 0, "explanation": "Correct answer: 2%. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Periodontics", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.398", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "At which level of the spinal column is the Cricoid Cartilage located?", "options": ["2 nd.", "3 rd.", "4 th.", "5 th.", "6 th."], "answer": 4, "explanation": "Correct answer: 6 th.. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.399", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The cellular origin of Ewing’s Sarcoma is which of the following?", "options": ["Primitive bone-forming mesenchyme stem cells", "Primitive neuroectodermal cells", "Primitive mesenchymal connective tissue cells", "Neural crest cells", "Aneurysmal bone cells"], "answer": 3, "explanation": "Correct: D. Neural crest cells", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Pathology & Medicine", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.400", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which gene mutation causes achondroplasia?", "options": ["FGFR3", "COL1A1", "PTCH1", "EXT1"], "answer": 0, "explanation": "Achondroplasia is caused by a gain-of-function mutation in FGFR3 (fibroblast growth factor receptor 3), which inhibits endochondral ossification. It is autosomal dominant and associated with increased paternal age.", "source": "Combined 2025", "domain": "Caries & Prevention", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Achondroplasia", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "What is the inheritance pattern of achondroplasia?", "options": ["Autosomal recessive", "X-linked recessive", "Autosomal dominant", "Mitochondrial"], "answer": 2, "explanation": "Achondroplasia follows autosomal dominant inheritance, though ~80% of cases arise from de novo mutations, particularly associated with advanced paternal age.", "source": "Combined 2025", "domain": "Caries & Prevention", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Achondroplasia", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "A patient with achondroplasia presents for dental treatment under general anesthesia. What is the primary airway/positioning concern?", "options": ["Macroglossia causing airway obstruction", "Atlantoaxial instability with cervical stenosis", "Mandibular hypoplasia limiting mouth opening", "Subglottic stenosis requiring smaller ET tube"], "answer": 1, "explanation": "Achondroplasia patients have foramen magnum stenosis and risk for atlantoaxial instability. Neck extension/positioning during GA can compress the cervical spinal cord. This must be communicated to the anesthesiology team pre-operatively.", "source": "Combined 2025", "domain": "Pharmacology & Sedation", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Achondroplasia", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Which cardiac defect is most commonly associated with Down syndrome (Trisomy 21)?", "options": ["Tetralogy of Fallot", "Ventricular septal defect only", "Atrioventricular septal defect (AVSD)", "Coarctation of the aorta"], "answer": 2, "explanation": "AVSD (also called endocardial cushion defect or AV canal defect) is the most common congenital heart defect in Down syndrome, occurring in ~40-50% of patients. It involves defects in both the atrial and ventricular septa along with abnormalities of the AV valves.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Down Syndrome (Trisomy 21)", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "A child with Down syndrome is scheduled for a dental procedure. Which condition requires medical clearance regarding cervical spine stability?", "options": ["Macroglossia", "Atlantoaxial instability", "Subglottic stenosis", "Mitral valve prolapse"], "answer": 1, "explanation": "Atlantoaxial instability (AAI) occurs in 10-20% of patients with Down syndrome due to ligamentous laxity and hypotonia. Neck hyperextension during dental procedures or GA can cause cervical cord compression. Radiographic screening and medical clearance are required before procedures requiring neck manipulation.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Down Syndrome (Trisomy 21)", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Which craniofacial feature is characteristic of achondroplasia that has direct dental implications?", "options": ["Prognathism and anterior open bite", "Midface hypoplasia causing Class III malocclusion and crowding", "Mandibular hypoplasia with Class II malocclusion", "Unilateral facial hypertrophy"], "answer": 1, "explanation": "Achondroplasia causes midface hypoplasia (the midface bones are cartilaginous in origin) resulting in a relative Class III malocclusion. Intraoral findings include dental crowding, hypodontia, open bite, and posterior crossbite.", "source": "Combined 2025", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Combined 2025 Study Guide — Achondroplasia", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Sturge-Weber syndrome involves which type of vascular malformation affecting the face?", "options": ["Arteriovenous malformation", "Capillary/venous malformation (port wine stain)", "Lymphatic malformation", "Hemangioma"], "answer": 1, "explanation": "Sturge-Weber syndrome features a port wine stain (capillary/venous malformation) in the V1 (ophthalmic) trigeminal distribution. Unlike hemangiomas that involute, port wine stains are permanent. The syndrome also involves ipsilateral leptomeningeal angiomatosis.", "source": "Combined 2025", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Combined 2025 Study Guide — Sturge-Weber Syndrome", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "A child with Sturge-Weber syndrome is at risk for gingival enlargement from which medication?", "options": ["Carbamazepine", "Phenytoin", "Valproic acid", "Levetiracetam"], "answer": 1, "explanation": "Phenytoin (Dilantin) is commonly used to control seizures in Sturge-Weber syndrome and causes gingival enlargement in 50% of patients. The fibrous enlargement is influenced by plaque and can be minimized with excellent oral hygiene. Surgical intervention (gingivectomy) may be required.", "source": "Combined 2025", "domain": "Periodontics", "category": "Periodontics", "source_page": "Combined 2025 Study Guide — Sturge-Weber Syndrome", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Beckwith-Wiedemann syndrome is characterized by which oral finding?", "options": ["Cleft palate", "Macroglossia", "Micrognathia", "Enamel hypoplasia"], "answer": 1, "explanation": "Beckwith-Wiedemann syndrome features macroglossia (large tongue), macrosomia, omphalocele, and hypoglycemia. The macroglossia can cause open bite, mandibular prognathism, and difficulty with feeding and speech. Surgical glossoplasty may be needed.", "source": "Combined 2025", "domain": "Oral Pathology & Medicine", "category": "Oral Pathology & Medicine", "source_page": "Combined 2025 Study Guide — Beckwith-Wiedemann Syndrome", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Which syndrome features bilateral mandibular hypoplasia, deformed pinnae, coloboma, and absence of lower eyelashes?", "options": ["Treacher Collins syndrome", "Goldenhar syndrome", "Pierre Robin sequence", "Crouzon syndrome"], "answer": 1, "explanation": "Goldenhar syndrome (oculo-auriculo-vertebral spectrum) features unilateral or bilateral hypoplasia of the mandible, deformed/absent external ear (microtia), epibulbar dermoids, coloboma of the upper eyelid, and vertebral anomalies. It differs from Treacher Collins in that it is typically unilateral.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Oral Pathology & Medicine", "source_page": "Combined 2025 Study Guide", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "A child with Turner syndrome (45,X) presents for dental evaluation. What dental finding is most characteristic?", "options": ["Supernumerary teeth and taurodontism", "Short roots, enamel hypoplasia, increased caries risk", "Oligodontia and delayed eruption", "Macrodontia and fused teeth"], "answer": 1, "explanation": "Turner syndrome (45,X) is associated with short dental roots, enamel defects/hypoplasia, increased caries susceptibility, and delayed dental development. Patients also have short stature, webbed neck, primary amenorrhea, and increased cardiovascular risk.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Turner Syndrome (45,X)", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Prader-Willi syndrome is most commonly caused by which genetic mechanism?", "options": ["Deletion of maternal chromosome 15q11-13", "Deletion of paternal chromosome 15q11-13", "Trisomy 15", "FMRP protein deficiency"], "answer": 1, "explanation": "Prader-Willi syndrome results from loss of paternally imprinted genes on chromosome 15q11-13 (paternal deletion in ~70%, maternal uniparental disomy in ~25%). Angelman syndrome results from the same region but involves maternal deletion — a classic imprinting disorder pair.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Special Healthcare Needs", "source_page": "Combined 2025 Study Guide — Prader-Willi Syndrome", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Which oral finding is MOST characteristic of Papillon-Lefèvre syndrome?", "options": ["Multiple dentigerous cysts", "Severe aggressive periodontitis causing early tooth loss", "Enamel hypoplasia of all teeth", "Macroglossia and delayed eruption"], "answer": 1, "explanation": "Papillon-Lefèvre syndrome (PLS) features severe aggressive periodontitis beginning with primary tooth eruption, leading to early loss of both primary and permanent teeth. It is caused by cathepsin C deficiency and is autosomal recessive. The severe periodontitis is the hallmark dental finding.", "source": "Combined 2025", "domain": "Periodontics", "category": "Periodontics", "source_page": "Combined 2025 Study Guide — Papillon-Lefèvre Syndrome", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Hypophosphatasia in children is characterized by premature loss of primary teeth due to:", "options": ["Severe caries undermining the roots", "Deficiency of cementum causing detachment from the PDL", "Aggressive periodontitis destroying alveolar bone", "Ankylosis of primary teeth preventing normal exfoliation"], "answer": 1, "explanation": "Hypophosphatasia is caused by deficiency of tissue-nonspecific alkaline phosphatase (TNSALP), resulting in defective cementum formation. Without cementum, the PDL cannot attach to the root, causing premature exfoliation of primary teeth (especially incisors) with intact roots. This is pathognomonic of hypophosphatasia.", "source": "Combined 2025", "domain": "Periodontics", "category": "Periodontics", "source_page": "Combined 2025 Study Guide — Hypophosphatasia", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "Which condition should be ruled out when a child presents with premature exfoliation of primary teeth without trauma?", "options": ["Amelogenesis imperfecta", "Hypophosphatasia", "Cleidocranial dysplasia", "Dentinogenesis imperfecta"], "answer": 1, "explanation": "Premature exfoliation of primary teeth (with intact roots, no caries, no trauma) is the hallmark of hypophosphatasia. Other conditions to consider: Langerhans cell histiocytosis, Papillon-Lefèvre syndrome, Chédiak-Higashi syndrome, cyclic neutropenia, and Leukemia.", "source": "Combined 2025", "domain": "Special Healthcare Needs", "category": "Oral Pathology & Medicine", "source_page": "Combined 2025 Study Guide", "source_doc": "Combined 2025.pdf (Board Review from Alex/)"}, {"q": "The primary action of phentolamine mesylate (OraVerse) in dental practice is:", "options": ["Alpha-adrenergic agonist causing vasoconstriction", "Alpha-adrenergic antagonist causing vasodilation to reverse soft tissue anesthesia", "Beta-adrenergic blocker reducing heart rate", "Reversal agent for benzodiazepine sedation"], "answer": 1, "explanation": "Phentolamine mesylate (OraVerse) is an alpha-adrenergic antagonist that causes vasodilation, reversing residual soft tissue numbness after dental anesthesia. It is NOT a reversal agent for sedation drugs. Maximum dose: 0.2mg for patients under 30kg, 0.4mg for 30kg+.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Methemoglobinemia as a complication of local anesthetic is most associated with which drug?", "options": ["Lidocaine", "Articaine", "Prilocaine", "Mepivacaine"], "answer": 2, "explanation": "Prilocaine metabolizes to o-toluidine, which oxidizes hemoglobin to methemoglobin. Treatment is IV methylene blue (1-2 mg/kg). Benzocaine (topical) also carries this risk. Prilocaine is avoided in neonates, infants, and patients with methemoglobinemia risk.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is the correct reversal agent pairing for sedation drugs?", "options": ["Benzodiazepines → Naloxone; Opioids → Flumazenil", "Benzodiazepines → Flumazenil; Opioids → Naloxone", "Both reversed by Naloxone", "Chloral hydrate → Flumazenil; Opioids → Naloxone"], "answer": 1, "explanation": "Flumazenil (Romazicon) reverses benzodiazepines. Naloxone (Narcan) reverses opioids. Chloral hydrate has NO reversal agent. Hydroxyzine and ketamine also have no specific reversal agents.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The minimum alveolar concentration (MAC) of nitrous oxide is approximately:", "options": ["5%", "55%", "105%", "150%"], "answer": 2, "explanation": "Nitrous oxide has a MAC of ~105%, meaning it cannot produce surgical anesthesia at atmospheric pressure alone (you'd need >100% which is impossible). This is why nitrous oxide is used as an adjunct/carrier gas, not as a sole anesthetic agent. Its primary dental use is anxiolysis at 30-50%.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which enzyme does nitrous oxide irreversibly inactivate, and what deficiency does this mimic?", "options": ["Carbonic anhydrase → respiratory acidosis", "Methionine synthase → cobalamin (B12) deficiency", "Phenylalanine hydroxylase → PKU", "Adenosine deaminase → SCID"], "answer": 1, "explanation": "Nitrous oxide irreversibly oxidizes the cobalt center of vitamin B12, inactivating methionine synthase. Prolonged exposure causes megaloblastic anemia, peripheral neuropathy, and subacute combined degeneration — identical to B12 deficiency. Contraindicated in patients with B12 deficiency.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "For a 25 kg child, what is the correct hourly fluid maintenance rate using the 4-2-1 rule?", "options": ["25 mL/hr", "50 mL/hr", "65 mL/hr", "75 mL/hr"], "answer": 2, "explanation": "4-2-1 rule: First 10 kg = 4 mL/kg/hr (40 mL/hr). Next 10 kg = 2 mL/kg/hr (+20 mL/hr). Remaining kg = 1 mL/kg/hr (+5 mL/hr for the 5 kg above 20 kg). Total = 40+20+5 = 65 mL/hr.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the maximum recommended dose of articaine 4% for a child?", "options": ["3.2 mg/kg", "5.1 mg/kg", "7 mg/kg", "10 mg/kg"], "answer": 2, "explanation": "Maximum dose of articaine 4% is 7 mg/kg (up to 500 mg absolute maximum). One cartridge of 4% articaine = 72 mg. For a 22 kg child: 7 × 22 = 154 mg maximum.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The Mallampati classification system assesses:", "options": ["Tonsil size for airway obstruction risk", "Ease or difficulty of orotracheal intubation based on oral cavity anatomy", "Respiratory depression during sedation", "The degree of nasal obstruction"], "answer": 1, "explanation": "Mallampati classes (I-IV) assess the oropharyngeal airway by looking at visibility of tonsillar pillars, uvula, and soft palate. Class III-IV predicts difficult intubation. Class III: soft palate only visible. Class IV: hard palate only visible.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is a contraindication to nitrous oxide sedation?", "options": ["Strong gag reflex", "First trimester of pregnancy", "Moderate dental anxiety", "Needle phobia"], "answer": 1, "explanation": "Contraindications to nitrous oxide: first trimester pregnancy (teratogenic risk), COPD/severe respiratory disease, cobalamin (B12) deficiency, nasal obstruction, bowel obstruction/pneumothorax (N2O expands gas-filled spaces), recent eye surgery with gas bubble, severe emotional disturbance/claustrophobia.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which local anesthetic is safest for pregnant patients based on FDA classification?", "options": ["Articaine", "Bupivacaine", "Lidocaine", "Mepivacaine"], "answer": 2, "explanation": "Lidocaine is Category B (no evidence of risk in humans) and is the preferred local anesthetic in pregnancy. Mepivacaine is avoided near term as it has slow fetal metabolism. Bupivacaine and articaine are Category C.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "According to Piaget's stages of cognitive development, abstract thinking first appears in which stage?", "options": ["Sensorimotor (0-2 years)", "Preoperational (2-7 years)", "Concrete operations (7-11 years)", "Formal operations (12+ years)"], "answer": 3, "explanation": "Abstract thinking begins in Piaget's Formal Operations stage (~12+ years). Key features: hypothetical-deductive reasoning, abstract thought, consideration of multiple variables. Concrete operations (7-11) allows logical thinking but only about concrete objects.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Growth & Development", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A 4-year-old child tries to take toys from others and refuses to share during a dental visit. This behavior is BEST explained by which Eriksonian stage?", "options": ["Trust vs. Mistrust", "Autonomy vs. Shame/Doubt", "Initiative vs. Guilt", "Industry vs. Inferiority"], "answer": 2, "explanation": "Initiative vs. Guilt (ages 3-6) involves children asserting power and control over their environment. They are egocentric, curious, and may show aggressive or domineering behavior. Failure to navigate this stage leads to guilt.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Growth & Development", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A child sits in the chair and looks at the dentist when spoken to, but appears tense and withdrawn. Which Frankl behavior rating applies?", "options": ["Frankl 1 (Definitely Negative)", "Frankl 2 (Negative)", "Frankl 3 (Positive)", "Frankl 4 (Definitely Positive)"], "answer": 2, "explanation": "Frankl 3 (Positive) = accepts treatment, sometimes cautiously, follows directions willingly, may be apprehensive but cooperates. Frankl 4 = excellent rapport, laughing and enjoying. Frankl 2 = reluctant to accept treatment, uncooperative, sulky. Frankl 1 = refuses treatment, forceful crying.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Behavior Guidance", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "According to evidence-based reviews, which behavior guidance technique has the weakest level of evidence supporting its effectiveness?", "options": ["Distraction", "Hypnosis", "Positive pre-visit imagery", "Tell-Show-Do (TSD)"], "answer": 3, "explanation": "Tell-Show-Do is perhaps the most universally used behavior guidance technique, but systematic reviews show it has only weak evidence for effectiveness. It remains recommended due to clinical experience and face validity despite limited RCT evidence.", "source": "QE Prep Course 2024", "domain": "Research Methods & Biostatistics", "category": "Research Methods & Biostatistics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Motivational interviewing in pediatric dentistry is BEST described as:", "options": ["Asking the parent to explain what the child has done wrong", "A technique to explore and resolve ambivalence about behavior change", "Telling the patient what they need to do differently", "Rewarding compliant behavior with prizes"], "answer": 1, "explanation": "Motivational interviewing (MI) is a patient-centered counseling technique that helps patients explore and resolve their ambivalence about behavior change. It uses open-ended questions, affirmations, reflective listening, and summaries (OARS). It is used for caries prevention counseling with parents.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The hybrid layer in dentin bonding is best described as:", "options": ["A layer of resin that bonds to the smear layer", "An interpenetrating network of collagen and resin formed after acid etching", "A calcium-depleted zone that requires remineralization", "A bonding interface between enamel and dentin"], "answer": 1, "explanation": "The hybrid layer (resin-dentin interdiffusion zone) forms when resin monomers penetrate the demineralized dentin collagen network after acid etching and are polymerized. It was described by Nakabayashi. It is the primary mechanism of micromechanical bonding in modern dentin adhesives.", "source": "QE Prep Course 2024", "domain": "Restorative Dentistry", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following BEST describes the Hall Technique for primary molar restoration?", "options": ["SSC placement after full caries excavation and pulpotomy", "SSC placement over carious primary molar without caries removal or tooth preparation", "Composite resin buildup followed by SSC", "IPC followed by definitive SSC placement after 6 weeks"], "answer": 1, "explanation": "The Hall Technique involves cementing a pre-formed SSC over a carious primary molar without local anesthesia, caries removal, or tooth preparation. It seals bacteria from nutrients and stops caries progression. Evidence shows comparable or superior outcomes to conventional SSC placement. Occlusion normalizes within weeks.", "source": "QE Prep Course 2024", "domain": "Restorative Dentistry", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "When performing an amalgam Class II preparation in a primary molar, the bevel on the cavosurface margin should be:", "options": ["45 degrees to maximize retention", "90 degrees (butt joint — no bevel)", "30 degrees to improve esthetics", "Rounded to prevent stress concentrations"], "answer": 1, "explanation": "Amalgam restorations require a 90-degree butt joint (no bevel) at the cavosurface margin. Bevels are used for composite resin preparations to increase enamel surface area for bonding. A bevel on an amalgam margin creates a thin, weak amalgam edge that will fracture.", "source": "QE Prep Course 2024", "domain": "Orthodontics & Occlusion", "category": "Restorative Dentistry", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the recommended occlusal reduction for a stainless steel crown (SSC) on a primary molar?", "options": ["0.5 mm", "1.0-1.5 mm", "1.5-2.0 mm", "No occlusal reduction required"], "answer": 1, "explanation": "1.0-1.5 mm of occlusal reduction is recommended for SSC placement to allow proper seating and prevent excessive occlusal opening. Proximal reduction should clear the contact, and the gingival margin should be 1-2 mm subgingival.", "source": "QE Prep Course 2024", "domain": "Restorative Dentistry", "category": "Restorative Dentistry", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Zirconia crowns for primary molars require what minimum occlusal reduction?", "options": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "answer": 2, "explanation": "Zirconia crowns (NuSmile, Kinder Krowns, etc.) require 1.5 mm of occlusal reduction — more than SSCs — to accommodate the thickness of the zirconia material. They offer superior esthetics but require local anesthesia and preparation. They cannot be crimped like SSCs.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "In a primary tooth, which finding on clinical examination is MOST indicative of irreversible pulpitis requiring pulpectomy rather than pulpotomy?", "options": ["Deep carious lesion with no symptoms", "Spontaneous pain, especially at night", "Bleeding on pulp exposure that stops within 4 minutes", "Positive response to cold testing"], "answer": 1, "explanation": "Spontaneous pain (especially nocturnal), history of prolonged pain, pain on biting, and pathologic mobility are indicators of irreversible pulpitis/pulp necrosis requiring pulpectomy in primary teeth. Controlled bleeding on pulp exposure is consistent with vital pulp and pulpotomy candidacy.", "source": "QE Prep Course 2024", "domain": "Pulp Therapy & Endodontics", "category": "Pulp Therapy & Endodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Mineral trioxide aggregate (MTA) for pulpotomy in primary teeth works primarily by:", "options": ["Fixing the radicular pulp tissue (like formocresol)", "Inducing dentinal bridge formation and maintaining pulp vitality", "Obliterating root canals with calcium hydroxide", "Releasing fluoride to prevent root caries"], "answer": 1, "explanation": "MTA (and biodentin) maintains radicular pulp vitality by creating an alkaline environment that induces hard tissue (dentinal bridge) formation. Unlike formocresol which fixes/mummifies tissue, MTA promotes biologic healing. Success rates are comparable to formocresol.", "source": "QE Prep Course 2024", "domain": "Pulp Therapy & Endodontics", "category": "Pulp Therapy & Endodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which obturating material is preferred for pulpectomy of primary teeth?", "options": ["Gutta-percha", "Zinc oxide eugenol (ZOE) paste", "Calcium hydroxide powder", "Biodentin"], "answer": 1, "explanation": "ZOE paste (non-reinforced, resorbable) is preferred for primary tooth pulpectomy because it resorbs at a rate similar to the primary root, allowing space for the succedaneous tooth. Gutta-percha is non-resorbable and should NOT be used in primary teeth. Vitapex (calcium hydroxide + iodoform) is an alternative.", "source": "QE Prep Course 2024", "domain": "Pulp Therapy & Endodontics", "category": "Pulp Therapy & Endodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Apexogenesis is a vital pulp therapy procedure indicated for permanent teeth with:", "options": ["Completed root formation and irreversible pulpitis", "Open apex (immature root) with vital pulp tissue", "Closed apex with pulp necrosis", "Horizontal root fracture in the apical third"], "answer": 1, "explanation": "Apexogenesis preserves vital radicular pulp in immature permanent teeth to allow continued root development and apex closure. It uses MTA or calcium hydroxide as a pulp cap/pulpotomy material. The goal is to allow the tooth to complete root formation (Nolla stages). Distinct from apexification which treats necrotic immature teeth.", "source": "QE Prep Course 2024", "domain": "Oral Surgery & Trauma", "category": "Pulp Therapy & Endodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A 7-year-old presents with multiple, painful oral ulcers on the attached gingiva and hard palate, preceded by 1-2 days of fever and malaise. The MOST likely diagnosis is:", "options": ["Recurrent aphthous stomatitis (RAS)", "Primary herpetic gingivostomatitis", "Herpangina", "Hand-foot-mouth disease"], "answer": 1, "explanation": "Primary HSV-1 gingivostomatitis features fever and malaise 1-2 days before vesicles/ulcers appear on BOTH free AND attached gingiva (keratinized mucosa). Recurrent aphthous stomatitis occurs only on non-keratinized mucosa. Herpangina (Coxsackie A) is limited to the posterior oropharynx. Hand-foot-mouth involves palms/soles.", "source": "QE Prep Course 2024", "domain": "Oral Pathology & Medicine", "category": "Periodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Herpangina is caused by which virus and affects which oral sites?", "options": ["HSV-1; anterior mouth and lips", "Coxsackie A virus; posterior oropharynx and soft palate", "EBV; posterior oropharynx with exudate", "HPV; soft palate as verrucous lesions"], "answer": 1, "explanation": "Herpangina is caused by Coxsackie A virus (and other enteroviruses) and presents as small vesicles/ulcers limited to the posterior oropharynx (soft palate, uvula, tonsillar pillars). It is self-limiting in 7-10 days. It is distinct from herpetic stomatitis which involves the anterior mouth.", "source": "QE Prep Course 2024", "domain": "Oral Pathology & Medicine", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Langerhans cell histiocytosis (LCH / Histiocytosis X) most commonly presents in the mouth as:", "options": ["Multiple dentigerous cysts", "Premature tooth loss with floating teeth on radiograph", "Gingival enlargement resembling leukemic infiltrate", "Multiple aphthous-like ulcers"], "answer": 1, "explanation": "LCH causes osteolytic lesions that destroy alveolar bone, giving the classic 'floating teeth' or 'teeth floating in air' radiographic appearance as teeth appear to lack bony support. Clinically there is premature mobility/loss of teeth, gingival ulceration, and jaw pain.", "source": "QE Prep Course 2024", "domain": "Radiology", "category": "Periodontics", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A brown tumor on radiograph in a young patient should prompt workup for which systemic condition?", "options": ["Multiple myeloma", "Hyperparathyroidism", "Giant cell arteritis", "Paget's disease of bone"], "answer": 1, "explanation": "Brown tumors are giant cell lesions caused by hyperparathyroidism (elevated PTH). Elevated PTH causes osteoclastic bone resorption and replacement by fibrovascular tissue that hemorrhages, creating the brown color. Serum calcium, PTH, and phosphorus levels confirm the diagnosis.", "source": "QE Prep Course 2024", "domain": "Radiology", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A 6-year-old patient presents with multiple cysts of the jaw, bifid ribs, and calcified falx cerebri. What is the MOST likely diagnosis?", "options": ["Cleidocranial dysplasia", "Nevoid basal cell carcinoma syndrome (Gorlin syndrome)", "Gardner syndrome", "Cherubism"], "answer": 1, "explanation": "Gorlin syndrome (NBCCS) = multiple odontogenic keratocysts (OKCs) + basal cell carcinomas + bifid ribs + calcified falx cerebri + skeletal anomalies. Caused by PTCH1 mutation (tumor suppressor). The jaw cysts can be the first presenting sign in children.", "source": "QE Prep Course 2024", "domain": "Special Healthcare Needs", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Erythema multiforme is distinguished from Stevens-Johnson syndrome primarily by:", "options": ["Erythema multiforme involves internal organs; SJS does not", "SJS has more severe mucosal involvement and systemic symptoms with greater BSA involvement", "Erythema multiforme is caused by HSV; SJS is always drug-induced", "SJS targets only oral mucosa; EM involves skin only"], "answer": 1, "explanation": "Stevens-Johnson syndrome is a severe form of erythema multiforme with extensive mucosal involvement (oral, ocular, genital), systemic symptoms (fever, prostration), and >10% BSA epidermal detachment. EM minor is typically HSV-triggered and self-limiting. SJS/TEN spectrum is typically drug-i
