<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABPD QE Prep</title>
<style>
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #222534;
  --border: #2e3248;
  --text: #e8eaf0;
  --muted: #8b90a0;
  --accent: #5b8af0;
  --accent2: #7c6af5;
  --green: #3ecf82;
  --red: #f06060;
  --yellow: #f5c842;
  --radius: 12px;
  --sidebar-w: 268px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;min-height:100vh;}

/* ── Profile Screen ───────────────────────────── */
#profile-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:32px 16px;}
.profile-screen-inner{width:100%;max-width:720px;}
.profile-screen-inner h1{font-size:26px;font-weight:800;margin-bottom:6px;text-align:center;}
.profile-screen-inner p{color:var(--muted);text-align:center;margin-bottom:36px;font-size:14px;}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.profile-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:22px 16px 18px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;}
.profile-card:hover{border-color:var(--accent);transform:translateY(-2px);}
.profile-card.empty{border-style:dashed;opacity:.6;}
.profile-card.empty:hover{opacity:1;}
.profile-avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;}
.profile-name{font-size:14px;font-weight:600;text-align:center;word-break:break-word;}
.profile-stats{font-size:11px;color:var(--muted);text-align:center;line-height:1.5;}
.profile-badge{position:absolute;top:10px;right:10px;width:8px;height:8px;border-radius:50%;background:var(--green);}

/* ── Profile Edit Modal ───────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:200;display:none;}
.modal-overlay.open{display:flex;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;width:380px;max-width:95vw;}
.modal h3{font-size:18px;font-weight:700;margin-bottom:20px;}
.modal-field{margin-bottom:16px;}
.modal-field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.modal-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;padding:10px 12px;font-family:inherit;}
.modal-input:focus{outline:none;border-color:var(--accent);}
.emoji-picker{display:flex;gap:8px;flex-wrap:wrap;}
.emoji-opt{width:38px;height:38px;background:var(--surface2);border:2px solid var(--border);border-radius:8px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s;}
.emoji-opt:hover,.emoji-opt.selected{border-color:var(--accent);background:rgba(91,138,240,.12);}
.color-picker{display:flex;gap:8px;flex-wrap:wrap;}
.color-opt{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .1s;}
.color-opt.selected{border-color:var(--text);}
.modal-actions{display:flex;gap:10px;margin-top:20px;}
.modal-btn{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:opacity .15s;}
.modal-btn.primary{background:var(--accent);color:#fff;}
.modal-btn.secondary{background:var(--surface2);color:var(--muted);}
.modal-btn:hover{opacity:.85;}
.modal-btn.danger{background:rgba(240,96,96,.15);color:var(--red);border:1px solid var(--red);}

/* ── App Layout ───────────────────────────────── */
#app{display:none;}
.app-wrap{display:flex;min-height:100vh;}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:10;}
.sidebar-header{padding:16px 14px 12px;border-bottom:1px solid var(--border);}
.sidebar-header h1{font-size:14px;font-weight:700;letter-spacing:.5px;}
.profile-pill{display:flex;align-items:center;gap:8px;margin-top:10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 10px 6px 8px;cursor:pointer;transition:all .15s;width:100%;}
.profile-pill:hover{border-color:var(--accent);}
.profile-pill-avatar{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.profile-pill-name{font-size:12px;font-weight:600;flex:1;}
.profile-pill-change{font-size:10px;color:var(--muted);}
.sidebar-section{padding:10px 14px 5px;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.domain-btn{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:1px 4px;text-align:left;padding:8px 10px;border:none;background:none;color:var(--muted);cursor:pointer;border-radius:8px;transition:all .15s;font-size:12.5px;}
.domain-btn:hover{background:var(--surface2);color:var(--text);}
.domain-btn.active{background:rgba(91,138,240,.15);color:var(--accent);font-weight:600;}
.domain-btn .d-name{flex:1;line-height:1.3;}
.domain-btn .d-count{font-size:11px;color:var(--muted);background:var(--surface2);padding:1px 6px;border-radius:10px;white-space:nowrap;}
.domain-btn.active .d-count{background:rgba(91,138,240,.2);color:var(--accent);}
.d-weight{font-size:10px;color:var(--muted);}
.sidebar-divider{border:none;border-top:1px solid var(--border);margin:6px 12px;}

/* ── Topbar ───────────────────────────────────── */
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:14px;height:56px;position:sticky;top:0;z-index:5;}
.topbar h2{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mode-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:8px;overflow:hidden;flex-shrink:0;}
.mode-btn{padding:6px 13px;font-size:12px;font-weight:600;border:none;background:none;color:var(--muted);cursor:pointer;transition:all .15s;}
.mode-btn.active{background:var(--accent);color:#fff;}
.score-chip{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:600;background:var(--surface2);}
.score-chip.correct{color:var(--green);}
.score-chip.wrong{color:var(--red);}

/* ── Quiz Area ────────────────────────────────── */
.quiz-area{flex:1;padding:32px 40px;max-width:800px;margin:0 auto;width:100%;}
.progress-bar-wrap{margin-bottom:24px;}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px;}
.progress-bar{height:4px;background:var(--surface2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .3s;}
.question-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px 28px 24px;margin-bottom:20px;}
.q-meta{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.q-tag{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted);}
.q-tag.domain-tag{color:var(--accent);background:rgba(91,138,240,.12);}
.question-text{font-size:16px;line-height:1.6;color:var(--text);font-weight:500;}
.options-grid{display:flex;flex-direction:column;gap:10px;margin-top:20px;}
.option-btn{text-align:left;padding:13px 16px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);cursor:pointer;font-size:14px;line-height:1.4;transition:all .15s;display:flex;gap:10px;align-items:flex-start;}
.option-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(91,138,240,.08);}
.option-btn:disabled{cursor:default;}
.option-btn.correct{border-color:var(--green);background:rgba(62,207,130,.1);color:var(--green);}
.option-btn.wrong{border-color:var(--red);background:rgba(240,96,96,.1);color:var(--red);}
.option-label{font-weight:700;min-width:20px;}
.explanation-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:16px 18px;margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--text);display:none;}
.explanation-box.show{display:block;}
.exp-label{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px;}
.recall-area{margin-top:20px;}
.recall-textarea{width:100%;min-height:90px;background:var(--surface2);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:12px 14px;resize:vertical;font-family:inherit;transition:border-color .15s;}
.recall-textarea:focus{outline:none;border-color:var(--accent);}
.recall-reveal-btn{margin-top:12px;padding:10px 24px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;border:none;border-radius:8px;cursor:pointer;transition:opacity .15s;}
.recall-reveal-btn:hover{opacity:.9;}
.recall-reveal-btn:disabled{opacity:.4;cursor:default;}
.self-grade{display:none;gap:10px;margin-top:14px;}
.self-grade.show{display:flex;}
.grade-btn{flex:1;padding:12px;border-radius:10px;border:2px solid;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;}
.grade-btn.got-it{border-color:var(--green);color:var(--green);background:rgba(62,207,130,.08);}
.grade-btn.got-it:hover{background:rgba(62,207,130,.18);}
.grade-btn.missed{border-color:var(--red);color:var(--red);background:rgba(240,96,96,.08);}
.grade-btn.missed:hover{background:rgba(240,96,96,.18);}
.nav-row{display:flex;gap:10px;margin-top:20px;align-items:center;}
.nav-btn{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;border:none;}
.nav-btn.primary{background:var(--accent);color:#fff;}
.nav-btn.primary:hover{opacity:.9;}
.nav-btn.secondary{background:var(--surface2);color:var(--muted);border:1px solid var(--border);}
.nav-btn.secondary:hover{color:var(--text);}
.nav-btn:disabled{opacity:.35;cursor:default;}
.skip-link{font-size:12px;color:var(--muted);cursor:pointer;margin-left:auto;}
.skip-link:hover{color:var(--text);}

/* ── Start Screen ─────────────────────────────── */
.start-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;}
.start-card h2{font-size:22px;font-weight:700;margin-bottom:8px;}
.start-card p{color:var(--muted);margin-bottom:24px;font-size:14px;line-height:1.6;}
.start-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px;}
.start-stat{background:var(--surface2);border-radius:10px;padding:14px 16px;}
.start-stat .n{font-size:28px;font-weight:800;color:var(--accent);}
.start-stat .l{font-size:12px;color:var(--muted);margin-top:2px;}
.shuffle-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;}
.toggle-switch{position:relative;display:inline-block;width:40px;height:22px;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background:var(--surface2);border-radius:22px;transition:.2s;border:1px solid var(--border);}
.toggle-slider:before{content:'';position:absolute;height:16px;width:16px;left:2px;bottom:2px;background:var(--muted);border-radius:50%;transition:.2s;}
input:checked+.toggle-slider{background:var(--accent);border-color:var(--accent);}
input:checked+.toggle-slider:before{background:#fff;transform:translateX(18px);}
.toggle-label{font-size:13px;color:var(--muted);}
.start-actions{display:flex;gap:10px;flex-wrap:wrap;}
.start-actions .nav-btn{padding:12px 28px;font-size:15px;}

/* ── Results ──────────────────────────────────── */
.results-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:36px;text-align:center;}
.results-score{font-size:56px;font-weight:800;margin-bottom:4px;}
.results-score .pct{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.results-sub{font-size:15px;color:var(--muted);margin-bottom:28px;}
.results-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:24px;}
.stat-box{background:var(--surface2);border-radius:10px;padding:16px;}
.stat-num{font-size:24px;font-weight:700;}
.stat-num.g{color:var(--green);}
.stat-num.r{color:var(--red);}
.stat-num.y{color:var(--yellow);}
.stat-label{font-size:12px;color:var(--muted);margin-top:2px;}
.results-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:20px;}
.results-actions .nav-btn{padding:12px 26px;}
.domain-breakdown{text-align:left;margin-bottom:20px;}
.domain-breakdown table{width:100%;border-collapse:collapse;}
.domain-breakdown td{padding:6px 4px;font-size:13px;border-bottom:1px solid var(--border);}

/* ── Stats Panel ──────────────────────────────── */
.stats-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;margin-bottom:20px;}
.stats-card h3{font-size:16px;font-weight:700;margin-bottom:16px;}
.domain-stat-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.domain-stat-row:last-child{border-bottom:none;}
.dsn{flex:1;font-size:13px;}
.dsp{font-size:13px;font-weight:700;min-width:38px;text-align:right;}
.ds-bar-wrap{width:80px;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.ds-bar{height:100%;border-radius:3px;}
.ds-count{font-size:11px;color:var(--muted);min-width:46px;text-align:right;}

::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
@media(max-width:700px){
  .sidebar{display:none;}
  .main{margin-left:0;}
  .quiz-area{padding:20px 16px;}
  .profile-grid{grid-template-columns:repeat(2,1fr);}
}
</style>
</head>
<body>

<!-- ── Profile Selection Screen ── -->
<div id="profile-screen">
  <div class="profile-screen-inner">
    <h1>ABPD QE Prep</h1>
    <p>Select your profile to track your progress separately. May 4, 2026.</p>
    <div class="profile-grid" id="profile-grid"></div>
  </div>
</div>

<!-- ── Profile Edit Modal ── -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 id="modal-title">Set Up Profile</h3>
    <div class="modal-field">
      <label>Name</label>
      <input class="modal-input" id="modal-name" type="text" placeholder="Enter your name" maxlength="20">
    </div>
    <div class="modal-field">
      <label>Avatar</label>
      <div class="emoji-picker" id="emoji-picker"></div>
    </div>
    <div class="modal-field">
      <label>Color</label>
      <div class="color-picker" id="color-picker"></div>
    </div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">Cancel</button>
      <button class="modal-btn danger" id="reset-btn" onclick="resetProfile()" style="display:none">Reset Data</button>
      <button class="modal-btn primary" onclick="saveProfile()">Save & Start</button>
    </div>
  </div>
</div>

<!-- ── Main App ── -->
<div id="app">
<div class="app-wrap">
  <nav class="sidebar">
    <div class="sidebar-header">
      <h1>ABPD QE Prep</h1>
      <button class="profile-pill" onclick="switchProfile()" id="profile-pill">
        <div class="profile-pill-avatar" id="pill-avatar"></div>
        <span class="profile-pill-name" id="pill-name">Profile</span>
        <span class="profile-pill-change">switch</span>
      </button>
    </div>
    <div style="padding:8px 4px;">
      <div class="sidebar-section">Blueprint Domains</div>
      <button class="domain-btn active" onclick="selectDomain('all')" id="d-all">
        <span class="d-name">All Domains</span>
        <span class="d-count" id="cnt-all">286</span>
      </button>
      <div id="domain-list"></div>
      <hr class="sidebar-divider" style="margin:10px 12px;">
      <button class="domain-btn" onclick="startDrillWrong()" id="wrong-drill-btn" style="color:var(--red);display:none;">
        <span class="d-name">🎯 Drill Missed</span>
        <span class="d-count" id="cnt-wrong" style="color:var(--red);">0</span>
      </button>
      <button class="domain-btn" onclick="showStatsPanel()">
        <span class="d-name">📊 My Progress</span>
      </button>
    </div>
  </nav>

  <div class="main">
    <div class="topbar">
      <h2 id="topbar-title">All Domains</h2>
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-mcq" onclick="setMode('mcq')">Multiple Choice</button>
        <button class="mode-btn" id="mode-recall" onclick="setMode('recall')">Free Recall</button>
      </div>
      <span class="score-chip correct" id="chip-correct">✓ 0</span>
      <span class="score-chip wrong" id="chip-wrong">✗ 0</span>
    </div>
    <div class="quiz-area" id="quiz-area"></div>
  </div>
</div>
</div>

<script>
const ALL_QUESTIONS = [{"q": "Desmopressin (DDAVP) is most appropriately used in the medical management of:", "options": ["Glanzmann thrombasthenia", "Aplastic anemia", "Mild to moderate hemophilia A", "Cyclic neutropenia"], "answer": 2, "explanation": "Desmopressin (DDAVP) causes rapid release of factor VIII and vWF, doubling their levels. Used for mild hemophilia A and von Willebrand Disease. Does NOT help with platelet disorders (Glanzmann) or bone marrow failure (aplastic anemia, cyclic neutropenia).", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The histological landmark on primary teeth consisting of an altered arrangement of enamel prisms that occurs as a result of transition from intrauterine to extrauterine environment is the:", "options": ["Dentinoenamel junction", "Incremental line of demarcation", "Line of Retzius", "Neonatal line"], "answer": 3, "explanation": "The neonatal line is a hypomineralized line in enamel and dentin that marks the transition from intrauterine to postnatal life. All primary teeth and the cusps of first permanent molars have a neonatal line.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which of the following can cause thrombocytopenia?", "options": ["Aplastic anemia", "Aspirin therapy", "Vitamin B3 deficiency", "Von Willebrand Disease"], "answer": 0, "explanation": "Thrombocytopenia = insufficient platelets. Aplastic anemia causes bone marrow failure → decreased production of ALL blood cells including platelets. Aspirin impairs platelet FUNCTION but does not decrease platelet COUNT. vWD affects coagulation factor, not platelet count.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "A 15-year-old presents with a 2-day history of palatal petechiae, lymphadenopathy, and fever. The most appropriate test to confirm diagnosis is:", "options": ["Glucose tolerance test", "Monospot test", "Partial thromboplastin time", "Chemistry screen"], "answer": 1, "explanation": "This presentation (palatal petechiae, pharyngitis, cervical lymphadenopathy, fever) is classic for infectious mononucleosis caused by Epstein-Barr virus. Monospot test (heterophile antibody test) confirms EBV/mono. Note: EBV also associated with Burkitt lymphoma.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which is the most common type of malignancy associated with Down Syndrome?", "options": ["Leukemia", "Lymphoma", "Neuroblastoma", "Wilms Tumor"], "answer": 0, "explanation": "Down Syndrome (Trisomy 21) has 10-20x higher risk of both ALL and AML. Leukemia is the most common malignancy in Down Syndrome patients.", "source": "Binni 2018", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "What is the minimum percentage of factor activity present to be classified as SEVERE factor VIII deficiency?", "options": ["1% (mild=5%, moderate=1-5%)", "5% (>5% is mild)", "Less than 1%", "Less than 5%"], "answer": 2, "explanation": "Hemophilia severity: Severe <1% factor activity (70% of hemophilia A patients), Moderate 1-5%, Mild >5%. Hemophilia A (factor VIII) is most common (85%); Hemophilia B (factor IX) accounts for 15%. X-linked recessive inheritance.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which of the following nerves is anesthetized by an incisive nerve block?", "options": ["Greater palatine branch of V1", "Greater palatine branch of V2", "Infraorbital nerve", "Nasopalatine branch of V2"], "answer": 3, "explanation": "The incisive (nasopalatine) nerve block anesthetizes the nasopalatine branch of V2 (maxillary division). It provides palatal anesthesia to the anterior 6 maxillary teeth region.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "How do drugs such as montelukast (Singulair) and zileuton improve asthmatic symptoms?", "options": ["Antihistaminic effect", "Direct bronchodilation", "Leukotriene antagonism", "Stabilization of mast cells"], "answer": 2, "explanation": "Montelukast and zileuton are leukotriene receptor antagonists (LTRAs). They block leukotrienes released by mast cells that cause bronchoconstriction. Albuterol = direct bronchodilation (B2 agonist). Cromolyn = mast cell stabilization. Antihistamines target histamine, not leukotrienes.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Epsilon aminocaproic acid (Amicar) is useful in the management of bleeding disorders because of its ability to:", "options": ["Prolong the half-life of factor VIII", "Stimulate increased production of factors IX and X", "Inhibit the normal fibrinolytic component of the hemostatic mechanism", "Produce a 2-4 fold increase in circulatory factor VIII level"], "answer": 2, "explanation": "Amicar (epsilon aminocaproic acid) is an antifibrinolytic agent — it inhibits the conversion of plasminogen to plasmin, preventing clot breakdown (fibrinolysis). Also inhibits salivary fibrinolytic enzymes. DDAVP/desmopressin produces 2-4x increase in factor VIII.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Following a successful inferior alveolar nerve block, a patient experiences numbness of half of the lower lip and loss of sensation of the gingiva adjacent to the premolar teeth. Which nerve is anesthetized?", "options": ["Incisive nerve", "Lingual nerve", "Long buccal nerve", "Mental nerve"], "answer": 3, "explanation": "The mental nerve exits the mental foramen and provides sensory innervation to the lower lip and chin, and labial gingiva of anterior mandibular teeth. The incisive nerve is the terminal branch that continues anteriorly to supply the anterior teeth.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "During general anesthesia, a healthy 3-year-old develops increased end-tidal CO2, acidosis, muscle rigidity, and tachycardia. The likely cause is:", "options": ["Dislodged endotracheal tube", "Insufficient level of anesthesia", "Malignant hyperthermia", "Pulmonary embolism"], "answer": 2, "explanation": "Malignant hyperthermia (MH): autosomal dominant skeletal muscle disorder. Triggered by volatile anesthetics (halothane, sevoflurane) and succinylcholine. Signs: increased CO2, tachycardia, HTN, muscle rigidity (masseter spasm), hyperthermia. Treatment: discontinue agents, hyperventilate with 100% O2, dantrolene sodium 2.5 mg/kg IV.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Activation of a rapid palatal expansion (RPE) appliance at 2 turns/day for one week results in expansion of approximately:", "options": ["0.5 mm", "1.5 mm", "2.5 mm", "3.5 mm"], "answer": 3, "explanation": "Each turn of an RPE = 0.25 mm. 2 turns/day × 7 days = 14 turns × 0.25 mm = 3.5 mm. This is the standard activation protocol for rapid palatal expansion.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The MOST appropriate management of a 5-year-old with a minimally displaced subcondylar fracture is:", "options": ["Open reduction with internal fixation", "Closed reduction with intermaxillary fixation", "Observation with soft diet and ROM exercises", "Condylectomy"], "answer": 2, "explanation": "Subcondylar fractures in young children are managed conservatively with observation, soft diet, and range-of-motion exercises. The condyle has excellent remodeling capacity in children. Surgical intervention risks damaging the growth center.", "source": "Binni 2018", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "Which of the following is the MOST likely dental finding in a patient with cystic fibrosis?", "options": ["Increased caries rate", "Enamel hypoplasia", "Amelogenesis imperfecta", "Dentinogenesis imperfecta"], "answer": 1, "explanation": "Cystic fibrosis: enamel hypoplasia, tooth discoloration, salivary gland involvement, REDUCED caries (due to long-term antibiotic use), mouth breathing, anterior open bite. Antibiotics alter oral flora, reducing cariogenic bacteria.", "source": "Binni 2018", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A patient is taking warfarin (Coumadin). Which lab test is used to monitor this medication?", "options": ["Bleeding time (BT)", "Complete blood count (CBC)", "Partial thromboplastin time (PTT)", "Prothrombin time/INR (PT/INR)"], "answer": 3, "explanation": "Warfarin inhibits vitamin K-dependent clotting factors (II, VII, IX, X). Monitored by PT/INR. PTT monitors the intrinsic pathway and is used for heparin monitoring. Safe INR for dental procedures is ≤3.5 (some say ≤3.0).", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which of the following is the MOST common side effect of nitrous oxide/oxygen sedation?", "options": ["Laryngospasm", "Nausea and vomiting", "Paradoxical excitement", "Respiratory depression"], "answer": 1, "explanation": "Nausea and vomiting is the most common side effect of N2O/O2 sedation, especially at concentrations >50%. Risk is higher with recent food intake. Other effects: diffusion hypoxia if O2 not given post-procedure, mild respiratory depression, euphoria.", "source": "Binni 2018", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "The MOST effective vehicle for delivering fluoride for caries prevention in a community with optimal water fluoridation is:", "options": ["Fluoride varnish", "Fluoride supplements", "Fluoride toothpaste", "Water fluoridation itself"], "answer": 2, "explanation": "Fluoride toothpaste is the most widely used and effective vehicle for preventing caries at the population level. It provides topical fluoride with every brushing. Water fluoridation prevents caries via systemic and topical mechanisms at 0.7 ppm.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "A patient has Papillon-Lefèvre syndrome. Which genetic mutation is responsible?", "options": ["RUNX2 gene mutation", "Cathepsin C gene mutation", "COL1A1 gene mutation", "PHEX gene mutation"], "answer": 1, "explanation": "Papillon-Lefèvre syndrome: autosomal recessive mutation in cathepsin C gene → palmar-plantar hyperkeratosis + severe aggressive periodontitis affecting both primary and permanent dentitions. All primary teeth may be lost by age 4-5.", "source": "Binni 2018", "category": "Periodontics", "domain": "Periodontics"}, {"q": "Which drug is used to reverse benzodiazepine overdose/sedation?", "options": ["Atropine", "Dantrolene", "Flumazenil", "Naloxone"], "answer": 2, "explanation": "Flumazenil is the competitive antagonist for benzodiazepine receptors. Naloxone reverses opioid overdose. Dantrolene treats malignant hyperthermia. Atropine treats bradycardia.", "source": "Binni 2018", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Which of the following is the MOST common congenital heart defect?", "options": ["Atrial septal defect (ASD)", "Coarctation of the aorta", "Tetralogy of Fallot", "Ventricular septal defect (VSD)"], "answer": 3, "explanation": "VSD (ventricular septal defect) is the most common congenital heart defect, accounting for ~30-35% of all CHDs. ASD is second most common. Tetralogy of Fallot is the most common cyanotic CHD.", "source": "Binni 2018", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "In the primary dentition, the space between the maxillary lateral incisor and canine is called:", "options": ["Lee way space", "Primate space", "Mixed dentition space", "Intercanine space"], "answer": 1, "explanation": "Primate spaces: in the maxilla, the diastema is between the lateral incisor and canine; in the mandible, between the canine and first primary molar. Lee way space = difference in size between primary C, D, E and permanent C, 1st PM, 2nd PM (maxilla: 0.9mm/side; mandible: 1.7mm/side).", "source": "Binni 2018", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Which of the following is TRUE about a class II malocclusion in primary dentition?", "options": ["It always requires early orthodontic treatment", "It is more common than class I", "It is often associated with mesial step terminal plane", "Most class II malocclusions in primary dentition correct spontaneously"], "answer": 3, "explanation": "Most class II malocclusions in the primary dentition improve or self-correct during the transition to the mixed dentition. Distal step terminal plane in primary dentition → class II permanent molar relationship. Mesial step → class I or class III.", "source": "Binni 2018", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Cervical lymphadenopathy associated with oral infections in children MOST commonly drains to which node group?", "options": ["Anterior cervical chain", "Posterior cervical chain", "Submandibular nodes", "Submental nodes"], "answer": 2, "explanation": "Submandibular lymph nodes receive drainage from most of the oral cavity including teeth, gingiva, tongue, lips, and cheeks. Submental nodes drain the lower anterior teeth and chin. Anterior cervical chain drains deeper head/neck structures.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which of the following local anesthetics has the LONGEST duration of action?", "options": ["2% Lidocaine with 1:100,000 epinephrine", "3% Mepivacaine plain", "4% Articaine with 1:100,000 epinephrine", "0.5% Bupivacaine with 1:200,000 epinephrine"], "answer": 3, "explanation": "Bupivacaine (Marcaine) has the longest duration of action (up to 8+ hours), making it useful for post-operative pain management. Lidocaine: 60-90 min. Mepivacaine plain: 20-40 min. Articaine: 60-90 min.", "source": "Binni 2018", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "A 10-year-old has a permanent maxillary first molar with a deep carious lesion extending close to the pulp. Radiographically, the pulp appears normal. What is the BEST treatment?", "options": ["Direct pulp cap with MTA", "Indirect pulp cap", "Partial pulpotomy (Cvek pulpotomy)", "Root canal treatment"], "answer": 1, "explanation": "Indirect pulp cap (stepwise excavation) is indicated when caries is close to the pulp but NO pulp exposure is present and pulp appears vital/normal. Leave a thin layer of affected dentin, seal, and re-evaluate. Cvek pulpotomy = partial pulpotomy for traumatic pulp exposure in immature teeth.", "source": "Binni 2018", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "Which syndrome is associated with frontal bossing, midface hypoplasia, prognathic mandible, and syndactyly (fused digits)?", "options": ["Apert syndrome", "Crouzon syndrome", "Pierre Robin sequence", "Treacher Collins syndrome"], "answer": 0, "explanation": "Apert syndrome: craniosynostosis + syndactyly (fused digits) + midface hypoplasia + Class III malocclusion + V-shaped maxilla + cleft palate. Crouzon = craniosynostosis WITHOUT hand/foot abnormalities. Both are FGFR2 mutations.", "source": "Binni 2018", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "For a child with a penicillin allergy requiring antibiotic prophylaxis for infective endocarditis, the BEST alternative is:", "options": ["Amoxicillin", "Azithromycin or clarithromycin", "Cephalexin", "Clindamycin"], "answer": 3, "explanation": "Per AHA guidelines, for penicillin/ampicillin-allergic patients: Azithromycin, clarithromycin, OR clindamycin. Cephalexin is contraindicated if there is a history of anaphylaxis/urticaria/angioedema to penicillin (cross-reactivity ~2%). Clindamycin is also commonly used.", "source": "Binni 2018", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Which of the following BEST describes the mechanism of action of chlorhexidine gluconate?", "options": ["Inhibits bacterial DNA synthesis", "Disrupts bacterial cell membranes and enzymes (bis-biguanide)", "Chelates calcium in bacterial cell walls", "Inhibits protein synthesis"], "answer": 1, "explanation": "Chlorhexidine is a bis-biguanide that is bactericidal against gram-positive and gram-negative bacteria. It disrupts bacterial membranes and enzymes. Its dually charged nature allows it to bind to bacteria and oral structures (substantivity). More effective against S. mutans than Lactobacilli.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The window of infectivity for Streptococcus mutans colonization in infants is:", "options": ["0–6 months", "6–12 months", "19–33 months", "36–48 months"], "answer": 2, "explanation": "The 'window of infectivity' for S. mutans colonization is 19–33 months, coinciding with the eruption of primary teeth. Children who acquire S. mutans early are at higher risk for caries. Mother's MS level ≥10^5 CFU/mL will definitely inoculate the child.", "source": "Binni 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the MOST common oral manifestation of HIV infection?", "options": ["Hairy leukoplakia", "Kaposi sarcoma", "Oral candidiasis", "Recurrent herpes labialis"], "answer": 2, "explanation": "Oral candidiasis (thrush) is the most common oral opportunistic infection in HIV/immunocompromised patients. It presents as white plaques that can be wiped off, leaving a red/bleeding surface. Caused by Candida albicans (a fungus).", "source": "Binni 2018", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A child presents with multiple hypomobile carious teeth, premature exfoliation of primary teeth without a clear cause, and no other systemic findings. Which condition MOST likely explains the premature tooth loss?", "options": ["Cyclic neutropenia", "Hypophosphatasia", "Leukocyte adhesion deficiency", "Papillon-Lefèvre syndrome"], "answer": 1, "explanation": "Hypophosphatasia: deficiency of tissue non-specific alkaline phosphatase (TNAP). Classic sign is premature exfoliation of PRIMARY incisors with INTACT roots before age 5. Lab: decreased serum alkaline phosphatase, increased urinary phosphoethanolamine. Can also present with rickets-like bone changes.", "source": "Binni 2018", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A child has been diagnosed with Cyclic Neutropenia. What oral findings would you expect?", "options": ["Gingival fibromatosis and hypertrichosis", "Premature exfoliation of primary teeth and severe periodontitis", "Reduced caries rate and dental fluorosis", "Taurodontism and enamel hypoplasia"], "answer": 1, "explanation": "Cyclic neutropenia: autosomal dominant mutation in neutrophil elastase gene (ELA2). Episodic decrease in circulating PMNs every 21 days. Oral manifestations: severe gingivitis/periodontitis, aphthous-like ulcers, premature tooth loss during neutropenic episodes.", "source": "Binni 2018", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A 4-year-old child is in the preoperational stage of Piaget's development. Which of the following BEST describes this stage?", "options": ["Sensorimotor (0-2 years): object permanence develops", "Preoperational (2-7 years): egocentric, magical thinking, symbolic play", "Concrete operational (7-12 years): logical thinking about concrete objects", "Formal operational (12+ years): abstract reasoning"], "answer": 1, "explanation": "Piaget stages: Sensorimotor (0-2): object permanence; Preoperational (2-7): egocentric, animism (inanimate objects have feelings), magical thinking, symbolic play; Concrete Operational (7-12): logical reasoning with concrete objects, conservation; Formal Operational (12+): abstract thinking.", "source": "2023 Recalled Questions", "category": "Growth & Development", "domain": "Growth & Development"}, {"q": "In hypophosphatasia, which of the following lab findings is characteristic?", "options": ["Increased serum alkaline phosphatase, increased urinary phosphoethanolamine", "Decreased serum alkaline phosphatase, increased urinary phosphoethanolamine", "Increased serum alkaline phosphatase, decreased urinary phosphoethanolamine", "Decreased serum alkaline phosphatase, decreased urinary phosphoethanolamine"], "answer": 1, "explanation": "Hypophosphatasia: deficiency of tissue-nonspecific alkaline phosphatase. Labs: DECREASED serum alkaline phosphatase, INCREASED urinary phosphoethanolamine. Clinical: premature exfoliation of primary teeth with intact roots, rickets-like bone changes.", "source": "2023 Recalled Questions", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A permanent canine overlaps more than 50% of the maxillary lateral incisor. If a primary canine is extracted, what percentage of canines will normalize position?", "options": ["91%", "78%", "64%", "50%"], "answer": 2, "explanation": "Canine impaction prediction: If overlap is LESS than 50%: 91% normalize. If overlap is MORE than 50%: 64% normalize within 1 year. Overall, extraction of primary canine leads to 78% normalization. Palatal canine impaction is common when canine is mesial to or overlaps the distal half of lateral.", "source": "2023 Recalled Questions", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "Which immunoglobulin in breast milk helps prevent S. mutans infection transmission from mother to infant?", "options": ["IgM", "IgG", "IgA (secretory)", "IgE"], "answer": 2, "explanation": "Secretory IgA and lactoferrin in breast milk decrease S. mutans biofilm formation. Breast milk contains IgA (primary) and IgG. IgM activates complement. IgE is involved in anaphylaxis. IgG provides passive immunity to newborns via placental transfer.", "source": "2023 Recalled Questions", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Increased eosinophils in a child's CBC suggest which type of infection?", "options": ["Bacterial infection", "Viral infection", "Parasitic infection", "Fungal infection"], "answer": 2, "explanation": "Eosinophilia is associated with parasitic infections and allergic conditions. Mnemonic: NAACP = Neoplasm, Asthma/Allergy, Addison's disease, Collagen vascular disease, Parasites.", "source": "2023 Recalled Questions", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the difference between hand instruments (scalers) and ultrasonic scalers for subgingival calculus removal?", "options": ["Ultrasonic removes greater amount of calculus and leaves smoother surface", "Hand instruments remove greater amount of calculus and leave smoother surface", "Hand instruments cause less soft tissue trauma", "Ultrasonic is more technique-sensitive"], "answer": 1, "explanation": "Hand instruments: remove GREATER amount of calculus, leave SMOOTHER surface. Ultrasonic: LESS soft tissue trauma, faster, LESS technique-sensitive. Both are effective for subgingival debridement.", "source": "2023 Recalled Questions", "category": "Periodontics", "domain": "Periodontics"}, {"q": "Premature loss of which primary tooth causes the MOST space loss?", "options": ["Maxillary first primary molar", "Mandibular first primary molar", "Maxillary second primary molar", "Mandibular second primary molar"], "answer": 2, "explanation": "Space loss rank: Maxillary E (2nd molar) > Mandibular E > Maxillary D = Mandibular D. Max 2nd primary molar loss causes the MOST space loss. Distal shoe is the space maintainer for premature loss of E when permanent 1st molar is unerupted.", "source": "2023 Recalled Questions", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Recurrent viral infections in a child suggest deficiency in which immune component?", "options": ["B-cell deficiency", "T-cell deficiency", "Neutrophil deficiency", "Complement deficiency"], "answer": 1, "explanation": "T-cell deficiencies (e.g., DiGeorge syndrome) impair cell-mediated immunity, leading to recurrent VIRAL and fungal infections. B-cell deficiencies → recurrent bacterial infections. Neutrophil deficiencies (cyclic neutropenia) → bacterial/fungal infections. Complement deficiency → encapsulated bacteria.", "source": "2023 Recalled Questions", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "What is a non-social positive reinforcer in pediatric behavior management?", "options": ["Verbal praise", "Facial expression", "Positive vocal tone", "Token/toy reward"], "answer": 3, "explanation": "Social reinforcers: verbal praise, facial expression, positive voice modulation, appropriate physical affection. Non-social reinforcers: tokens and toys. Both types are positive reinforcement strategies in Tell-Show-Do and voice control techniques.", "source": "2023 Recalled Questions", "category": "Behavior Guidance", "domain": "Behavior Guidance"}, {"q": "Early fusion of which cranial suture results in scaphocephaly (long, narrow skull)?", "options": ["Coronal suture", "Sagittal suture", "Metopic suture", "Lambdoid suture"], "answer": 1, "explanation": "Craniosynostosis: Sagittal suture fusion → scaphocephaly (long, narrow skull — most common). Coronal fusion → brachycephaly or plagiocephaly. Metopic fusion → trigonocephaly. Lambdoid → posterior plagiocephaly.", "source": "2023 Recalled Questions", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The Frankfort Horizontal plane passes through which two landmarks?", "options": ["Nasion and sella", "Porion and orbitale", "Gonion and menton", "ANS and PNS"], "answer": 1, "explanation": "Frankfort Horizontal (FH) plane passes through porion (top of external auditory meatus) and orbitale (lowest point of the orbit). It represents the natural head posture reference plane in cephalometric analysis.", "source": "2023 Recalled Questions", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Pseudo class III malocclusion is caused by which functional interference?", "options": ["Protruded mandibular incisors", "Retroclined maxillary incisors", "Large maxilla", "Posterior crossbite"], "answer": 1, "explanation": "Pseudo class III: normal skeletal class I, but retroclined maxillary incisors create an anterior crossbite causing the mandible to shift anteriorly (forward functional shift). True class III = skeletal mandibular prognathism or maxillary deficiency.", "source": "2023 Recalled Questions", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "The Herbst appliance is used for which malocclusion?", "options": ["Class I crowding", "Class II with retrognathic mandible", "Class III with mandibular prognathism", "Anterior open bite"], "answer": 1, "explanation": "Herbst appliance: fixed functional appliance for Class II malocclusion with retrognathic mandible. Promotes mandibular sagittal growth (advances mandible forward) and distalizes maxillary molars. Worn 24 hours/day unlike removable functional appliances.", "source": "2023 Recalled Questions", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Which malocclusion in the primary dentition is associated with TMD in children?", "options": ["Skeletal anterior open bite", "Deep overbite", "Unilateral posterior crossbite", "Class II deep bite"], "answer": 2, "explanation": "Unilateral posterior crossbite in the primary dentition is associated with TMD, mandibular deviation, and asymmetric condylar growth. It should be corrected early. Also associated with TMD: skeletal anterior open bite, steep articular eminence, overjet >6-7mm, skeletal class II and III.", "source": "2023 Recalled Questions", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "What is the unfavorable outcome most commonly seen with replantation of a permanent tooth with a CLOSED apex?", "options": ["Pulp canal obliteration (PCO)", "Replacement resorption (ankylosis)", "External root resorption", "Internal root resorption"], "answer": 1, "explanation": "Closed apex avulsion replantation: most likely complication is replacement resorption (ankylosis) because the pulp is non-vital and cannot be revascularized. Immature teeth (open apex) may revascularize. Replacement resorption = tooth is slowly replaced by bone.", "source": "2023 Recalled Questions", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "What protective function does a mouthguard serve?", "options": ["Only prevents tooth fractures", "Cushions blows, redistributes forces, stabilizes mandible, acts as buffer between soft/hard tissues", "Only prevents jaw fractures", "Prevents concussion by absorbing all impact"], "answer": 1, "explanation": "Mouthguard functions: (1) cushions blow and redistributes shock, (2) stabilizes mandible, (3) acts as buffer between soft tissues and dento-oral structures, (4) reduces concussion by positioning jaw to absorb impact. Most common type used by athletes: boil-and-bite (Type 2).", "source": "2023 Recalled Questions", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "Oral findings in Ehlers-Danlos Syndrome include all EXCEPT:", "options": ["Gorlin sign (touching nose with tongue)", "High cusps and deep fissures of premolars/molars", "Periodontitis", "Increased caries rate"], "answer": 3, "explanation": "Ehlers-Danlos oral findings: Gorlin sign, thin oral mucosa/ulcers, lack of labial/lingual frenum, high cusps/deep fissures, shortened/abnormal roots with pulp stones, enamel hypoplasia, OKC, periodontitis. Increased caries rate is NOT a characteristic finding.", "source": "2023 Recalled Questions", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which behaviors are examples of protective stabilization?", "options": ["Hand holding only", "Hand holding, head stabilizer device, bite block, cheek retractors, body wrap", "Only papoose board use", "Voice control and tell-show-do only"], "answer": 1, "explanation": "Protective stabilization includes: hand holding, forearm/body support (head positioner), full body wrap (papoose board), strap restraints, bite blocks, cheek retractors. Used to protect patient/staff from injury during treatment.", "source": "2023 Recalled Questions", "category": "Behavior Guidance", "domain": "Behavior Guidance"}, {"q": "The most appropriate time to perform a maxillary labial frenectomy is:", "options": ["Before eruption of permanent incisors", "After eruption of permanent incisors but before canines", "After eruption of permanent canines", "At age 5-6 years regardless of tooth eruption"], "answer": 2, "explanation": "Frenectomy should NOT be performed before permanent canines erupt. After canines erupt, orthodontic space closure can occur, and frenectomy follows if a diastema persists. Performing frenectomy too early may result in scar tissue impeding space closure.", "source": "New York Review", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "The MOST common malocclusion in Apert syndrome is:", "options": ["Class II with deep bite", "Class III anterior open bite", "Class I crowding", "Class II open bite"], "answer": 1, "explanation": "Apert syndrome: craniosynostosis, syndactyly, V-shaped maxilla, midface hypoplasia, Class III open bite, cervical spine fusion, supernumerary teeth, ectopic eruption of maxillary first molars, cleft palate.", "source": "New York Review", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Koplik spots are pathognomonic for which disease?", "options": ["Scarlet fever", "Rubeola (measles)", "Varicella", "Rubella"], "answer": 1, "explanation": "Koplik spots (white spots on buccal mucosa opposite molars) are pathognomonic for rubeola (measles). Strawberry tongue = Kawasaki disease or scarlet fever. \"Slapped cheek\" = erythema infectiosum (fifth disease).", "source": "New York Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "What makes MTA (Mineral Trioxide Aggregate) radiopaque?", "options": ["Calcium hydroxide content", "Bismuth oxide", "Zinc oxide", "Barium sulfate"], "answer": 1, "explanation": "MTA contains tricalcium silicate, dicalcium silicate, tricalcium aluminate, calcium sulfate, and bismuth oxide — bismuth oxide provides radiopacity. MTA sets in the presence of moisture and has excellent sealing ability and biocompatibility.", "source": "New York Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "What is the antagonist (reversal agent) for benzodiazepines?", "options": ["Naloxone (Narcan)", "Flumazenil (Romazicon)", "Atropine", "Physostigmine"], "answer": 1, "explanation": "Flumazenil (Romazicon) is the competitive benzodiazepine antagonist. Naloxone reverses opioids. Atropine reverses bradycardia. Note: Flumazenil has a shorter half-life than most benzodiazepines, so re-sedation may occur.", "source": "New York Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Malignant hyperthermia is treated with:", "options": ["Dantrolene sodium 2.5 mg/kg IV", "Naloxone 0.01 mg/kg IV", "Succinylcholine 1 mg/kg IV", "Epinephrine 0.01 mg/kg IV"], "answer": 0, "explanation": "Dantrolene sodium (2.5 mg/kg IV) is the treatment for malignant hyperthermia. It inhibits release of calcium from the sarcoplasmic reticulum of skeletal muscle. Also: discontinue triggering agents, 100% O2, cooling blanket.", "source": "New York Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "The best treatment for TMD in children is:", "options": ["Orthodontic treatment", "Occlusal splints", "Surgical condylectomy", "Equilibration/occlusal adjustment"], "answer": 1, "explanation": "Occlusal splints (bite guards) are the BEST conservative treatment for TMD in children. They reduce muscle hyperactivity and protect teeth from bruxism. Most TMD in children is transient and self-limiting.", "source": "New York Review", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Hall Technique (stainless steel crown without preparation) is indicated for:", "options": ["Permanent first molars with deep caries", "Primary molars with interproximal caries", "Primary incisors with caries", "Any tooth with visible caries"], "answer": 1, "explanation": "Hall Technique: SSC placement on primary molars WITHOUT local anesthesia, caries excavation, or tooth preparation. Indicated for primary molars with interproximal caries or when conventional treatment is difficult. Caries is sealed under the crown and arrested.", "source": "New York Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Internal bleaching of a non-vital tooth most commonly causes:", "options": ["Pulp canal obliteration", "External (cervical) root resorption", "Internal root resorption", "Ankylosis"], "answer": 1, "explanation": "Internal bleaching with hydrogen peroxide/sodium perborate can cause external cervical root resorption. The bleaching agent may permeate through dentinal tubules to the external root surface. Cervical collar of ZOE or glass ionomer should be placed before bleaching.", "source": "New York Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "What is the recommended depth for chest compressions in pediatric CPR (1-8 years)?", "options": ["1 inch (2.5 cm)", "1.5 inches (3.8 cm)", "2 inches (5 cm)", "2.5 inches (6 cm)"], "answer": 2, "explanation": "Pediatric CPR (1-8 years): compress at least 2 inches (5 cm). Infant CPR: 1.5 inches. Adult CPR: 2-2.4 inches. CAB order: Compressions → Airway → Breathing. 2-person pediatric CPR: 15:2 ratio.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The ratio of compressions to breaths in 2-person CPR for a pediatric patient is:", "options": ["30:2", "15:2", "15:1", "30:1"], "answer": 1, "explanation": "2-person pediatric CPR: 15:2 (compressions:breaths). 1-person CPR (any age): 30:2. Infant with healthcare provider: 15:2. Adult: 30:2 regardless of number of rescuers.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the optimal water fluoridation level recommended by the USPHS?", "options": ["0.5 ppm", "0.7 ppm", "1.0 ppm", "1.2 ppm"], "answer": 1, "explanation": "The USPHS recommends 0.7 ppm (mg/L) as the optimal fluoride level in drinking water for caries prevention while minimizing fluorosis risk. Previous recommendation was 0.7-1.2 ppm; updated to 0.7 ppm in 2015.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The critical pH for dissolution of enamel (Stephan curve) is:", "options": ["pH 4.5", "pH 5.5", "pH 6.0", "pH 7.0"], "answer": 1, "explanation": "Critical pH for enamel dissolution is 5.5. Below this pH, the oral environment is undersaturated with respect to hydroxyapatite, causing demineralization. For dentin, critical pH is higher (~6.0-6.7). Frequent acid challenges prevent remineralization.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The most common type of mouthguard used by athletes is:", "options": ["Custom-fabricated (Type 1)", "Boil-and-bite (Type 2)", "Stock/ready-made (Type 3)", "Vacuum-formed (Type 4)"], "answer": 1, "explanation": "Boil-and-bite (Type 2) is the most commonly used mouthguard by athletes due to accessibility and low cost. Custom-fabricated (Type 1) provides best fit and protection but requires dental visit. AAPD recommends custom-fabricated for best protection.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The pH of silver diamine fluoride (SDF) is approximately:", "options": ["pH 4-5", "pH 7 (neutral)", "pH 10", "pH 13"], "answer": 2, "explanation": "SDF has a pH of approximately 10 (alkaline). It contains 38% silver diamine fluoride. Silver ions kill bacteria, fluoride promotes remineralization. Primary side effect: permanent black staining of carious dentin. Does NOT stain sound dentin.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which bacteria are the primary pathogens in necrotizing ulcerative gingivitis (NUG)?", "options": ["Streptococcus mutans and Lactobacillus", "Spirochetes and Prevotella intermedia", "Actinobacillus actinomycetemcomitans", "Candida albicans"], "answer": 1, "explanation": "NUG pathogens: spirochetes (Treponema) and Prevotella intermedia (anaerobes). Clinical features: punched-out/crater-like papillae, pseudomembrane, fetid odor, pain. Predisposing factors: stress, malnutrition, smoking, viral infection (HIV), poor OH.", "source": "New York Review", "category": "Periodontics", "domain": "Periodontics"}, {"q": "The most common cephalometric landmark that is bilateral is:", "options": ["Nasion", "Sella", "Gonion", "ANS"], "answer": 2, "explanation": "Gonion is a bilateral landmark (both right and left sides of the mandible). In 2D cephalometrics, bilateral landmarks are averaged or one side is used. Nasion, sella, ANS, PNS, menton, and pogonion are midline (single) landmarks.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Hallermann-Streiff syndrome is associated with which dental finding?", "options": ["Fusion of central incisors", "Natal/neonatal teeth", "Taurodontism", "Congenitally missing teeth"], "answer": 1, "explanation": "Hallermann-Streiff syndrome is associated with natal/neonatal teeth (part of normal complement, NOT supernumerary). These should be kept unless excessively mobile or causing feeding problems. Most commonly mandibular incisors. When seen in posterior region → Pfeiffer syndrome or histiocytosis X.", "source": "New York Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Fluoride varnish contains how many ppm of fluoride?", "options": ["1,000 ppm", "5,000 ppm", "12,300 ppm", "22,500 ppm"], "answer": 3, "explanation": "Fluoride varnish (5% NaF) = 22,500 ppm F. 1.23% APF gel/foam = 12,300 ppm. Prevident (1.1% NaF) = 5,000 ppm. 0.05% NaF rinse = 220 ppm. Toothpaste typically 1,000-1,500 ppm.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Xylitol's primary mechanism in caries prevention is:", "options": ["Enhances fluoride uptake into enamel", "S. mutans cannot metabolize xylitol; directly inhibits S. mutans and reduces plaque", "Increases salivary flow", "Raises plaque pH above critical level"], "answer": 1, "explanation": "Xylitol: 5-carbon sugar alcohol. S. mutans CANNOT metabolize it. Directly inhibits S. mutans, reduces MS adhesion to pellicle, decreases acid production, decreases plaque formation. Does NOT enhance remineralization (fluoride does). Recommended dose: 6g/day, frequency 3-7x/day.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Fluoride toxicity — the 'certainly lethal dose' is:", "options": ["1 mg F/kg", "5 mg F/kg", "8 mg F/kg", "15 mg F/kg"], "answer": 3, "explanation": "Fluoride toxicity: Probable toxic dose (PTD) = 5 mg F/kg. Certainly lethal dose = 15 mg F/kg. Management: <8 mg/kg → milk + observe >6 hours. >8 mg/kg → induce vomiting, milk, refer to ER.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the most common form of child mistreatment in the US?", "options": ["Physical abuse", "Sexual abuse", "Emotional abuse", "Neglect"], "answer": 3, "explanation": "Neglect is the most common form of child maltreatment in the US. Dental neglect = failure to seek treatment when a parent knows a child has caries. 50% of abuse injuries involve the head and neck region. Most common abuser: parents.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The narrowest region of the pediatric airway is at the level of:", "options": ["Glottis", "Cricoid cartilage (until age 5)", "Subglottis", "Trachea"], "answer": 1, "explanation": "In children under ~5 years, the narrowest part of the airway is the cricoid cartilage (subglottic area), making it functionally uncuffed. In adults and older children, the narrowest part is the glottis opening. Important for ET tube selection.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Dental neglect is BEST defined as:", "options": ["Any tooth decay in a child", "Parent knowingly failing to seek dental care when caries or oral disease is present", "Missing a dental appointment", "Parent refusing fluoride treatment"], "answer": 1, "explanation": "Dental neglect (AAPD): willful failure of parent/guardian to seek and follow through with treatment necessary to ensure freedom from pain, infection, and progression of oral disease. Must involve KNOWLEDGE that the problem exists.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The MOST appropriate time to wean an infant from a bottle is:", "options": ["6 months", "9 months", "12-14 months", "18-24 months"], "answer": 2, "explanation": "AAPD recommends weaning from bottle by 12-18 months. Bottle use beyond 12-14 months increases risk of ECC. Weaning should be gradual, transitioning to a cup. Prolonged bottle use (especially at bedtime with sweetened liquids) is a major risk factor for ECC.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which space maintainer has the MOST medical contraindications?", "options": ["Band and loop", "Nance arch", "Lingual arch", "Distal shoe"], "answer": 3, "explanation": "Distal shoe space maintainer is contraindicated in: immunocompromised patients (including leukemia), bleeding disorders, poor OH, uncooperative patients, medical conditions preventing multiple appointments. It's a fixed intraosseous appliance used when primary 2nd molar is lost before permanent 1st molar erupts.", "source": "New York Review", "category": "Behavior Guidance", "domain": "Behavior Guidance"}, {"q": "Which cephalometric structure develops primarily via endochondral ossification?", "options": ["Cranial vault", "Mandible", "Cranial base (ethmoid, sphenoid, occipital)", "Maxilla"], "answer": 2, "explanation": "Cranial base (ethmoid, sphenoid, occipital bones) = endochondral ossification. Cranial vault = intramembranous. Mandible = MIXED (body = intramembranous; condyle = endochondral). Maxilla = intramembranous. Mnemonic: ENDO-ESO-BASE = endochondral, ethmoidal/sphenoid/occipital, cranial base.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "During adolescent pregnancy, elevated hormone levels increase which gingival bacteria?", "options": ["Streptococcus mutans", "Bacteroides/Prevotella species", "Actinobacillus actinomycetemcomitans", "Spirochetes"], "answer": 1, "explanation": "During puberty and pregnancy, elevated estrogen and progesterone increase Bacteroides (Prevotella and Porphyromonas species), leading to pregnancy gingivitis or puberty gingivitis. This is an exaggerated response to existing plaque.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The space maintainer for premature loss of a primary 2nd molar before the permanent 1st molar erupts is:", "options": ["Band and loop", "Lingual arch", "Nance arch", "Distal shoe"], "answer": 3, "explanation": "Distal shoe (fixed unilateral space maintainer): used when primary 2nd molar is lost BEFORE the permanent 1st molar erupts. The distal arm extends subgingivally to guide eruption. Contraindicated: leukemia/compromised immunity, poor OH, uncooperative patient.", "source": "New York Review", "category": "Behavior Guidance", "domain": "Behavior Guidance"}, {"q": "The radiograph of a dentigerous cyst shows:", "options": ["Multilocular radiolucency associated with the apex of a vital tooth", "Unilocular radiolucency associated with the CROWN of an unerupted/impacted tooth", "Radiolucency associated with the root of a non-vital tooth", "Diffuse ill-defined radiolucency"], "answer": 1, "explanation": "Dentigerous (follicular) cyst: unilocular radiolucency associated with the CROWN of an unerupted tooth (follicular space >3mm). Most common odontogenic cyst. Traumatic/simple bone cyst: unilocular RL associated with a VITAL tooth, regular borders, mandible, may cross midline, asymptomatic.", "source": "New York Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "The BEST treatment for a primary molar with ECC, decalcification, and hypoplasia is:", "options": ["Composite restoration", "Glass ionomer restoration", "Stainless steel crown (SSC)", "Extraction"], "answer": 2, "explanation": "Stainless steel crowns (SSC) are the gold standard for primary molars with: extensive caries, ECC, hypoplasia/hypomineralization, after pulp therapy, or when isolation is difficult. SSC has superior longevity over composite or amalgam restorations in primary teeth.", "source": "New York Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "The primary purpose of a maxillary obturator in a cleft palate infant is:", "options": ["Speech improvement", "Feeding", "Preventing infection", "Orthopedic bone molding"], "answer": 1, "explanation": "The primary purpose of an obturator (feeding plate) in cleft palate infants is to facilitate FEEDING by separating the oral and nasal cavities, allowing the infant to create negative pressure for sucking. Secondary benefit: some speech improvement and psychological benefit.", "source": "New York Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which nerve is affected when a patient has mandibular deviation on opening?", "options": ["Trigeminal nerve (V3)", "Facial nerve (CN VII)", "Lateral pterygoid muscle dysfunction", "Masseter hyperactivity"], "answer": 2, "explanation": "Mandibular deviation on opening is due to unilateral weakness or dysfunction of the LATERAL PTERYGOID muscle. The lateral pterygoid is the only muscle of mastication that assists in DEPRESSING the mandible. Deviation is toward the AFFECTED side during opening.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which condition is most commonly associated with periodontal problems in children?", "options": ["Juvenile idiopathic arthritis", "Langerhans cell histiocytosis", "Sickle cell disease", "Type 1 diabetes"], "answer": 1, "explanation": "Langerhans cell histiocytosis (LCH, formerly histiocytosis X) is strongly associated with periodontal destruction in children. Oral manifestations include: destruction of alveolar bone, 'floating teeth' appearance, gingival ulceration. Other conditions with periodontal involvement: Papillon-Lefèvre, cyclic neutropenia, Down syndrome, hypophosphatasia.", "source": "New York Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "What percentage of mesiodens spontaneously exfoliate?", "options": ["10%", "25%", "50%", "75%"], "answer": 1, "explanation": "Approximately 25% of mesiodens spontaneously exfoliate. Mesiodens is the most common supernumerary tooth, occurring in the maxillary midline. May cause delayed eruption of central incisors, diastema, or rotation. Treatment is surgical removal if causing eruption problems.", "source": "New York Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "What is the MOST common reason for extraction of primary teeth?", "options": ["Trauma and avulsion", "Carious lesions and pulpal pathology", "Orthodontic reasons", "Premature exfoliation"], "answer": 1, "explanation": "Despite improvements in pediatric oral health, caries and resulting pulpal pathology remains the most common reason for extraction of primary teeth. Proper pulp therapy (pulpotomy, pulpectomy) and SSC should be attempted before extraction to maintain space.", "source": "New York Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "A common characteristic in patients with amelogenesis imperfecta is:", "options": ["Taurodontism only", "Increased caries rate only", "Anterior open bite", "Class III malocclusion"], "answer": 2, "explanation": "Amelogenesis imperfecta (AI) is associated with anterior open bite (seen in hypocalcification type). AI affects enamel formation (quantity or quality). Types: hypoplastic (thin enamel), hypomaturation (mottled), hypocalcified (soft yellow enamel). Treatment: SSC, composite veneers, full-coverage restorations.", "source": "New York Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "Which type of suture causes the most inflammation?", "options": ["Chromic gut", "Polyglycolic acid (Vicryl)", "Silk", "Nylon (monofilament)"], "answer": 2, "explanation": "Silk sutures cause the MOST tissue inflammation of commonly used sutures because they are braided and harbor bacteria. Monofilament sutures (nylon) cause the least inflammation. Resorbable: chromic gut (10-14 days tensile strength), Vicryl. Non-resorbable: silk, nylon.", "source": "New York Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What are the Four Planes of Space in orthodontics?", "options": ["Sagittal, Coronal, Transverse, Rotational", "AP (Sagittal), Vertical, Transverse, and Alignment", "Horizontal, Vertical, Diagonal, Rotational", "Incisal, Occlusal, Skeletal, Dental"], "answer": 1, "explanation": "4 Planes of Space: AP (Sagittal), Vertical, Transverse, and Alignment. AP plane includes: incisor angulation, overjet, and Angle's Classification (molar/canine/incisor). Best predictor of ideal sagittal permanent relationship = canine relationship in primary dentition.", "source": "2021 High Yield", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Acetaminophen (Tylenol) toxicity in children causes:", "options": ["Renal failure", "Hepatic failure", "Cardiac arrhythmia", "Respiratory depression"], "answer": 1, "explanation": "Acetaminophen overdose causes hepatic (liver) failure by depleting glutathione → toxic accumulation of NAPQI metabolite. Treatment: N-acetylcysteine (NAC). Safe dose: 10-15 mg/kg q4-6h (max 75mg/kg/day or 4g/day in adults).", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The minimum BMI percentile at which a pediatric patient is considered OBESE is:", "options": ["85th percentile", "90th percentile", "95th percentile", "98th percentile"], "answer": 2, "explanation": "BMI categories for children: Overweight = 85th-95th percentile. Obese = ≥95th percentile. Underweight = <5th percentile. Note: some sources say 98th for severely obese. AAPD guidelines use 95th percentile as the threshold for obesity.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The proper sequence for management of cleft lip and palate is:", "options": ["Lip repair → palate repair → obturation → orthopedic molding", "Obturation → orthopedic molding → lip adhesion → palate repair", "Orthopedic molding → lip repair → palate repair → speech therapy", "Palate repair → lip repair → obturation → orthopedic molding"], "answer": 1, "explanation": "Cleft lip and palate management sequence: (1) Obturation/feeding plate, (2) Orthopedic presurgical molding (NAMP/NAM), (3) Lip adhesion/repair (~3 months/'rule of 10'), (4) Palate repair (~9-18 months). Speech therapy ongoing. Rule of 10 for lip repair: 10 weeks, 10 lbs, 10 g/dL hemoglobin.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A permanent tooth with a CLOSED apex is intruded 6 mm and surgically repositioned. The maximum splinting time is:", "options": ["2 weeks", "4 weeks", "6 weeks", "8 weeks"], "answer": 1, "explanation": "Intrusion with surgical repositioning: splint up to 4 weeks. Intrusion with orthodontic extrusion: up to 8 weeks. Standard splint times: subluxation = 2 weeks, extrusive/lateral luxation = 2-4 weeks, avulsion = 2 weeks (flexible splint), root fracture in middle/apical = 4 weeks.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "Which condition causes a portion of the cerebellum to protrude through the foramen magnum into the spinal canal, causing headaches?", "options": ["Dandy-Walker syndrome", "Arnold-Chiari malformation", "Hydrocephalus", "Spina bifida"], "answer": 1, "explanation": "Arnold-Chiari malformation: cerebellar tonsils/vermis protrude through foramen magnum into the cervical spinal canal. Symptoms: headaches (worse with Valsalva), neck pain, cerebellar symptoms. Associated with syringomyelia and spina bifida.", "source": "2021 High Yield", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "The material with a coefficient of thermal expansion MOST similar to tooth structure is:", "options": ["Composite resin", "Amalgam", "Glass ionomer cement", "Porcelain"], "answer": 2, "explanation": "Glass ionomer cement (GIC) has the coefficient of thermal expansion closest to natural tooth structure (dentin and enamel), reducing microleakage from thermal cycling. GIC also releases fluoride. Amalgam has the highest thermal conductivity among dental restorative materials.", "source": "2021 High Yield", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "The MOST common type of seizure in children is:", "options": ["Absence (petit mal)", "Febrile seizure", "Tonic-clonic (grand mal)", "Focal (partial)"], "answer": 1, "explanation": "Febrile seizures are the most common type of seizure in children (2-5% of children; ages 6 months - 5 years). Usually occur with rapidly rising fever >38°C. Simple febrile seizures: <15 min, generalized, single episode/24h. Recurrence: 33%. Long-term epilepsy risk: low.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What cells/organs have the HIGHEST radiosensitivity?", "options": ["Brain and muscle cells", "Cells with high mitotic rate, primitive differentiation, future mitosis potential", "Bone and cartilage", "Mature neurons and striated muscle"], "answer": 1, "explanation": "Bergonie-Tribondeau Law: cells are most radiosensitive when they have: (1) high mitotic rate, (2) undergo future mitosis (actively dividing), (3) primitive (undifferentiated) state. Most sensitive: gonads, hematopoietic cells, thyroid, breast, eye lens, skin. Least sensitive: brain, muscle (mature neurons don't divide).", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which bacteria most commonly cause dental and periodontal infections?", "options": ["Gram-positive aerobic streptococci only", "Aerobic and anaerobic streptococci", "Staphylococci", "Lactobacillus species"], "answer": 1, "explanation": "Aerobic and anaerobic streptococci are the most common bacteria causing dental and periodontal infections. Odontogenic infections are typically polymicrobial, with mixed aerobic-anaerobic flora. Streptococcus viridans group and anaerobes (Prevotella, Fusobacterium) are predominant.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the most common cause of severe oral ulcerations in children?", "options": ["Recurrent aphthous stomatitis", "Primary herpetic gingivostomatitis", "Erythema multiforme", "Behçet syndrome"], "answer": 1, "explanation": "Primary herpetic gingivostomatitis (HSV-1): most common cause of SEVERE oral ulcerations in children aged 1-5 years. Features: multiple painful ulcers on any oral surface, gingival erythema/bleeding, fever, lymphadenopathy. Recurrent aphthous stomatitis = most common ulcerative disease of oral mucosa.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which ingredient in toothpaste is implicated in allergic reactions precipitating aphthous stomatitis (RAS)?", "options": ["Fluoride", "Triclosan", "Sodium lauryl sulfate (SLS)", "Carrageenan"], "answer": 2, "explanation": "Sodium lauryl sulfate (SLS), a detergent/foaming agent in toothpaste, is implicated in precipitating recurrent aphthous stomatitis (RAS) in susceptible individuals. Using SLS-free toothpaste may reduce RAS frequency.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which unilocular cyst is associated with a VITAL tooth, has regular borders, is usually located in the mandible, may cross the midline, and occurs without explanation?", "options": ["Dentigerous cyst", "Radicular (periapical) cyst", "Traumatic (simple) bone cyst", "Lateral periodontal cyst"], "answer": 2, "explanation": "Traumatic bone cyst (simple bone cyst/atraumatic bone cyst): unilocular RL, associated with VITAL tooth, regular scalloped borders, mandible (especially posterior body), may cross midline, ASYMPTOMATIC, empty cavity on exploration. Radicular cyst = associated with NON-VITAL tooth apex.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Aplastic anemia is characterized by:", "options": ["Increased RBC with decreased WBC", "Hypercellular bone marrow with excess blast cells", "Hypocellular bone marrow → insufficient hematopoietic stem cells → decreased granulocytes, erythrocytes, and platelets", "Normal bone marrow with autoimmune platelet destruction"], "answer": 2, "explanation": "Aplastic anemia: hypocellular bone marrow producing insufficient hematopoietic stem cells → pancytopenia (decreased ALL blood cell lines: granulocytes, erythrocytes, platelets). Causes: idiopathic (most common), radiation, chemotherapy, viruses. Treatment: bone marrow transplant.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Klinefelter syndrome (47,XXY) has which dental characteristic?", "options": ["Missing teeth and taurodontism", "Natal teeth and enamel hypoplasia", "Extra chromosome causing tall stature, gynecomastia; dental: taurodontism", "Micrognathia and cleft palate"], "answer": 2, "explanation": "Klinefelter syndrome (47,XXY): hypogonadism, infertility, gynecomastia, tall stature with long limbs, mild intellectual disability. Dental: taurodontism (enlarged pulp chambers with apically displaced furcations). Also seen in Turner syndrome (45,X) and Down syndrome.", "source": "2021 High Yield", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "Which feature of the PRIMARY dentition is the BEST predictor of an ideal sagittal relationship in the permanent dentition?", "options": ["Molar terminal plane relationship", "Canine relationship", "Amount of s
