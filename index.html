_doc": "welp copy.docx"}, {"q": "What type of error is a 'false positive' in research?", "options": ["Type II error (beta error)", "Type I error (alpha error)", "Sampling error", "Measurement bias"], "answer": 1, "explanation": "Type I error (alpha): rejecting the null hypothesis when it is actually TRUE = false positive. Type II error (beta): failing to reject null hypothesis when it is actually FALSE = false negative. Power = 1 - beta.", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "A test showing the proportion of people WITHOUT disease who test negative is measuring:", "options": ["Sensitivity (true positive rate)", "Specificity (true negative rate)", "Positive predictive value", "Negative predictive value"], "answer": 1, "explanation": "Specificity = true negative rate = correctly identifies those WITHOUT the disease. Sensitivity = true positive rate = correctly identifies those WITH the disease. Mnemonic: SnNOut (Sensitive test, Negative result, rules OUT); SpPIn (Specific test, Positive result, rules IN).", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "New cases of a disease appearing over a specific time period is the definition of:", "options": ["Prevalence", "Incidence", "Attack rate", "Relative risk"], "answer": 1, "explanation": "Incidence = NEW cases over a specific time period (dynamic). Prevalence = ALL existing cases at a single point in time (snapshot = prevalence = 'period' or 'point'). Case-control = retrospective/observational. Meta-analysis = highest level of evidence.", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which statistical test is used to compare two categorical variables?", "options": ["Pearson r (correlation coefficient)", "Student's t-test", "ANOVA", "Chi-square test"], "answer": 3, "explanation": "Chi-square test: compares TWO CATEGORICAL variables (e.g., treatment vs. no treatment AND caries vs. no caries). Pearson r: correlation between two continuous variables. T-test: compares means of two groups. ANOVA: compares means of 3+ groups.", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which study design represents the highest level of evidence?", "options": ["Randomized controlled trial (RCT)", "Cohort study", "Case-control study", "Systematic review / meta-analysis"], "answer": 3, "explanation": "Evidence hierarchy (highest to lowest): Systematic review/meta-analysis → RCT → Cohort study → Case-control study → Cross-sectional → Case series → Expert opinion. Meta-analysis synthesizes results from multiple studies.", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "A case-control study is characterized as:", "options": ["Prospective and experimental", "Retrospective and observational", "Cross-sectional and descriptive", "Randomized and controlled"], "answer": 1, "explanation": "Case-control study: RETROSPECTIVE and OBSERVATIONAL. Starts with outcome (cases with disease vs. controls without), looks back to identify exposures. Good for rare diseases, cheap and quick. Limitation: recall bias, cannot establish incidence or causation.", "source": "STAR STAR 2022 / Board Review", "category": "Research Methods & Biostatistics", "domain": "Research Methods & Biostatistics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which is a high-level disinfectant used in dentistry?", "options": ["Chlorhexidine (0.12%)", "Glutaraldehyde (Cidex)", "Quaternary ammonium compounds", "Iodophor"], "answer": 1, "explanation": "Disinfection levels: HIGH = glutaraldehyde (kills all microorganisms including spores; used for heat-sensitive semi-critical items). INTERMEDIATE = iodophor, chlorine compounds, phenolics (kills HBV, mycobacteria, most fungi). LOW = quaternary ammonium (kills most bacteria/fungi but NOT TB or spores).", "source": "STAR STAR 2022 / Board Review", "category": "Infection Control & Safety", "domain": "Infection Control & Safety", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the maximum CFU (colony-forming units) allowed for dental unit waterlines?", "options": ["100 CFU/mL", "200 CFU/mL", "500 CFU/mL", "1000 CFU/mL"], "answer": 2, "explanation": "CDC and ADA recommend dental unit waterlines maintain water quality of ≤500 CFU/mL for heterotrophic bacteria — the same standard as drinking water. Biofilm forms rapidly in waterlines. Maintenance: chemical treatment, flushing, independent water reservoirs.", "source": "STAR STAR 2022 / Board Review", "category": "Infection Control & Safety", "domain": "Infection Control & Safety", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which of the following is classified as a CRITICAL dental instrument requiring sterilization?", "options": ["Mouth mirror", "X-ray film holder (reusable)", "Periodontal scaler", "Dental chair arm"], "answer": 2, "explanation": "Spaulding classification: CRITICAL (penetrates soft tissue or bone) = forceps, scalers, surgical burs → require STERILIZATION. SEMI-CRITICAL (contact mucous membranes) = mirrors, impression trays → high-level disinfection. NON-CRITICAL (contact intact skin) = blood pressure cuff → low-level disinfection.", "source": "STAR STAR 2022 / Board Review", "category": "Infection Control & Safety", "domain": "Radiology", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the appropriate disinfection method for an alginate impression that must be disinfected in under 10 minutes?", "options": ["Glutaraldehyde immersion", "Chlorine compound immersion (sodium hypochlorite)", "Iodophor spray", "Alcohol wipe"], "answer": 0, "explanation": "For alginate impressions in <10 minutes: glutaraldehyde. For longer immersion (10 min): chlorine/iodophor compounds. Alginate cannot be autoclaved. Impressions should be rinsed first, then disinfected before pouring. Glutaraldehyde is a high-level disinfectant.", "source": "STAR STAR 2022 / Board Review", "category": "Infection Control & Safety", "domain": "Infection Control & Safety", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the ppm concentration of fluoride in silver diamine fluoride (SDF) 38%?", "options": ["22,500 ppm", "38,000 ppm", "44,800 ppm", "12,300 ppm"], "answer": 2, "explanation": "SDF 38% = 44,800 ppm fluoride (some sources cite 44,000 ppm). Comparison: Fluoride varnish = 22,500 ppm. APF gel = 12,300 ppm. SDF pH = 10 (alkaline). SDF reacts with hydroxyapatite to form calcium fluoride (CaF2) + silver phosphate → fluorapatite formation.", "source": "STAR STAR 2022 / 2023 Recalled", "category": "Caries & Prevention", "domain": "Restorative Dentistry", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the percentage of fluoride (by weight) in 5% NaF varnish?", "options": ["0.5%", "1.23%", "2.26%", "5%"], "answer": 2, "explanation": "5% NaF varnish contains 2.26% (2.2%) fluoride by weight = 22,600 ppm. 1.23% APF = 1.23% F by weight = 12,300 ppm. The '5%' refers to the NaF concentration, not elemental fluoride. F comprises 45.2% of NaF by weight.", "source": "2023 Recalled Questions / STAR STAR", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "SDF (silver diamine fluoride) caries arrest occurs via which TWO primary mechanisms?", "options": ["Remineralization and sealing of tubules", "Antimicrobial silver ions AND prevention of biofilm formation on treated dentin", "Fluoride release and acid neutralization", "Physical barrier formation and antibacterial action"], "answer": 1, "explanation": "SDF caries arrest: (1) ANTIMICROBIAL action of silver ions kills cariogenic bacteria; (2) Biofilm CANNOT form on SDF-treated dentin. Silver phosphate deposits on the dentin surface. CaF2 forms fluorapatite. Limitation: permanent black staining of carious dentin.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Restorative Dentistry", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What juice amount is recommended by AAPD for children aged 1-3 years?", "options": ["No juice under 12 months; 4 oz/day for 1-3 years", "No juice under 6 months; 6 oz/day for 1-3 years", "No juice at all under age 2", "8 oz/day for all children over 1 year"], "answer": 0, "explanation": "AAPD juice recommendations: 0-12 months: NO juice. 1-3 years: max 4 oz/day. 4-6 years: 4-6 oz/day. 7-18 years: up to 8 oz (1 cup)/day. Juice should only be 100% juice, served in a cup (not bottle), with meals only.", "source": "2023 Recalled / STAR STAR", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "Which trace element found in rice cereal is of concern for infants?", "options": ["Lead", "Mercury", "Arsenic", "Cadmium"], "answer": 2, "explanation": "ARSENIC is found in rice and rice-based products (rice cereal, rice milk). Rice accumulates inorganic arsenic from soil and water. FDA recommends limiting infant rice cereal consumption. Oat-based cereals are alternatives. Arsenic is a carcinogen and neurotoxin.", "source": "STAR STAR 2022 / 2023 Recalled", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The arginine-bicarbonate system in saliva works to prevent caries primarily by:", "options": ["Forming a physical barrier on enamel", "Metabolizing arginine to produce ammonia, raising plaque pH above critical level", "Directly killing S. mutans", "Remineralizing white spot lesions"], "answer": 1, "explanation": "Arginine-producing bacteria (alkali-generating bacteria) metabolize arginine through the arginine deiminase system → produce ammonia → RAISE plaque pH above critical level (5.5). This counteracts acid production by S. mutans. Basis for arginine-containing toothpastes (Colgate Pro-Relief).", "source": "2023 Recalled / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "Flush terminal plane in the primary dentition most commonly transitions to which permanent molar relationship?", "options": ["Always Class I (100%)", "Class I (56%) or Class II (44%) — Class II is the most common transition", "Class III (majority)", "Equal distribution of Class I, II, III"], "answer": 1, "explanation": "Flush terminal plane transitions: Class I = 56%, Class II = 44%. DISTAL STEP → 100% Class II. MESIAL STEP (>2mm) → 68% Class I, 19% Class III, 13% Class II. Overall permanent dentition: Class I 61.6%, Class II 34.3%, Class III 4.1%.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Growth & Development", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which dimension of the face changes the LEAST during craniofacial growth?", "options": ["Height (vertical)", "Depth (AP)", "Width (transverse)", "All change equally"], "answer": 2, "explanation": "Facial width changes the LEAST after birth (Width < Depth < Height). The transverse dimension is largely complete by puberty. The vertical dimension shows the most change and continues growing the longest. This is why functional appliances and expansion work best during active growth.", "source": "STAR STAR 2022 / Jack Growth", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The spheno-occipital synchondrosis is significant because:", "options": ["It is the first cranial base suture to close", "It is the LAST synchondrosis to close and is the principal cranial base growth site", "It undergoes intramembranous ossification", "It is responsible for palatal width"], "answer": 1, "explanation": "Spheno-occipital synchondrosis: principal growth site of the cranial base. LAST to close (continues through adolescence). Endochondral ossification. Cranial vault = intramembranous. Maxilla = intramembranous. Mandible = mixed (body = intramembranous; condyle = endochondral).", "source": "STAR STAR 2022 / Jack Growth", "category": "Orthodontics & Occlusion", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What analysis is best for clinically estimating space for canines and premolars WITHOUT needing radiographs?", "options": ["Bolton analysis", "Steiner analysis", "Tanaka-Johnston analysis", "Moyers analysis"], "answer": 2, "explanation": "Tanaka-Johnston analysis: CLINICALLY based, no radiographs needed. Uses mandibular incisor widths to predict combined width of unerupted C + P1 + P2. Formula: (sum of 4 mand incisors ÷ 2) + 10.5 mm (mandible); + 11 mm (maxilla). Moyers: uses probability tables, requires measurements, is GENDER-SPECIFIC.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Growth & Development", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the WORST location to place a dental implant in a child?", "options": ["Mandibular posterior region", "Mandibular anterior region", "Maxillary anterior region", "Maxillary posterior region"], "answer": 2, "explanation": "Implants in children: WORST location = MAXILLARY ANTERIOR (greatest growth changes, vertical and transverse). Can place implants in MANDIBULAR ANTERIOR as early as 13 years in specific cases (e.g., ectodermal dysplasia — the ONE condition where childhood implants are indicated). Never in active growth areas.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "For serial extraction, what is the correct ORDER of tooth extraction?", "options": ["D → C → 4 (first PM)", "C → D → 4", "4 → C → D", "C → 4 → D"], "answer": 0, "explanation": "Serial extraction order: D (primary 1st molar) → C (primary canine) → 4 (first premolar). Indicated for Class I malocclusion with ≥10-11mm of crowding. The goal is for permanent canines to erupt/move distally into the space created by premolar extraction.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Orthodontics & Occlusion", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is considered 'normative' mandibular incisor crowding in an 8-year-old?", "options": ["0 mm (none expected)", "2 mm", "5 mm", "8 mm"], "answer": 1, "explanation": "2 mm of mandibular incisor crowding is NORMAL/NORMATIVE in the early mixed dentition (8-year-olds). This resolves with Lee Way space. Treatment guidelines: <4mm crowding → LLHA (lingual arch). 4-8mm → increase space with appliance. >8-10mm → serial extraction.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What cephalometric analysis is used when the occlusal plane is the reference?", "options": ["Steiner analysis", "Ricketts analysis", "Witts appraisal", "Downs analysis"], "answer": 2, "explanation": "Witts appraisal: uses the FUNCTIONAL OCCLUSAL PLANE as the reference. Measures the distance between points A and B (AO and BO) on the occlusal plane. Advantage: avoids cranial base angle tilt errors seen in SNA/SNB. Normal: females AO = BO; males AO slightly ahead of BO.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Growth & Development", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The INITIAL calcification of the permanent canine begins at approximately:", "options": ["Birth", "4-5 months after birth", "1-2 years", "4-5 years"], "answer": 1, "explanation": "Initial calcification timing: Permanent canine = 4-5 months. Central incisor = 3-4 months; crown complete at 4-5 years. First permanent molar = at BIRTH; crown complete at 3 years. Lateral incisor calcification = 10-12 months. Eruption of canine: 11-12 years maxilla, 9-10 years mandible.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Formation of Epstein's pearls vs. Bohn's nodules — what distinguishes them?", "options": ["Epstein's = salivary gland remnants along mid-palatine raphe; Bohn's = epithelial rests on ridges", "Epstein's = epithelial rests along mid-palatine raphe; Bohn's = salivary gland remnants on ridges/hard palate", "Both are salivary gland remnants in different locations", "Both are epithelial rests — location is the only difference"], "answer": 1, "explanation": "Epstein's pearls: remnants of EPITHELIAL tissue along the MID-PALATINE RAPHE. Bohn's nodules: remnants of MUCOUS GLAND (salivary) tissue, found on ridges and hard palate AWAY from the raphe. Both are benign, present in newborns, resolve spontaneously. Riga-Fede disease: ulceration under tongue from natal/neonatal teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Taurodontism is a failure of which developmental structure?", "options": ["Enamel organ (outer enamel epithelium)", "Stellate reticulum", "Hertwig's epithelial root sheath", "Dental papilla"], "answer": 2, "explanation": "Taurodontism (enlarged pulp chamber, apically displaced furcation): failure/delayed invagination of HERTWIG'S EPITHELIAL ROOT SHEATH. Associated with: Klinefelter syndrome, Down syndrome, tricho-dento-osseous syndrome (TDO = AI type 4 + taurodontism). Stage = morphodifferentiation.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Koplik spots are pathognomonic for which disease, and Strawberry tongue for which?", "options": ["Koplik's = Rubella; Strawberry tongue = Scarlet fever", "Koplik's = Rubeola (measles); Strawberry tongue = Kawasaki disease OR Scarlet fever", "Koplik's = Chickenpox; Strawberry tongue = Measles", "Both are associated with Kawasaki disease"], "answer": 1, "explanation": "Koplik spots (white spots on buccal mucosa) = RUBEOLA (measles). Strawberry tongue (red, swollen, with enlarged papillae) = KAWASAKI DISEASE or SCARLET FEVER (Group A strep pharyngitis). Kawasaki = fever >5 days + conjunctivitis + rash + cervical lymphadenopathy + strawberry tongue.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Herpangina is caused by which virus?", "options": ["Herpes simplex virus (DNA virus)", "Epstein-Barr virus", "Coxsackie A virus (RNA virus)", "Varicella zoster virus"], "answer": 2, "explanation": "Herpangina: Coxsackie A virus (RNA virus, enterovirus). Features: fever, vesicular/ulcerative lesions ONLY on posterior oral mucosa (soft palate, uvula, tonsils, fauces). NOT anterior. Same virus family as Hand-Foot-Mouth disease (HFM = Coxsackie A16, also Enterovirus 71). HFM complication: meningitis.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which oral lesion appears as 'floating teeth' on radiograph in a child?", "options": ["Dentigerous cyst", "Traumatic bone cyst", "Langerhans cell histiocytosis (LCH)", "Ameloblastoma"], "answer": 2, "explanation": "Langerhans cell histiocytosis (LCH, formerly histiocytosis X): 'floating teeth' appearance on radiograph due to alveolar bone destruction. Neuroectodermal tumor of infancy can also cause floating teeth in the maxillary anterior. LCH: ulceration, bone destruction, premature tooth loss, gingival involvement.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Radiology", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which of the following is the appropriate kVp for dental intraoral radiographs?", "options": ["40-50 kVp", "60-70 kVp", "90-100 kVp", "120-140 kVp"], "answer": 1, "explanation": "Appropriate kVp for dental intraoral radiographs: 60-70 kVp. CBCT uses higher kVp. Digital sensors allow dose reduction vs. film. Long-cone paralleling technique preferred. Lead apron: required for circular collimation; NOT required for rectangular collimation per updated guidelines.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Radiology", "domain": "Radiology", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which organ/tissue receives the HIGHEST equivalent radiation dose from a CBCT of the mandible?", "options": ["Thyroid gland", "Eye lens", "Salivary glands", "Bone marrow"], "answer": 2, "explanation": "CBCT radiation dose: SALIVARY GLANDS receive highest equivalent dose from mandibular CBCT (1,598 µSv), followed by oral mucosa and extrathoracic airway. For maxillary CBCT: salivary glands also highest (1,847 µSv). This is why CBCT should only be used when benefit clearly outweighs risk.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Radiology", "domain": "Radiology", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Talon cusp (dens evaginatus from the lingual surface) is most commonly associated with which syndrome?", "options": ["Down syndrome", "Rubenstein-Taybi syndrome", "Apert syndrome", "Crouzon syndrome"], "answer": 1, "explanation": "Talon cusp (most common on maxillary lateral incisor lingual surface) is associated with RUBENSTEIN-TAYBI syndrome. Dens invaginatus (dens in dente) most commonly found on maxillary lateral incisor. Dens evaginatus (occlusal cusp) most common on mandibular premolars (particularly in East Asian populations).", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The most common congenitally missing tooth (excluding third molars) is:", "options": ["Maxillary lateral incisor", "Maxillary second premolar", "Mandibular second premolar", "Mandibular central incisor"], "answer": 2, "explanation": "Congenitally missing teeth (excluding 3rd molars), most to least common: Mandibular 2nd premolar > Maxillary lateral incisor > Maxillary 2nd premolar. Most commonly IMPACTED tooth: 3rd molars > Maxillary canine (2nd most impacted). Maxillary canines: 85% palatal, 15% labial.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Growth & Development", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which condition causes 'ghost teeth' (regional odontodysplasia)?", "options": ["Generalized enamel hypoplasia affecting the entire dentition", "Regional defect causing large pulps, thin enamel/dentin, 'ghost' radiographic appearance, brittle teeth", "Enamel hypomineralization (MIH)", "Dentinogenesis imperfecta affecting both dentitions"], "answer": 1, "explanation": "Regional odontodysplasia ('ghost teeth'): affects a REGION of the jaw (not generalized). Teeth have large pulps, very thin/hypomineralized enamel and dentin, 'ghost' appearance on radiograph (indistinct EDJ). Both primary AND permanent teeth in the same quadrant/region are affected. Treatment: extraction of affected teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Growth & Development", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The most common heart defect associated with Down syndrome (Trisomy 21) is:", "options": ["Ventricular septal defect (VSD)", "Atrial septal defect (ASD)", "Atrioventricular septal defect (AVSD)", "Patent ductus arteriosus (PDA)"], "answer": 2, "explanation": "Down syndrome most common cardiac defect: ATRIOVENTRICULAR SEPTAL DEFECT (AVSD = AV canal defect, ~40% of DS cardiac defects). Also associated: VSD, ASD, PDA. Down syndrome also associated with: celiac disease, Alzheimer's, hypothyroidism, ALL/AML leukemia (10-20x risk), neutrophil chemotaxis defect.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Sturge-Weber syndrome is characterized by a vascular malformation of which type?", "options": ["Arterial malformation (hemangioma)", "Venous malformation (port-wine stain — leptomeningeal angioma)", "Lymphatic malformation", "Capillary malformation of the heart"], "answer": 1, "explanation": "Sturge-Weber syndrome: VENOUS malformation. Features: port-wine stain (nevus flammeus) on face (trigeminal distribution), leptomeningeal angioma, glaucoma, seizures. Oral: gingival hemangioma on side of port-wine stain. Angioma in oral cavity can bleed profusely during dental procedures.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The oral/dental hallmark of Epidermolysis Bullosa (EB) simplex (most common form) is:", "options": ["Enamel hypoplasia (seen in Junctional EB)", "Taurodontism", "Ankylosis of teeth", "Excess fibrous acellular cementum (Dystrophic EB)"], "answer": 0, "explanation": "EB types: Simplex = most common, mildest. Junctional EB = ENAMEL HYPOPLASIA (separation at basement membrane). Dystrophic EB = defect in TYPE VII COLLAGEN, EXCESS fibrous acellular cementum, most severe. Main cause of death in EB infants: FAILURE TO THRIVE. G6PD: avoid prilocaine, benzocaine (methemoglobinemia risk).", "source": "STAR STAR 2022 / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which medication used for ADHD causes bruxism and xerostomia?", "options": ["Atomoxetine (Strattera)", "Methylphenidate (Ritalin/Concerta)", "Amphetamine (Adderall)", "Both methylphenidate and amphetamines"], "answer": 3, "explanation": "Both methylphenidate (Ritalin) AND amphetamines (Adderall/Dexedrine) cause bruxism and xerostomia as side effects. These are stimulant medications. Dental implications: increased caries risk (xerostomia), TMJ symptoms, wear facets from bruxism. Atomoxetine (Strattera) is a non-stimulant ADHD med.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Williams syndrome is associated with which cardiac defect?", "options": ["Tetralogy of Fallot", "Supravalvular aortic stenosis", "VSD", "Coarctation of the aorta"], "answer": 1, "explanation": "Williams syndrome: SUPRAVALVULAR AORTIC STENOSIS (most characteristic). Features: 'elfin' facies, intellectual disability, hypercalcemia, hypersensitivity to sounds, very sociable/friendly personality. Oral: small teeth, wide spacing, Class II malocclusion. Caused by deletion of chromosome 7q11.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Wiskott-Aldrich syndrome is associated with which dental finding?", "options": ["Premature tooth loss with intact roots", "Over-retained primary teeth", "Severe periodontitis in primary dentition", "Enamel hypoplasia"], "answer": 1, "explanation": "Wiskott-Aldrich syndrome: X-linked immunodeficiency with OVER-RETAINED PRIMARY TEETH. Other syndromes with delayed eruption/over-retained primary teeth: Down syndrome, Crouzon, Cornelia de Lange, Noonan, DiGeorge, Cleidocranial Dysplasia. Wiskott-Aldrich: thrombocytopenia, eczema, immunodeficiency (WETIS mnemonic).", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Cleidocranial dysplasia is characterized by which dental finding?", "options": ["Premature exfoliation of primary teeth and aggressive periodontitis", "Multiple supernumerary teeth, delayed exfoliation of primary teeth, and delayed eruption", "Complete absence of permanent teeth", "Enamel hypoplasia affecting only primary teeth"], "answer": 1, "explanation": "Cleidocranial Dysplasia (CCD): RUNX2 gene mutation. Features: hypoplastic/absent clavicles, wide fontanelles, multiple SUPERNUMERARY teeth, DELAYED EXFOLIATION of primary teeth, DELAYED ERUPTION of permanent teeth. Treatment: surgical exposure and orthodontic guidance of permanent teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Periodontics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the postictal phase of a seizure and why is it the most dangerous?", "options": ["Active seizure with muscle contractions — dangerous due to aspiration", "The aura phase before seizure — dangerous due to unpredictability", "Post-seizure unconsciousness, confusion, and partial paralysis — dangerous due to airway compromise and recovery state", "The tonic phase — dangerous due to hypoxia"], "answer": 2, "explanation": "Seizure phases: (1) PRODROMAL: aura (30% have this). (2) ICTAL: active seizure (tonic → clonic contractions). (3) POSTICTAL: most dangerous — headache, atonia/partial paralysis, confusion, fatigue, possible incontinence, unconsciousness leading to confused awakening. Status epilepticus = seizure >5 minutes.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "A patient with an uncontrolled well-managed grand mal seizure disorder would have which ASA classification?", "options": ["ASA I", "ASA II", "ASA III", "ASA IV"], "answer": 1, "explanation": "WELL-CONTROLLED seizure disorder = ASA II (controlled systemic disease with no functional limitation). POORLY CONTROLLED seizure disorder = ASA III or IV. ASA I = no systemic disease. ASA IV = incapacitating disease with constant threat to life. Ketogenic diet is used to treat seizure disorders.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Pharmacology & Sedation", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The most common type of febrile seizure is:", "options": ["Absence (petit mal)", "Myoclonic", "Focal (partial)", "Generalized tonic-clonic"], "answer": 3, "explanation": "Febrile seizures: most common type = GENERALIZED TONIC-CLONIC (grand mal). Occur in 2-5% of children aged 6 months to 5 years with rapidly rising fever. Simple febrile seizures: <15 min, generalized, single episode within 24h. Complex: >15 min, focal, or recurrence within 24h.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Special Healthcare Needs", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Beckwith-Wiedemann syndrome in dental treatment requires what primary consideration?", "options": ["Increased bleeding risk", "Airway compromise due to macroglossia", "Malignant hyperthermia risk", "Severe periodontitis"], "answer": 1, "explanation": "Beckwith-Wiedemann syndrome: AIRWAY COMPROMISE due to macroglossia (large tongue). Features: macroglossia, macrosomia, omphalocele, hypoglycemia, ear pits. Dental: Class III tendency, anterior open bite from macroglossia. May require tongue reduction surgery. Glossoptosis can obstruct airway during sedation/GA.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Fetal alcohol syndrome is characterized by which ORAL/FACIAL finding?", "options": ["Micrognathia and cleft palate", "Macroglossia and prognathism", "Indistinct/flat philtrum and thin upper lip", "Prominent nose and midface hypoplasia"], "answer": 2, "explanation": "Fetal alcohol syndrome (FAS): INDISTINCT/FLAT PHILTRUM (smooth philtrum), thin upper lip, small palpebral fissures, microcephaly, intellectual disability, growth retardation. No safe amount of alcohol during pregnancy. Fetal alcohol SPECTRUM disorder (FASD) is broader term.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Oral Pathology & Medicine", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Local anesthetics work by which mechanism?", "options": ["Reversibly blocking potassium channels", "Reversibly blocking sodium channels → preventing depolarization", "Permanently blocking sodium channels", "Activating GABA receptors"], "answer": 1, "explanation": "LA mechanism: REVERSIBLE BLOCKAGE of sodium channels → prevents Na+ influx → blocks depolarization and conduction of action potentials. Ionized form (RNH+) binds intracellular receptor. Only the NON-IONIZED (free base, RN) form can cross nerve membrane. Low pH in infected tissue → more ionized LA → LESS effective.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Caries & Prevention", "source_page": "Slide Deck 4 & 14 — Pharmacologic Behavior Guidance", "source_doc": "From Jack Folder/ — Slide Deck 4 & 14.pdf"}, {"q": "Tachyphylaxis in local anesthesia is MOST likely to occur when:", "options": ["A patient has never received the medication before", "Nerve function returns prior to re-injection (allowing nerve re-polarization and tissue pH restoration)", "A patient is very young", "The patient is highly anxious"], "answer": 1, "explanation": "Tachyphylaxis (diminishing effectiveness with repeated doses of LA): MOST likely when nerve function RETURNS before re-injection. The nerve re-polarizes, and the acidic anesthetic environment builds up with multiple injections. Waiting until patient reports pain before re-injecting is the classic trigger.", "source": "Jack QE Course / QE Practice Test 2025", "category": "Pharmacology & Sedation", "domain": "Caries & Prevention", "source_page": "Slide Deck 4 & 14 — Pharmacologic Behavior Guidance", "source_doc": "From Jack Folder/ — Slide Deck 4 & 14.pdf"}, {"q": "Esters local anesthetics are metabolized by which enzyme/location?", "options": ["Liver via cytochrome P450", "Plasma pseudocholinesterase", "Kidney filtration", "Salivary amylase"], "answer": 1, "explanation": "ESTER LAs (procaine, tetracaine, benzocaine, cocaine): metabolized by PLASMA PSEUDOCHOLINESTERASE → PABA (para-aminobenzoic acid) = major metabolite responsible for allergic reactions. AMIDE LAs (lidocaine, mepivacaine, bupivacaine, articaine): metabolized in LIVER by cytochrome P450. Articaine: 90% plasma, 10% P450.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Caries & Prevention", "source_page": "Slide Deck 4 & 14 — Pharmacologic Behavior Guidance", "source_doc": "From Jack Folder/ — Slide Deck 4 & 14.pdf"}, {"q": "Which local anesthetic contains a thiophene ring with an ester group (making it a unique hybrid)?", "options": ["Bupivacaine", "Mepivacaine", "Articaine", "Prilocaine"], "answer": 2, "explanation": "ARTICAINE is unique: it's an AMIDE with an ESTER side chain and a THIOPHENE ring (instead of benzene ring). This gives it better tissue penetration. Metabolized 90% by plasma esterases, 10% by liver P450. Has highest protein binding of commonly used LAs. Available as 4% with 1:100,000 or 1:200,000 epi.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation", "source_page": "Slide Deck 4 & 14 — Pharmacologic Behavior Guidance", "source_doc": "From Jack Folder/ — Slide Deck 4 & 14.pdf"}, {"q": "The FIRST sign of local anesthetic systemic toxicity (LAST) is:", "options": ["Seizures", "Cardiac arrhythmia", "Tinnitus or circumoral numbness/dizziness (CNS excitatory signs)", "Loss of consciousness"], "answer": 2, "explanation": "LAST progression: CNS excitation → CNS depression → Cardiovascular toxicity. FIRST signs: tinnitus, metallic taste, dizziness, circumoral numbness, visual disturbances, agitation. Then: seizures (CNS excitation). Then: CNS depression (drowsiness, unconsciousness). LAST: cardiovascular collapse. Bupivacaine is most cardiotoxic.", "source": "2023 Recalled / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "Which drug causes gingival enlargement/hyperplasia?", "options": ["Metformin", "Atorvastatin", "Verapamil (and other calcium channel blockers, phenytoin, cyclosporine)", "Methotrexate"], "answer": 2, "explanation": "Drug-induced gingival enlargement: 3 main drug classes: (1) CALCIUM CHANNEL BLOCKERS (verapamil, nifedipine, amlodipine), (2) PHENYTOIN (Dilantin) — anticonvulsant, (3) CYCLOSPORINE — immunosuppressant. Gingival enlargement is fibrous (not inflammatory). Associated with plaque but requires drug as initiating factor.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Periodontics", "domain": "Periodontics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Nitrous oxide (N2O) interferes with the metabolism of which vitamin?", "options": ["Vitamin D", "Vitamin B6", "Vitamin B12", "Folic acid (Vitamin B9)"], "answer": 2, "explanation": "N2O irreversibly oxidizes VITAMIN B12 (cobalamin) → inactivates methionine synthase → blocks DNA synthesis. Chronic N2O exposure (abuse or repeated exposure) can cause: megaloblastic anemia, peripheral neuropathy, subacute combined degeneration. Single dental exposures: minimal clinical concern.", "source": "2024 Recalled / Board Review", "category": "Pharmacology & Sedation", "domain": "Behavior Guidance", "source_page": "Recalled exam 2024", "source_doc": "2024a.pdf"}, {"q": "What is the best method to provide the EARLIEST indication of depressed ventilation in a moderately sedated child?", "options": ["Pulse oximetry", "Blood pressure monitoring", "Capnography (EtCO2)", "Clinical observation of chest rise"], "answer": 2, "explanation": "CAPNOGRAPHY (end-tidal CO2 monitoring) provides the EARLIEST indication of depressed ventilation — detects rising CO2 BEFORE oxygen saturation drops (pulse oximetry lags). Normal EtCO2: 30-40 mmHg. Required per AAPD/AAP sedation guidelines. Pulse oximetry detects HYPOXIA, capnography detects HYPOVENTILATION.", "source": "STAR STAR 2022 / 2023 Recalled", "category": "Pharmacology & Sedation", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the IV fluid maintenance rate for a 25 kg child (Holliday-Segar formula)?", "options": ["25 mL/hr", "55 mL/hr", "65 mL/hr", "75 mL/hr"], "answer": 2, "explanation": "Holliday-Segar formula: First 10 kg = 4 mL/kg/hr (40 mL/hr). Next 10 kg = 2 mL/kg/hr (20 mL/hr). Each kg above 20 = 1 mL/kg/hr (5 mL/hr for 25kg). Total = 40+20+5 = 65 mL/hr. This is the '4-2-1 rule' for maintenance IV fluid rate in pediatric patients.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which is the current AAPD-recommended material for primary tooth pulpotomy (strong recommendation, moderate evidence)?", "options": ["Calcium hydroxide (Ca(OH)2)", "Ferric sulfate", "MTA (mineral trioxide aggregate) and formocresol", "Zinc oxide eugenol (ZOE) alone"], "answer": 2, "explanation": "AAPD 2022 guidelines: MTA and formocresol = strong recommendation, moderate-quality evidence for primary tooth pulpotomy (success rates 77-91%). Ferric sulfate: forms protein complex/hemostasis, conditional recommendation. Calcium hydroxide: not recommended for primary tooth pulpotomy (high failure rates). BiodentineTM: newer alternative.", "source": "Jack QE Course / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics", "source_page": "Slide Deck 3 — Pulp Therapy & Orofacial Trauma", "source_doc": "From Jack Folder/ — Slide Deck 3.pdf"}, {"q": "Indication for indirect pulp therapy (IPT) in a primary tooth:", "options": ["Spontaneous pain and percussion sensitivity", "Provoked pain only, intact lamina dura, no radiographic signs of pathology", "Furcal radiolucency", "Sinus tract present"], "answer": 1, "explanation": "IPT (stepwise excavation) indications: PROVOKED (not spontaneous) pain, intact lamina dura, NO radiographic pathology (no furcal/periapical lesion, no internal/external resorption). The purpose of IPT's first step: CHANGE THE CARIOGENIC ENVIRONMENT. ZOE placed deep decreases nerve stimulation.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Pulp Therapy & Endodontics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "LSTR (Lesion Sterilization and Tissue Repair) uses which antibiotic combination?", "options": ["Amoxicillin + metronidazole + doxycycline", "Metronidazole + ciprofloxacin + minocycline (3Mix)", "Clindamycin + tetracycline + amoxicillin", "Penicillin + metronidazole + erythromycin"], "answer": 1, "explanation": "LSTR uses 3Mix: metronidazole + ciprofloxacin + minocycline placed inside the infected pulp chamber. Aims to sterilize the lesion and promote tissue repair/regeneration by the host. Alternative to pulpectomy in primary teeth when canals cannot be negotiated. Minocycline may cause tooth discoloration.", "source": "2023A Recalled / Board Review", "category": "Infection Control & Safety", "domain": "Pharmacology & Sedation", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "For a Cvek pulpotomy (partial pulpotomy), what is the MOST important factor for success?", "options": ["Using MTA as the pulp capping material", "Tight marginal seal of the restoration", "Patient age under 10 years", "Using rubber dam for isolation"], "answer": 1, "explanation": "Cvek pulpotomy (partial pulpotomy for traumatic pulp exposure in an immature permanent tooth): the TIGHT MARGINAL SEAL of the restoration is the most important factor for success. Even MTA cannot compensate for microleakage. Success rates: 90-97% with proper technique. Can perform up to several days after exposure.", "source": "STAR STAR 2022 / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Restorative Dentistry", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Which percussion finding is an indication for non-vital pulp therapy in a primary tooth?", "options": ["Sensitivity to hot/cold only", "Spontaneous pain only", "Percussion sensitivity (pathognomonic of inflammation beyond the pulp)", "Normal response to EPT"], "answer": 2, "explanation": "Percussion sensitivity in a PRIMARY tooth = inflammation has extended BEYOND the pulp into the periradicular tissues → indication for NON-VITAL pulp therapy (pulpectomy) or extraction. Other indications for non-vital therapy: furcal/periapical radiolucency, sinus tract, pathologic mobility, pain on biting.", "source": "STAR STAR 2022 / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The most common cause of pediatric cardiac arrest is:", "options": ["Primary cardiac arrhythmia", "Asphyxiation/hypoxia (airway obstruction)", "Hypovolemia", "Septic shock"], "answer": 1, "explanation": "Pediatric cardiac arrest differs from adults: most common cause in children = ASPHYXIATION/HYPOXIA (respiratory arrest leading to cardiac arrest). This is why the pediatric emergency order prioritizes AIRWAY and BREATHING. Emergency sequence: Resp. arrest > Resp. depression > Cardiac arrest > Desaturation > Seizure.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "In a choking child (>1 year old), what is the FIRST maneuver to perform?", "options": ["Back blows only", "Abdominal thrusts (Heimlich maneuver)", "Back blows + chest thrusts (as for infants)", "Call 911 before any intervention"], "answer": 1, "explanation": "CHOKING: Child (>1 year): ABDOMINAL THRUSTS (Heimlich maneuver). Infant (<1 year): 5 BACK BLOWS + 5 CHEST THRUSTS (NOT abdominal thrusts — risk of abdominal organ injury in infants). Responsive child: encourage coughing, do Heimlich if cannot cough/breathe. Unconscious: CPR.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the most appropriate initial treatment for anaphylaxis?", "options": ["IV diphenhydramine (Benadryl)", "Epinephrine 1:1000, 0.01 mg/kg IM (lateral thigh)", "Oral prednisolone", "Albuterol inhaler"], "answer": 1, "explanation": "Anaphylaxis treatment: EPINEPHRINE is FIRST LINE — 1:1000 concentration, 0.01 mg/kg IM, lateral thigh (fastest absorption). Max 0.5 mg adult, 0.3 mg child. Mechanism: alpha-1 agonist (vasoconstriction), beta-1 (cardiac), beta-2 (bronchodilation). Antihistamines and steroids are SECONDARY — do NOT replace epi.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Pharmacology & Sedation", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "In a dental emergency, the MOST common emergency encountered in pediatric dentistry practice is:", "options": ["Cardiac arrest", "Laryngospasm", "Respiratory arrest or depression", "Anaphylaxis"], "answer": 2, "explanation": "Most common dental emergencies in order: (1) Respiratory arrest/depression → (2) Cardiac arrest → (3) Desaturation → (4) Seizure → (5) Laryngospasm → (6) Respiratory distress. Respiratory complications are overwhelmingly most common, which is why airway monitoring (capnography, pulse oximetry) is paramount.", "source": "STAR STAR 2022 / Board Review", "category": "Pharmacology & Sedation", "domain": "Infection Control & Safety", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "The DTaP vaccine schedule for children is:", "options": ["One dose at 12 months, 4 years, and 11 years", "3-dose series at 2, 4, 6 months; boosters at 15-18 months and 4-6 years", "Annual vaccination starting at 6 months", "2 doses at 2 months and 6 years"], "answer": 1, "explanation": "DTaP (Diphtheria, Tetanus, Pertussis) schedule: PRIMARY series: 2, 4, 6 months. BOOSTER 1: 15-18 months. BOOSTER 2: 4-6 years. Tdap (for older children/adults): 11-12 years, then Td every 10 years. DTaP = for infants/young children. Tdap = for older children/adults (lower dose diphtheria/pertussis).", "source": "2023A Recalled / Board Review", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "HPV vaccine routine vaccination schedule begins at age:", "options": ["9-10 years (can start as early as 9)", "11-12 years (routine recommendation)", "15-16 years", "18 years"], "answer": 1, "explanation": "HPV vaccine: routine = ages 11-12 years (can start at 9). 2-dose schedule if started before age 15: doses 0 and 6-12 months. 3-dose schedule if started at age 15+: 0, 1-2, 6 months. Catch-up vaccination: through age 26. FDA approved for up to age 45. Protects against 9 HPV types (Gardasil 9).", "source": "2023A Recalled / Board Review", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2023A", "source_doc": "2023A.pdf"}, {"q": "What is the minimum required occlusal reduction for a zirconia crown on a primary tooth?", "options": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "answer": 2, "explanation": "Zirconia crowns (NuSmile, Cheng Crowns): require ~1.5 mm occlusal reduction. Fracture resistance is enhanced by average or greater inciso-cervical length, and centric contacts located over the concave lingual portion. Shoulder margin is preferred for occlusal strength. SSCs require 1.0-1.5 mm occlusal reduction.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the width-to-length ratio considered ideal for maxillary central incisor esthetics?", "options": ["62%", "70%", "80%", "100% (square tooth)"], "answer": 2, "explanation": "Ideal width-to-length ratio for maxillary central incisor: 80% (tooth is taller than wide). Golden proportions for adjacent teeth relative to each other: LI visible width = 62% of CI. Canine visible width = 62% of LI. Golden ratio (1.618) applies to relative widths between adjacent teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What does resin infiltration (ICON) penetrate enamel by?", "options": ["Active transport", "Osmotic pressure", "Capillary action", "Mechanical pressure"], "answer": 2, "explanation": "ICON resin infiltration: penetrates through CAPILLARY ACTION into the porous enamel of white spot lesions. Pre-treatment with 15% HCl (or 6.6% for microabrasion ICON ENAMEL) creates channels for infiltration. Effective up to 1/3 of dentin thickness (D1 lesion in ADA classification). Seals the lesion without cavity preparation.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "What is the MOST important factor for sealant success?", "options": ["Type of sealant material used", "Retention (adequate bonding to tooth surface)", "Use of self-etching primers", "Patient age"], "answer": 1, "explanation": "Most important factor for sealant success: RETENTION. Factors improving retention: 4-handed technique, isolation (rubber dam or cotton rolls), adequate etching (15-30 seconds), dry field. Sealants reduce caries risk by 76% vs. unsealed teeth after 2-3 years. Self-etching primers: NOT recommended (reduces retention).", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "For a primary molar Class II amalgam prep, which line angle must be ROUNDED?", "options": ["Mesiobuccal line angle", "Axiobuccal line angle", "Axiopulpal line angle", "Gingivoaxial line angle"], "answer": 2, "explanation": "Primary molar Class II amalgam prep: the AXIOPULPAL line angle must be ROUNDED (beveled) to reduce stress concentration and prevent amalgam fracture. The cavosurface margins have a slight flare (NOT an actual bevel). Isthmus width should be 1/3 intercuspal width. Pulpal depth: 1.5-2 mm.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Orthodontics & Occlusion", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "MTA discoloration of the crown is caused by which component?", "options": ["Calcium silicate", "Zirconium oxide", "Bismuth oxide (radiopacifier)", "Iron oxide"], "answer": 2, "explanation": "MTA crown discoloration: caused by BISMUTH OXIDE (the radiopacifier component). Light/moisture activation causes bismuth to oxidize and penetrate dentinal tubules → gray/brown discoloration. Newer formulation (White MTA) replaced bismuth oxide with zirconium oxide to reduce staining while maintaining radiopacity.", "source": "2023 Channel / Board Review", "category": "Caries & Prevention", "domain": "Pulp Therapy & Endodontics", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "SSC (stainless steel crowns) interfere with which imaging modality?", "options": ["CT scan only", "Conventional X-ray", "MRI (causes scatter artifact)", "Ultrasound"], "answer": 2, "explanation": "SSCs cause SIGNIFICANT SCATTER ARTIFACT on MRI. The metallic content (chromium, nickel, iron, etc.) distorts the MRI magnetic field. For patients with SSCs who need MRI of the head/neck: discuss with radiologist, may need alternative imaging. CBCT: SSCs also cause scatter but less severe.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Radiology", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "SSC occlusal reduction is how much?", "options": ["0.5 mm", "1.0-1.5 mm", "2.0 mm", "No reduction needed (Hall technique)"], "answer": 1, "explanation": "SSC prep requires 1.0-1.5 mm OCCLUSAL REDUCTION (some sources say 1.0 mm). Hall technique: NO occlusal reduction, NO caries removal, NO local anesthesia — the crown is cemented over the caries. Hall technique: occlusion normalizes within 2-4 weeks as teeth/bite adapts.", "source": "2023 Channel / Board Review", "category": "Pharmacology & Sedation", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "An antibiotic that can cause QT prolongation (cardiac arrhythmia risk) is:", "options": ["Amoxicillin", "Clindamycin", "Azithromycin (Z-pak)", "Metronidazole"], "answer": 2, "explanation": "AZITHROMYCIN is associated with QT prolongation and potentially fatal cardiac arrhythmias (torsades de pointes). This is a Black Box Warning. Erythromycin also has this risk. Use with caution in patients with cardiac conduction abnormalities. Clindamycin: avoid in patients with IBS/IBD (risk of C. diff colitis).", "source": "2023 Channel / Board Review", "category": "Caries & Prevention", "domain": "Pharmacology & Sedation", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "What is the recommended material for restorations in pregnant women?", "options": ["Amalgam (established track record)", "Glass ionomer cement (GIC)", "Composite resin", "Avoid all restorations until after delivery"], "answer": 2, "explanation": "Composite resin is recommended for restorations in pregnant women. Avoid amalgam during pregnancy (mercury concerns). GIC and composite are both acceptable, but composite is preferred for durability. Dental treatment is SAFE during pregnancy — the second trimester is ideal timing for elective procedures.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "How long after Hall technique SSC placement does the occlusion typically normalize?", "options": ["1-2 days", "2-4 weeks", "3-6 months", "It never normalizes — must grind crown"], "answer": 1, "explanation": "Hall technique SSC: the crown creates a temporary increase in vertical dimension. Occlusion normalizes within 2-4 WEEKS through dentoalveolar compensation (slight intrusion of the cemented tooth and overeruption of opposing tooth). No permanent harmful effects on TMJ have been documented.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "What is the earliest age S. mutans can be detected in the oral cavity?", "options": ["At birth", "3 months", "6-10 months (with primary tooth eruption)", "15.7 months"], "answer": 1, "explanation": "S. mutans can be detected as early as 3 MONTHS of age in pre-dentate infants (even without teeth). The oral microbiome is established early. Colonization increases with tooth eruption. Some studies report detection at birth. Window of infectivity (highest risk for colonization): 19-33 months.", "source": "2023 Channel / STAR STAR", "category": "Caries & Prevention", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2023 (Channel)", "source_doc": "2023 Channel MOST RECENT.pdf"}, {"q": "The most common bacteria found in a chronic dental infection are:", "options": ["Gram-positive aerobic streptococci", "Gram-negative anaerobic bacteria", "Spirochetes and Treponema", "Staphylococcus aureus"], "answer": 1, "explanation": "CHRONIC dental/periapical infections: predominantly GRAM-NEGATIVE ANAEROBIC bacteria (Bacteroides, Prevotella, Fusobacterium, Peptostreptococcus). ACUTE infections: more gram-positive aerobes/facultative anaerobes. This is why amoxicillin + metronidazole or clindamycin covers both acute and chronic dental infections.", "source": "STAR STAR / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "Brown tumor of the jaw is associated with which metabolic condition?", "options": ["Vitamin D deficiency (rickets)", "Hyperparathyroidism (primary or secondary from renal disease)", "Hypophosphatasia", "Paget's disease"], "answer": 1, "explanation": "Brown tumors: GIANT CELL lesions of bone associated with HYPERPARATHYROIDISM (primary = parathyroid adenoma; secondary = renal disease). PTH → increased osteoclastic activity → bone lesions. 'Brown' color from hemosiderin deposits. Radiograph: multilocular radiolucency. Must rule out giant cell granuloma.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "STAR STAR Cookies & Milk (2022)", "source_doc": "STAR STAR. Cookies and Milk.pdf"}, {"q": "A patient with latex allergy may also be allergic to which fruits (latex-fruit syndrome)?", "options": ["Apples and oranges", "Kiwi, banana, and avocado", "Strawberries and mangoes", "Grapes and pineapple"], "answer": 1, "explanation": "LATEX-FRUIT SYNDROME: patients with latex allergy have cross-reactive allergies to KIWI, BANANA, AVOCADO (most common triad). Also: chestnut, papaya. Mechanism: shared proteins between latex (Hevea brasiliensis) and these fruits. Important for dental patients: use latex-free gloves and equipment.", "source": "2024 Recalled / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "Recalled exam 2024", "source_doc": "2024a.pdf"}, {"q": "According to Piaget, the stage of cognitive development in which a child can think abstractly is termed:", "options": ["concrete operations.", "formal operations.", "preoperational.", "Sensorimotor."], "answer": 1, "explanation": "Correct: B. formal operations.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Growth & Development", "source_page": "AAPD QE Prep Course 2024 — Q.178", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "During which of the following stages is a child most likely to begin showing an understanding of social norms for behavior?", "options": ["Concrete operations", "Formal operations", "Preoperational", "Sensorimotor"], "answer": 0, "explanation": "Correct: A. Concrete operations", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.179", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which best describes the trajectory seen in a body mass index chart for girls ages 2-20 years?", "options": ["A repeated pattern of linear increasing and leveling", "A steady ascension throughout the years", "A steady increase until plateauing at puberty", "An initial decrease then an increase through adolescence"], "answer": 3, "explanation": "Correct: D. An initial decrease then an increase through adolescence", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.180", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "During which of the following stages does a child first start demonstrating self-control?", "options": ["Concrete operations", "Formal operations", "Preoperational", "Sensorimotor"], "answer": 2, "explanation": "Correct: C. Preoperational", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.181", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "According to Erikson's stages of man, feelings of shame develop from a failure to develop which of the following?", "options": ["Autonomy", "Belonging", "Identity", "Skills"], "answer": 0, "explanation": "Correct: A. Autonomy", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Growth & Development", "source_page": "AAPD QE Prep Course 2024 — Q.182", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "At which age is a child most likely to try to impose power over others?", "options": ["2 years", "3 years", "4 years", "5 years"], "answer": 2, "explanation": "Correct: C. 4 years. In Erikson's Initiative vs. Guilt stage (ages 3-6), 4-year-olds are particularly assertive in trying to dominate others and impose their will. This egocentric behavior is developmentally normal.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.183", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which motor skill is latest to develop?", "options": ["Drawing a circle", "Standing on tiptoe", "Throwing a ball", "Turning a somersault"], "answer": 3, "explanation": "Correct: D. Turning a somersault", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.184", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A 6-year-old child follows directions, but only after glancing at her mother aftereach request, and being prompted toward compliance. Which classification represents this behavior?", "options": ["Frankl 1", "Frankl 2", "Frankl 3", "Frankl 4"], "answer": 2, "explanation": "Correct: C. Frankl 3", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.185", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A father gives instructions to his child consistent with the provider's direction and gives praise on compliance. Which classification represents this behavior?", "options": ["Authoritarian", "Authoritative", "Indulgent/Permissive", "Uninvolved"], "answer": 1, "explanation": "Correct: B. Authoritative", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.186", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Having a word for most everything is expected by what age in a child's development?", "options": ["1 up to 2 years", "2 up to 3 years", "3 up to 4 years", "4 up to 5 years"], "answer": 1, "explanation": "Correct: B. 2 up to 3 years", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.187", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The communication technique that helps parents explore and resolve their ambivalence about changing behaviors is known as:", "options": ["ask-tell-ask.", "functional inquiry.", "memory restructuring.", "motivational interviewing."], "answer": 3, "explanation": "Correct: D. motivational interviewing.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.188", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following best describes the aim of multimodal analgesia?", "options": ["To improve pain relief by using two or more drugs that act by different mechanisms to provide analgesia", "To minimize post-operative pain experience by administering a local anesthetic agent during a general anesthetic", "To pre-empt pain through the administration of an analgesic agent in addition to an anesthetic before a surgical insult", "To prevent pain by minimizing sensitization induced by noxious stimuli throughout the perioperative period"], "answer": 0, "explanation": "Correct: A. To improve pain relief by using two or more drugs that act by different mechanisms to provide analgesia", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.191", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The primary action of phentolamine mesylate in oral health care applications is:", "options": ["as a vasopressor.", "as an α-adrenergic agonist.", "neuraxial blockade.", "vasodilation."], "answer": 3, "explanation": "Correct: D. vasodilation.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.192", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Articaine has the shortest half-life of dental anesthetics due to its: a. anti-inflammatory effects allowing rapid absorption.", "options": ["characteristic structure containing an ester side-chain.", "pH approximating that of injection site tissues.", "synergy with bradykinin and histamine."], "answer": 0, "explanation": "Correct: B. characteristic structure containing an ester side-chain.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.193", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Sensation of the teeth and supporting structures is from cranial nerve:", "options": ["4.", "5.", "7.", "10."], "answer": 1, "explanation": "Correct: B. CN 5 (Trigeminal nerve). The trigeminal nerve (CN V) provides sensory innervation to the teeth, periodontium, and oral mucosa via its maxillary (V2) and mandibular (V3) divisions.", "source": "QE Prep Course 2024", "domain": "Oral Pathology & Medicine", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.194", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Local anesthetics:", "options": ["enter the nerve only when in ionized form.", "inhibit conduction of nerve action potentials.", "irreversibly block sodium channels.", "reversibly block potassium channels"], "answer": 1, "explanation": "Correct: B. inhibit conduction of nerve action", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.195", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "For a local anesthetic to be effective, it must do which of the following things?", "options": ["Block channels outside the nerve sheath", "Combine with hydrogen chloride to become hydrophilic", "Convert from cationic form to nonionized base", "Inactivate its lipophilic side chain"], "answer": 2, "explanation": "Correct: C. Convert from cationic form to nonionized base", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.196", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "In the conventional inferior alveolar nerve injection, local anesthetic is deposited:", "options": ["adjacent to the neck of the mandibular condyle.", "anterior to the mandibular lingula.", "lateral to the deep tendon of the temporalis.", "lateral to the pterygomandibular raphe"], "answer": 3, "explanation": "Correct: D. lateral to the pterygomandibular raphe", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.197", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The mandibular foramen in a child is generally located:", "options": ["anterior and medial to the mandibular lingula.", "more posteriorly than it is in adults.", "relatively lower on the mandible than it is in adults.", "slightly above the plane of occlusion."], "answer": 2, "explanation": "Correct: C. relatively lower on the mandible than it is", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.198", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which injection technique uses extraoral landmarks to guide anesthetic placement?", "options": ["Akinosi inferior alveolar nerve block", "Gow-gates inferior alveolar nerve block", "Mental nerve block", "Posterior-superior alveolar nerve block"], "answer": 1, "explanation": "Correct: B. Gow-gates inferior alveolar nerve block", "source": "QE Prep Course 2024", "domain": "Oral Surgery & Trauma", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.199", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which is true regarding anesthetic needles?", "options": ["Larger gauge needles are easier to aspirate through but are prone to deflection.", "Larger gauge needles are less likely to break but have been shown to cause more pain.", "Smaller gauge needles are harder to aspirate through and more likely to break.", "Smaller gauge needles are more likely to break and less likely to deflect."], "answer": 2, "explanation": "Correct: C. Smaller gauge needles are harder to aspirate through and more likely to break.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.200", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Lidocaine is primarily metabolized in the:", "options": ["kidneys.", "liver.", "local tissues.", "Plasma."], "answer": 1, "explanation": "Correct: B. Liver. Lidocaine (an amide local anesthetic) undergoes hepatic metabolism by cytochrome P450 enzymes (primarily CYP3A4). Liver disease significantly increases lidocaine toxicity risk.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.201", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Articaine differs from other amide local anesthetics in that it:", "options": ["contains a short amine group at its hydrophilic terminus.", "contains an additional benzene ring off its intermediate chain.", "contains an ester group at the lipophilic terminus.", "is metabolized primarily in the liver."], "answer": 2, "explanation": "Correct: C. contains an ester group at the lipophilic", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.202", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Methemoglobinemia can be induced by a metabolite of which injectable local anesthetic?", "options": ["Articaine", "Bupivacaine", "Lidocaine", "Prilocaine"], "answer": 3, "explanation": "Correct: D. Prilocaine", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.203", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Methemoglobinemia is treated by administration of:", "options": ["gentian violet.", "methylene blue.", "picric acid.", "surfactant."], "answer": 1, "explanation": "Correct: B. methylene blue.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.204", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "How many micrograms of epinephrine are found in a 1 mL solution of 2% local anesthetic with 1/100,000 parts epinephrine?", "options": ["10", "100", "1,000", "100,000"], "answer": 0, "explanation": "Correct: A. 10 mcg. 1:100,000 epi = 1 g per 100,000 mL = 0.01 mg/mL = 10 mcg/mL. One 1.8 mL dental cartridge of 2% lidocaine with 1:100,000 epi contains 18 mcg of epinephrine.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.205", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the maximum dosage of 4% articaine that a 22 kg patient can safely receive?", "options": ["2.2 mg", "96 mg", "154 mg", "308 mg"], "answer": 2, "explanation": "Correct: C. 154 mg. Maximum articaine dose = 7 mg/kg. For 22 kg: 7 × 22 = 154 mg. One cartridge of 4% articaine = 72 mg. So max = ~2.1 cartridges for this patient.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.206", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which product is inappropriate for management of a local anesthetic overdose?", "options": ["Balanced salt solution", "Lipid emulsion", "Phentolamine mesylate", "Oxygen"], "answer": 2, "explanation": "Correct: C. Phentolamine mesylate", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.207", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which local anesthetic is considered by the Food and Drug Administration to present the lowest risk to pregnant women and the unborn fetus?", "options": ["Articaine", "Bupivacaine", "Lidocaine", "Mepivicaine"], "answer": 2, "explanation": "Correct: C. Lidocaine", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.208", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following behavior guidance techniques is considered to be unconstructive?", "options": ["Deferred care", "Escape", "Rhetorical questions", "Voice control"], "answer": 2, "explanation": "Correct: C. Rhetorical questions", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Behavior Guidance", "source_page": "AAPD QE Prep Course 2024 — Q.209", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A commonly used behavior guidance technique that has only weak evidence to support its use is:", "options": ["distraction.", "hypnosis.", "positive pre-visit imagery.", "Tell-show-do."], "answer": 3, "explanation": "Correct: D. tell-show-do.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Behavior Guidance", "source_page": "AAPD QE Prep Course 2024 — Q.210", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the reversal agent for chloral hydrate?", "options": ["Epinephrine", "Flumazenil", "Naloxone", "None"], "answer": 3, "explanation": "Correct: D. None. Chloral hydrate has no specific reversal agent. There is no antagonist for chloral hydrate sedation. Management of overdose is supportive. This is a key fact distinguishing it from benzodiazepines (flumazenil) and opioids (naloxone).", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.211", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The Mallampati grading system was designed to:", "options": ["classify views obtained by direct laryngoscopy based on the structures seen.", "predict the degree of difficulty of direct laryngoscopy.", "record and communicate changes in tonsil size.", "record the ease or difficulty of orotracheal intubation."], "answer": 3, "explanation": "Correct: D. record the ease or difficulty of orotracheal intubation.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.212", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Hydroxyzine is a/an:", "options": ["antihistamine.", "barbiturate.", "benzodiazepine.", "narcotic."], "answer": 0, "explanation": "Correct: A. antihistamine.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AA
