locclusion (functional Class III) differs from a true skeletal Class III in that:", "options": ["It shows worsening cephalometric values", "The mandible shifts forward into crossbite but the teeth occlude edge-to-edge in centric relation", "It requires surgical correction", "It is not correctable in childhood"], "answer": 1, "explanation": "Pseudo (functional) Class III: teeth in crossbite in centric occlusion, but in centric relation they are edge-to-edge or Class I. The mandible shifts forward to avoid premature contact. True skeletal Class III shows anterior crossbite even in CR and poor skeletal values on cephalogram.", "domain": "Orthodontics & Occlusion", "source_page": "Class III Malocclusion", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which functional appliance is used for Class II treatment by positioning the mandible forward to stimulate mandibular growth?", "options": ["Nance appliance", "Twin Block appliance", "Rapid palatal expander", "Frankel appliance"], "answer": 1, "explanation": "The Twin Block appliance (Clark) is one of the most widely used functional appliances for Class II treatment. It advances the mandible by positioning the lower jaw forward via interlocking acrylic blocks, stimulating condylar growth and dentoalveolar changes.", "domain": "Orthodontics & Occlusion", "source_page": "Functional Appliances", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The timing of orthodontic treatment for Class III malocclusion with a maxillary deficiency in a growing child includes:", "options": ["Wait until skeletal maturity for all Class III cases", "Protraction headgear/facemask therapy in the early mixed dentition (ages 7–10)", "Fixed orthodontics only", "Mandibular setback surgery at age 10"], "answer": 1, "explanation": "Protraction facemask (face mask) therapy with a rapid palatal expander is most effective in the early mixed dentition (ages 7–10) when sutural resistance is low. It advances the maxilla and remodels sutures, correcting the skeletal discrepancy during growth.", "domain": "Orthodontics & Occlusion", "source_page": "Class III Treatment", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A midline diastema that persists after eruption of all permanent anterior teeth and canines is MOST likely caused by:", "options": ["Physiologic spacing (will self-correct)", "Abnormal frenum attachment, missing or small lateral incisors, habits, or midline supernumerary", "Normal ugly duckling stage", "Primary canine retention"], "answer": 1, "explanation": "Persistent midline diastema after canine eruption may result from: abnormal labial frenum (low attachment with blanching of papilla), congenitally missing/peg lateral incisors, midline supernumerary (mesiodens), oral habits, or other pathology. Evaluation and treatment of the cause is required.", "domain": "Growth & Development", "source_page": "Diastema", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The recommended age for evaluation of a permanent canine that has not erupted is:", "options": ["Age 15", "Age 13", "Age 10–11, as ectopic eruption can be detected radiographically and the primary canine extracted to redirect eruption", "Age 8"], "answer": 2, "explanation": "AAOF and AAPD recommend panoramic evaluation around age 10–11 for canine position. If an ectopic maxillary canine is detected early, extraction of the primary canine may redirect the permanent canine to a more normal eruption path in ~78% of cases (Ericson and Kurol).", "domain": "Growth & Development", "source_page": "Ectopic Canine", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Normal overjet in the permanent dentition is approximately:", "options": ["0 mm (edge-to-edge)", "1–3 mm", "4–6 mm", "7–10 mm"], "answer": 1, "explanation": "Normal overjet (horizontal overlap of upper incisors over lower) is 1–3 mm. Normal overbite (vertical overlap) is 2–3 mm or approximately 20–30% of the lower incisor crown height. Increased overjet (>4 mm) is a risk factor for traumatic injury to maxillary incisors.", "domain": "Growth & Development", "source_page": "Normal Occlusion Values", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which type of headgear is indicated for a Class II patient with a hyperdivergent (high-angle) facial pattern?", "options": ["Cervical-pull headgear", "High-pull (occipital-pull) headgear", "Straight-pull headgear", "Protraction facemask"], "answer": 1, "explanation": "High-pull headgear directs force superiorly and posteriorly, restraining maxillary growth and intruding the maxillary molars, making it preferred for high-angle (hyperdivergent) Class II patients where cervical-pull could increase the vertical dimension further.", "domain": "Orthodontics & Occlusion", "source_page": "Headgear", "source_doc": "ABPD Blueprint High-Yield"}];
const BLUEPRINT = {"Caries & Prevention": 0.15, "Growth & Development": 0.09, "Behavior Guidance": 0.09, "Restorative Dentistry": 0.1, "Pulp Therapy & Endodontics": 0.1, "Radiology": 0.08, "Oral Surgery & Trauma": 0.08, "Oral Pathology & Medicine": 0.08, "Pharmacology & Sedation": 0.08, "Orthodontics & Occlusion": 0.07, "Periodontics": 0.05, "Special Healthcare Needs": 0.05, "Research Methods & Biostatistics": 0.04, "Infection Control & Safety": 0.03};

const EMOJIS = ['👩‍⚕️','👨‍⚕️','🦷','🩺','📚','🎓','🧠','⭐','🔬','💊','🏆','🌟'];
const COLORS = ['#5b8af0','#7c6af5','#3ecf82','#f06060','#f5c842','#f07c3a','#42c8f5','#e05bf5','#50c8a0','#f5a742','#a0a0f5','#f57c9e'];
const DOMAIN_ORDER = Object.keys(BLUEPRINT);

// ── Storage helpers ────────────────────────────────────────────────────
const STORAGE_KEY = 'abpd_profiles_v2';
function loadProfiles() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}
function saveProfiles(profiles) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}
function getProfile(slot) {
  return loadProfiles()[slot] || null;
}
function putProfile(slot, data) {
  const profiles = loadProfiles();
  profiles[slot] = data;
  saveProfiles(profiles);
}
function newProfile(slot) {
  return {
    slot, name: '', emoji: EMOJIS[slot % EMOJIS.length],
    color: COLORS[slot % COLORS.length],
    wrongIds: [], bookmarkedIds: [], stats: {}, totalCorrect: 0, totalWrong: 0,
    sessions: 0, lastSeen: null
  };
}

// ── Session state (in-memory only, not persisted) ─────────────────────
let state = {
  mode: 'mcq', domain: 'all', queue: [], idx: 0,
  answered: false, correct: 0, wrong: 0, skipped: 0,
  sessionStats: {}, isDrilling: false, isBookmarkDrill: false, shuffle: true,
  activeSlot: null,
  wrongIds: new Set(), bookmarkedIds: new Set(),
};

// ── Profile Screen ─────────────────────────────────────────────────────
function renderProfileScreen() {
  const profiles = loadProfiles();
  const grid = document.getElementById('profile-grid');
  grid.innerHTML = '';
  for (let slot = 0; slot < 6; slot++) {
    const p = profiles[slot];
    const card = document.createElement('div');
    card.className = 'profile-card' + (p && p.name ? '' : ' empty');
    if (p && p.name) {
      const total = p.totalCorrect + p.totalWrong;
      const pct = total > 0 ? Math.round(p.totalCorrect / total * 100) : 0;
      card.innerHTML = `
        <div class="profile-avatar" style="background:${p.color}22">${p.emoji}</div>
        <div class="profile-name">${p.name}</div>
        <div class="profile-stats">${total > 0 ? pct+'% overall · '+total+' answered' : 'No questions yet'}${p.wrongIds.length > 0 ? '<br>'+p.wrongIds.length+' to review' : ''}${(p.bookmarkedIds||[]).length > 0 ? ' &nbsp;·&nbsp; 🔖 '+(p.bookmarkedIds||[]).length : ''}</div>
        <div class="profile-badge"></div>`;
      card.onclick = () => enterApp(slot);
    } else {
      card.innerHTML = `
        <div class="profile-avatar" style="background:var(--surface2);font-size:22px">+</div>
        <div class="profile-name" style="color:var(--muted)">Profile ${slot+1}</div>
        <div class="profile-stats" style="color:var(--muted)">Click to set up</div>`;
      card.onclick = () => openEditModal(slot, true);
    }
    grid.appendChild(card);
  }
}

// ── Modal ──────────────────────────────────────────────────────────────
let modalSlot = null, modalIsNew = false;
let selectedEmoji = '', selectedColor = '';

function openEditModal(slot, isNew) {
  modalSlot = slot;
  modalIsNew = isNew;
  const p = getProfile(slot) || newProfile(slot);
  selectedEmoji = p.emoji;
  selectedColor = p.color;

  document.getElementById('modal-title').textContent = isNew ? 'Create Profile '+(slot+1) : 'Edit Profile';
  document.getElementById('modal-name').value = p.name || '';
  document.getElementById('reset-btn').style.display = isNew ? 'none' : 'block';

  // Emoji picker
  const ep = document.getElementById('emoji-picker');
  ep.innerHTML = EMOJIS.map(e => `<div class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="pickEmoji('${e}',this)">${e}</div>`).join('');

  // Color picker
  const cp = document.getElementById('color-picker');
  cp.innerHTML = COLORS.map(c => `<div class="color-opt${c===selectedColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`).join('');

  document.getElementById('edit-modal').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 50);
}

function pickEmoji(e, el) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}
function pickColor(c, el) {
  selectedColor = c;
  document.querySelectorAll('.color-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}
function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
}
function saveProfile() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  const existing = getProfile(modalSlot) || newProfile(modalSlot);
  existing.name = name;
  existing.emoji = selectedEmoji;
  existing.color = selectedColor;
  putProfile(modalSlot, existing);
  closeModal();
  if (modalIsNew) {
    enterApp(modalSlot);
  } else {
    renderProfileScreen();
    updateProfilePill();
  }
}
function resetProfile() {
  if (!confirm('Reset all progress for this profile? This cannot be undone.')) return;
  const p = newProfile(modalSlot);
  p.name = document.getElementById('modal-name').value.trim() || 'Profile '+(modalSlot+1);
  p.emoji = selectedEmoji; p.color = selectedColor;
  putProfile(modalSlot, p);
  closeModal();
  renderProfileScreen();
}

// ── Enter App ──────────────────────────────────────────────────────────
function enterApp(slot) {
  const p = getProfile(slot);
  if (!p || !p.name) { openEditModal(slot, true); return; }
  state.activeSlot = slot;
  // Restore wrongIds and bookmarkedIds from profile
  state.wrongIds = new Set(p.wrongIds || []);
  state.bookmarkedIds = new Set(p.bookmarkedIds || []);
  state.correct = 0; state.wrong = 0; state.skipped = 0;
  state.sessionStats = {};
  // Update last seen
  p.lastSeen = new Date().toLocaleDateString();
  putProfile(slot, p);

  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateProfilePill();
  buildSidebar();
  updateWrongButton();
  updateBookmarkButton();
  selectDomain('all');
}

function switchProfile() {
  // Save session wrong IDs before leaving
  persistWrongIds();
  document.getElementById('app').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  renderProfileScreen();
  // Reset session
  state.correct = 0; state.wrong = 0; state.skipped = 0;
  updateChips();
}

function persistWrongIds() {
  if (state.activeSlot === null) return;
  const p = getProfile(state.activeSlot);
  if (!p) return;
  p.wrongIds = [...state.wrongIds];
  p.bookmarkedIds = [...state.bookmarkedIds];
  putProfile(state.activeSlot, p);
}

function updateProfilePill() {
  const p = getProfile(state.activeSlot);
  if (!p) return;
  document.getElementById('pill-avatar').textContent = p.emoji;
  document.getElementById('pill-avatar').style.background = p.color+'22';
  document.getElementById('pill-name').textContent = p.name;
}

// ── Sidebar ────────────────────────────────────────────────────────────
const domainCounts = {};
ALL_QUESTIONS.forEach(q => {
  const d = q.domain || q.category || 'Other';
  domainCounts[d] = (domainCounts[d]||0)+1;
});

function buildSidebar() {
  const list = document.getElementById('domain-list');
  list.innerHTML = '';
  DOMAIN_ORDER.forEach(domain => {
    const cnt = domainCounts[domain]||0;
    if (!cnt) return;
    const pct = Math.round((BLUEPRINT[domain]||0)*100);
    const btn = document.createElement('button');
    btn.className = 'domain-btn';
    btn.id = 'd-'+btoa(domain).replace(/=/g,'');
    btn.innerHTML = `<span class="d-name">${domain}<br><span class="d-weight">${pct}% of exam</span></span><span class="d-count">${cnt}</span>`;
    btn.onclick = () => selectDomain(domain);
    list.appendChild(btn);
  });
  document.getElementById('cnt-all').textContent = ALL_QUESTIONS.length;
}

function selectDomain(domain) {
  state.domain = domain; state.isDrilling = false;
  document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
  const id = domain==='all' ? 'd-all' : 'd-'+btoa(domain).replace(/=/g,'');
  const btn = document.getElementById(id);
  if (btn) btn.classList.add('active');
  document.getElementById('topbar-title').textContent = domain==='all' ? 'All Domains' : domain;
  renderStart();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById('mode-mcq').classList.toggle('active', mode==='mcq');
  document.getElementById('mode-recall').classList.toggle('active', mode==='recall');
  selectDomain(state.domain);
}

// ── Queue ──────────────────────────────────────────────────────────────
function buildQueue(domain, ids=null) {
  let pool = ids ? [...ids] : domain==='all'
    ? ALL_QUESTIONS.map((_,i)=>i)
    : ALL_QUESTIONS.map((q,i)=>(q.domain||q.category)===domain?i:-1).filter(i=>i>=0);
  if (state.shuffle) for (let i=pool.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool;
}

function startQuiz(domain) {
  state.queue=buildQueue(domain); state.idx=0;
  state.correct=0; state.wrong=0; state.skipped=0;
  state.answered=false; state.isDrilling=false; state.isBookmarkDrill=false; state.sessionStats={};
  updateChips(); renderQuestion();
}

function startDrillWrong() {
  if (!state.wrongIds.size) return;
  state.queue=buildQueue(null,[...state.wrongIds]); state.idx=0;
  state.correct=0; state.wrong=0; state.skipped=0;
  state.answered=false; state.isDrilling=true; state.isBookmarkDrill=false; state.sessionStats={};
  document.querySelectorAll('.domain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('wrong-drill-btn').classList.add('active');
  document.getElementById('topbar-title').textContent='🎯 Drilling Missed Questions';
  updateChips(); renderQuestion();
}

function startDrillBookmarked() {
  if (!state.bookmarkedIds.size) return;
  state.queue=buildQueue(null,[...state.bookmarkedIds]); state.idx=0;
  state.correct=0; state.wrong=0; state.skipped=0;
  state.answered=false; state.isDrilling=false; state.isBookmarkDrill=true; state.sessionStats={};
  document.querySelectorAll('.domain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('bookmark-drill-btn').classList.add('active');
  document.getElementById('topbar-title').textContent='🔖 Bookmarked Questions';
  updateChips(); renderQuestion();
}

function toggleBookmark(qIdx) {
  if (state.bookmarkedIds.has(qIdx)) { state.bookmarkedIds.delete(qIdx); }
  else { state.bookmarkedIds.add(qIdx); }
  const btn = document.getElementById('bookmark-btn');
  if (btn) {
    const saved = state.bookmarkedIds.has(qIdx);
    btn.className = 'bookmark-btn' + (saved ? ' bookmarked' : '');
    btn.textContent = saved ? '★ Saved' : '☆ Save';
  }
  updateBookmarkButton();
  persistWrongIds();
}

function updateBookmarkButton() {
  const btn = document.getElementById('bookmark-drill-btn');
  const cnt = document.getElementById('cnt-bookmarked');
  if (!btn) return;
  if (state.bookmarkedIds.size > 0) { btn.style.display='flex'; cnt.textContent=state.bookmarkedIds.size; }
  else { btn.style.display='none'; }
}

// ── Start Screen ───────────────────────────────────────────────────────
function renderStart() {
  const domain = state.domain;
  const allIds = domain==='all' ? ALL_QUESTIONS.map((_,i)=>i)
    : ALL_QUESTIONS.map((q,i)=>(q.domain||q.category)===domain?i:-1).filter(i=>i>=0);
  const count = allIds.length;
  const wrongInDomain = [...state.wrongIds].filter(i=>domain==='all'||(ALL_QUESTIONS[i].domain||ALL_QUESTIONS[i].category)===domain).length;
  const bookmarkedInDomain = [...state.bookmarkedIds].filter(i=>domain==='all'||(ALL_QUESTIONS[i].domain||ALL_QUESTIONS[i].category)===domain).length;
  const pct = domain!=='all' ? Math.round((BLUEPRINT[domain]||0)*100) : null;

  // Lifetime stats for this domain from saved profile
  const p = getProfile(state.activeSlot) || {};
  const saved = (p.stats||{})[domain==='all'?'__all__':domain]||{correct:0,wrong:0};
  const lifetimeTotal = saved.correct+saved.wrong;
  const lifetimePct = lifetimeTotal>0 ? Math.round(saved.correct/lifetimeTotal*100) : null;

  document.getElementById('quiz-area').innerHTML = `
    <div class="start-card">
      <h2>${domain==='all'?'All Domains':domain}</h2>
      <p>${pct?`<strong>${pct}% of the ABPD QE</strong> — `:''}${count} question${count!==1?'s':''} available. Use <strong>Free Recall</strong> mode to force active retrieval, or <strong>Multiple Choice</strong> to test recognition.</p>
      <div class="start-stats">
        <div class="start-stat"><div class="n">${count}</div><div class="l">Questions in set</div></div>
        <div class="start-stat"><div class="n" style="color:var(--red)">${wrongInDomain}</div><div class="l">Missed this session</div></div>
        <div class="start-stat"><div class="n">${lifetimePct!==null?lifetimePct+'%':'—'}</div><div class="l">Lifetime accuracy</div></div>
        <div class="start-stat"><div class="n">${lifetimeTotal||'—'}</div><div class="l">Lifetime answered</div></div>
      </div>
      <div class="shuffle-row">
        <label class="toggle-switch"><input type="checkbox" ${state.shuffle?'checked':''} onchange="state.shuffle=this.checked"><span class="toggle-slider"></span></label>
        <span class="toggle-label">Shuffle questions</span>
      </div>
      <div class="start-actions">
        <button class="nav-btn primary" onclick="startQuiz(state.domain)">Start Drilling</button>
        ${wrongInDomain>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${wrongInDomain} Missed ✗</button>`:''}
        ${bookmarkedInDomain>0?`<button class="nav-btn secondary" onclick="startDrillBookmarked()" style="color:var(--yellow);border-color:var(--yellow)">🔖 Review ${bookmarkedInDomain} Saved</button>`:''}
      </div>
    </div>`;
}

// ── Question Rendering ─────────────────────────────────────────────────
function renderQuestion() {
  const area = document.getElementById('quiz-area');
  if (state.idx >= state.queue.length) { renderResults(); return; }
  const qIdx = state.queue[state.idx];
  const q = ALL_QUESTIONS[qIdx];
  const domain = q.domain||q.category||'';
  const total = state.queue.length;
  const pct = Math.round(state.idx/total*100);
  const labels=['A','B','C','D','E'];

  let answerHtml = state.mode==='mcq'
    ? `<div class="options-grid">${q.options.map((opt,i)=>`<button class="option-btn" id="opt-${i}" onclick="selectAnswer(${i},${qIdx})"><span class="option-label">${labels[i]}</span><span>${opt}</span></button>`).join('')}</div>`
    : `<div class="recall-area"><textarea class="recall-textarea" id="recall-input" placeholder="Type what you recall — key facts, mechanism, numbers..."></textarea><button class="recall-reveal-btn" id="reveal-btn" onclick="revealAnswer(${qIdx})">Reveal Answer</button></div>`;

  area.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-meta"><span>${state.isBookmarkDrill?'🔖 Bookmarked':state.isDrilling?'🎯 Drilling missed':domain}</span><span>${state.idx+1} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-meta"><span class="q-tag domain-tag">${domain}</span><span class="q-tag">Q ${state.idx+1}</span><button class="bookmark-btn${state.bookmarkedIds.has(qIdx)?' bookmarked':''}" id="bookmark-btn" onclick="toggleBookmark(${qIdx})">${state.bookmarkedIds.has(qIdx)?'★ Saved':'☆ Save'}</button></div>
      <div class="question-text">${q.q}</div>
      ${answerHtml}
      <div class="explanation-box" id="exp-box"><div class="exp-label">Explanation</div><div id="exp-text"></div><div id="exp-ref" style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:none">📄 <span id="exp-ref-text"></span></div></div>
    </div>
    <div class="nav-row">
      <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()" style="display:none">Next →</button>
      <span class="skip-link" onclick="skipQuestion()">Skip</span>
    </div>`;
  state.answered=false;
}

// ── MCQ ────────────────────────────────────────────────────────────────
function selectAnswer(selectedIdx, qIdx) {
  if (state.answered) return;
  state.answered=true;
  const q=ALL_QUESTIONS[qIdx]; const correct=q.answer;
  document.querySelectorAll('.option-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct) btn.classList.add('correct');
    if(i===selectedIdx&&i!==correct) btn.classList.add('wrong');
  });
  const domain=q.domain||q.category||'';
  if(!state.sessionStats[domain]) state.sessionStats[domain]={correct:0,wrong:0};
  if(selectedIdx===correct) {
    state.correct++; state.sessionStats[domain].correct++;
    state.wrongIds.delete(qIdx);
  } else {
    state.wrong++; state.sessionStats[domain].wrong++;
    state.wrongIds.add(qIdx); updateWrongButton();
  }
  persistProgress(domain, selectedIdx===correct);
  showExplanation(q.explanation, q.source_page, q.source_doc);
  updateChips();
  document.getElementById('next-btn').style.display='block';
}

// ── Free Recall ────────────────────────────────────────────────────────
function revealAnswer(qIdx) {
  if(state.answered) return;
  state.answered=true;
  const q=ALL_QUESTIONS[qIdx];
  document.getElementById('reveal-btn').disabled=true;
  document.getElementById('exp-box').classList.add('show');
  document.getElementById('exp-text').innerHTML=`<strong style="color:var(--green)">✓ ${q.options[q.answer]}</strong><br><br>${q.explanation}`;
  showSourceRef(q.source_page, q.source_doc);
  const sg=document.createElement('div');
  sg.className='self-grade show'; sg.id='self-grade';
  sg.innerHTML=`<button class="grade-btn got-it" onclick="gradeRecall(true,${qIdx})">Got it ✓</button><button class="grade-btn missed" onclick="gradeRecall(false,${qIdx})">Missed it ✗</button>`;
  document.querySelector('.recall-area').appendChild(sg);
}

function gradeRecall(gotIt, qIdx) {
  const q=ALL_QUESTIONS[qIdx]; const domain=q.domain||q.category||'';
  if(!state.sessionStats[domain]) state.sessionStats[domain]={correct:0,wrong:0};
  document.querySelectorAll('.grade-btn').forEach(b=>b.disabled=true);
  if(gotIt) {
    state.correct++; state.sessionStats[domain].correct++;
    state.wrongIds.delete(qIdx);
    document.querySelector('.grade-btn.got-it').style.background='rgba(62,207,130,.25)';
  } else {
    state.wrong++; state.sessionStats[domain].wrong++;
    state.wrongIds.add(qIdx); updateWrongButton();
    document.querySelector('.grade-btn.missed').style.background='rgba(240,96,96,.25)';
  }
  persistProgress(domain, gotIt);
  updateChips();
  document.getElementById('next-btn').style.display='block';
}

// ── Persist progress to profile ────────────────────────────────────────
function persistProgress(domain, wasCorrect) {
  if(state.activeSlot===null) return;
  const p=getProfile(state.activeSlot);
  if(!p) return;
  if(!p.stats) p.stats={};
  if(!p.stats[domain]) p.stats[domain]={correct:0,wrong:0};
  if(!p.stats['__all__']) p.stats['__all__']={correct:0,wrong:0};
  if(wasCorrect) {
    p.stats[domain].correct++; p.stats['__all__'].correct++;
    p.totalCorrect=(p.totalCorrect||0)+1;
  } else {
    p.stats[domain].wrong++; p.stats['__all__'].wrong++;
    p.totalWrong=(p.totalWrong||0)+1;
  }
  p.wrongIds=[...state.wrongIds];
  p.bookmarkedIds=[...state.bookmarkedIds];
  putProfile(state.activeSlot, p);
}

function showExplanation(text, sourcePage, sourceDoc) {
  const box=document.getElementById('exp-box');
  box.classList.add('show');
  document.getElementById('exp-text').textContent=text;
  showSourceRef(sourcePage, sourceDoc);
}

function showSourceRef(sourcePage, sourceDoc) {
  const refEl=document.getElementById('exp-ref');
  const refText=document.getElementById('exp-ref-text');
  if(!refEl) return;
  if(sourcePage||sourceDoc) {
    const parts=[];
    if(sourcePage) parts.push('<strong>'+sourcePage+'</strong>');
    if(sourceDoc) parts.push(sourceDoc);
    refText.innerHTML=parts.join(' &nbsp;&middot;&nbsp; ');
    refEl.style.display='block';
  } else { refEl.style.display='none'; }
}

function nextQuestion() { state.idx++; renderQuestion(); }
function skipQuestion() { state.skipped++; state.idx++; renderQuestion(); }
function updateChips() {
  document.getElementById('chip-correct').textContent='✓ '+state.correct;
  document.getElementById('chip-wrong').textContent='✗ '+state.wrong;
}
function updateWrongButton() {
  const btn=document.getElementById('wrong-drill-btn');
  const cnt=document.getElementById('cnt-wrong');
  if(state.wrongIds.size>0){btn.style.display='flex';cnt.textContent=state.wrongIds.size;}
  updateBookmarkButton();
}

// ── Results ────────────────────────────────────────────────────────────
function renderResults() {
  const total=state.correct+state.wrong;
  const pct=total>0?Math.round(state.correct/total*100):0;
  let rows='';
  Object.entries(state.sessionStats).sort((a,b)=>b[1].correct+b[1].wrong-a[1].correct-a[1].wrong).forEach(([d,s])=>{
    const t=s.correct+s.wrong; const p=t>0?Math.round(s.correct/t*100):0;
    const color=p>=80?'var(--green)':p>=60?'var(--yellow)':'var(--red)';
    rows+=`<tr><td>${d}</td><td style="text-align:right;font-weight:700;color:${color}">${p}%</td><td style="text-align:right;color:var(--muted);font-size:12px">${s.correct}/${t}</td></tr>`;
  });
  document.getElementById('quiz-area').innerHTML=`
    <div class="results-card">
      <div class="results-score"><span class="pct">${pct}%</span></div>
      <div class="results-sub">Session complete · ${total+state.skipped} attempted</div>
      <div class="results-grid">
        <div class="stat-box"><div class="stat-num g">${state.correct}</div><div class="stat-label">Correct</div></div>
        <div class="stat-box"><div class="stat-num r">${state.wrong}</div><div class="stat-label">Missed</div></div>
        <div class="stat-box"><div class="stat-num y">${state.skipped}</div><div class="stat-label">Skipped</div></div>
      </div>
      ${rows?`<div class="domain-breakdown"><table>${rows}</table></div>`:''}
      <div class="results-actions">
        <button class="nav-btn primary" onclick="startQuiz(state.domain)">Restart</button>
        ${state.wrongIds.size>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${state.wrongIds.size} Missed ✗</button>`:''}
        ${state.bookmarkedIds.size>0?`<button class="nav-btn secondary" onclick="startDrillBookmarked()" style="color:var(--yellow);border-color:var(--yellow)">🔖 Review ${state.bookmarkedIds.size} Saved</button>`:''}
        <button class="nav-btn secondary" onclick="selectDomain('all')">All Domains</button>
      </div>
    </div>`;
}

// ── Progress Panel ─────────────────────────────────────────────────────
function showStatsPanel() {
  const p=getProfile(state.activeSlot)||{};
  const stats=p.stats||{};
  const allStat=stats['__all__']||{correct:0,wrong:0};
  const allTotal=allStat.correct+allStat.wrong;
  const allPct=allTotal>0?Math.round(allStat.correct/allTotal*100):0;
  let rows='';
  DOMAIN_ORDER.forEach(domain=>{
    const s=stats[domain]||{correct:0,wrong:0};
    const t=s.correct+s.wrong;
    if(!t) return;
    const pct=Math.round(s.correct/t*100);
    const color=pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';
    const exam=Math.round((BLUEPRINT[domain]||0)*100);
    rows+=`<div class="domain-stat-row">
      <span class="dsn">${domain}<br><span style="font-size:11px;color:var(--muted)">${exam}% of exam</span></span>
      <div class="ds-bar-wrap"><div class="ds-bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="dsp" style="color:${color}">${pct}%</span>
      <span class="ds-count">${s.correct}/${t}</span>
    </div>`;
  });

  document.getElementById('quiz-area').innerHTML=`
    <div class="stats-card">
      <h3>${p.emoji||''} ${p.name||'My Progress'}</h3>
      <div class="results-grid" style="margin-bottom:20px">
        <div class="stat-box"><div class="stat-num">${allPct}%</div><div class="stat-label">Overall accuracy</div></div>
        <div class="stat-box"><div class="stat-num g">${allStat.correct}</div><div class="stat-label">All-time correct</div></div>
        <div class="stat-box"><div class="stat-num r">${state.wrongIds.size}</div><div class="stat-label">In review queue</div></div>
        <div class="stat-box"><div class="stat-num" style="color:var(--yellow)">${state.bookmarkedIds.size}</div><div class="stat-label">Bookmarked</div></div>
      </div>
      ${rows||'<p style="color:var(--muted);text-align:center;padding:20px">No history yet — start drilling!</p>'}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="nav-btn primary" onclick="selectDomain('all')">Start Drilling</button>
      ${state.wrongIds.size>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${state.wrongIds.size} Missed ✗</button>`:''}
      ${state.bookmarkedIds.size>0?`<button class="nav-btn secondary" onclick="startDrillBookmarked()" style="color:var(--yellow);border-color:var(--yellow)">🔖 Review ${state.bookmarkedIds.size} Saved</button>`:''}
      <button class="nav-btn secondary" onclick="openEditModal(${state.activeSlot},false)">Edit Profile</button>
    </div>`;
  document.querySelectorAll('.domain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('topbar-title').textContent='📊 My Progress';
}

// ── Init ───────────────────────────────────────────────────────────────
renderProfileScreen();
</script>
</body>
</html>
