w of the entire dentition, developing teeth, jaw structure, TMJs, and sinuses. It is especially useful for assessing the mixed dentition, impacted teeth, and jaw pathology.", "domain": "Radiology", "source_page": "Radiograph Selection", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Internal root resorption on a radiograph appears as:", "options": ["Radiolucency external to the root outline", "Uniform radiolucent ballooning of the root canal with smooth borders", "Irregular external root surface with moth-eaten appearance", "Increased radiodensity around the root"], "answer": 1, "explanation": "Internal root resorption appears as a smooth, uniform radiolucent enlargement of the root canal that balloons outward symmetrically. External resorption shows irregular loss of the external root surface. Internal resorption originates from within the pulp space.", "domain": "Radiology", "source_page": "Root Resorption", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Condensing osteitis on a radiograph appears as:", "options": ["Radiolucent halo around the root apex", "Diffuse radiopaque area around the root apex, usually associated with a low-grade infection", "Well-defined radiolucency with corticated border", "Mixed radiolucent-radiopaque lesion"], "answer": 1, "explanation": "Condensing osteitis (focal sclerosing osteomyelitis) appears as a diffuse radiopaque area at the root apex, usually associated with a low-grade pulpal infection. It is a localized bony reaction (increased trabeculation) to chronic inflammation.", "domain": "Radiology", "source_page": "Periapical Pathology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A dentigerous (follicular) cyst radiographically appears as:", "options": ["Periapical radiolucency around a vital tooth", "Well-defined radiolucency surrounding the crown of an unerupted tooth at the CEJ", "Multilocular radiolucency between roots", "Radiopaque lesion with radiolucent rim"], "answer": 1, "explanation": "A dentigerous cyst is the most common odontogenic cyst associated with an unerupted tooth. It appears as a well-defined, unilocular radiolucency surrounding the crown of an unerupted tooth, attached at the CEJ.", "domain": "Caries & Prevention", "source_page": "Jaw Lesions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The incisive foramen on a maxillary periapical radiograph appears as:", "options": ["Radiopaque mass between central incisors", "Normal radiolucent oval between the roots of maxillary central incisors", "Bilateral radiolucencies at premolar apices", "Dense cortical bone overlying the midline"], "answer": 1, "explanation": "The incisive foramen is a normal anatomical radiolucency located at the midline between the roots of the maxillary central incisors. It can be mistaken for a periapical lesion but it is a normal landmark.", "domain": "Radiology", "source_page": "Normal Radiographic Anatomy", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The mental foramen on a mandibular periapical radiograph is typically located:", "options": ["At the apex of the mandibular first premolar", "At or between the apices of the mandibular first and second premolars", "At the apex of the mandibular canine", "Below the mandibular first molar"], "answer": 1, "explanation": "The mental foramen appears as a round or oval radiolucency typically at the apex or between the apices of the mandibular first and second premolars. It can be mistaken for a periapical pathology if not recognized as a normal anatomical structure.", "domain": "Radiology", "source_page": "Normal Radiographic Anatomy", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A periapical cemental dysplasia (PCD) in its early stage appears as:", "options": ["Radiopaque mass at the apex of a vital tooth", "Periapical radiolucency associated with a vital tooth — mimicking periapical pathology", "Mixed radiolucent-radiopaque lesion", "Resorption of the root apex"], "answer": 1, "explanation": "Early PCD appears as a radiolucency at the apex of a vital tooth and can mimic periapical pathology. Later stages develop a mixed appearance and eventually a dense radiopaque mass with a thin radiolucent rim. Vitality testing is key.", "domain": "Oral Pathology & Medicine", "source_page": "Periapical Pathology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which radiographic sign is MOST consistent with a diagnosis of an odontogenic keratocyst (OKC)?", "options": ["Dense radiopaque lesion with radiolucent rim", "Large multilocular or unilocular radiolucency with smooth scalloped borders, often with a high recurrence rate", "Periapical radiolucency on a non-vital tooth", "Diffuse radiopaque area at root apex"], "answer": 1, "explanation": "OKC (keratocystic odontogenic tumor) typically presents as a large radiolucency, often with scalloped or scalloped borders, can be multilocular, and has a high recurrence rate (up to 60%) due to its aggressive epithelial lining. Associated with Gorlin-Goltz syndrome.", "domain": "Oral Pathology & Medicine", "source_page": "Jaw Lesions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Horizontal bone loss on a radiograph suggests:", "options": ["Localized aggressive periodontitis", "Generalized chronic periodontitis with uniform bone loss", "Periapical abscess", "Periapical cemental dysplasia"], "answer": 1, "explanation": "Horizontal bone loss (even, parallel bone loss across multiple teeth) is characteristic of generalized chronic periodontitis. Vertical (angular) bone loss suggests localized defects, often associated with aggressive periodontitis or furcation involvement.", "domain": "Radiology", "source_page": "Periodontal Radiology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A ghost image on a panoramic radiograph is:", "options": ["An artifact caused by patient movement", "A blurred, magnified image of a structure on the opposite side projected superimposed on the image", "A double exposure artifact", "Film processing error"], "answer": 1, "explanation": "Ghost images on panoramic radiographs occur when a radio-opaque structure (e.g., earring, spine, ramus) on one side of the patient is projected as a blurred, enlarged shadow on the opposite side. They appear higher and more blurred than the real image.", "domain": "Radiology", "source_page": "Panoramic Errors", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most radiosensitive tissues in the head and neck region relevant to dental radiography are:", "options": ["Brain and spinal cord", "Thyroid gland and lens of the eye", "Parotid gland and mandible", "Teeth and alveolar bone"], "answer": 1, "explanation": "The thyroid gland and lens of the eye are among the most radiosensitive tissues in the head and neck. This is why thyroid collars are recommended during dental radiography, particularly for children whose thyroids are more susceptible.", "domain": "Caries & Prevention", "source_page": "Radiation Safety", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Cone beam CT (CBCT) in pediatric dentistry is indicated for:", "options": ["Routine caries detection", "Assessment of impacted teeth, complex trauma, and cleft palate evaluation", "Replacing bitewing radiographs", "Annual recall examinations"], "answer": 1, "explanation": "CBCT is indicated for complex cases where conventional 2D imaging is insufficient: assessment of impacted/supernumerary teeth, complex dentoalveolar trauma, cleft palate, TMJ evaluation, and airway assessment. It delivers higher dose than conventional radiographs and should follow ALARA.", "domain": "Radiology", "source_page": "CBCT Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which radiograph is MOST useful for assessing a suspected mandibular fracture in a child?", "options": ["Bitewing", "Periapical", "Panoramic radiograph", "Lateral cephalogram"], "answer": 2, "explanation": "A panoramic radiograph provides the best single overview for assessing mandibular fractures in children, showing the entire mandible including the condyles, body, and symphysis. CBCT may be used for complex fractures.", "domain": "Radiology", "source_page": "Trauma Radiology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A radiolucent lesion between the roots of a primary molar most likely represents:", "options": ["Normal nutrient canal", "Furcation involvement from pulp pathology", "Lateral periodontal cyst", "External root resorption"], "answer": 1, "explanation": "A radiolucent lesion in the furcation area of a primary molar strongly suggests furcation involvement from pulp pathology (necrosis, abscess). The pulp canals of primary molars communicate with the furcation via accessory canals, making this area vulnerable.", "domain": "Periodontics", "source_page": "Primary Tooth Pathology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which of the following BEST describes the radiographic appearance of ameloblastoma?", "options": ["Unilocular radiolucency at a tooth apex", "Multilocular 'soap bubble' radiolucency often crossing the midline", "Dense radiopaque mass", "Periapical radiolucency with widened PDL"], "answer": 1, "explanation": "Ameloblastoma classically appears as a multilocular 'soap bubble' or 'honeycomb' radiolucency, most commonly in the mandibular molar/ramus area. It is locally aggressive with a high recurrence rate if incompletely removed.", "domain": "Oral Pathology & Medicine", "source_page": "Jaw Lesions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A 'ground glass' radiographic pattern of the bone is MOST characteristic of:", "options": ["Osteoporosis", "Fibrous dysplasia", "Paget's disease", "Multiple myeloma"], "answer": 1, "explanation": "Fibrous dysplasia produces a characteristic 'ground glass' or 'orange peel' radiographic appearance due to replacement of normal bone with fibrous tissue containing woven bone trabeculae. It causes expansion and facial asymmetry.", "domain": "Oral Pathology & Medicine", "source_page": "Jaw Lesions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A 'sun ray' or 'sunburst' pattern of bone destruction on radiograph is MOST consistent with:", "options": ["Fibrous dysplasia", "Osteosarcoma", "Ameloblastoma", "Dentigerous cyst"], "answer": 1, "explanation": "A 'sunburst' or 'sun ray' pattern of periosteal new bone formation radiating outward from a central lesion is characteristic of osteosarcoma. This pattern indicates aggressive bone-forming malignancy and requires immediate referral.", "domain": "Radiology", "source_page": "Jaw Lesions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The effective dose from a full-mouth series (FMX) of periapical radiographs using digital sensors is approximately:", "options": ["Less than 1 μSv", "17–35 μSv", "100–150 μSv", "1000 μSv"], "answer": 1, "explanation": "A full-mouth series with digital sensors delivers approximately 17–35 μSv effective dose. Background radiation in the U.S. is approximately 3000 μSv/year. A panoramic delivers approximately 3–24 μSv; CBCT delivers approximately 30–500+ μSv depending on field of view.", "domain": "Radiology", "source_page": "Radiation Dosimetry", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which finding on a periapical radiograph of a primary incisor after trauma would indicate pulp necrosis?", "options": ["Widened pulp chamber", "Narrowing of the root canal", "Periapical or lateral radiolucency", "Increased radiodensity of the root"], "answer": 2, "explanation": "A periapical or lateral radiolucency developing after trauma to a primary incisor indicates pulp necrosis with periapical pathology. Other signs include pathologic root resorption and cessation of normal physiologic root resorption. Pulp canal obliteration (calcification) can follow trauma but does not always indicate necrosis.", "domain": "Radiology", "source_page": "Trauma Radiology", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which of the following represents an image receptor with the HIGHEST spatial resolution?", "options": ["PSP (photostimulable phosphor) plate", "Direct digital (CCD/CMOS) sensor", "F-speed conventional film", "Panoramic cassette with rare-earth screen"], "answer": 2, "explanation": "Conventional F-speed film has the highest spatial resolution of all dental image receptors. However, digital systems offer processing advantages, dose reduction, and immediate image availability. Direct digital sensors have higher resolution than PSP plates.", "domain": "Radiology", "source_page": "Digital Radiography", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which criterion distinguishes a primary tooth needing pulpotomy from one needing pulpectomy?", "options": ["Presence of pain to percussion", "Vital, hemorrhage-controllable coronal pulp with healthy radicular pulp", "Non-vital pulp with periapical pathology", "Extent of caries to the DEJ"], "answer": 1, "explanation": "Pulpotomy is indicated when the coronal pulp is vital and hemorrhage can be controlled within 4 minutes, with radiographically and clinically normal radicular pulp. Pulpectomy is indicated when radicular pulp is non-vital, infected, or cannot be controlled.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulp Therapy Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The current AAPD-preferred material for pulpotomy in primary teeth is:", "options": ["Formocresol", "Ferric sulfate", "Mineral trioxide aggregate (MTA) or Biodentine", "Calcium hydroxide"], "answer": 2, "explanation": "MTA and Biodentine (tricalcium silicate cements) are now preferred by AAPD for vital pulpotomy in primary teeth based on superior clinical and radiographic success rates. Formocresol historically was the standard; ferric sulfate is a hemostatic agent used with other materials.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulpotomy Materials", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Formocresol pulpotomy success rate in primary teeth is approximately:", "options": ["50%", "70%", "90%", "99%"], "answer": 2, "explanation": "Formocresol pulpotomy historically shows approximately 90% clinical success in primary teeth, though concerns about formaldehyde's potential carcinogenicity have led to preference for MTA-based alternatives in current practice.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulpotomy Materials", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Indirect pulp capping (IPC) is indicated when:", "options": ["The pulp is exposed", "Deep caries is present but the pulp is NOT exposed and tooth is vital", "The tooth shows signs of irreversible pulpitis", "Periapical pathology is present"], "answer": 1, "explanation": "Indirect pulp capping is indicated for deep caries near (but not exposing) the pulp in a vital, asymptomatic tooth. Remaining carious dentin is covered with a biocompatible liner (MTA, Biodentine, calcium hydroxide) to allow tertiary dentin formation.", "domain": "Caries & Prevention", "source_page": "Pulp Therapy Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The primary goal of pulpectomy in a primary tooth is:", "options": ["Preserve the primary tooth until natural exfoliation without harm to the permanent successor", "Achieve complete canal obturation identical to permanent teeth", "Prevent spread of infection to adjacent primary teeth only", "Remove all root canal contents and seal with gutta-percha"], "answer": 0, "explanation": "The goal of primary tooth pulpectomy is to maintain the primary tooth in a healthy state until natural exfoliation, prevent spread of infection, and avoid harm to the developing permanent tooth. Resorbable materials (ZOE, Vitapex) must be used so the primary tooth can exfoliate normally.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulpectomy Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The obturating material of choice for primary tooth pulpectomy is:", "options": ["Gutta-percha", "Zinc oxide eugenol (ZOE) paste or calcium hydroxide/iodoform paste (Vitapex)", "Glass ionomer cement", "MTA"], "answer": 1, "explanation": "Resorbable pastes (ZOE, Vitapex) are used for primary tooth pulpectomy because they resorb at a rate similar to the primary root, allowing normal exfoliation and successor eruption. Non-resorbable gutta-percha is contraindicated in primary teeth.", "domain": "Restorative Dentistry", "source_page": "Pulpectomy Materials", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which radiographic finding is an absolute contraindication to pulpotomy in a primary tooth?", "options": ["Slight widening of the PDL space", "Furcation or periapical radiolucency", "Small physiologic resorption of root apex", "Pulp chamber calcification without symptoms"], "answer": 1, "explanation": "Furcation or periapical radiolucency indicates existing infection beyond the pulp and is an absolute contraindication to pulpotomy. In these cases, pulpectomy or extraction is indicated.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulp Therapy Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Apexogenesis refers to:", "options": ["Vital pulp therapy to allow continued root development in a young permanent tooth", "Formation of an artificial apical barrier in a necrotic immature permanent tooth", "Surgical amputation of the root apex", "Obturation of a completed root canal"], "answer": 0, "explanation": "Apexogenesis is vital pulp therapy (partial pulpotomy, Cvek pulpotomy) in an immature permanent tooth that allows continued physiologic root development and apex closure. The pulp must be vital. MTA or Biodentine is placed over the remaining pulp.", "domain": "Pulp Therapy & Endodontics", "source_page": "Immature Permanent Teeth", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Apexification is indicated when:", "options": ["The pulp is vital in an immature permanent tooth", "The pulp is necrotic in an immature permanent tooth with an open apex", "Root development is complete but the apex is not sealed", "Pulpotomy has failed"], "answer": 1, "explanation": "Apexification creates an apical barrier in a non-vital immature permanent tooth with an open apex. Traditional Ca(OH)2 apexification takes 6–24 months; MTA apical plug ('one-visit apexification') creates an immediate barrier, followed by GP obturation.", "domain": "Pulp Therapy & Endodontics", "source_page": "Immature Permanent Teeth", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Regenerative endodontics (revascularization) for a necrotic immature permanent tooth aims to:", "options": ["Seal the apex with MTA only", "Induce continued root development by utilizing stem cells from the apical papilla", "Replace the pulp with synthetic material", "Create a periapical barrier using calcium hydroxide"], "answer": 1, "explanation": "Regenerative endodontics (revascularization/pulp regeneration) aims to eliminate infection and stimulate stem cells from the apical papilla to regenerate pulp-like tissue, potentially allowing continued root development. Blood clot or platelet-rich plasma scaffold is used after disinfection.", "domain": "Growth & Development", "source_page": "Regenerative Endodontics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A Cvek (partial) pulpotomy is indicated for:", "options": ["Primary teeth with deep caries", "Permanent teeth with a traumatic small pulp exposure in a young vital tooth", "Non-vital permanent teeth", "Primary molars with furcation pathology"], "answer": 1, "explanation": "The Cvek pulpotomy (shallow/partial pulpotomy) removes 2–3 mm of inflamed coronal pulp tissue at a traumatically exposed site in a vital immature permanent tooth, preserves healthy radicular pulp for continued root development, and is covered with MTA.", "domain": "Pulp Therapy & Endodontics", "source_page": "Trauma Endodontics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which finding on a permanent incisor after trauma suggests pulp canal obliteration (calcification)?", "options": ["Periapical radiolucency", "Progressive narrowing or disappearance of the pulp canal on radiograph", "Widening of the PDL space", "Internal root resorption"], "answer": 1, "explanation": "Pulp canal obliteration (dystrophic calcification) after trauma appears as progressive narrowing and eventual disappearance of the root canal space on serial radiographs. The tooth may turn yellow. While the pulp may still be vital, it can eventually necrose and requires monitoring.", "domain": "Radiology", "source_page": "Trauma Complications", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The working length for a primary molar pulpectomy should be:", "options": ["To the radiographic apex", "1–2 mm short of the radiographic root apex", "To the apical foramen", "Based on electronic apex locator only"], "answer": 1, "explanation": "Working length for primary tooth pulpectomy should be 1–2 mm short of the radiographic apex to avoid disrupting the developing permanent tooth bud below. Instrumentation to the apex risks damaging the successor.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulpectomy Technique", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which irrigant is recommended for root canal debridement in primary teeth?", "options": ["3–5.25% sodium hypochlorite", "35% phosphoric acid", "Chlorhexidine only", "Hydrogen peroxide only"], "answer": 0, "explanation": "Sodium hypochlorite (NaOCl) 1–3% is the preferred irrigant for primary tooth pulpectomy, providing antimicrobial action and tissue dissolution. Concentrations should be lower in primary teeth than in permanent teeth to reduce risk of periapical damage.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulpectomy Technique", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Mineral trioxide aggregate (MTA) sets in the presence of:", "options": ["Dry conditions only", "Moisture (water)", "Phosphoric acid", "EDTA solution"], "answer": 1, "explanation": "MTA requires moisture to set via hydration. It produces calcium hydroxide during setting, creating an alkaline environment that promotes hard tissue formation. Its biocompatibility and sealing ability make it the material of choice for pulp capping, apexification, and pulpotomy.", "domain": "Pulp Therapy & Endodontics", "source_page": "Pulp Therapy Materials", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most common indication for stainless steel crown (SSC) in a primary tooth is:", "options": ["Class II caries in a primary molar", "Following pulpotomy/pulpectomy of a primary molar", "Small Class I caries", "Hypersensitivity of primary teeth"], "answer": 1, "explanation": "SSC is indicated following pulpotomy/pulpectomy in primary molars, for multi-surface caries, teeth with structural defects (amelogenesis/dentinogenesis imperfecta), and when other restorations have failed. They have the highest success rate among primary molar restorations.", "domain": "Orthodontics & Occlusion", "source_page": "Primary Tooth Restorations", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The Hall Technique for SSC placement differs from traditional SSC placement in that:", "options": ["It requires complete caries removal before cementation", "The crown is seated over the caries without caries removal or tooth preparation", "Local anesthesia is always required", "It uses composite-based cements only"], "answer": 1, "explanation": "The Hall Technique cements an SSC over the primary molar without caries removal or tooth preparation (no drilling). It seals caries from the oral environment, causing bacterial stasis. Studies show equivalent or superior outcomes to traditional SSC placement, with less child anxiety.", "domain": "Restorative Dentistry", "source_page": "Hall Technique", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Glass ionomer cement (GIC) used for restoration in primary teeth has which key advantage?", "options": ["Highest compressive strength of all restorative materials", "Fluoride release and chemical bond to tooth structure", "Superior esthetics to composite", "Does not require any cavity preparation"], "answer": 1, "explanation": "GIC releases fluoride (ongoing fluoride reservoir), has a chemical (ionic) bond to enamel and dentin without etching, is biocompatible, and is cariostatic. It is ideal for high-risk patients, primary teeth, and interim restorations. Its main disadvantage is lower strength than composite or amalgam.", "domain": "Restorative Dentistry", "source_page": "Dental Materials", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The CAMBRA (Caries Management by Risk Assessment) approach recommends which restorative material for a high-caries-risk young child?", "options": ["Composite resin", "Amalgam", "Silver diamine fluoride (SDF) and/or glass ionomer cement", "Porcelain"], "answer": 2, "explanation": "For high-risk caries management in young children, SDF (to arrest caries) and GIC (for interim therapeutic restorations/ITR) are recommended in the CAMBRA model. SDF arrests caries chemically; GIC provides fluoride release and can serve as an interim or final restoration.", "domain": "Restorative Dentistry", "source_page": "Caries Management", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Silver diamine fluoride (SDF) arrests caries by:", "options": ["Etching enamel to promote remineralization", "Silver ions killing bacteria and fluoride promoting remineralization and hardening carious dentin", "Releasing chlorhexidine to reduce biofilm", "Forming a resin seal over the lesion"], "answer": 1, "explanation": "SDF (38% concentration) arrests caries through dual action: silver ions are antimicrobial (kill cariogenic bacteria) and inhibit matrix metalloproteinases; fluoride promotes remineralization and hardens carious dentin. Major side effect: permanent black staining of treated carious lesions.", "domain": "Restorative Dentistry", "source_page": "SDF", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which matrix system is preferred for Class II composite restorations in primary molars?", "options": ["Tofflemire matrix band", "Sectional matrix system (Palodent, Contact Matrix)", "Copper band", "No matrix needed for posterior composites"], "answer": 1, "explanation": "Sectional matrix systems (e.g., Palodent) with curved bands and separation rings are preferred for Class II composites in primary molars because they better recreate proximal contact and contour compared to circumferential Tofflemire bands.", "domain": "Orthodontics & Occlusion", "source_page": "Restorative Technique", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Interim Therapeutic Restoration (ITR) using GIC involves:", "options": ["Complete caries removal with high-speed handpiece, then GIC placement", "Partial or complete caries removal with hand instruments only, then GIC placement, often without local anesthesia", "SSC placement without preparation", "SDF application only"], "answer": 1, "explanation": "ITR (also called ART - Atraumatic Restorative Treatment) uses hand instruments (excavators, spoon excavators) for caries removal without a drill, then restores with GIC. It is used for uncooperative patients, young children, and community settings without electricity.", "domain": "Restorative Dentistry", "source_page": "ITR/ART", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The bonding mechanism of composite resin to enamel is primarily:", "options": ["Chemical bonding to hydroxyapatite", "Micromechanical retention through acid etching creating resin tags", "Ionic bonding similar to glass ionomer", "van der Waals forces"], "answer": 1, "explanation": "Composite bonds to enamel primarily through micromechanical retention: phosphoric acid etching (30–37%) creates microporosities in the enamel prisms into which unfilled resin penetrates and polymerizes, forming resin tags. Dentin bonding involves both micromechanical and chemical mechanisms.", "domain": "Restorative Dentistry", "source_page": "Adhesive Dentistry", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which of the following is a PRIMARY advantage of using rubber dam isolation during restorative procedures in children?", "options": ["Reduces appointment time", "Provides moisture control, improves visibility, and reduces aspiration risk", "Eliminates the need for local anesthesia", "Allows the child to speak during treatment"], "answer": 1, "explanation": "Rubber dam provides moisture control (critical for bonded restorations), improves visibility and access, retracts soft tissue, and prevents aspiration of small instruments or materials. It also reduces aerosol contamination. AAPD recommends rubber dam use during pulp therapy and restorative procedures.", "domain": "Restorative Dentistry", "source_page": "Isolation", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "When preparing a primary molar for a stainless steel crown, the proximal reduction should:", "options": ["Create undercuts for retention", "Break proximal contacts and taper slightly", "Remove all enamel on the proximal surfaces", "Be parallel to the long axis of the tooth"], "answer": 1, "explanation": "Proximal preparation for SSC should break proximal contact and create a slight taper (remove approximately 0.5–1.0 mm), allowing the crown to be slid into place. The crown derives retention from the ledge at the gingival margin, not from undercuts.", "domain": "Restorative Dentistry", "source_page": "SSC Preparation", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Zirconia primary crowns offer which advantage over SSC?", "options": ["Better marginal adaptation", "Superior esthetics (tooth-colored)", "Greater strength than SSC", "Lower cost"], "answer": 1, "explanation": "Zirconia crowns (EZCrowns, NuSmile ZR, Kinder Krowns) offer superior esthetics as tooth-colored alternatives to SSC, especially for anterior and posterior primary teeth. They require more tooth reduction and have a higher cost but excellent parental acceptance.", "domain": "Restorative Dentistry", "source_page": "Primary Tooth Restorations", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most appropriate restoration for a large multi-surface caries in a primary second molar of a 4-year-old is:", "options": ["Class II composite", "Amalgam restoration", "Stainless steel crown", "Glass ionomer interim restoration until GA appointment"], "answer": 2, "explanation": "Stainless steel crowns are the restoration of choice for multi-surface caries in primary molars, especially after pulp therapy. They have superior longevity compared to multi-surface composites or amalgam in primary teeth and are cost-effective.", "domain": "Orthodontics & Occlusion", "source_page": "Primary Tooth Restorations", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which of the following restorations has the HIGHEST longevity in primary molars?", "options": ["Class II composite", "Multi-surface amalgam", "Stainless steel crown", "Glass ionomer Class II"], "answer": 2, "explanation": "Stainless steel crowns have consistently demonstrated the highest survival/longevity among restorations for primary molars across multiple systematic reviews, outperforming composite, amalgam, and glass ionomer restorations.", "domain": "Orthodontics & Occlusion", "source_page": "Evidence-Based Restorative", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The primary cause of secondary (recurrent) caries around composite restorations is:", "options": ["Inadequate moisture control during placement", "Allergic reaction to composite", "Bacterial microleakage at the restoration margin", "Composite fracture"], "answer": 2, "explanation": "The primary cause of recurrent caries around composite restorations is marginal microleakage — bacterial infiltration at the restoration-tooth interface. Proper bonding technique, rubber dam use, and adequate light curing reduce microleakage.", "domain": "Caries & Prevention", "source_page": "Restorative Complications", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which caries detection dye is used to differentiate infected carious dentin (to be removed) from affected dentin (that may be preserved)?", "options": ["Methylene blue", "Caries detector dye (acid red/basic fuchsin)", "Iodine solution", "Fluorescein"], "answer": 1, "explanation": "Caries detector dyes (containing acid red or basic fuchsin in propylene glycol) stain infected, irreversibly denatured dentin that should be removed. Affected dentin that can remineralize is not stained or is lightly stained. This aids conservative caries removal.", "domain": "Restorative Dentistry", "source_page": "Caries Removal", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most common form of periodontal disease in children is:", "options": ["Chronic periodontitis", "Plaque-induced gingivitis", "Aggressive periodontitis", "Necrotizing ulcerative gingivitis"], "answer": 1, "explanation": "Plaque-induced gingivitis is the most common form of periodontal disease in children. It is reversible with improved oral hygiene. In children, gingivitis is prevalent but rarely progresses to periodontitis unless there are systemic predisposing factors.", "domain": "Oral Pathology & Medicine", "source_page": "Pediatric Periodontics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Molar-incisor pattern of bone loss in a teenager is characteristic of:", "options": ["Generalized chronic periodontitis", "Localized aggressive periodontitis (previously 'localized juvenile periodontitis')", "Necrotizing ulcerative periodontitis", "Gingival fibromatosis"], "answer": 1, "explanation": "Localized aggressive periodontitis (formerly LJP) classically presents with severe alveolar bone loss localized to first molars and incisors in otherwise healthy adolescents, with minimal plaque/calculus relative to the severity of bone loss. Associated with Aggregatibacter actinomycetemcomitans.", "domain": "Oral Pathology & Medicine", "source_page": "Aggressive Periodontitis", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The primary bacteria associated with localized aggressive periodontitis is:", "options": ["Streptococcus mutans", "Aggregatibacter actinomycetemcomitans (Aa)", "Porphyromonas gingivalis", "Treponema denticola"], "answer": 1, "explanation": "Aggregatibacter actinomycetemcomitans (formerly Actinobacillus actinomycetemcomitans) is the primary pathogen in localized aggressive periodontitis. It produces leukotoxin and other virulence factors. Systemic antibiotics (amoxicillin + metronidazole) are often used alongside mechanical therapy.", "domain": "Periodontics", "source_page": "Aggressive Periodontitis", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Puberty-associated gingivitis is caused primarily by:", "options": ["Increased plaque accumulation at puberty", "Altered gingival response to plaque due to increased sex hormone levels", "New pathogenic bacterial species at puberty", "Decreased saliva flow at puberty"], "answer": 1, "explanation": "At puberty, elevated levels of sex hormones (estrogen, progesterone, testosterone) alter gingival vascularity and immune response, making the gingiva more reactive to existing plaque. Even small amounts of plaque cause exaggerated gingival inflammation during puberty.", "domain": "Periodontics", "source_page": "Puberty Gingivitis", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which systemic condition is associated with severe, early-onset periodontitis due to neutrophil dysfunction?", "options": ["Down syndrome", "Papillon-Lefèvre syndrome", "Turner syndrome", "Apert syndrome"], "answer": 1, "explanation": "Papillon-Lefèvre syndrome (cathepsin C gene mutation) causes palmar-plantar keratoderma and severe early-onset periodontitis with loss of primary and permanent teeth. Neutrophil dysfunction leads to inability to fight periodontal pathogens effectively.", "domain": "Special Healthcare Needs", "source_page": "Systemic Periodontal Conditions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Cyclosporine-induced gingival enlargement is a side effect of immunosuppressive therapy used in:", "options": ["Asthma management", "Post-organ transplant patients", "HIV management", "Epilepsy treatment"], "answer": 1, "explanation": "Cyclosporine (immunosuppressant used in organ transplant patients), phenytoin (antiepileptic), and calcium channel blockers (nifedipine) are the classic causes of drug-induced gingival enlargement. Meticulous oral hygiene reduces severity.", "domain": "Periodontics", "source_page": "Drug-Induced Gingival Changes", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Phenytoin (Dilantin)-induced gingival enlargement is most effectively prevented by:", "options": ["Substituting another antiepileptic medication", "Excellent plaque control and regular periodontal maintenance", "Surgical gingivectomy as a first-line approach", "Increasing phenytoin dose to reduce seizure frequency"], "answer": 1, "explanation": "Excellent plaque control significantly reduces the severity of drug-induced gingival enlargement. It doesn't eliminate it entirely but reduces its extent. If oral hygiene is optimal and enlargement persists, medication substitution (with physician) or surgical management may be needed.", "domain": "Special Healthcare Needs", "source_page": "Drug-Induced Gingival Changes", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Necrotizing ulcerative gingivitis (NUG) is characterized by the triad of:", "options": ["Swelling, pain, fever", "Punched-out papillae, pain, fetid odor (pseudomembrane covered)", "Gingival enlargement, bleeding, recession", "Localized bone loss, deep pockets, calculus"], "answer": 1, "explanation": "NUG (trench mouth) presents with the classic triad: punched-out (crater-like) interdental papillae covered by a gray pseudomembrane, significant pain, and fetid breath. It is associated with stress, immunosuppression, smoking, and poor nutrition. Treatment: debridement, metronidazole, CHX rinse.", "domain": "Oral Pathology & Medicine", "source_page": "NUG/NUP", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Gingival recession in a child most commonly results from:", "options": ["Aggressive periodontitis", "Vigorous toothbrushing and thin gingival biotype", "Systemic disease", "Hormonal changes"], "answer": 1, "explanation": "Gingival recession in children most commonly results from toothbrush trauma (aggressive horizontal brushing) and a thin gingival biotype. It often occurs on the buccal surfaces of mandibular incisors. Miller's classification grades recession by the extent of root coverage possible.", "domain": "Periodontics", "source_page": "Gingival Recession", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The normal probing depth in a healthy child's dentition is:", "options": ["0–1 mm", "1–3 mm", "4–5 mm", "6+ mm"], "answer": 1, "explanation": "Normal probing depth in a healthy periodontium is 1–3 mm. Depths of 4 mm or greater (especially with bleeding on probing) suggest periodontal disease. Children's probing depths may be slightly different around erupting teeth due to the junctional epithelium position.", "domain": "Periodontics", "source_page": "Periodontal Assessment", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "An avulsed permanent tooth with the BEST prognosis for replantation has been stored in:", "options": ["Tap water", "Dry medium (tissue)", "Hank's Balanced Salt Solution (HBSS) or cold milk", "Saline only"], "answer": 2, "explanation": "HBSS (Save-a-Tooth, pH-balanced, isotonic) is the ideal storage medium for avulsed teeth as it maintains periodontal ligament cell viability for up to 24 hours. Cold milk is the best widely available alternative. Dry storage kills PDL cells within 15–60 minutes.", "domain": "Oral Surgery & Trauma", "source_page": "Dental Avulsion", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "For an avulsed permanent tooth with a CLOSED apex that has been dry for less than 60 minutes, the recommended replantation protocol includes:", "options": ["Replant immediately without any root surface treatment", "Soak in fluoride solution for 20 minutes then replant", "Replant after gentle saline rinse of the root surface, avoiding scrubbing", "Remove all PDL remnants before replanting"], "answer": 2, "explanation": "For avulsed teeth with closed apex, dry time <60 min: gently rinse with saline (do NOT scrub or handle the root), replant promptly, splint for 2 weeks, begin root canal treatment within 7–10 days. The goal is to preserve viable PDL cells.", "domain": "Oral Surgery & Trauma", "source_page": "Dental Avulsion — IADT Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "For an avulsed permanent tooth with an OPEN apex that has been dry for less than 60 minutes, after replantation, root canal treatment:", "options": ["Should be done within 7–10 days", "Is not done; the tooth is monitored for revascularization", "Should be done immediately at the time of replantation", "Is done 3 months later"], "answer": 1, "explanation": "For avulsed immature permanent teeth (open apex) with viable PDL: replant and monitor for signs of revascularization/pulp regeneration. Root canal treatment is NOT initiated unless signs of pulp necrosis develop (periapical pathology, arrest of root development). The open apex allows revascularization.", "domain": "Pulp Therapy & Endodontics", "source_page": "Dental Avulsion — IADT Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The recommended splinting duration for a replanted avulsed permanent tooth (closed apex) is:", "options": ["1 week", "2 weeks", "4 weeks", "3 months"], "answer": 1, "explanation": "IADT guidelines recommend flexible splinting for 2 weeks for avulsed teeth (closed apex). Rigid splinting for prolonged periods promotes ankylosis. For alveolar fractures, splinting for 4 weeks is recommended.", "domain": "Oral Surgery & Trauma", "source_page": "Trauma Splinting", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Replacement resorption (ankylosis) after avulsion replantation is characterized radiographically by:", "options": ["Periapical radiolucency", "Progressive replacement of root structure by bone, loss of PDL space", "Internal root resorption", "Widened PDL space"], "answer": 1, "explanation": "Replacement (ankylosis) resorption: the PDL space disappears and bone fuses directly to the root surface (ankylosis). Radiographically: loss of PDL space, progressive root replacement by bone. Clinically: high metallic percussion sound (ankylosed). Eventually leads to tooth loss and infraocclusion.", "domain": "Oral Surgery & Trauma", "source_page": "Trauma Complications", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Inflammatory root resorption after replantation is caused by:", "options": ["Ankylosis of the root to bone", "Bacterial toxins from infected root canal stimulating resorptive cells near damaged PDL", "Excessive occlusal forces after splinting", "Immune rejection of the replanted tooth"], "answer": 1, "explanation": "Inflammatory root resorption occurs when bacteria from an infected necrotic pulp stimulate clast cells through the dentinal tubules, causing rapid root resorption. This is why root canal treatment is initiated within 7–10 days for closed-apex teeth — to eliminate the bacterial source.", "domain": "Oral Surgery & Trauma", "source_page": "Trauma Complications", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A luxation injury where the tooth is displaced in a lateral direction (not axially) is called:", "options": ["Extrusive luxation", "Intrusive luxation", "Lateral luxation", "Subluxation"], "answer": 2, "explanation": "Lateral luxation = displacement in a non-axial direction (labial, lingual, or lateral) with comminution or fracture of the alveolar socket. Intrusive = pushed apically into socket. Extrusive = partial displacement out of socket. Subluxation = loosened, not displaced.", "domain": "Oral Surgery & Trauma", "source_page": "Luxation Injuries — IADT", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The MOST serious complication of intrusive luxation of a primary incisor is:", "options": ["Permanent discoloration of the primary tooth", "Damage to the developing permanent successor", "Loss of the primary tooth space", "Alveolar fracture"], "answer": 1, "explanation": "The primary concern with intrusive luxation of a primary tooth is potential damage to the developing permanent tooth germ, which lies just below. The primary incisor may be extracted or left to spontaneously re-erupt; the decision depends on the direction of displacement.", "domain": "Oral Surgery & Trauma", "source_page": "Primary Tooth Trauma", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A concussion injury to a tooth is defined as:", "options": ["Tooth loosened but not displaced", "Tooth with injury to supporting structures, NOT loose or displaced, but sensitive to percussion", "Tooth displaced laterally", "Tooth with crown fracture only"], "answer": 1, "explanation": "Concussion = injury to supporting structures with sensitivity to percussion/palpation but NO loosening or displacement. Subluxation = loosened but not displaced. Both are treated with soft diet and monitoring.", "domain": "Oral Surgery & Trauma", "source_page": "Luxation Injuries — IADT", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The recommended treatment for an intruded permanent incisor in an adolescent (closed apex, intrusion >7mm) is:", "options": ["Passive re-eruption (wait and watch)", "Surgical or orthodontic repositioning", "Extraction and implant", "Immediate root canal treatment only"], "answer": 1, "explanation": "For mature permanent teeth with intrusion >7mm or intrusion in adults/adolescents (closed apex), IADT recommends surgical or orthodontic repositioning. Passive re-eruption is reserved for immature teeth (open apex) with mild intrusion (< 7mm). Early treatment prevents ankylosis.", "domain": "Orthodontics & Occlusion", "source_page": "Intrusive Luxation — IADT", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A crown fracture involving enamel and dentin WITHOUT pulp exposure in a permanent tooth is classified as:", "options": ["Ellis Class I / Andreasen Class 1", "Ellis Class II / Andreasen Class 2", "Ellis Class III / Andreasen Class 3", "Complicated crown fracture"], "answer": 1, "explanation": "Ellis Class II (Andreasen Class 2/uncomplicated crown fracture): involves enamel and dentin, no pulp exposure. Treatment: protect exposed dentin with bonded composite, glass ionomer, or dentin bonding agent. Monitor pulp vitality. If pulp exposure present = Ellis Class III (complicated).", "domain": "Orthodontics & Occlusion", "source_page": "Crown Fractures", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which antibiotic is recommended by IADT guidelines following replantation of an avulsed permanent tooth?", "options": ["Amoxicillin 500 mg TID x 7 days (or pediatric dose)", "Clindamycin 300 mg QID x 7 days", "No antibiotics are indicated", "Metronidazole only"], "answer": 0, "explanation": "IADT recommends systemic antibiotics (amoxicillin, age-appropriate dose) following replantation of avulsed permanent teeth to reduce bacterial contamination and prevent inflammatory root resorption. Tetracycline is used in patients >12 years due to concerns about tooth staining.", "domain": "Oral Surgery & Trauma", "source_page": "Dental Avulsion — IADT", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which study design provides the HIGHEST level of evidence?", "options": ["Randomized controlled trial", "Systematic review with meta-analysis", "Cohort study", "Case-control study"], "answer": 1, "explanation": "The evidence hierarchy from highest to lowest: systematic review/meta-analysis > RCT > cohort study > case-control study > cross-sectional study > case series/case report > expert opinion. Systematic reviews synthesize data from multiple high-quality RCTs.", "domain": "Research Methods & Biostatistics", "source_page": "Evidence Hierarchy", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A randomized controlled trial (RCT) is most useful for:", "options": ["Determining disease prevalence in a population", "Identifying the cause of rare diseases", "Evaluating treatment efficacy by minimizing confounding", "Describing disease natural history"], "answer": 2, "explanation": "RCTs are the gold standard for evaluating treatment efficacy because randomization distributes known and unknown confounders equally between groups, allowing a causal inference about the treatment effect.", "domain": "Research Methods & Biostatistics", "source_page": "Study Design", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Selection bias is best controlled in a clinical trial by:", "options": ["Blinding of the outcome assessor", "Randomization of participants to groups", "Increasing sample size", "Using a within-subject design"], "answer": 1, "explanation": "Randomization (random allocation) is the primary method to control selection bias in RCTs. It ensures that both known and unknown confounders are equally distributed between treatment and control groups.", "domain": "Caries & Prevention", "source_page": "Research Bias", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A study finds that patients who brush their teeth more frequently have lower caries rates. This association could be due to confounding if:", "options": ["The sample size was too small", "More frequent brushers also have better diets and higher socioeconomic status", "The study was not blinded", "The study used radiographs for caries detection"], "answer": 1, "explanation": "Confounding occurs when a third variable (confounder) is associated with both the exposure (tooth brushing) and the outcome (caries), creating a spurious association. Diet quality and SES are confounders here, as they affect both brushing frequency and caries risk.", "domain": "Caries & Prevention", "source_page": "Confounding", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Sensitivity of a diagnostic test refers to:", "options": ["The proportion of true negatives correctly identified", "The proportion of true positives correctly identified", "The probability that a positive test result is correct", "The overall accuracy of the test"], "answer": 1, "explanation": "Sensitivity = true positives / (true positives + false negatives). A highly sensitive test rarely misses disease (few false negatives). High sensitivity is important for screening tests where missing disease is costly.", "domain": "Caries & Prevention", "source_page": "Diagnostic Test Statistics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Specificity of a diagnostic test refers to:", "options": ["The proportion of true positives correctly identified", "The proportion of true negatives correctly identified", "The probability that a negative test result is correct", "The reliability of the test on repeat measures"], "answer": 1, "explanation": "Specificity = true negatives / (true negatives + false positives). A highly specific test rarely incorrectly labels healthy patients as diseased (few false positives). High specificity is important for confirmatory tests.", "domain": "Caries & Prevention", "source_page": "Diagnostic Test Statistics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The Number Needed to Treat (NNT) is calculated as:", "options": ["1 / absolute risk reduction", "1 / relative risk reduction", "Relative risk × 100", "Treatment success rate / control success rate"], "answer": 0, "explanation": "NNT = 1 / Absolute Risk Reduction (ARR). ARR = control event rate − treatment event rate. A lower NNT means the treatment is more effective (fewer patients need treatment for one to benefit). NNT of 1 = every patient benefits.", "domain": "Research Methods & Biostatistics", "source_page": "Clinical Statistics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A 95% confidence interval (CI) that does NOT include the null value (e.g., 1.0 for relative risk) indicates:", "options": ["The result is not clinically significant", "The result is statistically significant at p < 0.05", "The study had adequate power", "The result has no clinical relevance"], "answer": 1, "explanation": "A 95% CI that does not cross the null value (1.0 for ratios, 0 for differences) indicates statistical significance at α = 0.05. The CI provides information about both statistical significance and precision of the estimate.", "domain": "Research Methods & Biostatistics", "source_page": "Statistics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "An absolute risk reduction of 0.05 (5%) between two treatment groups yields an NNT of:", "options": ["5", "20", "50", "100"], "answer": 1, "explanation": "NNT = 1 / ARR = 1 / 0.05 = 20. This means 20 patients need to be treated with the experimental treatment for one additional patient to benefit compared to the control treatment.", "domain": "Research Methods & Biostatistics", "source_page": "Clinical Statistics", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Inter-rater reliability in clinical research is best measured by:", "options": ["Pearson correlation coefficient", "Cohen's kappa statistic", "p-value", "Confidence interval"], "answer": 1, "explanation": "Cohen's kappa measures agreement between two raters beyond chance. Kappa 0.81–1.0 = almost perfect agreement; 0.61–0.80 = substantial; 0.41–0.60 = moderate. Pearson correlation measures linear relationship between continuous variables, not categorical agreement.", "domain": "Research Methods & Biostatistics", "source_page": "Research Reliability", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Publication bias in systematic reviews refers to:", "options": ["Authors fabricating data", "The tendency for positive/significant results to be more likely published than negative results", "Bias introduced by the peer review process", "Selecting only certain patients for publication"], "answer": 1, "explanation": "Publication bias occurs because studies with positive (statistically significant) results are more likely to be published, submitted, and accepted than those with null or negative findings. This inflates the apparent efficacy of treatments in systematic reviews. Funnel plots detect publication bias.", "domain": "Research Methods & Biostatistics", "source_page": "Systematic Reviews", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A cohort study follows:", "options": ["A group of patients backward in time from disease to exposure", "A group of exposed and unexposed individuals forward in time to compare disease incidence", "Cases with disease and controls without disease simultaneously", "A single patient over time"], "answer": 1, "explanation": "A cohort study follows a group of individuals (exposed and unexposed) forward in time (prospective) to measure disease incidence and calculate relative risk. It is good for studying rare exposures but requires long follow-up and is susceptible to loss-to-follow-up bias.", "domain": "Research Methods & Biostatistics", "source_page": "Study Design", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A case-control study is most useful for studying:", "options": ["Common diseases and common exposures", "Rare diseases, as it selects cases based on outcome and compares to controls", "Evaluating treatment efficacy", "Measuring disease prevalence"], "answer": 1, "explanation": "Case-control studies start with cases (who have the disease) and controls (who don't) and look backward at exposures. They are efficient for studying rare diseases and multiple exposures simultaneously. They calculate odds ratios (not relative risk or absolute risk).", "domain": "Research Methods & Biostatistics", "source_page": "Study Design", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The Hawthorne effect in research refers to:", "options": ["Observer bias from the researcher", "Participants changing their behavior because they know they are being observed/studied", "The tendency to find positive results in RCTs", "Seasonal variation in disease rates"], "answer": 1, "explanation": "The Hawthorne effect: participants alter their behavior simply because they are being observed, regardless of the intervention. This can confound results in clinical studies — e.g., patients improving oral hygiene just because they know they are enrolled in a study.", "domain": "Research Methods & Biostatistics", "source_page": "Research Bias", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Type I error (alpha error) in hypothesis testing refers to:", "options": ["Failing to detect a true effect (false negative)", "Rejecting the null hypothesis when it is actually true (false positive)", "Inadequate sample size", "Measurement error"], "answer": 1, "explanation": "Type I error (α) = false positive = rejecting the null hypothesis when it is true. Conventionally α = 0.05 (5% chance of false positive). Type II error (β) = false negative = failing to reject a false null hypothesis. Power = 1 − β.", "domain": "Research Methods & Biostatistics", "source_page": "Hypothesis Testing", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "According to the Spaulding classification, dental handpieces are classified as:", "options": ["Non-critical items — low-level disinfection", "Semi-critical items — high-level disinfection", "Critical items — sterilization required", "Non-critical — wipe with alcohol"], "answer": 2, "explanation": "Dental handpieces penetrate soft tissue and bone and contact blood, classifying them as critical items requiring sterilization (autoclaving) between patients. OSAP and CDC guidelines require heat sterilization of handpieces — external surface disinfection is insufficient.", "domain": "Infection Control & Safety", "source_page": "Sterilization Guidelines", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Semi-critical items (e.g., mouth mirrors, reusable impression trays) require a MINIMUM of:", "options": ["Low-level disinfection", "High-level disinfection or sterilization", "Intermediate-level disinfection", "Wiping with 70% ethanol"], "answer": 1, "explanation": "Semi-critical items contact mucous membranes or non-intact skin but do not penetrate them. They require high-level disinfection (kills all microorganisms except high numbers of bacterial spores) or sterilization. Examples: mouth mirrors, amalgam condensers, reusable impression trays.", "domain": "Infection Control & Safety", "source_page": "Spaulding Classification", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The autoclave (steam sterilization) kills microorganisms primarily through:", "options": ["Dry heat at 160°C", "Moist heat (steam under pressure) denaturing proteins", "Chemical oxidation", "UV radiation"], "answer": 1, "explanation": "Steam autoclave (121°C at 15 psi for 15–30 min, or 132°C for 3–4 min in flash cycle) sterilizes by moist heat under pressure, which denatures microbial proteins and destroys all forms of microorganisms including spores.", "domain": "Infection Control & Safety", "source_page": "Sterilization Methods", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Biological indicators (spore tests) are the MOST reliable method to verify sterilizer function because:", "options": ["They are performed daily and are inexpensive", "They directly test the sterilizer's ability to kill the most resistant microorganisms", "They are required by OSHA daily", "Chemical indicators confirm proper temperature"], "answer": 1, "explanation": "Biological indicators (Geobacillus stearothermophilus spores for steam autoclave) directly verify that the sterilization cycle killed the most resistant organisms. Chemical indicators only verify that certain physical parameters were reached, not that sterilization occurred. AAMI recommends weekly spore testing (at minimum).", "domain": "Infection Control & Safety", "source_page": "Sterilization Monitoring", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "OSHA's Bloodborne Pathogen Standard requires hepatitis B vaccination to be offered to dental workers:", "options": ["After 1 year of employment at no cost", "Within 10 days of initial assignment to tasks involving occupational exposure, at no cost to the employee", "Only if the employee requests it", "After an occupational exposure incident"], "answer": 1, "explanation": "OSHA BBP Standard: employers must offer hepatitis B vaccine at no cost to employees with occupational exposure within 10 working days of initial assignment. If declined, a signed declination form is required.", "domain": "Infection Control & Safety", "source_page": "OSHA BBP Standard", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Which hepatitis virus is transmitted primarily through the fecal-oral route and is NOT associated with chronic infection?", "options": ["Hepatitis B", "Hepatitis C", "Hepatitis A", "Hepatitis D"], "answer": 2, "explanation": "Hepatitis A is transmitted fecal-orally (contaminated food/water), causes acute illness, and does NOT cause chronic infection. HAV vaccine is part of the routine childhood immunization schedule. Hepatitis B and C are blood-borne and can cause chronic infection.", "domain": "Infection Control & Safety", "source_page": "Bloodborne Pathogens", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Standard precautions in dentistry require gloves:", "options": ["Only when performing surgical procedures", "Only when blood is expected", "For all patient contacts involving potential exposure to blood, saliva, or mucous membranes", "Only for uncooperative patients"], "answer": 2, "explanation": "Standard precautions (formerly universal precautions) require gloves for all patient contact where there is potential exposure to blood, saliva, or mucous membranes — meaning virtually all dental procedures. Gloves must be changed between patients and are single-use.", "domain": "Caries & Prevention", "source_page": "Standard Precautions", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The recommended method for preventing needlestick injuries in dentistry is:", "options": ["Double gloving during all procedures", "Using a one-handed scoop technique or needle recapping device; never two-handed recapping", "Wearing cut-resistant gloves", "Using only retractable needles for all injections"], "answer": 1, "explanation": "CDC and OSHA recommend a one-handed scoop technique or a mechanical recapping device to prevent needlestick injuries. Two-handed recapping is prohibited. Safety-engineered devices (retractable needles, safety syringes) should be used when available.", "domain": "Infection Control & Safety", "source_page": "Sharps Safety", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "N95 respirators compared to surgical masks provide protection primarily against:", "options": ["Large droplet splatter", "Small airborne particles (≥0.3 microns, >95% filtration efficiency)", "Chemical vapors", "Blood splash to the eyes"], "answer": 1, "explanation": "N95 respirators filter ≥95% of airborne particles ≥0.3 microns and must be fit-tested. They protect against airborne transmission (TB, measles, varicella, SARS-CoV-2 aerosols). Surgical masks protect against large droplets and splatter but do not filter fine aerosols.", "domain": "Infection Control & Safety", "source_page": "PPE", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "After an occupational needlestick exposure to a patient with unknown HIV status in a dental office, the FIRST action should be:", "options": ["Immediately start post-exposure prophylaxis (PEP)", "Wash the wound thoroughly with soap and water, then report to the exposure management protocol", "Test the worker for HIV immediately", "Test the source patient immediately before doing anything else"], "answer": 1, "explanation": "After a needlestick exposure: (1) wash immediately with soap and water; (2) report to the exposure management authority/supervisor; (3) evaluate source patient and exposed worker; (4) consider PEP within 72 hours if indicated. Do NOT squeeze the wound to express blood.", "domain": "Infection Control & Safety", "source_page": "Exposure Management", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most common oral finding in patients with Down syndrome is:", "options": ["Macrodontia", "Hypodontia (missing teeth) and delayed eruption", "Taurodontism", "Amelogenesis imperfecta"], "answer": 1, "explanation": "Common oral findings in Down syndrome include hypodontia, delayed eruption, tooth size-arch discrepancy, microdontia, fissured tongue, Class III malocclusion, mouth breathing, and increased periodontal disease susceptibility due to immune dysfunction.", "domain": "Special Healthcare Needs", "source_page": "Down Syndrome", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A child with Down syndrome (Trisomy 21) requires antibiotic prophylaxis before dental treatment if they have:", "options": ["Down syndrome alone", "Congenital heart disease with conditions specified in AHA guidelines", "Intellectual disability", "Any cardiac murmur regardless of type"], "answer": 1, "explanation": "Down syndrome alone is NOT an indication for antibiotic prophylaxis. However, ~40–50% of children with Down syndrome have congenital heart disease (especially AV canal defects). If CHD meets AHA criteria for prophylaxis (prosthetic valves, prior IE, unrepaired/repaired cyanotic CHD), prophylaxis is indicated.", "domain": "Pharmacology & Sedation", "source_page": "Down Syndrome — Cardiac", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Atlantoaxial instability in Down syndrome is relevant to dentistry because:", "options": ["It affects dental development", "Neck extension during dental treatment could cause spinal cord compression", "It causes increased gag reflex", "It leads to temporomandibular joint problems"], "answer": 1, "explanation": "Atlantoaxial instability (laxity of the transverse atlantal ligament) occurs in ~15% of patients with Down syndrome. Hyperextension of the neck (as may occur during dental treatment in the supine position) could cause spinal cord compression. Care should be taken to support and limit neck movement.", "domain": "Special Healthcare Needs", "source_page": "Down Syndrome — Medical", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Children with cerebral palsy often present with which oral finding?", "options": ["Dental caries immune to fluoride", "Tooth wear, bruxism, and difficulty maintaining oral hygiene", "Supernumerary teeth", "Macroglossia and gingival hyperplasia"], "answer": 1, "explanation": "Children with cerebral palsy commonly present with tooth wear/bruxism, drooling (contributing to perioral skin breakdown), poor oral hygiene due to motor impairment, gingival overgrowth from anticonvulsant medications, and increased risk of trauma.", "domain": "Special Healthcare Needs", "source_page": "Cerebral Palsy", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "The most appropriate position for dental treatment of a patient in a wheelchair with limited mobility is:", "options": ["Transfer to the dental chair is always required", "Treatment in the wheelchair is acceptable with appropriate positioning aids", "Lateral decubitus position only", "Standing position for all procedures"], "answer": 1, "explanation": "Dental treatment can often be performed in the patient's wheelchair using appropriate positioning cushions, headrests, and adaptations. Transfers to the dental chair are not always necessary or safe. Some patients can be treated safely and efficiently in their own wheelchair.", "domain": "Special Healthcare Needs", "source_page": "Wheelchair Dentistry", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A patient with uncontrolled epilepsy requiring dental treatment should be scheduled:", "options": ["Immediately after breakfast when medication is optimal", "Later in the day when the patient is most relaxed", "In the morning after taking anticonvulsant medications, when seizure threshold is highest", "No special timing is needed"], "answer": 2, "explanation": "Patients with epilepsy are best treated in the morning, after they have taken their anticonvulsant medications (allowing peak serum levels), when they are rested, and stress is minimized. Fatigue and missed medications are common seizure triggers.", "domain": "Special Healthcare Needs", "source_page": "Epilepsy", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "If a patient with epilepsy has a generalized tonic-clonic seizure in the dental chair, the FIRST action is:", "options": ["Attempt to restrain the patient", "Place a padded tongue blade in the mouth", "Lower the chair to a supine or semi-reclined position and protect from injury", "Administer oxygen via nasal mask immediately"], "answer": 2, "explanation": "During a seizure: (1) lower chair and protect patient from injury (remove instruments, pad hard surfaces); (2) do NOT restrain or put anything in the mouth; (3) turn head to side to prevent aspiration; (4) call for help; (5) time the seizure; (6) administer oxygen as able. Most seizures are self-limiting.", "domain": "Special Healthcare Needs", "source_page": "Epilepsy — Emergency", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Fragile X syndrome, the most common inherited cause of intellectual disability, is characterized by:", "options": ["Macrocephaly and tall stature", "Long face, large ears, macroorchidism, and intellectual disability", "Short stature and webbed neck", "Hypopigmentation and seizures"], "answer": 1, "explanation": "Fragile X syndrome (FMR1 gene, X-linked): most common INHERITED cause of intellectual disability in males. Features: elongated face, large protruding ears, macroorchidism, hyperextensible joints, social anxiety. Dental: high palate, dental crowding, mouth breathing, dental anxiety.", "domain": "Special Healthcare Needs", "source_page": "Fragile X Syndrome", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "For a patient with autism spectrum disorder who is sensitive to sensory stimuli, which dental office modification would be MOST helpful?", "options": ["Brighter lighting and louder background music to distract", "Quiet environment, dimmed lighting, weighted blanket, noise-canceling headphones", "Standard dental office environment without modifications", "Nitrous oxide as the only modification"], "answer": 1, "explanation": "Sensory accommodations for ASD: quiet environment, dimmed or non-fluorescent lighting, weighted blankets, noise-canceling headphones, minimal smells, advance preparation with social stories, visual schedules, and consistent staff. These modifications significantly improve cooperation and reduce sensory overload.", "domain": "Pharmacology & Sedation", "source_page": "Autism Spectrum Disorder", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "A child with medically complex needs on chronic anticoagulation therapy (warfarin) requiring a tooth extraction should have:", "options": ["Warfarin stopped 3 days before the extraction", "INR checked; proceed if INR ≤ 3.5 for simple extractions with local hemostatic measures", "Warfarin always stopped regardless of INR", "General anesthesia required for all extractions"], "answer": 1, "explanation": "Current evidence supports proceeding with simple dental extractions without stopping warfarin if INR ≤ 3.5 (or per physician guidance), using local hemostatic measures (local anesthetic with epinephrine, pressure, sutures, gelatin sponge, tranexamic acid rinse). Stopping anticoagulation increases thromboembolism risk.", "domain": "Oral Surgery & Trauma", "source_page": "Medically Complex Patients", "source_doc": "ABPD Blueprint High-Yield"}, {"q": "Angle's Class II malocclusion is defined as:", "options": ["Mesiobuccal cusp of the upper first molar occludes in the buccal groove of the lower first molar", "Mesiobuccal cusp of the upper first molar occludes anterior to t
