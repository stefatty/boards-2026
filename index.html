al Healthcare Needs", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "A permanent tooth with a CLOSED apex is intruded 6 mm and surgically repositioned. The maximum splinting time is:", "options": ["2 weeks", "4 weeks", "6 weeks", "8 weeks"], "answer": 1, "explanation": "Intrusion with surgical repositioning: splint up to 4 weeks. Intrusion with orthodontic extrusion: up to 8 weeks. Standard splint times: subluxation = 2 weeks, extrusive/lateral luxation = 2-4 weeks, avulsion = 2 weeks (flexible splint), root fracture in middle/apical = 4 weeks.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which condition causes a portion of the cerebellum to protrude through the foramen magnum into the spinal canal, causing headaches?", "options": ["Dandy-Walker syndrome", "Arnold-Chiari malformation", "Hydrocephalus", "Spina bifida"], "answer": 1, "explanation": "Arnold-Chiari malformation: cerebellar tonsils/vermis protrude through foramen magnum into the cervical spinal canal. Symptoms: headaches (worse with Valsalva), neck pain, cerebellar symptoms. Associated with syringomyelia and spina bifida.", "source": "2021 High Yield", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "The material with a coefficient of thermal expansion MOST similar to tooth structure is:", "options": ["Composite resin", "Amalgam", "Glass ionomer cement", "Porcelain"], "answer": 2, "explanation": "Glass ionomer cement (GIC) has the coefficient of thermal expansion closest to natural tooth structure (dentin and enamel), reducing microleakage from thermal cycling. GIC also releases fluoride. Amalgam has the highest thermal conductivity among dental restorative materials.", "source": "2021 High Yield", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "The MOST common type of seizure in children is:", "options": ["Absence (petit mal)", "Febrile seizure", "Tonic-clonic (grand mal)", "Focal (partial)"], "answer": 1, "explanation": "Febrile seizures are the most common type of seizure in children (2-5% of children; ages 6 months - 5 years). Usually occur with rapidly rising fever >38°C. Simple febrile seizures: <15 min, generalized, single episode/24h. Recurrence: 33%. Long-term epilepsy risk: low.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Special Healthcare Needs", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "What cells/organs have the HIGHEST radiosensitivity?", "options": ["Brain and muscle cells", "Cells with high mitotic rate, primitive differentiation, future mitosis potential", "Bone and cartilage", "Mature neurons and striated muscle"], "answer": 1, "explanation": "Bergonie-Tribondeau Law: cells are most radiosensitive when they have: (1) high mitotic rate, (2) undergo future mitosis (actively dividing), (3) primitive (undifferentiated) state. Most sensitive: gonads, hematopoietic cells, thyroid, breast, eye lens, skin. Least sensitive: brain, muscle (mature neurons don't divide).", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which bacteria most commonly cause dental and periodontal infections?", "options": ["Gram-positive aerobic streptococci only", "Aerobic and anaerobic streptococci", "Staphylococci", "Lactobacillus species"], "answer": 1, "explanation": "Aerobic and anaerobic streptococci are the most common bacteria causing dental and periodontal infections. Odontogenic infections are typically polymicrobial, with mixed aerobic-anaerobic flora. Streptococcus viridans group and anaerobes (Prevotella, Fusobacterium) are predominant.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "What is the most common cause of severe oral ulcerations in children?", "options": ["Recurrent aphthous stomatitis", "Primary herpetic gingivostomatitis", "Erythema multiforme", "Behçet syndrome"], "answer": 1, "explanation": "Primary herpetic gingivostomatitis (HSV-1): most common cause of SEVERE oral ulcerations in children aged 1-5 years. Features: multiple painful ulcers on any oral surface, gingival erythema/bleeding, fever, lymphadenopathy. Recurrent aphthous stomatitis = most common ulcerative disease of oral mucosa.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which ingredient in toothpaste is implicated in allergic reactions precipitating aphthous stomatitis (RAS)?", "options": ["Fluoride", "Triclosan", "Sodium lauryl sulfate (SLS)", "Carrageenan"], "answer": 2, "explanation": "Sodium lauryl sulfate (SLS), a detergent/foaming agent in toothpaste, is implicated in precipitating recurrent aphthous stomatitis (RAS) in susceptible individuals. Using SLS-free toothpaste may reduce RAS frequency.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which unilocular cyst is associated with a VITAL tooth, has regular borders, is usually located in the mandible, may cross the midline, and occurs without explanation?", "options": ["Dentigerous cyst", "Radicular (periapical) cyst", "Traumatic (simple) bone cyst", "Lateral periodontal cyst"], "answer": 2, "explanation": "Traumatic bone cyst (simple bone cyst/atraumatic bone cyst): unilocular RL, associated with VITAL tooth, regular scalloped borders, mandible (especially posterior body), may cross midline, ASYMPTOMATIC, empty cavity on exploration. Radicular cyst = associated with NON-VITAL tooth apex.", "source": "2021 High Yield", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Aplastic anemia is characterized by:", "options": ["Increased RBC with decreased WBC", "Hypercellular bone marrow with excess blast cells", "Hypocellular bone marrow → insufficient hematopoietic stem cells → decreased granulocytes, erythrocytes, and platelets", "Normal bone marrow with autoimmune platelet destruction"], "answer": 2, "explanation": "Aplastic anemia: hypocellular bone marrow producing insufficient hematopoietic stem cells → pancytopenia (decreased ALL blood cell lines: granulocytes, erythrocytes, platelets). Causes: idiopathic (most common), radiation, chemotherapy, viruses. Treatment: bone marrow transplant.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Klinefelter syndrome (47,XXY) has which dental characteristic?", "options": ["Missing teeth and taurodontism", "Natal teeth and enamel hypoplasia", "Extra chromosome causing tall stature, gynecomastia; dental: taurodontism", "Micrognathia and cleft palate"], "answer": 2, "explanation": "Klinefelter syndrome (47,XXY): hypogonadism, infertility, gynecomastia, tall stature with long limbs, mild intellectual disability. Dental: taurodontism (enlarged pulp chambers with apically displaced furcations). Also seen in Turner syndrome (45,X) and Down syndrome.", "source": "2021 High Yield", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which feature of the PRIMARY dentition is the BEST predictor of an ideal sagittal relationship in the permanent dentition?", "options": ["Molar terminal plane relationship", "Canine relationship", "Amount of spacing in primary dentition", "Incisor overjet"], "answer": 1, "explanation": "The canine relationship in the primary dentition is the best predictor of the permanent dentition sagittal relationship. Class I primary canines predict Class I permanent canines. Molar terminal plane (flush terminal plane, distal step, mesial step) predicts permanent molar relationship.", "source": "2021 High Yield", "category": "Orthodontics & Occlusion", "domain": "Growth & Development", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Primary canine interference in the primary dentition can result in:", "options": ["Class II malocclusion", "Functional posterior crossbite", "Class III malocclusion", "Anterior open bite"], "answer": 1, "explanation": "Primary canine interference (premature contact) can cause a functional shift of the mandible laterally, resulting in a FUNCTIONAL POSTERIOR CROSSBITE. This is why early correction of primary canine interferences with equilibration or extraction may be indicated.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Orthodontics & Occlusion", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "The most appropriate antibiotic for a 10-year-old with NUG is:", "options": ["Penicillin VK", "Amoxicillin", "Doxycycline (tetracycline)", "Metronidazole alone"], "answer": 2, "explanation": "NUG/NUP treatment: primary treatment is mechanical debridement + antiseptic rinse (CHX). Antibiotics if systemically ill: tetracycline (doxycycline) or metronidazole (+ amoxicillin for systemic symptoms). Tetracycline is preferred for NUG in children >8 years. For <8 years: avoid tetracycline → use metronidazole + amoxicillin.", "source": "2021 High Yield", "category": "Periodontics", "domain": "Pharmacology & Sedation", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Regarding ectopic eruption of the maxillary first permanent molar: in the MAJORITY of cases, the outcome is:", "options": ["Requires immediate surgical intervention", "The affected permanent molar self-corrects", "Results in resorption of the primary molar and requires space maintainer", "Requires extraction of the primary molar"], "answer": 1, "explanation": "Ectopic eruption of max first permanent molar: 66% self-correct (reversible type). 33% do not self-correct (irreversible type) → treatment needed (Kesling/Humphrey appliance or brass wire separation). Monitor until age 7. Causes distal root resorption of primary 2nd molar.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Growth & Development", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Orthodontic movement of traumatized teeth should be delayed for a minimum of how long after minor trauma (uncomplicated crown fracture, minor subluxation)?", "options": ["1 month", "3 months", "6 months", "1 year"], "answer": 1, "explanation": "IADT guidelines: after minor trauma (uncomplicated crown fracture, minor subluxation/extrusion), wait at least 3 months before orthodontic movement. Moderate-severe PDL damage: 6 months. Root fracture: at least 1 year. Goal: ensure pulp vitality and periodontal healing.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Orthodontics & Occlusion", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "In the majority of cases, intruded primary incisors are displaced in which direction?", "options": ["Palatally (toward permanent successor)", "Labially (away from permanent successor)", "Apically along root axis", "Laterally"], "answer": 1, "explanation": "80% of intruded primary incisors are pushed LABIALLY (away from permanent successor), which is a more favorable prognosis for the permanent tooth. Management: observe for spontaneous re-eruption (may take up to 1 year). Extract if intruded palatally or if no re-eruption in 6-8 weeks.", "source": "2021 High Yield", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "What is the MOST common complication following traumatic injury to primary teeth?", "options": ["Pulp canal obliteration (PCO)", "Pulp necrosis", "Color change (gray discoloration)", "Premature tooth loss"], "answer": 2, "explanation": "Most common complication after primary tooth trauma: color change (53%). PCO: 36%. Pulp necrosis: 25%. Premature loss: 46%. 50% of discolored primary teeth remain asymptomatic until eruption of permanent teeth. Dark discoloration ≠ automatic extraction.", "source": "2021 High Yield", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "Which permanent tooth injuries require IMMEDIATE treatment (cannot be delayed)?", "options": ["Subluxation, concussion, intrusion", "Avulsion, alveolar fracture, extrusive luxation, lateral luxation", "Crown fracture without pulp exposure, root fracture", "Intrusion, concussion, subluxation"], "answer": 1, "explanation": "Immediate treatment needed: Avulsion, Alveolar fracture (bone remodels quickly), Extrusive luxation, Lateral luxation. Can be delayed: Intrusion, Concussion, Subluxation, Root fracture, Crown fracture ± pulp exposure (Cvek). Memory: AAEL = immediate (Avulsion, Alveolar, Extrusion, Lateral).", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "The order of splint time for dental trauma: avulsion vs. subluxation vs. extrusive luxation?", "options": ["All 2 weeks", "Avulsion=2w, Subluxation=2w, Extrusive luxation=2w (all flexible splints)", "Subluxation=2w, extrusion=2-4w, avulsion=2w (flexible), lateral luxation=4w", "Avulsion=4w, subluxation=1w, extrusion=1w"], "answer": 2, "explanation": "Splint times (flexible splint preferred): Subluxation = 2 weeks. Extrusive luxation = 2-4 weeks. Lateral luxation = 4 weeks. Avulsion = 2 weeks (flexible splint). Root fracture cervical 1/3 = 4 months (rigid). Root fracture middle/apical = 4 weeks (flexible). Rigid splint only for root fracture/alveolar fracture.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "A 6-year-old with primary second molar that was avulsed — what is the treatment?", "options": ["Reimplant immediately", "Reimplant with splinting for 4 weeks", "Do NOT reimplant primary teeth", "Place space maintainer immediately after avulsion"], "answer": 2, "explanation": "Primary tooth avulsion: DO NOT REIMPLANT. Risk of damaging permanent tooth bud outweighs benefits. Management: reassure parents, monitor for space loss, place space maintainer if needed. If space closure risk is low, space maintainer may not be needed.", "source": "2021 High Yield", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "High-yield study guide 2021", "source_doc": "2021 Final High Yield.pdf"}, {"q": "The mean age of S. mutans colonization in dentate infants is:", "options": ["6 months", "12 months", "15.7 months", "24 months"], "answer": 2, "explanation": "Mean age of S. mutans colonization in dentate infants is 15.7 months. 50% infected by 6 months, 84% by 24 months. Window of infectivity: 19-33 months. Mother's MS level ≥10^5 CFU/mL will inoculate the child. Transmission is vertical (mother to child) and horizontal (daycare).", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Which organisms are responsible for INITIATION of dental caries?", "options": ["Lactobacillus acidophilus and Lactobacillus casei", "Streptococcus mutans and Streptococcus sobrinus", "Actinomyces and Fusobacterium", "S. sanguis and S. gordonii"], "answer": 1, "explanation": "Caries initiation: S. mutans AND S. sobrinus. Caries progression: Lactobacillus acidophilus and casei. S. sobrinus is more important in smooth-surface caries. Infants who acquire S. sanguis early have LESS S. mutans (competitive exclusion).", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "What is the ONLY sugar that S. mutans can use to form sticky polysaccharides (glucan/fructan)?", "options": ["Fructose", "Glucose", "Lactose", "Sucrose"], "answer": 3, "explanation": "Sucrose = glucose + fructose. S. mutans uses sucrose to form: glucan (water-soluble, extracellular adhesion, inhibits plaque diffusion) and fructan (intracellular energy). S. mutans CAN metabolize many sugars (glucose, fructose, lactose) but ONLY sucrose forms sticky polysaccharides.", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Localized aggressive periodontitis (LAP) primarily affects which specific teeth?", "options": ["All first molars and canines", "At least 2 permanent first molars and incisors (no more than 2 other teeth)", "Only mandibular first molars", "All posterior teeth"], "answer": 1, "explanation": "LAP: attachment loss of at least 2 permanent 1st molars AND incisors, with NO MORE than 2 other teeth affected. Occurs without systemic disease. Prevalence: 0.2% overall; 2.5% in African Americans. Neutrophil dysfunction (chemotaxis defect). Treatment: root debridement + tetracycline (sequentially with metronidazole).", "source": "2010 Columbia", "category": "Periodontics", "domain": "Periodontics", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Tetracycline antibiotics should NOT be given to children under what age?", "options": ["6 years", "8 years", "10 years", "12 years"], "answer": 1, "explanation": "Tetracyclines (tetracycline, doxycycline) should NOT be given to children under 8 years due to: permanent discoloration of developing teeth, enamel hypoplasia, bone growth inhibition. Also contraindicated in pregnant women.", "source": "2010 Columbia", "category": "Oral Pathology & Medicine", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Amoxicillin is preferred over penicillin VK for dental infections primarily because:", "options": ["It has narrower spectrum", "It has broader spectrum covering more gram-negative organisms (E.coli, H.influenzae, Salmonella)", "It is less likely to cause allergic reactions", "It is more effective against anaerobes"], "answer": 1, "explanation": "Amoxicillin: broader spectrum than PCN — covers more gram-negative organisms (E. coli, H. influenzae, Salmonella) + Streptococcus. Used for respiratory tract infections, otitis media, sinusitis. However, LESS effective against some gram-positive organisms. Augmentin (amox/clavulanate) = even broader, covers beta-lactamase producers.", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Pharmacology & Sedation", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Children with severe early childhood caries (S-ECC) have which microbial characteristic?", "options": ["Increased microbial diversity in biofilm", "Decreased microbial diversity and complexity in biofilm", "No difference from caries-free children", "Higher prevalence of S. sanguis"], "answer": 1, "explanation": "Children with S-ECC have LESS microbial diversity and complexity in their biofilm. Higher prevalence of C. albicans in ECC vs caries-free. S. mutans is necessary but not solely sufficient for caries — needs appropriate substrate and host factors.", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Which treatment is preferred for Localized Aggressive Periodontitis (LAP) and why?", "options": ["SRP alone — most effective", "Surgical therapy alone", "Root debridement PLUS antibiotics (tetracycline, sequentially with metronidazole)", "Chlorhexidine rinse alone"], "answer": 2, "explanation": "LAP treatment: root debridement WITH antibiotic therapy. SRP alone is INEFFECTIVE. Tetracycline is the drug of choice (sequentially with metronidazole). Alternative: metronidazole + amoxicillin. Surgical therapy alone may also be effective. Addresses the Aa (A. actinomycetemcomitans) bacteria.", "source": "2010 Columbia", "category": "Periodontics", "domain": "Periodontics", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Necrotizing periodontal disease (NUG/NUP) is treated with:", "options": ["Amoxicillin and cephalexin", "Mechanical debridement, antiseptic irrigation, and metronidazole + penicillin (if febrile)", "Corticosteroids and antiviral agents", "Extraction of affected teeth"], "answer": 1, "explanation": "NUG/NUP treatment: mechanical debridement, irrigation with antiseptics (povidone iodine), chlorhexidine, meticulous OHI. If febrile → systemic antibiotics: metronidazole + penicillin. Predisposing factors: viral infection (HIV), malnutrition, stress, sleep deprivation.", "source": "2010 Columbia", "category": "Oral Surgery & Trauma", "domain": "Pharmacology & Sedation", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "The Lee Way space is LARGER in which arch?", "options": ["Maxillary arch (0.9 mm/side)", "Mandibular arch (1.7 mm/side)", "Equal in both arches", "Depends on tooth size"], "answer": 1, "explanation": "Lee Way space = difference between combined mesiodistal width of primary C, D, E versus permanent C, first PM, second PM. Maxillary: 0.9 mm/side (total 1.8 mm). Mandibular: 1.7 mm/side (total 3.4 mm). The mandible has MORE Lee Way space → mesial drift of permanent first molar.", "source": "2010 Columbia", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Changing radiographic film from D-speed to F-speed reduces radiation dose by a factor of:", "options": ["2", "4", "5", "10"], "answer": 0, "explanation": "Radiation dose reduction: D → F speed = factor of 2 reduction. F-speed → digital = additional reduction (digital is less than F-speed). Rectangular collimation = factor of 4-5 reduction vs round. PAN = equivalent to about 4 intraoral images.", "source": "2010 Columbia", "category": "Radiology", "domain": "Radiology", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Sealants should be placed over non-cavitated (incipient) carious lesions because:", "options": ["They will remineralize the caries", "Sealing over non-cavitated caries is effective in arresting caries progression", "They provide no benefit over non-carious teeth", "They only work on caries-free teeth"], "answer": 1, "explanation": "AAPD and ADA support sealing over non-cavitated (incipient) carious lesions. Sealants effectively arrest progression by cutting off bacteria from substrate. Bacteria under sealed sealants become quiescent. Resin-based sealants are first choice; GIC when isolation is difficult.", "source": "2010 Columbia", "category": "Restorative Dentistry", "domain": "Caries & Prevention", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Aggressive periodontitis (generalized) differs from localized aggressive periodontitis by:", "options": ["GAP affects only first molars; LAP affects entire dentition", "GAP = generalized attachment loss of ≥3 teeth NOT being first molars and incisors", "GAP responds well to conventional mechanical therapy", "GAP only affects adults"], "answer": 1, "explanation": "GAP: generalized attachment loss of at least 3 teeth NOT first molars/incisors (distinguishes it from LAP). LAP = limited to 1st molars and incisors. GAP affects adolescents/young adults. GAP does NOT respond well to conventional mechanical therapy or antibiotics alone.", "source": "2010 Columbia", "category": "Periodontics", "domain": "Periodontics", "source_page": "Columbia Board Review 2010", "source_doc": "2010 Columbia.pdf"}, {"q": "Fluoride rinse (0.05% NaF) is NOT recommended for children under what age?", "options": ["4 years", "6 years", "8 years", "10 years"], "answer": 1, "explanation": "0.05% NaF fluoride rinse = 0.022% F ion = 220 ppm. NOT recommended for children under 6 years due to risk of inadvertent swallowing. Prevident (1.1% NaF, 5,000 ppm) = prescription-strength for high-risk patients.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "MI Paste (CPP-ACP) is contraindicated in patients with allergy to:", "options": ["Penicillin", "Latex", "Milk protein (casein)", "Soy"], "answer": 2, "explanation": "MI Paste (CPP-ACP = casein phosphopeptide-amorphous calcium phosphate) is contraindicated in patients with allergy to MILK PROTEIN (casein). CPP-ACP: anticariogenic, inhibits demineralization AND promotes remineralization. Better than NaF varnish for treating white spot lesions.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Pharmacology & Sedation", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Battle sign (bruising behind the ear/mastoid) indicates:", "options": ["Mandibular fracture", "Posterior cranial bone fracture (basilar skull fracture)", "Condylar fracture", "Zygomatic fracture"], "answer": 1, "explanation": "Battle sign = mastoid ecchymosis (bruising behind ear) = basilar skull fracture. Raccoon eyes (periorbital ecchymosis) = anterior cranial fossa fracture. Both are delayed signs appearing 24-48h post-injury. CSF rhinorrhea/otorrhea may also be present.", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Unilateral subcondylar fracture: the mandible deviates on opening to which side?", "options": ["Opposite side of fracture", "Same side as the fracture", "No deviation", "Bilateral deviation"], "answer": 1, "explanation": "Unilateral subcondylar fracture: jaw deviates toward the SIDE OF FRACTURE on opening (affected condyle cannot translate forward normally). Bilateral subcondylar fractures → anterior open bite. Management: mostly conservative (closed reduction); open reduction minimizes growth center damage.", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Electrical burns in children most commonly occur in which age group?", "options": ["Newborns (0-1 year)", "Children 2-4 years old", "School age (5-10 years)", "Adolescents (12-18 years)"], "answer": 1, "explanation": "Electrical burns: typically 2-4 year old children who bite electrical cords. Deep burn (2000°C), PAINLESS (nerve damage). Eschar (necrotic tissue) sloughs off 1-3 weeks later, causing bleeding from labial artery. Commissural splint: start within 2 weeks of burn, wear 24h/day for 6-12 months. Prevents microstomia.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Most common complication of primary tooth intrusion intrusion in terms of permanent tooth damage is:", "options": ["Pulp necrosis of permanent tooth", "Delayed eruption of permanent tooth", "Discoloration/hypoplasia of permanent tooth crown", "Root dilaceration of permanent tooth"], "answer": 2, "explanation": "Intrusion and avulsion of primary teeth carry GREATEST risk of damage to permanent successor. Most common damage: discoloration/hypoplasia of permanent tooth crown. Severity of damage depends on child's age (younger = more severe since root development is less). 80% of intruded teeth go labially (away from successor).", "source": "Cookies Review Notes", "category": "Pulp Therapy & Endodontics", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "The BEST prognosis for a permanent tooth root fracture is in which location?", "options": ["Cervical third (worst prognosis)", "Middle third", "Apical third (best prognosis)", "All locations have equal prognosis"], "answer": 2, "explanation": "Root fracture prognosis: Apical 1/3 = BEST prognosis (adequate blood supply, coronal segment has good support). Middle 1/3 = intermediate. Cervical 1/3 = WORST prognosis (close to oral environment, inadequate support). Cervical 1/3 fractures may require extraction or rigid splinting for 4 months.", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Subluxation injury to a permanent tooth requires a flexible splint for how long?", "options": ["1 week", "2 weeks", "4 weeks", "6 weeks"], "answer": 1, "explanation": "Splint times for permanent teeth: Subluxation = 2 weeks (flexible). Extrusive luxation = 2 weeks (flexible). Lateral luxation = 4 weeks (flexible). Avulsion = 2 weeks (flexible). Intrusion (surgical/ortho) = 4-8 weeks. Root fracture middle/apical = 4 weeks. Root fracture cervical = up to 4 months (rigid).", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "What is the most common intrusive luxation treatment recommendation?", "options": ["Immediate surgical repositioning", "Immediate orthodontic extrusion", "Observe for spontaneous re-eruption; extract if no movement in 6-8 weeks", "Immediate extraction"], "answer": 2, "explanation": "Intrusion of permanent teeth: Mild (<3mm): observe for spontaneous re-eruption (immature > mature). Moderate (3-7mm) and severe (>7mm): orthodontic extrusion (immature) or surgical repositioning (mature). Observe for 4-8 weeks for any re-eruption before intervening.", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Which diagnostic criteria is used for CBCT (cone beam CT) in pediatric patients?", "options": ["Routine screening for all new patients", "When 2D imaging would be insufficient; benefit must outweigh significantly higher radiation (5-16x panoramic)", "For all trauma cases", "Annual monitoring of orthodontic cases"], "answer": 1, "explanation": "CBCT: radiation is 5-16x higher than panoramic. Should only be used when benefit clearly outweighs risk and 2D imaging is inadequate. Not for routine screening. American Academy of Oral and Maxillofacial Radiology: use lowest dose settings, collimate to area of interest.", "source": "Cookies Review Notes", "category": "Radiology", "domain": "Radiology", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "What is the recommended fluoride concentration for community water fluoridation (updated 2015)?", "options": ["0.5 ppm", "0.7 ppm (updated from 0.7-1.2 ppm)", "1.0 ppm", "1.2 ppm"], "answer": 1, "explanation": "USPHS updated recommendation in 2015: 0.7 ppm (down from 0.7-1.2 ppm range) due to increased fluoride intake from other sources and concerns about fluorosis. This single value replaces the previous range based on ambient temperature.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Which type of resin-based sealant monomer is most commonly used?", "options": ["PMMA (polymethyl methacrylate)", "HEMA", "Urethane dimethacrylate or bis-GMA", "Polycarboxylate"], "answer": 2, "explanation": "Resin-based sealants: urethane dimethacrylate (UDMA) or bis-GMA (bisphenol A glycidyl methacrylate) monomers. Resin sealants are first choice. Self-etching bonding agents increase retention. GIC sealants when isolation is difficult. Routine mechanical prep NOT recommended.", "source": "Cookies Review Notes", "category": "Restorative Dentistry", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Cardiac conditions that NO LONGER require antibiotic prophylaxis for dental procedures include:", "options": ["Prosthetic heart valves", "Previous infective endocarditis", "Mitral valve prolapse WITHOUT regurgitation", "Cyanotic congenital heart disease with residual shunt"], "answer": 2, "explanation": "AHA 2007 updated guidelines: MVP WITHOUT valvular regurgitation or structural leaflet abnormality does NOT require prophylaxis. Conditions still requiring prophylaxis: prosthetic valves, previous IE, unrepaired cyanotic CHD, repaired CHD with residual defects near prosthetic material, cardiac transplant with valvulopathy.", "source": "Cookies Review Notes", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Kawasaki disease is characterized by which oral finding?", "options": ["Koplik spots", "Strawberry tongue", "Palatal petechiae", "Geographic tongue"], "answer": 1, "explanation": "Kawasaki disease (mucocutaneous lymph node syndrome): affects children <5 years. Strawberry tongue, fever >5 days, bilateral non-purulent conjunctivitis, rash, cervical lymphadenopathy, changes in extremities. Serious complication: coronary artery aneurysm. Treatment: IVIG + aspirin.", "source": "Cookies Review Notes", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "The most common malocclusion in the United States is:", "options": ["Class II division 1", "Class I", "Class II division 2", "Class III"], "answer": 1, "explanation": "Class I malocclusion is the most common. Angle's classification based on relationship of MB cusp of max 1st molar to buccal groove of mand 1st molar. Class I = correct molar relationship with anterior crowding/spacing/irregularities.", "source": "Cookies Review Notes", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "The sensitive period for tooth formation where tetracycline staining has the MOST significant effect is:", "options": ["Embryonic period (weeks 1-8)", "Fetal period after calcification begins through age 8", "After all permanent teeth have calcified", "Only during crown formation"], "answer": 1, "explanation": "Tetracycline staining occurs when the drug is given during periods of active tooth calcification: from about 4 months in utero through age 7-8 years (when crown of second permanent molars is forming). Staining is permanent: yellow → gray with UV light exposure.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "What concentration of chlorhexidine is used for plaque control in dentistry?", "options": ["0.05%", "0.12% (USA) or 0.2% (Europe)", "0.5%", "1.0%"], "answer": 1, "explanation": "CHX gluconate: 0.12% (USA) for oral rinse; 0.2% (Europe). CHX varnish: 1% or 40% (Cervitec). CHX gel: 0.2-1%. CHX is more effective against S. mutans (than Lactobacilli, S. sanguis). Substantivity: binds to oral tissues and releases over time (up to 12 hours).", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "In primary tooth trauma, which injuries can WAIT/be deferred before treatment?", "options": ["Extrusive luxation, alveolar fracture, complicated crown fracture", "Primary tooth avulsion, minor crown fractures, intrusion (wait and watch)", "Any injury in children under 3", "Only injuries without pain"], "answer": 1, "explanation": "PRIMARY tooth trauma: CAN BE DEFERRED: avulsion (do not reimplant), minor crown fractures, intrusion (observe). MUST BE SEEN IMMEDIATELY: extrusive luxation, complicated crown fracture, crown/root fracture, alveolar fracture, uncontrolled bleeding. Peak incidence: 2-4 years old. Most involve max primary incisors. Most common injury: luxation.", "source": "Cookies Review Notes", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "A child presents with multiple recurring oral ulcers and cyclic fever approximately every 21 days. The MOST likely diagnosis is:", "options": ["Recurrent herpes labialis", "Primary herpetic gingivostomatitis", "Cyclic neutropenia", "Aphthous stomatitis (RAS)"], "answer": 2, "explanation": "Cyclic neutropenia: fever and ulcers occur on a cycle of approximately every 21 days. Autosomal dominant mutation in neutrophil elastase gene (ELA2). WBC and PMN count drops episodically. Oral manifestations: aphthous-like ulcers, severe gingivitis, premature tooth loss during neutropenic episodes.", "source": "Cookies Review Notes", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Potassium nitrate (Sensodyne) treats dental sensitivity by:", "options": ["Occluding dentinal tubules", "Blocking potassium ion channels/nerve signals for sensitive teeth", "Remineralizing exposed dentin", "Killing bacteria in open tubules"], "answer": 1, "explanation": "Potassium nitrate (KNO3) in Sensodyne blocks nerve signal transmission for sensitive teeth. Works centrally on nerve depolarization. Potassium ions block the nerve signal pathway. Takes 2-4 weeks of regular use to take effect.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Which of the following regarding stainless steel crowns (SSC) is TRUE?", "options": ["They require caries-free teeth", "The component decreased due to child allergies is nickel", "They cannot be used after pulpotomy", "They are only for primary molars, not permanent molars"], "answer": 1, "explanation": "SSC: the nickel component has been DECREASED over time due to increased nickel allergies in children. Indications: extensive caries, after pulp therapy, hypoplastic teeth, bruxism, as attachment for space maintainers. SSC use after pulpotomy is standard of care.", "source": "Cookies Review Notes", "category": "Pulp Therapy & Endodontics", "domain": "Restorative Dentistry", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Changing from rectangular to round collimation of dental x-rays changes radiation by:", "options": ["Reduces by factor of 2", "Reduces by factor of 4-5 (rectangular reduces by 4-5x vs round)", "Increases dose", "No difference"], "answer": 1, "explanation": "Rectangular collimation REDUCES radiation by factor of 4-5 compared to round collimation. This is because rectangular collimation limits the beam to only the film/sensor size, dramatically reducing scatter radiation and dose to non-target tissues.", "source": "Cookies Review Notes", "category": "Radiology", "domain": "Radiology", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Peak incidence of primary tooth trauma is in which age group?", "options": ["0-1 year", "2-4 years", "5-7 years", "8-10 years"], "answer": 1, "explanation": "Primary tooth trauma peak incidence: 2-4 years. Most involve maxillary primary incisors. Most common injury type: luxation injuries. Most common cause: falls. Permanent tooth trauma peak: 8-12 years.", "source": "Cookies Review Notes", "category": "Caries & Prevention", "domain": "Oral Surgery & Trauma", "source_page": "Cookies & Milk review notes", "source_doc": "Cookies 2 copy.pdf"}, {"q": "Matching S. mutans genotype between mother and child indicates which type of transmission?", "options": ["Horizontal transmission", "Vertical transmission (mother to child)", "Environmental contamination", "Food-borne transmission"], "answer": 1, "explanation": "Genotype matching of S. mutans between mother and infant confirms VERTICAL transmission. Genotyping (DNA fingerprinting) is the gold standard method to trace bacterial transmission from caregiver to child.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "As a child ages, what happens to their facial profile?", "options": ["More convex, more prominent lips", "Less convex, more prominent nose, less prominent lips", "Less convex, less prominent nose, more prominent lips", "No change to facial profile"], "answer": 1, "explanation": "As children grow, the facial profile becomes LESS convex (straighter), the nose becomes MORE prominent relative to the face, and the lips become LESS prominent. The chin advances and the profile flattens as mandibular growth continues.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "What type of laser detects caries on the occlusal surface via fluorescence?", "options": ["CO2 laser", "Nd:YAG laser", "Diode laser (DIAGNOdent)", "Er:YAG laser"], "answer": 2, "explanation": "DIAGNOdent is a portable diode laser-based system that uses laser fluorescence to detect occlusal caries. It emits fluorescence that correlates with the extent of demineralization. Useful for detecting early pit and fissure caries not visible clinically.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Cystic fibrosis is caused by a defect in which ion channel?", "options": ["Sodium channel", "Potassium channel", "Chloride channel (CFTR)", "Calcium channel"], "answer": 2, "explanation": "Cystic fibrosis: mutation in CFTR gene (cystic fibrosis transmembrane conductance regulator) → defective chloride transport in epithelium. Affects lungs, liver, intestine, pancreas. Produces thick, sticky mucus. Oral findings: enamel defects, decreased caries (chronic antibiotics), anterior open bite, increased calculus.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Special Healthcare Needs", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Acquired rheumatic heart disease results from infection with which organism?", "options": ["Staphylococcus aureus", "Group A Streptococcus (Strep pyogenes)", "Streptococcus viridans", "Enterococcus faecalis"], "answer": 1, "explanation": "Rheumatic heart disease results from UNTREATED Group A Streptococcal pharyngitis (strep throat). Molecular mimicry causes autoimmune attack on cardiac valves → mitral and aortic valve stenosis/regurgitation. Treatment of strep pharyngitis with PCN prevents rheumatic fever.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Which stage of Piaget's development is characterized by animism (attributing feelings to inanimate objects)?", "options": ["Sensorimotor", "Preoperational", "Concrete operational", "Formal operational"], "answer": 1, "explanation": "Preoperational stage (2-7 years): animism (belief that inanimate objects have life/feelings), magical thinking, egocentrism, symbolic play, centration (focusing on one aspect). A 4-year-old believing a chair is 'mean' for bumping them is an example of animism.", "source": "Welp 2019", "category": "Growth & Development", "domain": "Behavior Guidance", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Taste sensation for the anterior 2/3 of the tongue is carried by which cranial nerve?", "options": ["CN V (trigeminal) — touch/pain", "CN VII (facial nerve — chorda tympani)", "CN IX (glossopharyngeal)", "CN X (vagus)"], "answer": 1, "explanation": "CN VII (facial/chorda tympani): TASTE anterior 2/3. CN V (V3): TOUCH anterior 2/3. CN IX (glossopharyngeal): TASTE AND TOUCH posterior 1/3. CN X: very posterior tongue/epiglottis. Damage to trigeminal = loss of light touch/pain anterior 2/3 (not taste).", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Oral Pathology & Medicine", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Fluorosis (enamel fluorosis) occurs during which stage of tooth development?", "options": ["Initiation", "Morphodifferentiation", "Mineralization/Maturation", "Apposition"], "answer": 2, "explanation": "Dental fluorosis occurs during the MINERALIZATION/MATURATION phase. Excess fluoride disrupts ameloblast function during enamel maturation → hypomineralization, white spots, pitting. Enamel hypoplasia = problem during APPOSITION stage.", "source": "Welp 2019", "category": "Oral Pathology & Medicine", "domain": "Growth & Development", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "How many mm of mandibular molar movement is required to transition from flush terminal plane to Class I?", "options": ["1.5 mm", "2.5 mm", "3.5 mm", "5 mm"], "answer": 2, "explanation": "Flush terminal plane requires ~3.5 mm of mesial drift of the mandibular first permanent molar (relative to maxillary) to achieve Class I. This is primarily achieved through Lee Way space utilization (~3.4 mm mandibular) during the late mixed dentition transition.", "source": "Welp 2019", "category": "Orthodontics & Occlusion", "domain": "Growth & Development", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "For autotransplantation of a tooth, the ideal root development is:", "options": ["Less than 1/3 complete", "1/3 to 2/3 complete", "2/3 to 3/4 complete", "Fully formed (closed apex)"], "answer": 2, "explanation": "Autotransplantation: best results when root development is 2/3 to 3/4 complete. This allows continued root development and revascularization of the pulp after transplantation. Fully formed roots have the worst prognosis due to inability to revascularize.", "source": "Welp 2019", "category": "Growth & Development", "domain": "Growth & Development", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Why should codeine be avoided in pediatric patients?", "options": ["Increased risk of nephrotoxicity", "Higher risk of addiction", "Some children are ultra-rapid metabolizers, leading to dangerously high morphine levels and respiratory depression", "Codeine is ineffective in children"], "answer": 2, "explanation": "FDA black box warning (2013): Codeine → morphine conversion via CYP2D6. Ultra-rapid metabolizers produce excessive morphine → respiratory depression/death. Particularly dangerous in post-tonsillectomy/adenoidectomy patients and children with sleep apnea. AVOID codeine in children <12 years.", "source": "Welp 2019", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "What is the primary characteristic of Motivational Interviewing (MI)?", "options": ["The clinician provides direct instructions for behavior change", "Open-ended questions, reflective listening, and keeping responsibility for change with the patient/parent (OARS)", "Setting strict goals with consequences", "Telling patients what to do to improve their health"], "answer": 1, "explanation": "Motivational Interviewing: patient-centered approach using OARS: Open-ended questions, Affirmations, Reflective listening, Summarizing. Keeps RESPONSIBILITY for change with the patient/parent. Decreases staff burnout. Evidence base: fair level of evidence per AAPD.", "source": "Welp 2019", "category": "Research Methods & Biostatistics", "domain": "Behavior Guidance", "source_page": "Recalled exam 2019", "source_doc": "welp copy.docx"}, {"q": "Which enzyme in saliva provides protection and buffers against hydrogen peroxide?", "options": ["Lysozyme", "Amylase", "Peroxidase", "Histatin"], "answer": 2, "explanation": "Salivary peroxidase (lactoperoxidase) breaks down hydrogen peroxide. Lysozyme: cleaves peptidoglycan in gram-positive bacteria. Histatin: antimicrobial and antifungal (against Candida). Amylase: digests carbohydrates. IgA: immune function.", "source": "Welp 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "Which immunoglobulin is involved in extrinsic (allergic) asthma?", "options": ["IgA", "IgG", "IgM", "IgE"], "answer": 3, "explanation": "IgE mediates type I (immediate) hypersensitivity reactions including extrinsic/allergic asthma, allergic rhinitis, anaphylaxis. Mast cells and basophils have IgE receptors. When antigen binds IgE on mast cells → degranulation → histamine release. IgA: saliva/breast milk. IgG: secondary immune response/perio.", "source": "Welp 2018", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "What is the mechanism of fluoride in caries prevention?", "options": ["Only prevents bacterial adhesion to enamel", "Inhibits demineralization, enhances remineralization, inhibits bacterial enolase (glycolysis), and forms fluorapatite", "Only remineralizes enamel", "Kills all oral bacteria"], "answer": 1, "explanation": "Fluoride's 3 mechanisms: (1) Inhibits DEMINERALIZATION of enamel; (2) Enhances REMINERALIZATION (forms fluorapatite — less soluble than hydroxyapatite); (3) Inhibits ENOLASE in cariogenic bacteria → reduces glycolysis and acid production. Fluorapatite forms at critical pH in response to acid.", "source": "Welp 2018", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "What is the mechanism of fluoride release from GIC restorations?", "options": ["Active transport", "Ion exchange", "Diffusion", "Osmosis"], "answer": 2, "explanation": "Fluoride release from glass ionomer cement occurs via simple DIFFUSION — movement from higher concentration (restoration) to lower concentration (surrounding environment). This creates a fluoride reservoir effect. GIC also takes up fluoride from external sources (toothpaste, varnish) and re-releases it.", "source": "Welp 2018", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "APF (acidulated phosphate fluoride) gel should NOT be used on which restorations?", "options": ["Composite restorations", "Porcelain veneers and ceramic restorations (changes surface topography)", "Amalgam", "GIC"], "answer": 1, "explanation": "APF (1.23%, pH 3.5) should NOT be used on: porcelain/ceramic restorations, glass ionomer, composite resin — it etches and changes surface topography, causing erosion and dulling. Use neutral NaF (0.9%, pH 7) instead on patients with ceramic/composite restorations.", "source": "Welp 2018", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "What is the hallmark clinical feature of Lesch-Nyhan syndrome?", "options": ["Hypophosphatemia and rickets", "Self-mutilating behavior (lip and finger biting)", "Aggressive periodontitis", "Enamel hypoplasia"], "answer": 1, "explanation": "Lesch-Nyhan syndrome: X-linked recessive, deficiency of HGPRT enzyme → hyperuricemia (gout). Key features: intellectual disability, spastic cerebral palsy, choreoathetosis, and SELF-MUTILATING BEHAVIOR (lip and finger biting). Dental management: mouth guard or extraction to prevent self-injury.", "source": "Welp 2018", "category": "Oral Surgery & Trauma", "domain": "Periodontics", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "Positive and negative reinforcement, omission, and punishment are components of which learning theory?", "options": ["Classical conditioning (Pavlov)", "Operant conditioning (Skinner)", "Social learning theory (Bandura)", "Cognitive development theory (Piaget)"], "answer": 1, "explanation": "Operant conditioning (Skinner): Positive reinforcement = add pleasant stimulus to INCREASE behavior. Negative reinforcement = remove unpleasant stimulus to INCREASE behavior. Punishment = add unpleasant stimulus to DECREASE behavior. Omission = remove pleasant stimulus to DECREASE behavior.", "source": "Welp 2018", "category": "Growth & Development", "domain": "Behavior Guidance", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "What is the main purpose/goal of voice control in pediatric dentistry?", "options": ["Reduce patient pain", "Avert negative behaviors and re-establish communication", "Replace other behavior guidance techniques", "Make the child feel comfortable"], "answer": 1, "explanation": "Voice control: alteration of voice tone, volume, or pace to influence patient behavior. PRIMARY goal: gain child's attention, extinguish negative behavior, re-establish communication. Contraindication: hearing-impaired patients. AAPD evidence level: WEAK.", "source": "Welp 2018", "category": "Behavior Guidance", "domain": "Behavior Guidance", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "Amalgam strength and fracture resistance is attributed to which phase?", "options": ["Silver-tin (γ) phase", "Silver-mercury (γ1) phase", "Tin-mercury (γ2) phase — weakest", "Copper-tin (η') phase — strength"], "answer": 3, "explanation": "Amalgam phases: γ (silver-tin) = strongest. γ1 (silver-mercury) = intermediate. γ2 (tin-mercury) = WEAKEST, most corrosion-prone — eliminated by high-copper amalgam. Copper-tin (η') replaces γ2 in high-copper alloys → increased strength and corrosion resistance.", "source": "Welp 2018", "category": "Restorative Dentistry", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "How can you distinguish an animal bite from a human bite mark?", "options": ["Human bites leave deeper marks", "Animal bites avulse tissue; human bites create compression bruising without tissue avulsion", "Human bites are circular; animal bites are irregular", "There is no reliable distinction"], "answer": 1, "explanation": "Human bite marks: compression bruising, elliptical/horseshoe shape, do NOT avulse tissue, have positive pressure with central ecchymosis, intercanine distance 3-4.5 cm. Animal bites: typically avulse tissue (tearing). For child abuse assessment, >3 cm intercanine distance suggests adult bite.", "source": "Welp 2018", "category": "Caries & Prevention", "domain": "Oral Surgery & Trauma", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "When does a child vocalize excitement and displeasure (developmental milestone)?", "options": ["1-3 months", "4-6 months", "7-9 months", "10-12 months"], "answer": 1, "explanation": "Developmental milestones for vocalization: 0-2 months: cooing. 4-6 months: vocalizes excitement and displeasure, babbles consonant sounds. 6-9 months: babbles, imitates sounds. 12 months: first words. Failure to vocalize by 6 months warrants evaluation.", "source": "Welp 2018", "category": "Growth & Development", "domain": "Caries & Prevention", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "Which structure in cleft lip fails to fuse during embryonic development?", "options": ["Palatine processes fail to fuse with each other", "Maxillary process fails to fuse with the medial nasal process", "Mandibular processes fail to fuse", "Maxillary and lateral nasal processes fail to fuse"], "answer": 1, "explanation": "Cleft lip: failure of MAXILLARY PROCESS to fuse with MEDIAL NASAL PROCESS (also called frontonasal process medial nasal prominence). Cleft palate: failure of palatine processes to fuse with each other (and/or with nasal septum). Occurs between weeks 6-9 of embryonic development.", "source": "Welp 2018", "category": "Oral Pathology & Medicine", "domain": "Special Healthcare Needs", "source_page": "Recalled exam 2018", "source_doc": "welp copy.docx"}, {"q": "Which salivary component binds to enamel and protects against proteolytic degradation?", "options": ["IgA", "Lysozyme", "Histatin", "Statherin"], "answer": 2, "explanation": "Histatin: salivary peptide that is both antimicrobial and antifungal (active against Candida albicans). BINDS to enamel and protects against proteolytic degradation. Statherin: inhibits calcium phosphate precipitation, lubricates enamel. Lysozyme: cleaves gram-positive bacterial cell walls.", "source": "Welp 2017", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "What is the most common site for mandibular fractures in children?", "options": ["Symphysis (14%)", "Body (21%)", "Condyle/subcondylar region (36%)", "Angle (20%)"], "answer": 2, "explanation": "Most common mandibular fracture site in CHILDREN: condyle/subcondylar (36%) — because the condyle is a weak point in the growing mandible. In adults: body of mandible. Bilateral subcondylar fractures → anterior open bite. Treatment: conservative/closed reduction in children.", "source": "Welp 2017", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "Bilateral condylar resorption will most likely result in:", "options": ["Posterior open bite", "Anterior deep bite", "Anterior open bite", "Class II malocclusion only"], "answer": 2, "explanation": "Bilateral condylar resorption (BCR): loss of condylar height bilaterally → ANTERIOR OPEN BITE and chin retrognathia. The mandible rotates clockwise (posterior direction) as condyles lose height. Also associated with Class II skeletal relationship. Seen in females with connective tissue disorders.", "source": "Welp 2017", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "For an obese patient undergoing general anesthesia, the primary concern is:", "options": ["Delayed drug metabolism", "Aspiration (difficult airway, increased gastric volume/pressure)", "Malignant hyperthermia", "Hypotension"], "answer": 1, "explanation": "Obese patients are at higher risk for ASPIRATION during GA due to: increased intra-abdominal pressure, increased gastric acid/volume, hiatal hernia, delayed gastric emptying, and difficult airway management (Mallampati class III-IV). Modified RSI (rapid sequence induction) may be required.", "source": "Welp 2017", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "Regional odontodysplasia ('ghost teeth') is characterized by:", "options": ["Increased enamel thickness with normal dentin", "Large pulps, thin enamel and dentin, ghost-like radiographic appearance, brittle teeth", "Only affects permanent teeth", "Symmetrical distribution affecting entire arch"], "answer": 1, "explanation": "Regional odontodysplasia: affects a region of the jaw (not generalized). Teeth have: large pulp chambers, very thin/poorly mineralized enamel and dentin, 'ghost' appearance on radiograph (indistinct enamel-dentin junction), brittle. Affects both primary and permanent teeth in the same region. Treatment: extraction of severely affected teeth.", "source": "Welp 2017", "category": "Oral Surgery & Trauma", "domain": "Caries & Prevention", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "In an unerupted premolar, approximately how long does it take to move 1 mm through alveolar bone?", "options": ["1-3 months", "4-5 months", "6-8 months", "12 months"], "answer": 1, "explanation": "Erupting premolars require approximately 4-5 months to move through 1 mm of alveolar bone. This is important for space maintainer planning — if a premolar is within 1 mm of erupting, a space maintainer may not be indicated.", "source": "Welp 2017", "category": "Orthodontics & Occlusion", "domain": "Caries & Prevention", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "The Mallampati Class 3 airway classification shows:", "options": ["Soft palate, uvula, fauces, and pillars all visible", "Soft palate, uvula, and fauces visible", "Soft palate and base of uvula visible", "Only hard palate visible"], "answer": 2, "explanation": "Mallampati Classification (mouth open, tongue protruded): Class 1: all visible (soft palate, uvula, fauces, pillars). Class 2: soft palate, uvula, fauces visible. Class 3: ONLY soft palate and BASE of uvula visible. Class 4: ONLY hard palate visible. Higher class = more difficult intubation.", "source": "Welp 2017", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "Decoronation of an ankylosed anterior incisor is most appropriate in which patient to preserve alveolar bone?", "options": ["7-year-old with primary teeth", "13-year-old female (peak growth already occurred)", "17-year-old male (near completion of growth)", "19-year-old female (growth completed)"], "answer": 2, "explanation": "Decoronation of ankylosed tooth to preserve alveolar bone for future implant: best performed AFTER peak growth has occurred but while still growing. Peak growth: females peak at 12-13 years, finish by 13.5-14. Males peak at 14-16, finish by 17-18. A 17-year-old male is near end of growth → ideal timing.", "source": "Welp 2017", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2017", "source_doc": "welp copy.docx"}, {"q": "The first immune cells to respond to bacteria accumulating in the gingival sulcus (innate immunity) are:", "options": ["T lymphocytes", "B lymphocytes/plasma cells", "Phagocytes (macrophages and PMNs/granulocytes)", "Mast cells"], "answer": 2, "explanation": "First line of innate immune response in the gingival sulcus: PHAGOCYTES (macrophages, PMNs/granulocytes, dendritic cells). They phagocytose bacteria and release cytokines/chemokines to recruit more immune cells. PMNs are first to arrive (within minutes to hours), followed by macrophages.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "The number of chest compressions per minute when performing CPR on a child is:", "options": ["60-80 compressions/minute", "80-100 compressions/minute", "100-120 compressions/minute", ">120 compressions/minute"], "answer": 2, "explanation": "Current AHA guidelines: CPR compression rate for ALL ages (infant, child, adult) = 100-120 compressions per minute ('Push fast'). Push at least 2 inches (5 cm) for children. Allow complete chest recoil between compressions. Minimize interruptions.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "Tongue thrusting habits in children should be intervened when the habit persists beyond what age?", "options": ["3 years", "5 years", "7 years", "10 years"], "answer": 1, "explanation": "Most children naturally outgrow tongue thrust by age 5-6 years. If persists beyond age 5-6, it may perpetuate anterior open bite or proclination of incisors. Tongue crib or myofunctional therapy may be indicated. Active intervention typically recommended if habit persists after age 5.", "source": "Welp 2016", "category": "Orthodontics & Occlusion", "domain": "Caries & Prevention", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "The hybrid layer in dentin bonding consists of:", "options": ["Smear layer and polymerized dentin", "Smear layer and resin monomer", "Demineralized dentin (collagen network) and resin monomer infiltrated into tubules", "Calcium and phosphate precipitate"], "answer": 2, "explanation": "Hybrid layer (Nakabayashi, 1982): formed when acid-etching demineralizes dentin, exposing collagen fibrils. Resin monomer infiltrates the exposed collagen network and inter-tubular dentin. After polymerization = hybrid layer = demineralized dentin + polymerized resin. This provides dentin-resin micromechanical bond.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Restorative Dentistry", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "Which primary infant formula has the LEAST fluoride content?", "options": ["Reconstituted soy-based formula", "Reconstituted milk-based formula", "Pre-made (ready-to-feed) soy-based formula", "Pre-made (ready-to-feed) milk-based formula"], "answer": 3, "explanation": "Pre-made/ready-to-feed soy-based formula has the LEAST fluoride content. Reconstituted formulas (both milk and soy) have variable fluoride depending on water used. Pre-made formulas are diluted with water that typically has lower fluoride. Risk of fluorosis: reconstituted formula made with fluoridated water.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "When performing an amalgam Class II preparation in a primary molar, the bevel should be placed at the:", "options": ["Cavosurface margin only", "Axiopulpal line angle", "Axiobuccal and axiolingual line angles", "Cavosurface margin is flared, not beveled"], "answer": 3, "explanation": "In primary molar amalgam Class II preparation: the buccal and lingual extensions should have a FLARE at the cavosurface margin (not an actual bevel like in composite). The axiopulpal line angle is rounded/beveled to reduce stress concentration. The isthmus should be 1/3 the intercuspal width.", "source": "Welp 2016", "category": "Restorative Dentistry", "domain": "Orthodontics & Occlusion", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "Calcium administered for fluoride toxicity works by:", "options": ["Increasing fluoride excretion", "Decreasing bioavailability of fluoride (binds fluoride)", "Alkalinizing the stomach", "Reducing fluoride absorption rate"], "answer": 1, "explanation": "Calcium (milk, calcium gluconate) binds fluoride ions to form insoluble calcium fluoride → DECREASES bioavailability of fluoride → reduces absorption. Management: <8 mg/kg → milk or calcium gluconate + observe. >8 mg/kg → induce vomiting, milk/calcium, refer ER.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "Which is the least cariogenic sugar?", "options": ["Sucrose (most cariogenic)", "Glucose", "Fructose", "Lactose (least cariogenic)"], "answer": 3, "explanation": "Cariogenic ranking (most to least): Sucrose > Fructose ≈ Glucose > Lactose. Lactose is the least cariogenic common sugar. Xylitol is the only 5-carbon sugar that is non-cariogenic. Breast milk has MORE lactose than cow's milk. S. mutans uses only sucrose to form sticky polysaccharides.", "source": "Welp 2016", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "Intrusion of a permanent molar (closed apex) most commonly leads to:", "options": ["Pulp canal obliteration", "External resorption", "Pulp necrosis", "Ankylosis immediately"], "answer": 2, "explanation": "Intrusion of a MATURE (closed apex) permanent tooth most commonly leads to PULP NECROSIS (because the blood supply at the apical foramen is compromised by the closed apex). Immature teeth (open apex) more commonly develop PCO (pulp canal obliteration) as the pulp may remain vital and revascularize.", "source": "Welp 2016", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics", "source_page": "Recalled exam 2016", "source_doc": "welp copy.docx"}, {"q": "What is the most predictive factor for future caries risk in preschool children?", "options": ["High maternal S. mutans levels", "Frequent sugar intake", "Past caries experience", "Poor oral hygiene"], "answer": 2, "explanation": "BEST predictor of future caries = past caries experience (for any age). However, in YOUNG CHILDREN who may not have had caries yet, high maternal S. mutans levels become an important predictor (since past caries experience is not available for caries-free children). AAPD caries risk assessment tool uses multiple factors.", "source": "Welp 2015", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "What bacteria are responsible for black extrinsic staining on teeth?", "options": ["Streptococcus mutans", "Chromogenic bacteria including Actinomyces species", "Porphyromonas gingivalis", "Prevotella melaninogenica"], "answer": 1, "explanation": "Black extrinsic tooth staining is caused by chromogenic bacteria, particularly Actinomyces species. The staining is due to ferrous sulfide from bacterial metabolism. These children often have LOWER caries rates (possibly due to protective effects of some Actinomyces strains). Resistant to professional cleaning.", "source": "Welp 2015", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "Which component of sealants is implicated in potential estrogen effects (endocrine disruption)?", "options": ["TEGDMA", "UDMA", "Bisphenol A (BPA) from bis-DMA hydrolysis", "Bis-GMA directly"], "answer": 2, "explanation": "BPA (bisphenol A) is released from hydrolysis of bis-DMA (bisphenol-A dimethacrylate) — NOT from bis-GMA directly. BPA has potential estrogenic effects. Salivary amylase can hydrolyze bis-DMA → BPA. Rinse and spit after sealant placement to minimize exposure. Current evidence suggests exposure is minimal and transient.", "source": "Welp 2015", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "Custom-fabricated mouthguards are made from which material?", "options": ["Polyurethane", "Polycarbonate", "Polyvinyl acetate-polyethylene", "Polyglycolic acid"], "answer": 2, "explanation": "Custom-fabricated mouthguards: polyvinyl acetate-polyethylene (PVA-PE), vacuum-formed or heat-pressure laminated on a dental cast. Recommended thickness: 3mm. Boil-and-bite (mouth-forming): also polyvinyl acetate-polyethylene (thermoplastic). Stock mouthguards: polyurethane.", "source": "Welp 2015", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "What is the purpose of soaking an avulsed tooth in doxycycline/NaF before reimplantation?", "options": ["Prevent infection", "Prevent ankylosis", "Prevent external root resorption by killing PDL cells", "Delay external root resorption and prevent infection"], "answer": 3, "explanation": "Soaking avulsed tooth in doxycycline (or NaF): PREVENTS EXTERNAL ROOT RESORPTION by eliminating remaining contaminated PDL cells and bacteria on the root surface. Minocycline (EMDOGAIN) may also be used. For teeth that have been extraoral >60 min (dead PDL), doxycycline soak (1mg/20mL saline, 5 min) is recommended before reimplantation.", "source": "Welp 2015", "category": "Oral Pathology & Medicine", "domain": "Caries & Prevention", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "Which suture requires the shortest time before losing tensile strength in the oral cavity?", "options": ["Silk (permanent)", "Vicryl (polyglycolic acid, 3-4 weeks)", "Plain gut (1 week)", "Chromic gut (10-14 days)"], "answer": 2, "explanation": "Plain gut: loses tensile strength in 1 week. Chromic gut: loses tensile strength in 10-14 days. Vicryl (PGA): 3-4 weeks to resorb. Polyglactin 910: similar to Vicryl. Silk and nylon: permanent (non-resorbable). For pediatric dentistry, chromic gut is commonly used for soft tissue closure as it dissolves without removal.", "source": "Welp 2015", "category": "Caries & Prevention", "domain": "Oral Surgery & Trauma", "source_page": "Recalled exam 2015", "source_doc": "welp copy.docx"}, {"q": "Self-mutilation/self-injurious behavior is associated with which syndrome?", "options": ["Down syndrome", "Fragile X syndrome", "Lesch-Nyhan syndrome", "Cornelia de Lange syndrome"], "answer": 2, "explanation": "Self-mutilation (biting lips, fingers, cheeks) is the hallmark of LESCH-NYHAN syndrome (X-linked, HGPRT enzyme deficiency → hyperuricemia). Cornelia de Lange: also associated with self-injurious behavior. Down syndrome: macroglossia, fissured tongue. Fragile X: largest inherited cause of intellectual disability.", "source": "Welp 2014", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "Leukocyte adhesion deficiency is associated with which oral finding?", "options": ["Papilloma of oral mucosa", "Dental caries", "Rapidly progressing periodontitis and tooth loss", "Angular cheilitis"], "answer": 2, "explanation": "Leukocyte adhesion deficiency (LAD): rare autosomal recessive disorder. Neutrophils cannot migrate to sites of infection. Oral: rapidly progressing severe periodontitis and premature tooth loss (primary AND permanent teeth). Absent pus formation despite infection. Early-onset severe periodontitis is pathognomonic.", "source": "Welp 2014", "category": "Oral Pathology & Medicine", "domain": "Caries & Prevention", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "The most predictive factor for MS colonization in an infant is:", "options": ["Birth weight", "Gestational age", "Magnitude of maternal inoculum (mother's MS level)", "C-section vs vaginal birth"], "answer": 2, "explanation": "Successful S. mutans colonization from mother to infant is most affected by: (1) MAGNITUDE OF INOCULUM (mother's MS level — ≥10^5 CFU/mL virtually guarantees transmission), (2) frequency of small-dose inoculation, (3) minimum infective dose. Reducing caries in the mother and avoiding saliva-sharing reduces infant colonization risk.", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "Which electrolyte disturbance is seen in malignant hyperthermia?", "options": ["Hypokalemia", "Hyperkalemia (leading to cardiac arrhythmias)", "Hyponatremia", "Hypercalcemia"], "answer": 1, "explanation": "Malignant hyperthermia: uncontrolled release of calcium from sarcoplasmic reticulum of skeletal muscle → muscle hypermetabolism → HYPERKALEMIA (from muscle breakdown), hyperthermia, acidosis, rhabdomyolysis. Hyperkalemia → cardiac arrhythmias. Treatment: dantrolene (inhibits Ca release from SR).", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "Sodium hypochlorite (NaOCl) used in endodontic irrigation is primarily valued for its:", "options": ["Mechanical flushing action only", "Antimicrobial action and ability to dissolve organic tissue", "Bleaching of tooth structure", "Remineralizing effect"], "answer": 1, "explanation": "NaOCl (sodium hypochlorite): primary irrigant in root canal therapy. Valued for: (1) ANTIMICROBIAL action (broad spectrum), (2) ability to DISSOLVE organic tissue (pulp remnants, collagen, debris). Concentration: 0.5-6%. Accidental injection into periapical tissue → severe pain and swelling.", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Pulp Therapy & Endodontics", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "An unvaccinated patient presents with a contaminated wound. What should be given?", "options": ["Tetanus immunoglobulin alone", "Diphtheria-tetanus (Td) toxoid only", "Both tetanus immunoglobulin AND tetanus toxoid (active + passive immunization)", "Antibiotics only"], "answer": 2, "explanation": "For unvaccinated patients with dirty/tetanus-prone wounds: both ACTIVE immunization (Td or Tdap toxoid) AND PASSIVE immunization (tetanus immunoglobulin/TIG 250 units IM at a different site). Previously vaccinated patients with clean wounds: Td booster if >10 years. Dirty wound: if >5 years since last booster.", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Infection Control & Safety", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "Infants exclusively breastfed for the first 4 months show decreased incidence of:", "options": ["Dental fluorosis", "Vitamin D deficiency", "Respiratory infections", "All of the above"], "answer": 2, "explanation": "Breastfeeding for first 4-6 months: decreased respiratory infections, otitis media, GI infections, some allergies. Note: breast milk is deficient in Vitamin D (NOT increased). The AAP recommends Vitamin D supplements (400 IU/day) for all breastfed infants starting shortly after birth.", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Growth & Development", "source_page": "Recalled exam 2014", "source_doc": "welp copy.docx"}, {"q": "Carbamide peroxide vs. hydrogen peroxide for tooth bleaching — what distinguishes carbamide?", "options": ["Carbamide peroxide is less stable and shorter shelf life", "Carbamide peroxide is MORE stable, longer shelf life", "Hydrogen peroxide is more effective for nightguard bleaching", "There is no clinical difference"], "answer": 1, "explanation": "Carbamide peroxide (CP) = hydrogen peroxide + urea. MORE STABLE than hydrogen peroxide, LONGER shelf life. 10% CP releases ~3.5% HP. Used in nightguard bleaching. HP degrades faster. 10% CP for nightguard is most common home bleaching concentration. In-office: 35-38% HP.", "source": "Welp 2014", "category": "Caries & Prevention", "domain": "Caries & Prevention", "source_page": "Recalled exam 2014", "source
