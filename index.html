ference"], "answer": 1, "explanation": "Epstein's pearls: remnants of EPITHELIAL tissue along the MID-PALATINE RAPHE. Bohn's nodules: remnants of MUCOUS GLAND (salivary) tissue, found on ridges and hard palate AWAY from the raphe. Both are benign, present in newborns, resolve spontaneously. Riga-Fede disease: ulceration under tongue from natal/neonatal teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Taurodontism is a failure of which developmental structure?", "options": ["Enamel organ (outer enamel epithelium)", "Stellate reticulum", "Hertwig's epithelial root sheath", "Dental papilla"], "answer": 2, "explanation": "Taurodontism (enlarged pulp chamber, apically displaced furcation): failure/delayed invagination of HERTWIG'S EPITHELIAL ROOT SHEATH. Associated with: Klinefelter syndrome, Down syndrome, tricho-dento-osseous syndrome (TDO = AI type 4 + taurodontism). Stage = morphodifferentiation.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "Koplik spots are pathognomonic for which disease, and Strawberry tongue for which?", "options": ["Koplik's = Rubella; Strawberry tongue = Scarlet fever", "Koplik's = Rubeola (measles); Strawberry tongue = Kawasaki disease OR Scarlet fever", "Koplik's = Chickenpox; Strawberry tongue = Measles", "Both are associated with Kawasaki disease"], "answer": 1, "explanation": "Koplik spots (white spots on buccal mucosa) = RUBEOLA (measles). Strawberry tongue (red, swollen, with enlarged papillae) = KAWASAKI DISEASE or SCARLET FEVER (Group A strep pharyngitis). Kawasaki = fever >5 days + conjunctivitis + rash + cervical lymphadenopathy + strawberry tongue.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Herpangina is caused by which virus?", "options": ["Herpes simplex virus (DNA virus)", "Epstein-Barr virus", "Coxsackie A virus (RNA virus)", "Varicella zoster virus"], "answer": 2, "explanation": "Herpangina: Coxsackie A virus (RNA virus, enterovirus). Features: fever, vesicular/ulcerative lesions ONLY on posterior oral mucosa (soft palate, uvula, tonsils, fauces). NOT anterior. Same virus family as Hand-Foot-Mouth disease (HFM = Coxsackie A16, also Enterovirus 71). HFM complication: meningitis.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which oral lesion appears as 'floating teeth' on radiograph in a child?", "options": ["Dentigerous cyst", "Traumatic bone cyst", "Langerhans cell histiocytosis (LCH)", "Ameloblastoma"], "answer": 2, "explanation": "Langerhans cell histiocytosis (LCH, formerly histiocytosis X): 'floating teeth' appearance on radiograph due to alveolar bone destruction. Neuroectodermal tumor of infancy can also cause floating teeth in the maxillary anterior. LCH: ulceration, bone destruction, premature tooth loss, gingival involvement.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Which of the following is the appropriate kVp for dental intraoral radiographs?", "options": ["40-50 kVp", "60-70 kVp", "90-100 kVp", "120-140 kVp"], "answer": 1, "explanation": "Appropriate kVp for dental intraoral radiographs: 60-70 kVp. CBCT uses higher kVp. Digital sensors allow dose reduction vs. film. Long-cone paralleling technique preferred. Lead apron: required for circular collimation; NOT required for rectangular collimation per updated guidelines.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Radiology", "domain": "Radiology"}, {"q": "Which organ/tissue receives the HIGHEST equivalent radiation dose from a CBCT of the mandible?", "options": ["Thyroid gland", "Eye lens", "Salivary glands", "Bone marrow"], "answer": 2, "explanation": "CBCT radiation dose: SALIVARY GLANDS receive highest equivalent dose from mandibular CBCT (1,598 µSv), followed by oral mucosa and extrathoracic airway. For maxillary CBCT: salivary glands also highest (1,847 µSv). This is why CBCT should only be used when benefit clearly outweighs risk.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Radiology", "domain": "Radiology"}, {"q": "Talon cusp (dens evaginatus from the lingual surface) is most commonly associated with which syndrome?", "options": ["Down syndrome", "Rubenstein-Taybi syndrome", "Apert syndrome", "Crouzon syndrome"], "answer": 1, "explanation": "Talon cusp (most common on maxillary lateral incisor lingual surface) is associated with RUBENSTEIN-TAYBI syndrome. Dens invaginatus (dens in dente) most commonly found on maxillary lateral incisor. Dens evaginatus (occlusal cusp) most common on mandibular premolars (particularly in East Asian populations).", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "The most common congenitally missing tooth (excluding third molars) is:", "options": ["Maxillary lateral incisor", "Maxillary second premolar", "Mandibular second premolar", "Mandibular central incisor"], "answer": 2, "explanation": "Congenitally missing teeth (excluding 3rd molars), most to least common: Mandibular 2nd premolar > Maxillary lateral incisor > Maxillary 2nd premolar. Most commonly IMPACTED tooth: 3rd molars > Maxillary canine (2nd most impacted). Maxillary canines: 85% palatal, 15% labial.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "Which condition causes 'ghost teeth' (regional odontodysplasia)?", "options": ["Generalized enamel hypoplasia affecting the entire dentition", "Regional defect causing large pulps, thin enamel/dentin, 'ghost' radiographic appearance, brittle teeth", "Enamel hypomineralization (MIH)", "Dentinogenesis imperfecta affecting both dentitions"], "answer": 1, "explanation": "Regional odontodysplasia ('ghost teeth'): affects a REGION of the jaw (not generalized). Teeth have large pulps, very thin/hypomineralized enamel and dentin, 'ghost' appearance on radiograph (indistinct EDJ). Both primary AND permanent teeth in the same quadrant/region are affected. Treatment: extraction of affected teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Surgery & Trauma", "domain": "Oral Surgery & Trauma"}, {"q": "The most common heart defect associated with Down syndrome (Trisomy 21) is:", "options": ["Ventricular septal defect (VSD)", "Atrial septal defect (ASD)", "Atrioventricular septal defect (AVSD)", "Patent ductus arteriosus (PDA)"], "answer": 2, "explanation": "Down syndrome most common cardiac defect: ATRIOVENTRICULAR SEPTAL DEFECT (AVSD = AV canal defect, ~40% of DS cardiac defects). Also associated: VSD, ASD, PDA. Down syndrome also associated with: celiac disease, Alzheimer's, hypothyroidism, ALL/AML leukemia (10-20x risk), neutrophil chemotaxis defect.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "Sturge-Weber syndrome is characterized by a vascular malformation of which type?", "options": ["Arterial malformation (hemangioma)", "Venous malformation (port-wine stain — leptomeningeal angioma)", "Lymphatic malformation", "Capillary malformation of the heart"], "answer": 1, "explanation": "Sturge-Weber syndrome: VENOUS malformation. Features: port-wine stain (nevus flammeus) on face (trigeminal distribution), leptomeningeal angioma, glaucoma, seizures. Oral: gingival hemangioma on side of port-wine stain. Angioma in oral cavity can bleed profusely during dental procedures.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The oral/dental hallmark of Epidermolysis Bullosa (EB) simplex (most common form) is:", "options": ["Enamel hypoplasia (seen in Junctional EB)", "Taurodontism", "Ankylosis of teeth", "Excess fibrous acellular cementum (Dystrophic EB)"], "answer": 0, "explanation": "EB types: Simplex = most common, mildest. Junctional EB = ENAMEL HYPOPLASIA (separation at basement membrane). Dystrophic EB = defect in TYPE VII COLLAGEN, EXCESS fibrous acellular cementum, most severe. Main cause of death in EB infants: FAILURE TO THRIVE. G6PD: avoid prilocaine, benzocaine (methemoglobinemia risk).", "source": "STAR STAR 2022 / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Which medication used for ADHD causes bruxism and xerostomia?", "options": ["Atomoxetine (Strattera)", "Methylphenidate (Ritalin/Concerta)", "Amphetamine (Adderall)", "Both methylphenidate and amphetamines"], "answer": 3, "explanation": "Both methylphenidate (Ritalin) AND amphetamines (Adderall/Dexedrine) cause bruxism and xerostomia as side effects. These are stimulant medications. Dental implications: increased caries risk (xerostomia), TMJ symptoms, wear facets from bruxism. Atomoxetine (Strattera) is a non-stimulant ADHD med.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "Williams syndrome is associated with which cardiac defect?", "options": ["Tetralogy of Fallot", "Supravalvular aortic stenosis", "VSD", "Coarctation of the aorta"], "answer": 1, "explanation": "Williams syndrome: SUPRAVALVULAR AORTIC STENOSIS (most characteristic). Features: 'elfin' facies, intellectual disability, hypercalcemia, hypersensitivity to sounds, very sociable/friendly personality. Oral: small teeth, wide spacing, Class II malocclusion. Caused by deletion of chromosome 7q11.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "Wiskott-Aldrich syndrome is associated with which dental finding?", "options": ["Premature tooth loss with intact roots", "Over-retained primary teeth", "Severe periodontitis in primary dentition", "Enamel hypoplasia"], "answer": 1, "explanation": "Wiskott-Aldrich syndrome: X-linked immunodeficiency with OVER-RETAINED PRIMARY TEETH. Other syndromes with delayed eruption/over-retained primary teeth: Down syndrome, Crouzon, Cornelia de Lange, Noonan, DiGeorge, Cleidocranial Dysplasia. Wiskott-Aldrich: thrombocytopenia, eczema, immunodeficiency (WETIS mnemonic).", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "Cleidocranial dysplasia is characterized by which dental finding?", "options": ["Premature exfoliation of primary teeth and aggressive periodontitis", "Multiple supernumerary teeth, delayed exfoliation of primary teeth, and delayed eruption", "Complete absence of permanent teeth", "Enamel hypoplasia affecting only primary teeth"], "answer": 1, "explanation": "Cleidocranial Dysplasia (CCD): RUNX2 gene mutation. Features: hypoplastic/absent clavicles, wide fontanelles, multiple SUPERNUMERARY teeth, DELAYED EXFOLIATION of primary teeth, DELAYED ERUPTION of permanent teeth. Treatment: surgical exposure and orthodontic guidance of permanent teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Orthodontics & Occlusion", "domain": "Orthodontics & Occlusion"}, {"q": "What is the postictal phase of a seizure and why is it the most dangerous?", "options": ["Active seizure with muscle contractions — dangerous due to aspiration", "The aura phase before seizure — dangerous due to unpredictability", "Post-seizure unconsciousness, confusion, and partial paralysis — dangerous due to airway compromise and recovery state", "The tonic phase — dangerous due to hypoxia"], "answer": 2, "explanation": "Seizure phases: (1) PRODROMAL: aura (30% have this). (2) ICTAL: active seizure (tonic → clonic contractions). (3) POSTICTAL: most dangerous — headache, atonia/partial paralysis, confusion, fatigue, possible incontinence, unconsciousness leading to confused awakening. Status epilepticus = seizure >5 minutes.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "A patient with an uncontrolled well-managed grand mal seizure disorder would have which ASA classification?", "options": ["ASA I", "ASA II", "ASA III", "ASA IV"], "answer": 1, "explanation": "WELL-CONTROLLED seizure disorder = ASA II (controlled systemic disease with no functional limitation). POORLY CONTROLLED seizure disorder = ASA III or IV. ASA I = no systemic disease. ASA IV = incapacitating disease with constant threat to life. Ketogenic diet is used to treat seizure disorders.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The most common type of febrile seizure is:", "options": ["Absence (petit mal)", "Myoclonic", "Focal (partial)", "Generalized tonic-clonic"], "answer": 3, "explanation": "Febrile seizures: most common type = GENERALIZED TONIC-CLONIC (grand mal). Occur in 2-5% of children aged 6 months to 5 years with rapidly rising fever. Simple febrile seizures: <15 min, generalized, single episode within 24h. Complex: >15 min, focal, or recurrence within 24h.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Beckwith-Wiedemann syndrome in dental treatment requires what primary consideration?", "options": ["Increased bleeding risk", "Airway compromise due to macroglossia", "Malignant hyperthermia risk", "Severe periodontitis"], "answer": 1, "explanation": "Beckwith-Wiedemann syndrome: AIRWAY COMPROMISE due to macroglossia (large tongue). Features: macroglossia, macrosomia, omphalocele, hypoglycemia, ear pits. Dental: Class III tendency, anterior open bite from macroglossia. May require tongue reduction surgery. Glossoptosis can obstruct airway during sedation/GA.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Fetal alcohol syndrome is characterized by which ORAL/FACIAL finding?", "options": ["Micrognathia and cleft palate", "Macroglossia and prognathism", "Indistinct/flat philtrum and thin upper lip", "Prominent nose and midface hypoplasia"], "answer": 2, "explanation": "Fetal alcohol syndrome (FAS): INDISTINCT/FLAT PHILTRUM (smooth philtrum), thin upper lip, small palpebral fissures, microcephaly, intellectual disability, growth retardation. No safe amount of alcohol during pregnancy. Fetal alcohol SPECTRUM disorder (FASD) is broader term.", "source": "STAR STAR 2022 / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}, {"q": "Local anesthetics work by which mechanism?", "options": ["Reversibly blocking potassium channels", "Reversibly blocking sodium channels → preventing depolarization", "Permanently blocking sodium channels", "Activating GABA receptors"], "answer": 1, "explanation": "LA mechanism: REVERSIBLE BLOCKAGE of sodium channels → prevents Na+ influx → blocks depolarization and conduction of action potentials. Ionized form (RNH+) binds intracellular receptor. Only the NON-IONIZED (free base, RN) form can cross nerve membrane. Low pH in infected tissue → more ionized LA → LESS effective.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Tachyphylaxis in local anesthesia is MOST likely to occur when:", "options": ["A patient has never received the medication before", "Nerve function returns prior to re-injection (allowing nerve re-polarization and tissue pH restoration)", "A patient is very young", "The patient is highly anxious"], "answer": 1, "explanation": "Tachyphylaxis (diminishing effectiveness with repeated doses of LA): MOST likely when nerve function RETURNS before re-injection. The nerve re-polarizes, and the acidic anesthetic environment builds up with multiple injections. Waiting until patient reports pain before re-injecting is the classic trigger.", "source": "Jack QE Course / QE Practice Test 2025", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Esters local anesthetics are metabolized by which enzyme/location?", "options": ["Liver via cytochrome P450", "Plasma pseudocholinesterase", "Kidney filtration", "Salivary amylase"], "answer": 1, "explanation": "ESTER LAs (procaine, tetracaine, benzocaine, cocaine): metabolized by PLASMA PSEUDOCHOLINESTERASE → PABA (para-aminobenzoic acid) = major metabolite responsible for allergic reactions. AMIDE LAs (lidocaine, mepivacaine, bupivacaine, articaine): metabolized in LIVER by cytochrome P450. Articaine: 90% plasma, 10% P450.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Which local anesthetic contains a thiophene ring with an ester group (making it a unique hybrid)?", "options": ["Bupivacaine", "Mepivacaine", "Articaine", "Prilocaine"], "answer": 2, "explanation": "ARTICAINE is unique: it's an AMIDE with an ESTER side chain and a THIOPHENE ring (instead of benzene ring). This gives it better tissue penetration. Metabolized 90% by plasma esterases, 10% by liver P450. Has highest protein binding of commonly used LAs. Available as 4% with 1:100,000 or 1:200,000 epi.", "source": "Jack QE Course / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "The FIRST sign of local anesthetic systemic toxicity (LAST) is:", "options": ["Seizures", "Cardiac arrhythmia", "Tinnitus or circumoral numbness/dizziness (CNS excitatory signs)", "Loss of consciousness"], "answer": 2, "explanation": "LAST progression: CNS excitation → CNS depression → Cardiovascular toxicity. FIRST signs: tinnitus, metallic taste, dizziness, circumoral numbness, visual disturbances, agitation. Then: seizures (CNS excitation). Then: CNS depression (drowsiness, unconsciousness). LAST: cardiovascular collapse. Bupivacaine is most cardiotoxic.", "source": "2023 Recalled / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "Which drug causes gingival enlargement/hyperplasia?", "options": ["Metformin", "Atorvastatin", "Verapamil (and other calcium channel blockers, phenytoin, cyclosporine)", "Methotrexate"], "answer": 2, "explanation": "Drug-induced gingival enlargement: 3 main drug classes: (1) CALCIUM CHANNEL BLOCKERS (verapamil, nifedipine, amlodipine), (2) PHENYTOIN (Dilantin) — anticonvulsant, (3) CYCLOSPORINE — immunosuppressant. Gingival enlargement is fibrous (not inflammatory). Associated with plaque but requires drug as initiating factor.", "source": "STAR STAR 2022 / 2020 Recalled", "category": "Periodontics", "domain": "Periodontics"}, {"q": "Nitrous oxide (N2O) interferes with the metabolism of which vitamin?", "options": ["Vitamin D", "Vitamin B6", "Vitamin B12", "Folic acid (Vitamin B9)"], "answer": 2, "explanation": "N2O irreversibly oxidizes VITAMIN B12 (cobalamin) → inactivates methionine synthase → blocks DNA synthesis. Chronic N2O exposure (abuse or repeated exposure) can cause: megaloblastic anemia, peripheral neuropathy, subacute combined degeneration. Single dental exposures: minimal clinical concern.", "source": "2024 Recalled / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "What is the best method to provide the EARLIEST indication of depressed ventilation in a moderately sedated child?", "options": ["Pulse oximetry", "Blood pressure monitoring", "Capnography (EtCO2)", "Clinical observation of chest rise"], "answer": 2, "explanation": "CAPNOGRAPHY (end-tidal CO2 monitoring) provides the EARLIEST indication of depressed ventilation — detects rising CO2 BEFORE oxygen saturation drops (pulse oximetry lags). Normal EtCO2: 30-40 mmHg. Required per AAPD/AAP sedation guidelines. Pulse oximetry detects HYPOXIA, capnography detects HYPOVENTILATION.", "source": "STAR STAR 2022 / 2023 Recalled", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "What is the IV fluid maintenance rate for a 25 kg child (Holliday-Segar formula)?", "options": ["25 mL/hr", "55 mL/hr", "65 mL/hr", "75 mL/hr"], "answer": 2, "explanation": "Holliday-Segar formula: First 10 kg = 4 mL/kg/hr (40 mL/hr). Next 10 kg = 2 mL/kg/hr (20 mL/hr). Each kg above 20 = 1 mL/kg/hr (5 mL/hr for 25kg). Total = 40+20+5 = 65 mL/hr. This is the '4-2-1 rule' for maintenance IV fluid rate in pediatric patients.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Which is the current AAPD-recommended material for primary tooth pulpotomy (strong recommendation, moderate evidence)?", "options": ["Calcium hydroxide (Ca(OH)2)", "Ferric sulfate", "MTA (mineral trioxide aggregate) and formocresol", "Zinc oxide eugenol (ZOE) alone"], "answer": 2, "explanation": "AAPD 2022 guidelines: MTA and formocresol = strong recommendation, moderate-quality evidence for primary tooth pulpotomy (success rates 77-91%). Ferric sulfate: forms protein complex/hemostasis, conditional recommendation. Calcium hydroxide: not recommended for primary tooth pulpotomy (high failure rates). BiodentineTM: newer alternative.", "source": "Jack QE Course / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "Indication for indirect pulp therapy (IPT) in a primary tooth:", "options": ["Spontaneous pain and percussion sensitivity", "Provoked pain only, intact lamina dura, no radiographic signs of pathology", "Furcal radiolucency", "Sinus tract present"], "answer": 1, "explanation": "IPT (stepwise excavation) indications: PROVOKED (not spontaneous) pain, intact lamina dura, NO radiographic pathology (no furcal/periapical lesion, no internal/external resorption). The purpose of IPT's first step: CHANGE THE CARIOGENIC ENVIRONMENT. ZOE placed deep decreases nerve stimulation.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "LSTR (Lesion Sterilization and Tissue Repair) uses which antibiotic combination?", "options": ["Amoxicillin + metronidazole + doxycycline", "Metronidazole + ciprofloxacin + minocycline (3Mix)", "Clindamycin + tetracycline + amoxicillin", "Penicillin + metronidazole + erythromycin"], "answer": 1, "explanation": "LSTR uses 3Mix: metronidazole + ciprofloxacin + minocycline placed inside the infected pulp chamber. Aims to sterilize the lesion and promote tissue repair/regeneration by the host. Alternative to pulpectomy in primary teeth when canals cannot be negotiated. Minocycline may cause tooth discoloration.", "source": "2023A Recalled / Board Review", "category": "Infection Control & Safety", "domain": "Infection Control & Safety"}, {"q": "For a Cvek pulpotomy (partial pulpotomy), what is the MOST important factor for success?", "options": ["Using MTA as the pulp capping material", "Tight marginal seal of the restoration", "Patient age under 10 years", "Using rubber dam for isolation"], "answer": 1, "explanation": "Cvek pulpotomy (partial pulpotomy for traumatic pulp exposure in an immature permanent tooth): the TIGHT MARGINAL SEAL of the restoration is the most important factor for success. Even MTA cannot compensate for microleakage. Success rates: 90-97% with proper technique. Can perform up to several days after exposure.", "source": "STAR STAR 2022 / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "Which percussion finding is an indication for non-vital pulp therapy in a primary tooth?", "options": ["Sensitivity to hot/cold only", "Spontaneous pain only", "Percussion sensitivity (pathognomonic of inflammation beyond the pulp)", "Normal response to EPT"], "answer": 2, "explanation": "Percussion sensitivity in a PRIMARY tooth = inflammation has extended BEYOND the pulp into the periradicular tissues → indication for NON-VITAL pulp therapy (pulpectomy) or extraction. Other indications for non-vital therapy: furcal/periapical radiolucency, sinus tract, pathologic mobility, pain on biting.", "source": "STAR STAR 2022 / Board Review", "category": "Pulp Therapy & Endodontics", "domain": "Pulp Therapy & Endodontics"}, {"q": "The most common cause of pediatric cardiac arrest is:", "options": ["Primary cardiac arrhythmia", "Asphyxiation/hypoxia (airway obstruction)", "Hypovolemia", "Septic shock"], "answer": 1, "explanation": "Pediatric cardiac arrest differs from adults: most common cause in children = ASPHYXIATION/HYPOXIA (respiratory arrest leading to cardiac arrest). This is why the pediatric emergency order prioritizes AIRWAY and BREATHING. Emergency sequence: Resp. arrest > Resp. depression > Cardiac arrest > Desaturation > Seizure.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "In a choking child (>1 year old), what is the FIRST maneuver to perform?", "options": ["Back blows only", "Abdominal thrusts (Heimlich maneuver)", "Back blows + chest thrusts (as for infants)", "Call 911 before any intervention"], "answer": 1, "explanation": "CHOKING: Child (>1 year): ABDOMINAL THRUSTS (Heimlich maneuver). Infant (<1 year): 5 BACK BLOWS + 5 CHEST THRUSTS (NOT abdominal thrusts — risk of abdominal organ injury in infants). Responsive child: encourage coughing, do Heimlich if cannot cough/breathe. Unconscious: CPR.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the most appropriate initial treatment for anaphylaxis?", "options": ["IV diphenhydramine (Benadryl)", "Epinephrine 1:1000, 0.01 mg/kg IM (lateral thigh)", "Oral prednisolone", "Albuterol inhaler"], "answer": 1, "explanation": "Anaphylaxis treatment: EPINEPHRINE is FIRST LINE — 1:1000 concentration, 0.01 mg/kg IM, lateral thigh (fastest absorption). Max 0.5 mg adult, 0.3 mg child. Mechanism: alpha-1 agonist (vasoconstriction), beta-1 (cardiac), beta-2 (bronchodilation). Antihistamines and steroids are SECONDARY — do NOT replace epi.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "In a dental emergency, the MOST common emergency encountered in pediatric dentistry practice is:", "options": ["Cardiac arrest", "Laryngospasm", "Respiratory arrest or depression", "Anaphylaxis"], "answer": 2, "explanation": "Most common dental emergencies in order: (1) Respiratory arrest/depression → (2) Cardiac arrest → (3) Desaturation → (4) Seizure → (5) Laryngospasm → (6) Respiratory distress. Respiratory complications are overwhelmingly most common, which is why airway monitoring (capnography, pulse oximetry) is paramount.", "source": "STAR STAR 2022 / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "The DTaP vaccine schedule for children is:", "options": ["One dose at 12 months, 4 years, and 11 years", "3-dose series at 2, 4, 6 months; boosters at 15-18 months and 4-6 years", "Annual vaccination starting at 6 months", "2 doses at 2 months and 6 years"], "answer": 1, "explanation": "DTaP (Diphtheria, Tetanus, Pertussis) schedule: PRIMARY series: 2, 4, 6 months. BOOSTER 1: 15-18 months. BOOSTER 2: 4-6 years. Tdap (for older children/adults): 11-12 years, then Td every 10 years. DTaP = for infants/young children. Tdap = for older children/adults (lower dose diphtheria/pertussis).", "source": "2023A Recalled / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "HPV vaccine routine vaccination schedule begins at age:", "options": ["9-10 years (can start as early as 9)", "11-12 years (routine recommendation)", "15-16 years", "18 years"], "answer": 1, "explanation": "HPV vaccine: routine = ages 11-12 years (can start at 9). 2-dose schedule if started before age 15: doses 0 and 6-12 months. 3-dose schedule if started at age 15+: 0, 1-2, 6 months. Catch-up vaccination: through age 26. FDA approved for up to age 45. Protects against 9 HPV types (Gardasil 9).", "source": "2023A Recalled / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the minimum required occlusal reduction for a zirconia crown on a primary tooth?", "options": ["0.5 mm", "1.0 mm", "1.5 mm", "2.0 mm"], "answer": 2, "explanation": "Zirconia crowns (NuSmile, Cheng Crowns): require ~1.5 mm occlusal reduction. Fracture resistance is enhanced by average or greater inciso-cervical length, and centric contacts located over the concave lingual portion. Shoulder margin is preferred for occlusal strength. SSCs require 1.0-1.5 mm occlusal reduction.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "What is the width-to-length ratio considered ideal for maxillary central incisor esthetics?", "options": ["62%", "70%", "80%", "100% (square tooth)"], "answer": 2, "explanation": "Ideal width-to-length ratio for maxillary central incisor: 80% (tooth is taller than wide). Golden proportions for adjacent teeth relative to each other: LI visible width = 62% of CI. Canine visible width = 62% of LI. Golden ratio (1.618) applies to relative widths between adjacent teeth.", "source": "STAR STAR 2022 / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What does resin infiltration (ICON) penetrate enamel by?", "options": ["Active transport", "Osmotic pressure", "Capillary action", "Mechanical pressure"], "answer": 2, "explanation": "ICON resin infiltration: penetrates through CAPILLARY ACTION into the porous enamel of white spot lesions. Pre-treatment with 15% HCl (or 6.6% for microabrasion ICON ENAMEL) creates channels for infiltration. Effective up to 1/3 of dentin thickness (D1 lesion in ADA classification). Seals the lesion without cavity preparation.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "What is the MOST important factor for sealant success?", "options": ["Type of sealant material used", "Retention (adequate bonding to tooth surface)", "Use of self-etching primers", "Patient age"], "answer": 1, "explanation": "Most important factor for sealant success: RETENTION. Factors improving retention: 4-handed technique, isolation (rubber dam or cotton rolls), adequate etching (15-30 seconds), dry field. Sealants reduce caries risk by 76% vs. unsealed teeth after 2-3 years. Self-etching primers: NOT recommended (reduces retention).", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "For a primary molar Class II amalgam prep, which line angle must be ROUNDED?", "options": ["Mesiobuccal line angle", "Axiobuccal line angle", "Axiopulpal line angle", "Gingivoaxial line angle"], "answer": 2, "explanation": "Primary molar Class II amalgam prep: the AXIOPULPAL line angle must be ROUNDED (beveled) to reduce stress concentration and prevent amalgam fracture. The cavosurface margins have a slight flare (NOT an actual bevel). Isthmus width should be 1/3 intercuspal width. Pulpal depth: 1.5-2 mm.", "source": "STAR STAR 2022 / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "MTA discoloration of the crown is caused by which component?", "options": ["Calcium silicate", "Zirconium oxide", "Bismuth oxide (radiopacifier)", "Iron oxide"], "answer": 2, "explanation": "MTA crown discoloration: caused by BISMUTH OXIDE (the radiopacifier component). Light/moisture activation causes bismuth to oxidize and penetrate dentinal tubules → gray/brown discoloration. Newer formulation (White MTA) replaced bismuth oxide with zirconium oxide to reduce staining while maintaining radiopacity.", "source": "2023 Channel / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "SSC (stainless steel crowns) interfere with which imaging modality?", "options": ["CT scan only", "Conventional X-ray", "MRI (causes scatter artifact)", "Ultrasound"], "answer": 2, "explanation": "SSCs cause SIGNIFICANT SCATTER ARTIFACT on MRI. The metallic content (chromium, nickel, iron, etc.) distorts the MRI magnetic field. For patients with SSCs who need MRI of the head/neck: discuss with radiologist, may need alternative imaging. CBCT: SSCs also cause scatter but less severe.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "SSC occlusal reduction is how much?", "options": ["0.5 mm", "1.0-1.5 mm", "2.0 mm", "No reduction needed (Hall technique)"], "answer": 1, "explanation": "SSC prep requires 1.0-1.5 mm OCCLUSAL REDUCTION (some sources say 1.0 mm). Hall technique: NO occlusal reduction, NO caries removal, NO local anesthesia — the crown is cemented over the caries. Hall technique: occlusion normalizes within 2-4 weeks as teeth/bite adapts.", "source": "2023 Channel / Board Review", "category": "Pharmacology & Sedation", "domain": "Pharmacology & Sedation"}, {"q": "An antibiotic that can cause QT prolongation (cardiac arrhythmia risk) is:", "options": ["Amoxicillin", "Clindamycin", "Azithromycin (Z-pak)", "Metronidazole"], "answer": 2, "explanation": "AZITHROMYCIN is associated with QT prolongation and potentially fatal cardiac arrhythmias (torsades de pointes). This is a Black Box Warning. Erythromycin also has this risk. Use with caution in patients with cardiac conduction abnormalities. Clindamycin: avoid in patients with IBS/IBD (risk of C. diff colitis).", "source": "2023 Channel / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "What is the recommended material for restorations in pregnant women?", "options": ["Amalgam (established track record)", "Glass ionomer cement (GIC)", "Composite resin", "Avoid all restorations until after delivery"], "answer": 2, "explanation": "Composite resin is recommended for restorations in pregnant women. Avoid amalgam during pregnancy (mercury concerns). GIC and composite are both acceptable, but composite is preferred for durability. Dental treatment is SAFE during pregnancy — the second trimester is ideal timing for elective procedures.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "How long after Hall technique SSC placement does the occlusion typically normalize?", "options": ["1-2 days", "2-4 weeks", "3-6 months", "It never normalizes — must grind crown"], "answer": 1, "explanation": "Hall technique SSC: the crown creates a temporary increase in vertical dimension. Occlusion normalizes within 2-4 WEEKS through dentoalveolar compensation (slight intrusion of the cemented tooth and overeruption of opposing tooth). No permanent harmful effects on TMJ have been documented.", "source": "2023 Channel / Board Review", "category": "Restorative Dentistry", "domain": "Restorative Dentistry"}, {"q": "What is the earliest age S. mutans can be detected in the oral cavity?", "options": ["At birth", "3 months", "6-10 months (with primary tooth eruption)", "15.7 months"], "answer": 1, "explanation": "S. mutans can be detected as early as 3 MONTHS of age in pre-dentate infants (even without teeth). The oral microbiome is established early. Colonization increases with tooth eruption. Some studies report detection at birth. Window of infectivity (highest risk for colonization): 19-33 months.", "source": "2023 Channel / STAR STAR", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "The most common bacteria found in a chronic dental infection are:", "options": ["Gram-positive aerobic streptococci", "Gram-negative anaerobic bacteria", "Spirochetes and Treponema", "Staphylococcus aureus"], "answer": 1, "explanation": "CHRONIC dental/periapical infections: predominantly GRAM-NEGATIVE ANAEROBIC bacteria (Bacteroides, Prevotella, Fusobacterium, Peptostreptococcus). ACUTE infections: more gram-positive aerobes/facultative anaerobes. This is why amoxicillin + metronidazole or clindamycin covers both acute and chronic dental infections.", "source": "STAR STAR / Board Review", "category": "Caries & Prevention", "domain": "Caries & Prevention"}, {"q": "Brown tumor of the jaw is associated with which metabolic condition?", "options": ["Vitamin D deficiency (rickets)", "Hyperparathyroidism (primary or secondary from renal disease)", "Hypophosphatasia", "Paget's disease"], "answer": 1, "explanation": "Brown tumors: GIANT CELL lesions of bone associated with HYPERPARATHYROIDISM (primary = parathyroid adenoma; secondary = renal disease). PTH → increased osteoclastic activity → bone lesions. 'Brown' color from hemosiderin deposits. Radiograph: multilocular radiolucency. Must rule out giant cell granuloma.", "source": "STAR STAR 2022 / Board Review", "category": "Oral Pathology & Medicine", "domain": "Oral Pathology & Medicine"}, {"q": "A patient with latex allergy may also be allergic to which fruits (latex-fruit syndrome)?", "options": ["Apples and oranges", "Kiwi, banana, and avocado", "Strawberries and mangoes", "Grapes and pineapple"], "answer": 1, "explanation": "LATEX-FRUIT SYNDROME: patients with latex allergy have cross-reactive allergies to KIWI, BANANA, AVOCADO (most common triad). Also: chestnut, papaya. Mechanism: shared proteins between latex (Hevea brasiliensis) and these fruits. Important for dental patients: use latex-free gloves and equipment.", "source": "2024 Recalled / Board Review", "category": "Special Healthcare Needs", "domain": "Special Healthcare Needs"}];
const BLUEPRINT = {"Caries & Prevention": 0.15, "Growth & Development": 0.09, "Behavior Guidance": 0.09, "Restorative Dentistry": 0.1, "Pulp Therapy & Endodontics": 0.1, "Radiology": 0.08, "Oral Surgery & Trauma": 0.08, "Oral Pathology & Medicine": 0.08, "Pharmacology & Sedation": 0.08, "Orthodontics & Occlusion": 0.07, "Periodontics": 0.05, "Special Healthcare Needs": 0.05, "Research Methods & Biostatistics": 0.04, "Infection Control & Safety": 0.03};

const EMOJIS = ['👩‍⚕️','👨‍⚕️','🦷','🩺','📚','🎓','🧠','⭐','🔬','💊','🏆','🌟'];
const COLORS = ['#5b8af0','#7c6af5','#3ecf82','#f06060','#f5c842','#f07c3a','#42c8f5','#e05bf5','#50c8a0','#f5a742','#a0a0f5','#f57c9e'];
const DOMAIN_ORDER = Object.keys(BLUEPRINT);

// ── Storage helpers ────────────────────────────────────────────────────
const STORAGE_KEY = 'abpd_profiles_v2';
function loadProfiles() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return {};
}
function saveProfiles(profiles) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(profiles));
}
function getProfile(slot) {
  return loadProfiles()[slot] || null;
}
function putProfile(slot, data) {
  const profiles = loadProfiles();
  profiles[slot] = data;
  saveProfiles(profiles);
}
function newProfile(slot) {
  return {
    slot, name: '', emoji: EMOJIS[slot % EMOJIS.length],
    color: COLORS[slot % COLORS.length],
    wrongIds: [], stats: {}, totalCorrect: 0, totalWrong: 0,
    sessions: 0, lastSeen: null
  };
}

// ── Session state (in-memory only, not persisted) ─────────────────────
let state = {
  mode: 'mcq', domain: 'all', queue: [], idx: 0,
  answered: false, correct: 0, wrong: 0, skipped: 0,
  sessionStats: {}, isDrilling: false, shuffle: true,
  activeSlot: null,
};

// ── Profile Screen ─────────────────────────────────────────────────────
function renderProfileScreen() {
  const profiles = loadProfiles();
  const grid = document.getElementById('profile-grid');
  grid.innerHTML = '';
  for (let slot = 0; slot < 6; slot++) {
    const p = profiles[slot];
    const card = document.createElement('div');
    card.className = 'profile-card' + (p && p.name ? '' : ' empty');
    if (p && p.name) {
      const total = p.totalCorrect + p.totalWrong;
      const pct = total > 0 ? Math.round(p.totalCorrect / total * 100) : 0;
      card.innerHTML = `
        <div class="profile-avatar" style="background:${p.color}22">${p.emoji}</div>
        <div class="profile-name">${p.name}</div>
        <div class="profile-stats">${total > 0 ? pct+'% overall · '+total+' answered' : 'No questions yet'}<br>${p.wrongIds.length > 0 ? p.wrongIds.length+' to review' : 'No missed questions'}</div>
        <div class="profile-badge"></div>`;
      card.onclick = () => enterApp(slot);
    } else {
      card.innerHTML = `
        <div class="profile-avatar" style="background:var(--surface2);font-size:22px">+</div>
        <div class="profile-name" style="color:var(--muted)">Profile ${slot+1}</div>
        <div class="profile-stats" style="color:var(--muted)">Click to set up</div>`;
      card.onclick = () => openEditModal(slot, true);
    }
    grid.appendChild(card);
  }
}

// ── Modal ──────────────────────────────────────────────────────────────
let modalSlot = null, modalIsNew = false;
let selectedEmoji = '', selectedColor = '';

function openEditModal(slot, isNew) {
  modalSlot = slot;
  modalIsNew = isNew;
  const p = getProfile(slot) || newProfile(slot);
  selectedEmoji = p.emoji;
  selectedColor = p.color;

  document.getElementById('modal-title').textContent = isNew ? 'Create Profile '+(slot+1) : 'Edit Profile';
  document.getElementById('modal-name').value = p.name || '';
  document.getElementById('reset-btn').style.display = isNew ? 'none' : 'block';

  // Emoji picker
  const ep = document.getElementById('emoji-picker');
  ep.innerHTML = EMOJIS.map(e => `<div class="emoji-opt${e===selectedEmoji?' selected':''}" onclick="pickEmoji('${e}',this)">${e}</div>`).join('');

  // Color picker
  const cp = document.getElementById('color-picker');
  cp.innerHTML = COLORS.map(c => `<div class="color-opt${c===selectedColor?' selected':''}" style="background:${c}" onclick="pickColor('${c}',this)"></div>`).join('');

  document.getElementById('edit-modal').classList.add('open');
  setTimeout(() => document.getElementById('modal-name').focus(), 50);
}

function pickEmoji(e, el) {
  selectedEmoji = e;
  document.querySelectorAll('.emoji-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}
function pickColor(c, el) {
  selectedColor = c;
  document.querySelectorAll('.color-opt').forEach(x => x.classList.remove('selected'));
  el.classList.add('selected');
}
function closeModal() {
  document.getElementById('edit-modal').classList.remove('open');
}
function saveProfile() {
  const name = document.getElementById('modal-name').value.trim();
  if (!name) { document.getElementById('modal-name').focus(); return; }
  const existing = getProfile(modalSlot) || newProfile(modalSlot);
  existing.name = name;
  existing.emoji = selectedEmoji;
  existing.color = selectedColor;
  putProfile(modalSlot, existing);
  closeModal();
  if (modalIsNew) {
    enterApp(modalSlot);
  } else {
    renderProfileScreen();
    updateProfilePill();
  }
}
function resetProfile() {
  if (!confirm('Reset all progress for this profile? This cannot be undone.')) return;
  const p = newProfile(modalSlot);
  p.name = document.getElementById('modal-name').value.trim() || 'Profile '+(modalSlot+1);
  p.emoji = selectedEmoji; p.color = selectedColor;
  putProfile(modalSlot, p);
  closeModal();
  renderProfileScreen();
}

// ── Enter App ──────────────────────────────────────────────────────────
function enterApp(slot) {
  const p = getProfile(slot);
  if (!p || !p.name) { openEditModal(slot, true); return; }
  state.activeSlot = slot;
  // Restore wrongIds from profile
  state.wrongIds = new Set(p.wrongIds || []);
  state.correct = 0; state.wrong = 0; state.skipped = 0;
  state.sessionStats = {};
  // Update last seen
  p.lastSeen = new Date().toLocaleDateString();
  putProfile(slot, p);

  document.getElementById('profile-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  updateProfilePill();
  buildSidebar();
  updateWrongButton();
  selectDomain('all');
}

function switchProfile() {
  // Save session wrong IDs before leaving
  persistWrongIds();
  document.getElementById('app').style.display = 'none';
  document.getElementById('profile-screen').style.display = 'flex';
  renderProfileScreen();
  // Reset session
  state.correct = 0; state.wrong = 0; state.skipped = 0;
  updateChips();
}

function persistWrongIds() {
  if (state.activeSlot === null) return;
  const p = getProfile(state.activeSlot);
  if (!p) return;
  p.wrongIds = [...state.wrongIds];
  putProfile(state.activeSlot, p);
}

function updateProfilePill() {
  const p = getProfile(state.activeSlot);
  if (!p) return;
  document.getElementById('pill-avatar').textContent = p.emoji;
  document.getElementById('pill-avatar').style.background = p.color+'22';
  document.getElementById('pill-name').textContent = p.name;
}

// ── Sidebar ────────────────────────────────────────────────────────────
const domainCounts = {};
ALL_QUESTIONS.forEach(q => {
  const d = q.domain || q.category || 'Other';
  domainCounts[d] = (domainCounts[d]||0)+1;
});

function buildSidebar() {
  const list = document.getElementById('domain-list');
  list.innerHTML = '';
  DOMAIN_ORDER.forEach(domain => {
    const cnt = domainCounts[domain]||0;
    if (!cnt) return;
    const pct = Math.round((BLUEPRINT[domain]||0)*100);
    const btn = document.createElement('button');
    btn.className = 'domain-btn';
    btn.id = 'd-'+btoa(domain).replace(/=/g,'');
    btn.innerHTML = `<span class="d-name">${domain}<br><span class="d-weight">${pct}% of exam</span></span><span class="d-count">${cnt}</span>`;
    btn.onclick = () => selectDomain(domain);
    list.appendChild(btn);
  });
  document.getElementById('cnt-all').textContent = ALL_QUESTIONS.length;
}

function selectDomain(domain) {
  state.domain = domain; state.isDrilling = false;
  document.querySelectorAll('.domain-btn').forEach(b => b.classList.remove('active'));
  const id = domain==='all' ? 'd-all' : 'd-'+btoa(domain).replace(/=/g,'');
  const btn = document.getElementById(id);
  if (btn) btn.classList.add('active');
  document.getElementById('topbar-title').textContent = domain==='all' ? 'All Domains' : domain;
  renderStart();
}

function setMode(mode) {
  state.mode = mode;
  document.getElementById('mode-mcq').classList.toggle('active', mode==='mcq');
  document.getElementById('mode-recall').classList.toggle('active', mode==='recall');
  selectDomain(state.domain);
}

// ── Queue ──────────────────────────────────────────────────────────────
function buildQueue(domain, ids=null) {
  let pool = ids ? [...ids] : domain==='all'
    ? ALL_QUESTIONS.map((_,i)=>i)
    : ALL_QUESTIONS.map((q,i)=>(q.domain||q.category)===domain?i:-1).filter(i=>i>=0);
  if (state.shuffle) for (let i=pool.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];
  }
  return pool;
}

function startQuiz(domain) {
  state.queue=buildQueue(domain); state.idx=0;
  state.correct=0; state.wrong=0; state.skipped=0;
  state.answered=false; state.isDrilling=false; state.sessionStats={};
  updateChips(); renderQuestion();
}

function startDrillWrong() {
  if (!state.wrongIds.size) return;
  state.queue=buildQueue(null,[...state.wrongIds]); state.idx=0;
  state.correct=0; state.wrong=0; state.skipped=0;
  state.answered=false; state.isDrilling=true; state.sessionStats={};
  document.querySelectorAll('.domain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('wrong-drill-btn').classList.add('active');
  document.getElementById('topbar-title').textContent='🎯 Drilling Missed Questions';
  updateChips(); renderQuestion();
}

// ── Start Screen ───────────────────────────────────────────────────────
function renderStart() {
  const domain = state.domain;
  const allIds = domain==='all' ? ALL_QUESTIONS.map((_,i)=>i)
    : ALL_QUESTIONS.map((q,i)=>(q.domain||q.category)===domain?i:-1).filter(i=>i>=0);
  const count = allIds.length;
  const wrongInDomain = [...state.wrongIds].filter(i=>domain==='all'||(ALL_QUESTIONS[i].domain||ALL_QUESTIONS[i].category)===domain).length;
  const pct = domain!=='all' ? Math.round((BLUEPRINT[domain]||0)*100) : null;

  // Lifetime stats for this domain from saved profile
  const p = getProfile(state.activeSlot) || {};
  const saved = (p.stats||{})[domain==='all'?'__all__':domain]||{correct:0,wrong:0};
  const lifetimeTotal = saved.correct+saved.wrong;
  const lifetimePct = lifetimeTotal>0 ? Math.round(saved.correct/lifetimeTotal*100) : null;

  document.getElementById('quiz-area').innerHTML = `
    <div class="start-card">
      <h2>${domain==='all'?'All Domains':domain}</h2>
      <p>${pct?`<strong>${pct}% of the ABPD QE</strong> — `:''}${count} question${count!==1?'s':''} available. Use <strong>Free Recall</strong> mode to force active retrieval, or <strong>Multiple Choice</strong> to test recognition.</p>
      <div class="start-stats">
        <div class="start-stat"><div class="n">${count}</div><div class="l">Questions in set</div></div>
        <div class="start-stat"><div class="n" style="color:var(--red)">${wrongInDomain}</div><div class="l">Missed this session</div></div>
        <div class="start-stat"><div class="n">${lifetimePct!==null?lifetimePct+'%':'—'}</div><div class="l">Lifetime accuracy</div></div>
        <div class="start-stat"><div class="n">${lifetimeTotal||'—'}</div><div class="l">Lifetime answered</div></div>
      </div>
      <div class="shuffle-row">
        <label class="toggle-switch"><input type="checkbox" ${state.shuffle?'checked':''} onchange="state.shuffle=this.checked"><span class="toggle-slider"></span></label>
        <span class="toggle-label">Shuffle questions</span>
      </div>
      <div class="start-actions">
        <button class="nav-btn primary" onclick="startQuiz(${JSON.stringify(domain)})">Start Drilling</button>
        ${wrongInDomain>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${wrongInDomain} Missed ✗</button>`:''}
      </div>
    </div>`;
}

// ── Question Rendering ─────────────────────────────────────────────────
function renderQuestion() {
  const area = document.getElementById('quiz-area');
  if (state.idx >= state.queue.length) { renderResults(); return; }
  const qIdx = state.queue[state.idx];
  const q = ALL_QUESTIONS[qIdx];
  const domain = q.domain||q.category||'';
  const total = state.queue.length;
  const pct = Math.round(state.idx/total*100);
  const labels=['A','B','C','D','E'];

  let answerHtml = state.mode==='mcq'
    ? `<div class="options-grid">${q.options.map((opt,i)=>`<button class="option-btn" id="opt-${i}" onclick="selectAnswer(${i},${qIdx})"><span class="option-label">${labels[i]}</span><span>${opt}</span></button>`).join('')}</div>`
    : `<div class="recall-area"><textarea class="recall-textarea" id="recall-input" placeholder="Type what you recall — key facts, mechanism, numbers..."></textarea><button class="recall-reveal-btn" id="reveal-btn" onclick="revealAnswer(${qIdx})">Reveal Answer</button></div>`;

  area.innerHTML = `
    <div class="progress-bar-wrap">
      <div class="progress-meta"><span>${state.isDrilling?'🎯 Drilling missed':domain}</span><span>${state.idx+1} / ${total}</span></div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="question-card">
      <div class="q-meta"><span class="q-tag domain-tag">${domain}</span><span class="q-tag">Q ${state.idx+1}</span></div>
      <div class="question-text">${q.q}</div>
      ${answerHtml}
      <div class="explanation-box" id="exp-box"><div class="exp-label">Explanation</div><div id="exp-text"></div></div>
    </div>
    <div class="nav-row">
      <button class="nav-btn primary" id="next-btn" onclick="nextQuestion()" style="display:none">Next →</button>
      <span class="skip-link" onclick="skipQuestion()">Skip</span>
    </div>`;
  state.answered=false;
}

// ── MCQ ────────────────────────────────────────────────────────────────
function selectAnswer(selectedIdx, qIdx) {
  if (state.answered) return;
  state.answered=true;
  const q=ALL_QUESTIONS[qIdx]; const correct=q.answer;
  document.querySelectorAll('.option-btn').forEach((btn,i)=>{
    btn.disabled=true;
    if(i===correct) btn.classList.add('correct');
    if(i===selectedIdx&&i!==correct) btn.classList.add('wrong');
  });
  const domain=q.domain||q.category||'';
  if(!state.sessionStats[domain]) state.sessionStats[domain]={correct:0,wrong:0};
  if(selectedIdx===correct) {
    state.correct++; state.sessionStats[domain].correct++;
    state.wrongIds.delete(qIdx);
  } else {
    state.wrong++; state.sessionStats[domain].wrong++;
    state.wrongIds.add(qIdx); updateWrongButton();
  }
  persistProgress(domain, selectedIdx===correct);
  showExplanation(q.explanation);
  updateChips();
  document.getElementById('next-btn').style.display='block';
}

// ── Free Recall ────────────────────────────────────────────────────────
function revealAnswer(qIdx) {
  if(state.answered) return;
  state.answered=true;
  const q=ALL_QUESTIONS[qIdx];
  document.getElementById('reveal-btn').disabled=true;
  document.getElementById('exp-box').classList.add('show');
  document.getElementById('exp-text').innerHTML=`<strong style="color:var(--green)">✓ ${q.options[q.answer]}</strong><br><br>${q.explanation}`;
  const sg=document.createElement('div');
  sg.className='self-grade show'; sg.id='self-grade';
  sg.innerHTML=`<button class="grade-btn got-it" onclick="gradeRecall(true,${qIdx})">Got it ✓</button><button class="grade-btn missed" onclick="gradeRecall(false,${qIdx})">Missed it ✗</button>`;
  document.querySelector('.recall-area').appendChild(sg);
}

function gradeRecall(gotIt, qIdx) {
  const q=ALL_QUESTIONS[qIdx]; const domain=q.domain||q.category||'';
  if(!state.sessionStats[domain]) state.sessionStats[domain]={correct:0,wrong:0};
  document.querySelectorAll('.grade-btn').forEach(b=>b.disabled=true);
  if(gotIt) {
    state.correct++; state.sessionStats[domain].correct++;
    state.wrongIds.delete(qIdx);
    document.querySelector('.grade-btn.got-it').style.background='rgba(62,207,130,.25)';
  } else {
    state.wrong++; state.sessionStats[domain].wrong++;
    state.wrongIds.add(qIdx); updateWrongButton();
    document.querySelector('.grade-btn.missed').style.background='rgba(240,96,96,.25)';
  }
  persistProgress(domain, gotIt);
  updateChips();
  document.getElementById('next-btn').style.display='block';
}

// ── Persist progress to profile ────────────────────────────────────────
function persistProgress(domain, wasCorrect) {
  if(state.activeSlot===null) return;
  const p=getProfile(state.activeSlot);
  if(!p) return;
  if(!p.stats) p.stats={};
  if(!p.stats[domain]) p.stats[domain]={correct:0,wrong:0};
  if(!p.stats['__all__']) p.stats['__all__']={correct:0,wrong:0};
  if(wasCorrect) {
    p.stats[domain].correct++; p.stats['__all__'].correct++;
    p.totalCorrect=(p.totalCorrect||0)+1;
  } else {
    p.stats[domain].wrong++; p.stats['__all__'].wrong++;
    p.totalWrong=(p.totalWrong||0)+1;
  }
  p.wrongIds=[...state.wrongIds];
  putProfile(state.activeSlot, p);
}

function showExplanation(text) {
  const box=document.getElementById('exp-box');
  box.classList.add('show');
  document.getElementById('exp-text').textContent=text;
}

function nextQuestion() { state.idx++; renderQuestion(); }
function skipQuestion() { state.skipped++; state.idx++; renderQuestion(); }
function updateChips() {
  document.getElementById('chip-correct').textContent='✓ '+state.correct;
  document.getElementById('chip-wrong').textContent='✗ '+state.wrong;
}
function updateWrongButton() {
  const btn=document.getElementById('wrong-drill-btn');
  const cnt=document.getElementById('cnt-wrong');
  if(state.wrongIds.size>0){btn.style.display='flex';cnt.textContent=state.wrongIds.size;}
}

// ── Results ────────────────────────────────────────────────────────────
function renderResults() {
  const total=state.correct+state.wrong;
  const pct=total>0?Math.round(state.correct/total*100):0;
  let rows='';
  Object.entries(state.sessionStats).sort((a,b)=>b[1].correct+b[1].wrong-a[1].correct-a[1].wrong).forEach(([d,s])=>{
    const t=s.correct+s.wrong; const p=t>0?Math.round(s.correct/t*100):0;
    const color=p>=80?'var(--green)':p>=60?'var(--yellow)':'var(--red)';
    rows+=`<tr><td>${d}</td><td style="text-align:right;font-weight:700;color:${color}">${p}%</td><td style="text-align:right;color:var(--muted);font-size:12px">${s.correct}/${t}</td></tr>`;
  });
  document.getElementById('quiz-area').innerHTML=`
    <div class="results-card">
      <div class="results-score"><span class="pct">${pct}%</span></div>
      <div class="results-sub">Session complete · ${total+state.skipped} attempted</div>
      <div class="results-grid">
        <div class="stat-box"><div class="stat-num g">${state.correct}</div><div class="stat-label">Correct</div></div>
        <div class="stat-box"><div class="stat-num r">${state.wrong}</div><div class="stat-label">Missed</div></div>
        <div class="stat-box"><div class="stat-num y">${state.skipped}</div><div class="stat-label">Skipped</div></div>
      </div>
      ${rows?`<div class="domain-breakdown"><table>${rows}</table></div>`:''}
      <div class="results-actions">
        <button class="nav-btn primary" onclick="startQuiz(${JSON.stringify(state.domain)})">Restart</button>
        ${state.wrongIds.size>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${state.wrongIds.size} Missed ✗</button>`:''}
        <button class="nav-btn secondary" onclick="selectDomain('all')">All Domains</button>
      </div>
    </div>`;
}

// ── Progress Panel ─────────────────────────────────────────────────────
function showStatsPanel() {
  const p=getProfile(state.activeSlot)||{};
  const stats=p.stats||{};
  const allStat=stats['__all__']||{correct:0,wrong:0};
  const allTotal=allStat.correct+allStat.wrong;
  const allPct=allTotal>0?Math.round(allStat.correct/allTotal*100):0;
  let rows='';
  DOMAIN_ORDER.forEach(domain=>{
    const s=stats[domain]||{correct:0,wrong:0};
    const t=s.correct+s.wrong;
    if(!t) return;
    const pct=Math.round(s.correct/t*100);
    const color=pct>=80?'var(--green)':pct>=60?'var(--yellow)':'var(--red)';
    const exam=Math.round((BLUEPRINT[domain]||0)*100);
    rows+=`<div class="domain-stat-row">
      <span class="dsn">${domain}<br><span style="font-size:11px;color:var(--muted)">${exam}% of exam</span></span>
      <div class="ds-bar-wrap"><div class="ds-bar" style="width:${pct}%;background:${color}"></div></div>
      <span class="dsp" style="color:${color}">${pct}%</span>
      <span class="ds-count">${s.correct}/${t}</span>
    </div>`;
  });

  document.getElementById('quiz-area').innerHTML=`
    <div class="stats-card">
      <h3>${p.emoji||''} ${p.name||'My Progress'}</h3>
      <div class="results-grid" style="margin-bottom:20px">
        <div class="stat-box"><div class="stat-num">${allPct}%</div><div class="stat-label">Overall accuracy</div></div>
        <div class="stat-box"><div class="stat-num g">${allStat.correct}</div><div class="stat-label">All-time correct</div></div>
        <div class="stat-box"><div class="stat-num r">${state.wrongIds.size}</div><div class="stat-label">In review queue</div></div>
      </div>
      ${rows||'<p style="color:var(--muted);text-align:center;padding:20px">No history yet — start drilling!</p>'}
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="nav-btn primary" onclick="selectDomain('all')">Start Drilling</button>
      ${state.wrongIds.size>0?`<button class="nav-btn secondary" onclick="startDrillWrong()" style="color:var(--red);border-color:var(--red)">Drill ${state.wrongIds.size} Missed ✗</button>`:''}
      <button class="nav-btn secondary" onclick="openEditModal(${state.activeSlot},false)">Edit Profile</button>
    </div>`;
  document.querySelectorAll('.domain-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('topbar-title').textContent='📊 My Progress';
}

// ── Init ───────────────────────────────────────────────────────────────
renderProfileScreen();
</script>
</body>
</html>
