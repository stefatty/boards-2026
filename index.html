PD QE Prep Course 2024 — Q.213", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the mechanism of action of dantrolene?", "options": ["Blocking neuromuscular transmission", "Decreasing calcium in muscle cells", "Increasing adenosine triphosphate hydrolysis", "Reversing muscle relaxant triggering agents"], "answer": 1, "explanation": "Correct: B. Decreasing calcium in muscle cells", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.214", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "For a 25 kg child, what would be the hourly rate for fluid replacement?", "options": ["25 mL/hour", "50 mL/hour", "65 mL/hour", "75 mL/hour"], "answer": 2, "explanation": "Correct: C. 65 mL/hour", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.215", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The minimum alveolar concentration (MAC) of nitrous oxide is:", "options": ["5%.", "55%.", "105%.", "115%."], "answer": 2, "explanation": "Correct: C. 105%. MAC is the alveolar concentration of an inhaled anesthetic required to prevent movement in 50% of patients exposed to a surgical stimulus. N2O MAC of 105% means it cannot produce surgical anesthesia at atmospheric pressure alone — hence it is used as an adjunct gas.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.216", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Oxygen makes up approximately what percent of room air?", "options": ["10", "20", "30", "40"], "answer": 1, "explanation": "Correct: B. 20% (precisely 20.9%). Room air composition: ~78% nitrogen, ~21% oxygen, ~1% argon, ~0.04% CO2. In dental sedation, always ensure adequate oxygen delivery; hypoxia risk increases with all sedation agents.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.217", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Where is nitrous oxide metabolized?", "options": ["Most is exhaled without being metabolized.", "Most is metabolized in the brain.", "Most is metabolized in the kidney.", "Most is metabolized in the liver."], "answer": 0, "explanation": "Correct: A. Most is exhaled without being metabolized.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.218", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following conditions is a potential indication for nitrous oxide?", "options": ["Cobalamin deficiency", "First trimester of pregnancy", "Severe emotional disturbance", "Strong gag reflex"], "answer": 3, "explanation": "Correct: D. Strong gag reflex", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.219", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which enzyme is inactivated by nitrous oxide?", "options": ["Carbonic anhydrase", "Methionine synthase", "Phenylalanine hydroxylase", "S1 nuclease"], "answer": 1, "explanation": "Correct: B. Methionine synthase", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.220", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What reading is displayed on an oxygen \"E\" cylinder that is 1⁄2 empty?", "options": ["500 psi", "750 psi", "1000 psi", "2000 psi"], "answer": 2, "explanation": "Correct: C. 1000 psi", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.221", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What reading is displayed on a portable nitrous oxide cylinder that is 1⁄2 empty?", "options": ["375 psi", "750 psi", "1000 psi", "2000 psi"], "answer": 1, "explanation": "Correct: B. 750 psi. Nitrous oxide cylinders display pressure that remains nearly constant (~750 psi) until the liquid N2O is nearly depleted, because liquid and gas phases coexist. This is why you cannot gauge remaining N2O by pressure alone — you must weigh the cylinder.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.222", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Diffusion hypoxia results when:", "options": ["nitrous oxide displaces oxygen at carrying sites on hemoglobin.", "nitrous oxide passes out of the bloodstream and into the lungs.", "oxygen concentration in the brain is too great, reducing the rate of breathing.", "oxygen concentrations in the lungs are too great, reducing the rate of breathing."], "answer": 1, "explanation": "Correct: B. nitrous oxide passes out of the bloodstream and into the lungs.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.223", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What American Society of Anesthesiologists Physical Status Classification is generallyconsidered too great a risk for in-office moderate procedural sedation?", "options": ["II or greater", "III or greater", "IV or greater", "V or greater"], "answer": 1, "explanation": "Correct: B. III or greater", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.224", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which dosing scalar is most appropriate for dosing sedation medications for overweight patients?", "options": ["Body mass index", "Lean body weight", "Mean weight for age", "Total body weight"], "answer": 2, "explanation": "Correct: C. Mean weight for age", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.225", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is true of the pediatric airway compared with the adult airway?", "options": ["Glottis is more posterior", "Increased airway resistance", "Larynx is lower", "Relatively smaller tongue"], "answer": 1, "explanation": "Correct: B. Increased airway resistance", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.226", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A child consumed 8 ounces of water at 8:00 AM. He presents for sedation at 9:00 AM. How long should you wait prior to sedating the child?", "options": ["2 hours", "3 hours", "4 hours", "No delay is necessary"], "answer": 0, "explanation": "Correct: A. 2 hours. AAPD/ASA NPO guidelines for clear liquids (including water, clear juice, tea without milk) = 2 hours before sedation/anesthesia. Formula/non-human milk = 6 hours. Breast milk = 4 hours. Solid food/fatty food = 8 hours.", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.227", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A child consumed a piece of toast at 8:00 AM. He presents for sedation at 9:00 AM. How would you manage this situation?", "options": ["Wait 2 hours before sedating", "Wait 3 hours before sedating", "Wait 6 hours before sedating", "Wait 7 hours before sedating"], "answer": 2, "explanation": "Correct: C. Wait 6 hours before sedating", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.228", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which term describes the interaction of a drug and receptors in the site of action?", "options": ["Pharmacodynamics", "Pharmacogenetics", "Pharmacokinetics", "Pharmacotherapeutics"], "answer": 0, "explanation": "Correct: A. Pharmacodynamics", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.229", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which common oral sedation medication is contraindicated in patients with seizure disorders?", "options": ["Chloral hydrate", "Hydroxyzine", "Midazolam", "Meperidine"], "answer": 3, "explanation": "Correct: D. Meperidine", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Pharmacology & Sedation", "source_page": "AAPD QE Prep Course 2024 — Q.230", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is formed by endochondral ossification?", "options": ["Body of mandible", "Cranial base", "Cranial vault", "Nasomaxillary complex"], "answer": 1, "explanation": "Correct: B. Cranial base", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.66", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The second pharyngeal arch gives rise to which of the following?", "options": ["Mandible", "Maxilla", "Muscles of facial expression", "Muscles of mastication"], "answer": 2, "explanation": "Correct: C. Muscles of facial expression", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.67", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A cleft lip occurs due to failure of fusion of which two processes?", "options": ["Lateral nasal and maxillary", "Maxillary and maxillary", "Medial nasal and maxillary", "Medial nasal and medial nasal"], "answer": 2, "explanation": "Correct: C. Medial nasal and maxillary", "source": "QE Prep Course 2024", "domain": "Special Healthcare Needs", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024 — Q.68", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is defined as radiating ossification of mesenchymal condensation?", "options": ["Appositional", "Endochondral", "Interstitial", "Intramembranous"], "answer": 3, "explanation": "Correct: D. Intramembranous?", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.69", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The first sign of ossification of the mandible is:", "options": ["endochondral ossification within Meckel's cartilage.", "initial osteogenesis lateral to Meckel's cartilage.", "intramembranous ossification at the midline of the mandible.", "mesenchymal condensation at the future site of the condyle."], "answer": 1, "explanation": "Correct: B. initial osteogenesis lateral to Meckel's cartilage.", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.70", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which structure develops via mixed intramembranous and endochondral ossification?", "options": ["Cranial base", "Cranial vault", "Mandible", "Maxilla"], "answer": 2, "explanation": "Correct: C. Mandible", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.71", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Displacement/translation of the maxilla occurs in which direction?", "options": ["Downward and backward", "Downward and forward", "Upward and backward", "Upward and forward"], "answer": 1, "explanation": "Correct: B. Downward and forward", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.72", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "When does fusion of the mandibular suture occur?", "options": ["During the perinatal period", "3 to 4 months of age", "5 to 6 months of age", "7 to 8 months of age"], "answer": 3, "explanation": "Correct: D. 7 to 8 months of age", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.73", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Bolton analysis assesses:", "options": ["anteroposterior growth.", "intermaxillary tooth size.", "transverse growth.", "vertical growth."], "answer": 1, "explanation": "Correct: B. intermaxillary tooth size.", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.74", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A flush terminal plane in the primary dentition most often results in what molar relationship in the permanent dentition?", "options": ["Class I", "End-on Class II", "Full Class II", "Class III"], "answer": 0, "explanation": "Correct: A. Class I. A flush terminal plane (primary second molars end-to-end distally) most commonly transitions to a Class I permanent molar relationship (~56%) via the mesial step created by differential jaw growth and leeway space utilization.", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.75", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the late mesial shift?", "options": ["Mandibular primary molars close primate space behind canines", "Mesial migration of the mandibular first permanent molars into leeway space", "Relieving of the anterior diastema due to eruption of canines", "Replacement of the incisors with increase in labial inclination"], "answer": 1, "explanation": "Correct: B. Mesial migration of the mandibular first permanent molars into leeway space", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.76", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "At which stage is there an equal number of primary and permanent teeth?", "options": ["First inter-transitional period", "First transitional period", "Second inter-transitional period", "Second transitional period"], "answer": 2, "explanation": "Correct: C. Second inter-transitional period", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.77", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which primary molar relation is most frequently associated with subsequent Class II molar relation in the permanent dentition?", "options": ["Distal step", "Flush terminal plane", "Mesial step", "There is no correlation"], "answer": 0, "explanation": "Correct: A. Distal step", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.78", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "At what stage is the anterior-posterior depth of the mandibular arch the greatest?", "options": ["After eruption of the permanent first", "During the eruption of the premolars", "Prior to the early mesial shift", "Subsequent to eruption of the incisors"], "answer": 2, "explanation": "Correct: C. Prior to the early mesial shift", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.79", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Because growth has little effect in this area, an overall view of patient growth may be gained by evaluation of serial cephalometric radiographs superimposing which of the following?", "options": ["Basion-nasion plane and facial axis", "Frankfort horizontal plane and pterygoid vertical plane", "Palatal plane and pterygoid vertical plane", "Sella-nasion plane and facial axis"], "answer": 3, "explanation": "Correct: D. Sella-nasion plane and facial axis?", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Radiology", "source_page": "AAPD QE Prep Course 2024 — Q.80", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which is true of the mandibular plane angle?", "options": ["Excess values may indicate counter clockwise (i.e., dolichofacial) growth patterns.", "It changes with growth, increasing approximately one degree every four years.", "It is formed by the intersection of the basion-nasion plane with the mandibular plane.", "Values exceeding one standard deviation below the norm imply vertical deficiency."], "answer": 3, "explanation": "Correct: D. Values exceeding one standard deviation below the norm imply vertical deficiency.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.81", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which is true regarding the association between nonnutritive sucking behavior and malocclusions?", "options": ["Digital sucking and pacifier sucking have similar risks for developing most malocclusion features.", "Digital sucking is more significantly associated with posterior crossbite than pacifier sucking.", "Pacifier suckers are more likely than digit suckers to develop an increased overjet.", "Pacifiers, compared with digit sucking, were associated with a higher risk of developing most malocclusion features."], "answer": 0, "explanation": "Correct: A. Digital sucking and pacifier sucking have similar risks for", "source": "QE Prep Course 2024", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.82", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Half of all children with a non-nutritive sucking habit will discontinue this habit as early as age:", "options": ["19-23 months.", "24-28 months.", "29-33 months.", "34-38 months."], "answer": 1, "explanation": "Correct: B. 24-28 months.", "source": "QE Prep Course 2024", "domain": "Behavior Guidance", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.83", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "For patients undergoing rapid maxillary expansion, the greatest increase in width typically occurs at which suture?", "options": ["Intermaxillary", "Internasal", "Maxillonasal", "Pterygomaxillary"], "answer": 0, "explanation": "Correct: A. Intermaxillary", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.84", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is true regarding increase in midpalatal suture width for patients undergoing rapid maxillary expansion?", "options": ["The greatest increase occurs at the central incisor level.", "The greatest increase occurs at the canine level.", "The greatest increase occurs at the first molar level.", "There is uniform increase in width at all levels."], "answer": 0, "explanation": "Correct: A. The greatest increase occurs at the central incisor level", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.85", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Primate spaces in the primary dentition are located:", "options": ["between canines and first molars in both arches.", "between laterals and canines in both arches.", "distal to mandibular laterals and maxillary canines.", "distal to maxillary laterals and mandibular canines."], "answer": 3, "explanation": "Correct: D. distal to maxillary laterals and mandibular canines.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.86", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Developmental deficiencies occurring during the morphodifferentiation stage can lead to:", "options": ["hypodontia.", "hypomaturation amelogenesis imperfecta.", "hypoplastic amelogenesis imperfecta.", "microdontia."], "answer": 3, "explanation": "Correct: D. microdontia.", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024 — Q.87", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Formation of enamel and dentin matrices:", "options": ["is characterized by apposition.", "is completed before mineralization begins.", "occurs sequentially, dentin prior to enamel.", "progresses from cervical to incisal regions"], "answer": 2, "explanation": "Correct: C. occurs sequentially, dentin prior to enamel", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.88", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following represents the typical eruption pattern of the permanent dentition?", "options": ["Mandibular arch: first molar, central incisor, lateral incisor, first premolar, canine, second premolar, second molar", "Mandibular arch: first molar, central incisor, lateral incisor, first premolar, second premolar, canine, second molar", "Maxillary arch: first molar, central incisor, lateral incisor, first premolar, canine, second premolar, second molar", "Maxillary arch: first molar, central incisor, lateral incisor, first premolar, second premolar, canine, second molar"], "answer": 3, "explanation": "Correct: D. Maxillary arch: first molar, central incisor, lateral incisor,first premolar, second premolar, canine, second molar", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.89", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The last permanent incisor to begin calcification is the:", "options": ["mandibular central.", "mandibular lateral.", "maxillary central.", "maxillary lateral."], "answer": 3, "explanation": "Correct: D. maxillary lateral.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.90", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "At what age is the root formation of maxillary lateral incisors typically completed?", "options": ["9", "10", "11", "12"], "answer": 2, "explanation": "Correct: C. 11 years. Root completion of maxillary lateral incisors occurs at approximately 11 years. Eruption occurs at 8-9 years, but root completion takes 2-3 more years. This follows the general rule that roots complete 2-3 years after eruption.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.92", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which developmental disturbance occurs with the greatest frequency?", "options": ["Congenitally missing permanent teeth", "Ectopically erupting first permanent molars", "Mesiodens", "Palatally impacted permanent canines"], "answer": 0, "explanation": "Correct: A. Congenitally missing permanent teeth", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Oral Pathology & Medicine", "source_page": "AAPD QE Prep Course 2024 — Q.93", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "What is the order of most frequent to least frequent congenitally missing permanent teeth?", "options": ["Mandibular second premolars, maxillary and mandibular third molars, maxillary lateral incisors", "Maxillary and mandibular third molars, mandibular second premolars, maxillary lateral incisors", "Maxillary and mandibular third molars, maxillary lateral incisors and mandibular second premolars", "Maxillary lateral incisors, maxillary second premolars, mandibular second premolars"], "answer": 1, "explanation": "Correct: B. Maxillary and mandibular third molars, mandibular second premolars, maxillary lateral incisors", "source": "QE Prep Course 2024", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.94", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following overjet measurements has been suggested as the threshold for initiating preventive orthodontic treatment in early- to middle-mixed dentition to potentiallyreduce the severity of traumatic injuries to permanent incisors?", "options": ["Greater than 3 millimeters", "Greater than 4 millimeters", "Greater than 5 millimeters", "Greater than 6 millimeters"], "answer": 0, "explanation": "Correct: A. Greater than 3 millimeters", "source": "QE Prep Course 2024", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.252", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is an example of a class III mouthguard according to the American Society for Testing and Materials?", "options": ["Heat-pressure lamination mouthguard", "Mouth-formed mouthguard", "Stock mouthguard", "Vacuum-formed mouthguard"], "answer": 2, "explanation": "Correct: C. Stock mouthguard", "source": "QE Prep Course 2024", "domain": "Orthodontics & Occlusion", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.60", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "A mandibular mouthguard would be more suitable than a maxillary mouthguard for an athlete when:", "options": ["he has a sensitive gag reflex.", "he has a transpalatal appliance.", "he is in class III malocclusion.", "the permanent incisors are erupting."], "answer": 2, "explanation": "Correct: C. he is in class III malocclusion.", "source": "QE Prep Course 2024", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "AAPD QE Prep Course 2024 — Q.61", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "With which clinical presentation would antibiotics be indicated for an odontogenic infection?", "options": ["Associated parulis", "Facial cellulitis", "Fever of 101.0 degrees Fahrenheit", "Unrelenting pain"], "answer": 1, "explanation": "Correct: B. Facial cellulitis", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.113", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "There is no evidence to support or refute removal of third molars when:", "options": ["pathology is present.", "they are healthy but impacted.", "they are healthy but malpositioned.", "they are healthy but non-functional."], "answer": 1, "explanation": "Correct: B. they are healthy but impacted.", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.114", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following is an indication for antibiotic administration?", "options": ["Draining fistula", "Facial cellulitis", "Persistent dental pain", "Temperature of 100 degrees Fahrenheit"], "answer": 1, "explanation": "Correct: B. Facial cellulitis", "source": "QE Prep Course 2024", "domain": "Pharmacology & Sedation", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.115", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which of the following describes the natural course of a typical odontogenic infection?", "options": ["Mild pain and abscess leading to spontaneous resolution", "Mild pain with purulent drainage leading to large, tender lesion", "Severe pain and cellulitis leading to less pain and localized abscess", "Severe pain with fluctuant lesion followed by less pain and hard, diffuse lesion"], "answer": 2, "explanation": "Correct: C. Severe pain and cellulitis leading to less pain and localized abscess", "source": "QE Prep Course 2024", "domain": "Oral Surgery & Trauma", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.116", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "Which primary tooth type typically causes a canine space infection?", "options": ["Mandibular canine", "Mandibular incisor", "Maxillary incisor", "Maxillary molar"], "answer": 3, "explanation": "Correct: D. Maxillary molar", "source": "QE Prep Course 2024", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "AAPD QE Prep Course 2024 — Q.117", "source_doc": "QE Prep.docx (Board Review from Alex/Wee/)"}, {"q": "The sublingual space contains which anatomical structure?", "options": ["Carotid artery", "Hypoglossal nerve", "Stenson's duct", "Submandibular salivary gland"], "answer": 1, "explanation": "Correct: B. Hypoglossal nerve", "source": "QE Prep Course 2024", "domain": "Oral Pathology ion between frequency of tooth brushing and caries incidence.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.35", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What is the recommended range of fluoride concentration in communal water supplies that delivers optimal benefits for caries reduction without producing clinically significant evidence of dental fluorosis?", "options": ["0.4 to 1.0 ppm", "0.7 to 1.2 ppm", "0.9 to 1.1 ppm", "1.0 to 2.0 ppm", "There is no range. The universally recommended concentration is 1.0 ppm"], "answer": 1, "explanation": "Correct: B. 0.7 to 1.2 ppm", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.36", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following factors must be considered in calculating the appropriate fluoride dose when prescribing a dietary (systemic) fluoride supplement for a child?", "options": ["Age and previous caries history, e.g. deft and DMFT rates", "Age and oral hygiene practices", "Age and the fluoride concentration of the family’s drinking water", "Caries history and the fluoride concentration of the community water supply", "Weight and the fluoride concentration in the community water supply"], "answer": 2, "explanation": "Correct: C. Age and the fluoride concentration of the family’s drinking water", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.37", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What is the current recommended daily dose of dietary (systemic) fluoride supplemen pecial Healthcare Needs", "source_page": "Troutman Comprehensive Review 2012 — Q.43", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Topical fluoride applications act to reduce the incidence of dental caries in all of the following ways EXCEPT by which of the following?", "options": ["Enhancing the coalescence of susceptible enamel pits and fissures", "Making the surface enamel more resistant to acid demineralization by improving crystalinity and decreasing solubility", "Promoting remineralization of surface enamel", "Having a direct antibacterial effect on plaque", "Inhibiting glycolysis in the bacterial plaque"], "answer": 0, "explanation": "Correct: A. Enhancing the coalescence of susceptible enamel pits and fissures", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.44", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Fissure sealant application is an important part of a caries prevention program because they do which of the following?", "options": ["Reduce the need for water fluoridation", "Prevent the extension of existing carious lesions", "Allow the patient to clean the occlusal surfaces of their teeth with less effort", "Reduce susceptibility for caries-susceptible areas least benefited by fluorides", "Release fluoride that acts topically to reduce smooth surface caries"], "answer": 3, "explanation": "Correct: D. Reduce susceptibility for caries-susceptible areas least benefited by fluorides", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.45", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the LEAST cost effective in the prevention of denta unted."], "answer": 2, "explanation": "Correct: C. Metabolism by the Kidneys", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.48", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "A 6 1/2 year-old child with 18 primary teeth and 2 permanent mandibular central incisors and 2 permanent Mandibular first molars in the process of erupting, presents with facial caries in 4 primary maxillary incisors and distal-occlusal caries in 4 primary first molars. This child would have a DMFT rate of which of the following?", "options": ["0", "4", "6", "8", "10"], "answer": 0, "explanation": "Correct answer: 0. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.50", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the most practical and cost effective way to minimize dental caries in a population group?", "options": ["Eliminate cariogenic bacteria (e.g. streptococci.) by immunization of all children by one year of age", "Eliminate dietary sucrose", "Fluoridation of a communities drinking water supply", "Apply topical fluorides routinely (e.g. every 6 mo.) in the dental office", "Fluoridation of the water supply in elementary and middle schools"], "answer": 2, "explanation": "Correct: C. Fluoridation of a communities drinking water supply", "source": "2012 Troutman Comprehensive Review", "domain": "Infection Control & Safety", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.51", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The : "Troutman Comprehensive Review 2012 — Q.60", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Enamel calcification in crown of the Permanent Maxillary Central Incisors is generally completed by what age?", "options": ["6 months", "1 year", "3 years (Mandibular Central = 3 mo. To 3 1/2 yr.)—see # 72", "4 years (3 mo. To 4 yr. +/- 6 mo.)"], "answer": 3, "explanation": "Correct: E. 4 years (3 mo. To 4 yr. +/- 6 mo.)", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.61", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is TRUE regarding children with digit sucking habits?", "options": ["They should be offered a pacifier instead if they are still sucking past", "They often stop sucking before age 6 without any professional intervention", "They should be coerced by their parents into giving up the habit", "They should be fitted with a “rake” appliance to make digit sucking uncomfortable if the habit continues beyond 3 years of age", "They will develop a Class II malocclusion if the habit continues after age 4"], "answer": 1, "explanation": "Correct: B. They often stop sucking before age 6 without any professional intervention", "source": "2012 Troutman Comprehensive Review", "domain": "Behavior Guidance", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.62", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following statements is TRUE regarding primary teething?", "options": ["There is no scientific evidence that primary teething is painful.", "Teething usually causes discomfort, which is best managed by allowing the child to suck on a pacifier coated with topical anesthetic in a concentration of 10% or less.", "Teething usually causes discomfort, which is best managed by topical application of local anesthetics (20%) to the affected area(s).", "Teething is a common cause of fever in 1½ -2 year old children and can result in seizures if untreated.", "Teething is frequently painful and should be treated with a topical anesthetic and liquid Tylenol to prevent fever."], "answer": 0, "explanation": "Correct: A. There is no scientific evidence that primary teething is painful.", "source": "2012 Troutman Comprehensive Review", "domain": "Behavior Guidance", "category": "Pharmacology & Sedation", "source_page": "Troutman Comprehensive Review 2012 — Q.63", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In performing a Moyer’s mixed dentition analysis, which of the following teeth are used as the basis for the prediction of maxillary and mandibular posterior (canines and premolars) succedaneous tooth size?", "options": ["Class I", "Class II", "Class III", "Distal step", "Mesial step"], "answer": 2, "explanation": "Correct: C. Class III", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.64", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "“Leeway space” is the term for which of the following?", "options": ["The space between the primary maxillary lateral incisors and canines", "The space between the permanent central incisors before eruption of the permanent canines", "The discrepancy between the sum of the mesio-distal widths of the Primary incisors and the sum of the mesio-distal widths of the Permanent incisors", "The difference between the sum of the mesio-distal widths of the Primary Mandibular first and second premolars and canine and the sum of the mesio-distal widths of their Permanent successors."], "answer": 3, "explanation": "Correct: E. The difference between ationship becomes a Class I permanent molar relationship after the exfoliation of the primary mandibular second molars", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.83", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What amount of average change in mandibular intercanine arch width should be anticipated in the transition from the primary dentition of a 5 year-old male to the permanent dentition of a teenager?", "options": ["A decrease of about -2 to -4 mm.", "A decrease of about -1 mm. to no measurable change", "An increase of about +2 to +3 mm.", "An increase of about +4 to +6 mm.", "There is no significant change in intercanine arch width during this period."], "answer": 2, "explanation": "Correct: C. An increase of about +2 to +3 mm.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.84", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The posterior primary tooth least like any posterior permanent tooth is which of the following?", "options": ["Primary maxillary first molar", "Primary mandibular second molar", "Primary mandibular first molar", "Primary maxillary second molar", "None of the above"], "answer": 2, "explanation": "Correct: C. Primary mandibular first molar", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.85", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The term that describes the proximal contour of a molar tooth and the space gingival to the marginal ridge is which of the following?", "options": ["Occlusal embrasure", "Gingival embrasure", "Proximal margin", "Height of contour", "Proximal contact point"], "answer": 1, "explanation": "Correct: B. Gingival embrasure", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.86", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In both the Steiner and Downs cephalometric analysis, Basion is defined as which of the following?", "options": ["The highest point on the concavity of the occipital condyles", "The deepest point on the anterior surface of the symphysis of the mandible.", "The point on the bony angle of the mandible that is crossed by a line bisecting the gingival angle", "The lowest point on the midline of the anterior margin of the foramen magnum", "The lowest point on the bony chin"], "answer": 3, "explanation": "Correct: D. The lowest point on the midline of the anterior margin of the foramen magnum", "source": "2012 Troutman Comprehensive Review", "domain": "Restorative Dentistry", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.87", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the percent ectopically erupting permanent maxillary first molars that can be expected to “self-correct”?", "options": ["20%", "40%", "60%", "80%", ">90%"], "answer": 2, "explanation": "Correct answer: 60%. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.88", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "An anterior tongue posture can be caused by all of the following EXCEPT which one of the following?", "options": ["Short velum", "Tongue thrust", "Oral-neuro-motor dysfunction", "Hypertrophic tonsils"], "answer": 0, "explanation": "Correct: A. Short velum", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.89", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "A 7 year-old child presents with abscessed primary mandibular left and right first molars that must be removed. The primary second molars have a mesial step relationship. The permanent mandibular incisors measure as follows: #26 = 6mm, #25 =4.5 mm, #24 = 4.5 mm, and #23 = 6 mm. The primary canine and first and second molar space on each side is 22 mm.", "options": ["Place a mandibular passive lingual arch", "Place 2 band and loop space maintainers", "Place an active lingual arch to increase the total arch length", "Place no appliances, as the bicuspids will erupt soon", "Refer the child for orthodontic evaluation"], "answer": 0, "explanation": "Correct: A. Place a mandibular passive lingual arch", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.90", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "\"Leeway space\", as described by Nance, refers to the mesial distal size differences between primary canines and molars and their permanent successors. In the maxillary arch, this difference is mm. per quadrant, while in the mandibular arch this difference is mm. per quadrant. Which of the following correctly fills in the blanks?", "options": ["3.4 mm and 2 mm", "0.9 mm and 1.7 mm", "6.0 mm and 3.4 mm", "1.8 mm and 3.4 mm"], "answer": 1, "explanation": "Correct: C. 0.9 mm and 1.7 mm", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.91", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the primary dentition, the anatomic structure(s) used to determine molar relationship and classify occlusion is/are which of the following?", "options": ["The mesiobuccal cusp of the primary maxillary second molar", "The distobuccal cusp of the primary mandibular first molar", "The distal surface planes of the primary second molars", "The mesiobuccal cusp of the primary maxillary second molar and the embrasure between the primary mandibular first and second molars", "The cusps of the canines"], "answer": 2, "explanation": "Correct: C. The distal surface planes of the primary second molars", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.92", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is/are indications for a mixed dentition analysis?", "options": ["Ectopic eruption of permanent mandibular canines with a Class I molar relationship and incisor crowding", "Anterior and/or posterior functional crossbites in an 8 year-old", "Rotated or lingually erupting permanent mandibular lateral incisors in a 7 year old", "A flush (straight) terminal relationship of the primary second molars in a 7 year old with mild mandibular incisor crowding", "All of the above are indications"], "answer": 4, "explanation": "Correct: E. All of the above are indications", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.93", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Second order tooth movements refer to which of the following?", "options": ["Bodily movement distally", "Vertical or horizontal movement", "Buccal or lingual tipping movement", "Tipping mesially or distally", "Intrusion"], "answer": 3, "explanation": "Correct: D. Tipping mesially or distally", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.94", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Third order (degree) bends in a rectangular arch wire of an Edgewise orthodontic appliance are intended to move a tooth in which of the following directions?", "options": ["Mesial or distal tipping", "Buccal or labial-lingual axial movement", "Vertical -- intrusion or extrusion", "Mesial or distal bodily movement", "Rotation"], "answer": 1, "explanation": "Correct: B. Buccal or labial-lingual axial movement", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Oral Surgery & Trauma", "source_page": "Troutman Comprehensive Review 2012 — Q.95", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The most effective appliance for treatment of a skeletal Class II malocclusion, with excessive vertical face height and reasonably good mandibular morphology, is which of the following?", "options": ["A high pull headgear attached to the molars", "A chin-cup therapy to restrict vertical growth", "A facemask therapy with a downward pull on the anterior maxilla", "A functional appliance with posterior bite blocks", "Four (4) bicuspid serial extractions with a lingual holding arch"], "answer": 0, "explanation": "Correct: A. A high pull headgear attached to the molars", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.97", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the most desirable proportional relationship of the middle third of the face to the lower third of the face?", "options": ["One to one", "One to two", "Two to one", "Three to one", "One to three"], "answer": 0, "explanation": "Correct: A. One to one", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.98", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Palatal height at birth achieves its “vault” shape in adulthood by which of the following?", "options": ["Alveolar growth", "Mid-palatal suture growth", "Posterior palatal suture growth", "A combination of a & c"], "answer": 0, "explanation": "Correct: A. Alveolar growth", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.99", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Anomalies that result from disturbance in Apposition result in which of the following?", "options": ["Variation in the numbers of teeth", "Variations in the density of dentin", "Variation in the amount of enamel", "Variation in the density of enamel"], "answer": 2, "explanation": "Correct: C. Variation in the amount of enamel", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.100", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In the primary dentition, where are the primate spaces located?", "options": ["Mesial to the maxillary canines and distal to the mandibular canines", "Distal to the maxillary canines and mesial to the mandibular canines", "Mesial to both the maxillary and mandibular canines", "Distal to both the maxillary and mandibular canines", "Between the primary maxillary and mandibular incisors in children with a Class I molar relationship"], "answer": 0, "explanation": "Correct: A. Mesial to the maxillary canines and distal to the mandibular canines", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.101", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following best represents the “window of infectivity” for dental caries?", "options": ["3 to 6 mo.", "7 to 18 mo.", "19 to 33 mo.", "34 to 36 mo.", "6 to 36 mo."], "answer": 2, "explanation": "Correct: C. 19 to 33 mo.", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.102", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In a “long-face” dolichofacial pattern of growth, superimposition of serial cephalograms on the cranial base should demonstrate each of the following characteristic patterns of growth EXCEPT one. Which is the EXECPTION?", "options": ["Forward counter-clockwise rotation of the mandible", "Increased anterior face height from ANS to Menton", "Tendency toward anterior openbite", "Hyperdivergent mandibular plane angle"], "answer": 0, "explanation": "Correct: A. Forward counter-clockwise rotation of the mandible", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.103", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "During which of the following stages in dental development does Dentinogenesis Imperfecta occur?", "options": ["Initiation", "Histodifferentiation", "Morphodifferentiation", "Calcification"], "answer": 1, "explanation": "Correct: B. Histodifferentiation", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Oral Pathology & Medicine", "source_page": "Troutman Comprehensive Review 2012 — Q.104", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "By which developmental period do the palatal processes in the embryo complete their fusion?", "options": ["4 weeks in-utero", "11 weeks in-utero", "12 – 14 weeks in-utero", "At the same time as the median nasal and lateral nasal processes fuse", "Just prior to the fusion of the median nasal and lateral nasal processes"], "answer": 1, "explanation": "Correct: B. 11 weeks in-utero", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.105", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The median nasal process fuses with the lateral processes at about which of the following developmental periods?", "options": ["2 weeks in-utero", "6 weeks in-utero", "10 weeks in-utero", "12 – 14 weeks in-utero", "27 weeks in-utero"], "answer": 1, "explanation": "Correct: B. 6 weeks in-utero", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.106", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The primary molar relationship that is most likely to result in a Class I permanent molar relationship is which of the following?", "options": ["Flush terminal plane (37% of primary occlusions at 5 yr.", "Mesial step (49% of primary occlusion at 5 yr.", "Distal step. (14 % of primary occlusions at 5 yr.", "Flush terminal plane with generalized crowding", "Distal step with generalized spacing"], "answer": 1, "explanation": "Correct: B. Mesial step (49% of primary occlusion at 5 yr.", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.107", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Most Class II malocclusions are generally the result of which of the following?", "options": ["Excessive Maxillary growth", "Deficient Mandibular growth", "Early loss of Primary maxillary first molars", "Procumbent Maxillary incisors", "Prolonged digit sucking habits"], "answer": 1, "explanation": "Correct: B. Deficient Mandibular growth", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.108", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following statements is / are true regarding the eruption of the maxillary canine?", "options": ["The maxillary canine increases its inclination mesially until a maximum angle is reached at approximately age 7 years", "The maxillary canine increases its inclination mesially until a maximum angle is reached at approximately age 9 years, and than progressively straightens until it emerges", "During eruption, the maxillary canine maintains its horizontal inclination until after 7 years of age, when it begins its mesial inclination until it straightens out and emerges at age 9 years", "The maxillary canine increases its inclination distally until a maximum angle is reached at approximately age 7 years and than progressively straightens out until it emerges at age 12 years", "Maxillary canines follow an unpredictable eruption path"], "answer": 1, "explanation": "Correct: B. The maxillary canine increases its inclination mesially until a maximum angle is reached at approximately age 9 years, and than progressively straightens until it emerges", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.110", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In an untreated functional posterior crossbite, after growth is complete, a frontal P-A cephalograms would be expected to exhibit which of the following mandibular patterns?", "options": ["Mandibular length shorter on the non-crossbite side than the crossbite side", "Mandibular length longer on the non-crossbite side than the crossbite side", "Mandibular length equal on the non-crossbite side with the crossbite side", "There is no predictable pattern due to extreme variability in human growth differentials."], "answer": 1, "explanation": "Correct: B. Mandibular length longer on the non-crossbite side than the crossbite side", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.111", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "What percentage of posterior crossbite in school-age children exhibit a functional shift of the mandible as a component of the crossbite pattern?", "options": ["<10 %", "10 – 20 %", "30 – 40 %", "60 – 70 %", "> 80 %"], "answer": 4, "explanation": "Correct answer: > 80 %. This question tests recall of a specific clinical fact. Review the source document for full context.", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.112", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following describes the “Brachyfacial/Hypodivergent” facial type?", "options": ["Excessive condylar growth tendency", "Posterior face height greater then anterior face height", "Flat mandibular plane and deep bite", "Class II, Division II malocclusion", "All of the above combined describe the “Brachyfacial/Hypodivergent” acial type"], "answer": 4, "explanation": "Correct: E. All of the above combined describe the “Brachyfacial/Hypodivergent” acial type", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.113", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The normal Histologic development of the dentition occurs in which of the following sequences?", "options": ["Initiation, histodifferentiation, proliferation, morphodifferentiation, calcification, apposition and eruption", "Proliferation, initiation, apposition, morphodifferentiation, histodifferentiation, calcification and eruption", "Initiation, morphodifferentiation, histodifferentiation proliferation, apposition, calcification and eruption", "Initiation, proliferation, histodifferentiation, morphodifferentiation, apposition, calcification and eruption"], "answer": 3, "explanation": "Correct: D. Initiation, proliferation, histodifferentiation, morphodifferentiation, apposition, calcification and eruption", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.114", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The cephalometric measurement that most directly assesses the vertical skull growth pattern is which of the following?", "options": ["ANB (Dental – ant.-post. Position of incisors)", "FMA (Frankfort to Mandibular Plane Angle)", "SNA (Ant. Position of Maxilla)", "SNB (Mandibular Apical base to cranial base (Steiner))", "Gonial angle (Anterior-Posterior relation of mandible to max.)"], "answer": 1, "explanation": "Correct: B. FMA (Frankfort to Mandibular Plane Angle)", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.115", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following planes of space are used to classify malocclusions utilizing Angles classification?", "options": ["Anterior-Posterior", "Transverse", "Vertical", "Angular acuteness", "Angular divergence"], "answer": 0, "explanation": "Correct: A. Anterior-Posterior", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.116", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following sites of growth is primarily responsible for increase in the vertical dimension of the facial complex?", "options": ["Condylar", "Ramus", "Alveolar", "Inferior Mandibular body", "Maxillary tuberosity"], "answer": 0, "explanation": "Correct: A. Condylar", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.117", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Primary types of bone ossification include which of the following?", "options": ["Intramembranous", "Laminar", "Endochondral", "All of the above", "Only a & c are correct"], "answer": 4, "explanation": "Correct: E. Only a & c are correct", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.118", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is NOT a “cranial base line” in cephalometric analysis?", "options": ["Sella – Nasion (S-N)", "Frankfort Horizontal (PO-O)", "Y Axis (S-Pg)", "All of the above are “Cranial base lines"], "answer": 2, "explanation": "Correct: C. Y Axis (S-Pg)", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.119", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "A cervical headgear in a 12 year-old pre-pubertal child will usually result in which of the following?", "options": ["Opening the bite", "Distal movement of the maxillary permanent first molars", "Only b and c are correct"], "answer": 0, "explanation": "Correct: A. Opening the bite", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.120", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The difference between the size of the primary molars and canines and the permanent succedaneous premolars and canines; and the difference in size between the primary and permanent incisors, is termed, respectively?", "options": ["Late mesial shift and incisor viability", "Leeway space and incisor liability", "Late mesial shift and leeway space", "Canine liability and leeway space"], "answer": 1, "explanation": "Correct: C. Leeway space and incisor liability", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.121", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "During development of the dental occlusion, there is generally no relief of mandibular incisor crowding following the complete eruption of which of the following?", "options": ["Permanent mandibular canines", "Permanent mandibular second premolars", "Permanent mandibular first molars", "Permanent mandibular lateral incisors", "Permanent mandibular second molars"], "answer": 3, "explanation": "Correct: D. Permanent mandibular lateral incisors", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Orthodontics & Occlusion", "source_page": "Troutman Comprehensive Review 2012 — Q.122", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The largest amount of increase in longitudinal growth takes place in the sagittal relationship of the maxilla and mandible during which of the following age periods?", "options": ["Females 6-12 yo & males 6-12 yo", "Females 6-12 yo & males 12-18 yo", "Females 12-18 yo & males 12-18 yo", "Females 12-18 yo & males 6-12 yo", "Females 12-18 yo & males 18-24 yo"], "answer": 1, "explanation": "Correct: B. Females 6-12 yo & males 12-18 yo", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.123", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represents the mean exfoliation time sequence for the primary dentition? Underlined teeth represent the maxillary, non-underlined the mandibular.", "options": ["a, a, b, b, c, c, d, d, e, e", "a, b, a, b, c, c, d, e, d, e", "a, a, b, b, c, d, d, c, e, e", "a, b, a, b, c, d, d, c, e, e", "a, a, b, b, d, d, c, e, e, c"], "answer": 2, "explanation": "Correct: C. a, a, b, b, c, d, d, c, e, e", "source": "2012 Troutman Comprehensive Review", "domain": "Growth & Development", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.124", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Treatment Timing for Rapid Maxillary Expansion is important because patients treated before the pubertal peak exhibit more significant and more effective long term changes at which of the following developmental levels?", "options": ["Dento-alveolar", "Skeletal", "Skeletal and Dento-alveolar", "Cranial Base", "All of the above were affected equally if treated before the pubertal peak"], "answer": 1, "explanation": "Correct: B. Skeletal", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.125", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "In which of the following planes do the facial structures, predominantly, grow between 7 & 10 weeks post conception (the late embryonic and early fetal periods)?", "options": ["Sagittal", "Coronal", "Transverse", "Mandibular", "All of the above develop at the same rate during this period"], "answer": 0, "explanation": "Correct: A. Sagittal", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.126", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "During the change from the primary dentition to the permanent, the maxillary and mandibular central incisors exhibit which of the following changes in their position in the jaws?", "options": ["The inter-incisal angle becomes more acute (smaller)", "The inter-incisal angle becomes more obtuse (greater)", "The maxillary incisors become more upright", "The mandibular incisors become more upright", "The mandibular incisors become more lingually inclined"], "answer": 0, "explanation": "Correct: A. The inter-incisal angle becomes more acute (smaller)", nner", "Psychoanalytic", "Conductive learning", "Cognitive development Piaget", "Psychosexual Freud"], "answer": 3, "explanation": "Correct: D. Cognitive development Piaget", "source": "2012 Troutman Comprehensive Review", "domain": "Behavior Guidance", "category": "Growth & Development", "source_page": "Troutman Comprehensive Review 2012 — Q.259", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Direct pulp capping therapy can be used appropriately in the primary dentition for which of the following?", "options": ["1-2 mm carious exposures in molars", ">2 mm carious exposures in incisors", "<1mm mechanical or recent traumatic exposure (within 2 hours)", "Any / all of the above could be correct", "a and c only"], "answer": 2, "explanation": "Correct: C. <1mm mechanical or recent traumatic exposure (within 2 hours)", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Pulp Therapy & Endodontics", "source_page": "Troutman Comprehensive Review 2012 — Q.260", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "When replanting an avulsed (within 2 hours) permanent central incisor with a partially to completely closed apex in a 7 year-old child, when should calcium hydroxide be placed in the canal?", "options": ["Immediately, prior to replanting", "Immediately after replanting", "After 3 days, but before 10 days", "After 10 days, but before 21 days", "ZnOE should be used, not calcium hydroxide"], "answer": 2, "explanation": "Correct: C. After 3 days, but before 10 days", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Surgery & Trauma", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.261", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following significantly decreases the prognosis for a traumatically lingually luxated permanent central or lateral incisor?", "options": ["Calcium hydroxide canal obturation >7 days after injury", "Application of a flexible splint", "Previous history of trauma to the same tooth", "Previous orthodontic movement", "All of the above dramatically decrease the prognosis"], "answer": 2, "explanation": "Correct: C. Previous history of trauma to the same tooth", "source": "2012 Troutman Comprehensive Review", "domain": "Orthodontics & Occlusion", "category": "Oral Surgery & Trauma", "source_page": "Troutman Comprehensive Review 2012 — Q.262", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is an easily observable sign/symptom of a subdural hematoma?", "options": ["Loss of consciousness", "Rising blood pressure", "An irregular gait", "Unequal pupil size", "Slurred speech"], "answer": 3, "explanation": "Correct: D. Unequal pupil size", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.263", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following injuries to permanent teeth has the poorest prognosis in a", "options": ["Complicated enamel and dentin fracture", "Intrusion >7mm.", "Subluxation", "Lateral luxation", "Avulsion"], "answer": 1, "explanation": "Correct: B. Intrusion >7mm.", "source": "2012 Troutman Comprehensive Review", "domain": "Oral Surgery & Trauma", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.264", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is the goal of apexification of a permanent tooth with an incompletely formed apex?", "options": ["Continued normal development of the root apex", "Formation of a cementoid barrier at the apex", "Increase dental wall deposition", "Retain vitality in the apical third of the pulp", "Elimination of the possibility of periapical infection"], "answer": 1, "explanation": "Correct: B. Formation of a cementoid barrier at the apex", "source": "2012 Troutman Comprehensive Review", "domain": "Pulp Therapy & Endodontics", "category": "Pulp Therapy & Endodontics", "source_page": "Troutman Comprehensive Review 2012 — Q.265", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following represent the type of splinting and the period of time the splint should be kept in place, as recommended in the AAPD Guidelines, for an avulsed permanent incisor with an open apex?", "options": ["A Rigid splint for 6 – 8 weeks", "A Flexible .018 round wire splint for 1 – 2 weeks", "A Flexible .027 wire splint for 4 – 6 weeks", "A Rigid, resin-bonded splint for 2 – 4 weeks", "A Flexible 15 lb. fishing line splint for 3 – 7 days"], "answer": 1, "explanation": "Correct: B. A Flexible .018 round wire splint for 1 – 2 weeks", "source": "2012 Troutman Comprehensive Review", "domain": "Pulp Therapy & Endodontics", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.266", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "Which of the following is / are the responsibility of the pediatric dentist who suspects that one of his / her/ patients has been physically abused?", "options": ["Interrogate the child", "Report the suspected abuse to the appropriate agency", "All of the above are required by CA. and NY law"], "answer": 1, "explanation": "Correct: D. Report the suspected abuse to the appropriate agency", "source": "2012 Troutman Comprehensive Review", "domain": "Caries & Prevention", "category": "Caries & Prevention", "source_page": "Troutman Comprehensive Review 2012 — Q.267", "source_doc": "2012 Troutman Answers.docx (Board Review from Alex/Wee/Old material QE/)"}, {"q": "The main goal
